[project]
name = "chatgpt-plugin-kaggle"
version = "0.1.0"
description = "Kaggle compute provider bridge for ChatGPT using a GitHub Issue control plane"
requires-python = ">=3.11"
dependencies = [
  "chatgpt-plugins-core",
  "chatgpt-plugins-github-bridge",
  "chatgpt-plugins-repair-engine",
]

[tool.uv.sources]
chatgpt-plugins-core = { workspace = true }
chatgpt-plugins-github-bridge = { workspace = true }
chatgpt-plugins-repair-engine = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chatgpt_plugin_kaggle"]
