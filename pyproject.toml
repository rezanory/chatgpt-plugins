[project]
name = "chatgpt-plugins-monorepo"
version = "0.1.0"
description = "Modular ChatGPT plugins and compute bridges"
requires-python = ">=3.11"

[dependency-groups]
dev = [
  "pytest>=8.4",
  "ruff>=0.12",
]

[tool.uv.workspace]
members = [
  "packages/core",
  "packages/github-bridge",
  "packages/repair-engine",
  "plugins/kaggle",
  "plugins/kaggle-gateway",
]

[tool.uv.sources]
chatgpt-plugins-core = { workspace = true }
chatgpt-plugins-github-bridge = { workspace = true }
chatgpt-plugins-repair-engine = { workspace = true }
chatgpt-plugin-kaggle = { workspace = true }
chatgpt-plugin-kaggle-gateway = { workspace = true }

[tool.pytest.ini_options]
addopts = "-q"
testpaths = [
  "packages/core/tests",
  "packages/github-bridge/tests",
  "packages/repair-engine/tests",
  "plugins/kaggle/tests",
  "plugins/kaggle-gateway/tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
