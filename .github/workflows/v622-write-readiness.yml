name: v622-write-readiness

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v622-write-readiness.yml'

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    environment: cloudflare-production
    steps:
      - uses: actions/checkout@v4
      - name: Install Worker dependencies
        working-directory: deploy/cloudflare-worker-free
        run: npm install --no-audit --no-fund
      - name: Inspect Cloudflare secret names
        working-directory: deploy/cloudflare-worker-free
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          account_id="$(printf '%s' "$RAW_CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$account_id"
          echo "::add-mask::$account_id"
          export CLOUDFLARE_ACCOUNT_ID="$account_id"
          npx wrangler secret list > /tmp/secret-list.json
          python - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path('/tmp/secret-list.json').read_text(encoding='utf-8'))
          names = {
              item.get('name') for item in value
              if isinstance(item, dict) and isinstance(item.get('name'), str)
          } if isinstance(value, list) else set()
          readiness = {
              'github_webhook_secret_configured': 'CGP_GITHUB_WEBHOOK_SECRET' in names,
              'github_journal_token_configured': 'CGP_GITHUB_TOKEN' in names,
              'mcp_path_configured': 'CGP_MCP_PATH_TOKEN' in names,
              'master_configured': 'CGP_KAGGLE_MASTER_TOKEN' in names,
              'worker_token_count': sum(
                  1 for i in range(2, 8) if f'CGP_KAGGLE_KG{i:02d}_TOKEN' in names
              ),
          }
          Path('/tmp/write-readiness.json').write_text(
              json.dumps(readiness, indent=2), encoding='utf-8'
          )
          PY
      - name: Publish readiness
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '## V6.2.2 write-bridge readiness'
            echo
            echo '```json'
            cat /tmp/write-readiness.json
            echo '```'
          } > /tmp/write-readiness.md
          gh issue comment 18 --repo "$GITHUB_REPOSITORY" --body-file /tmp/write-readiness.md
