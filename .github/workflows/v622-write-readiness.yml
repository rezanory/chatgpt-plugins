name: v622-write-readiness

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v622-write-readiness.yml'

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    environment: cloudflare-production
    steps:
      - uses: actions/checkout@v4
      - name: Install Worker dependencies
        working-directory: deploy/cloudflare-worker-free
        run: npm install --no-audit --no-fund
      - name: Inspect Cloudflare secret names
        working-directory: deploy/cloudflare-worker-free
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          npx wrangler secret list --format json > /tmp/secret-list.json
          python - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path('/tmp/secret-list.json').read_text(encoding='utf-8'))
          names = set()
          if isinstance(value, list):
              for item in value:
                  if isinstance(item, dict) and isinstance(item.get('name'), str):
                      names.add(item['name'])
          elif isinstance(value, dict):
              for item in value.get('result', value.get('secrets', [])) or []:
                  if isinstance(item, dict) and isinstance(item.get('name'), str):
                      names.add(item['name'])
          readiness = {
              'github_webhook_secret_configured': 'CGP_GITHUB_WEBHOOK_SECRET' in names,
              'github_journal_token_configured': 'CGP_GITHUB_TOKEN' in names,
              'mcp_path_configured': 'CGP_MCP_PATH_TOKEN' in names,
              'master_configured': 'CGP_KAGGLE_MASTER_TOKEN' in names,
              'worker_token_count': sum(1 for i in range(2, 8) if f'CGP_KAGGLE_KG{i:02d}_TOKEN' in names),
          }
          Path('/tmp/write-readiness.json').write_text(json.dumps(readiness, indent=2), encoding='utf-8')
          PY
      - name: Publish readiness
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '## V6.2.2 write-bridge readiness'
            echo
            echo '```json'
            cat /tmp/write-readiness.json
            echo '```'
          } > /tmp/write-readiness.md
          gh issue comment 18 --repo "$GITHUB_REPOSITORY" --body-file /tmp/write-readiness.md
