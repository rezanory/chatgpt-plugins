name: v622-selfhost-activate-diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/.v622-selfhost-activate'

permissions:
  contents: read
  issues: write

jobs:
  activate:
    if: github.actor == 'rezanory' && github.head_ref == 'diag/v622-selfhost-activate'
    runs-on: [self-hosted, windows, x64, v622]
    environment: cloudflare-production
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate and deploy current Worker
        shell: powershell
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          $ErrorActionPreference = 'Stop'
          $accountId = [string]$env:RAW_CLOUDFLARE_ACCOUNT_ID
          $accountId = $accountId.Trim()
          if ([string]::IsNullOrWhiteSpace($env:CLOUDFLARE_API_TOKEN) -or [string]::IsNullOrWhiteSpace($accountId)) {
            throw 'Cloudflare deployment credentials are not configured.'
          }
          if ($accountId -notmatch '^[A-Za-z0-9_-]+$') { throw 'Invalid Cloudflare Account ID.' }
          Write-Host "::add-mask::$accountId"
          $env:CLOUDFLARE_ACCOUNT_ID = $accountId
          Push-Location 'deploy/cloudflare-worker-free'
          try {
            npm install --no-audit --no-fund
            if ($LASTEXITCODE -ne 0) { throw 'npm install failed' }
            npm run check
            if ($LASTEXITCODE -ne 0) { throw 'Worker typecheck failed' }
            npm run deploy:dry
            if ($LASTEXITCODE -ne 0) { throw 'Worker dry-run failed' }
            npx wrangler deploy
            if ($LASTEXITCODE -ne 0) { throw 'Worker deployment failed' }
          }
          finally { Pop-Location }

      - name: Probe fresh Wave 6 and publish receipt
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $waveUrl = 'https://chatgpt-kaggle-gateway.rezanory-chatgpt-plugins.workers.dev/recovery/v6-2-2/wave-status?wave=6'
          $value = $null
          for ($attempt = 1; $attempt -le 8; $attempt++) {
            try {
              $candidate = Invoke-RestMethod -Uri $waveUrl -Method Get -TimeoutSec 30
              if ($candidate.project -eq 'PNEUMONIA V6.2.2' -and [int]$candidate.wave -eq 6 -and @($candidate.tasks).Count -eq 6) {
                $value = $candidate
                break
              }
            }
            catch { Write-Host "Wave 6 probe attempt $attempt failed: $($_.Exception.Message)" }
            Start-Sleep -Seconds 5
          }
          if ($null -eq $value) { throw 'Fresh Wave 6 lightweight probe failed.' }

          $receipt = [ordered]@{
            source = '/recovery/v6-2-2/wave-status?wave=6'
            status_scope = 'fresh_self_hosted_windows_after_worker_deploy'
            generated_at = $value.generated_at
            counts = $value.counts
            workers = $value.tasks
          }
          $json = $receipt | ConvertTo-Json -Depth 30
          $body = "## V6.2.2 Wave 6 live Kaggle progress`n`n``````json`n$json`n```````n"
          $payload = @{ body = $body } | ConvertTo-Json -Depth 5
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/issues/18/comments" -Method Post -Headers $headers -ContentType 'application/json' -Body $payload | Out-Null
