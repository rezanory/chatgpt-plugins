name: v622-lockbox-mutator-audit-retired-after-pass

# LOCKBOX HARDENING PASS was recorded before the official locked test.
# This audit is retired so its marker literals cannot be mistaken for an active mutator.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: [self-hosted, windows, x64, v622]
    steps:
      - name: Confirm retired audit
        shell: powershell
        run: |
          Write-Host 'LOCKBOX HARDENING already passed with zero mutators.'
          Write-Host 'Official locked test already completed; this audit cannot mutate anything.'
