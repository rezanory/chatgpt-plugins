name: phase2-full-results-recovery-v1

on:
  pull_request:
    paths:
      - 'scripts/phase2_full_results_recovery_v1.py'
      - 'scripts/test_phase2_full_results_recovery_v1.py'
      - 'evidence/phase2_final_closure_v1/**'
      - '.github/workflows/phase2-full-results-recovery-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile recovery implementation
        run: python -m py_compile scripts/phase2_full_results_recovery_v1.py scripts/test_phase2_full_results_recovery_v1.py
      - name: Run focused fail-closed tests
        run: python scripts/test_phase2_full_results_recovery_v1.py -v

  recover-full-results:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    needs: validate
    runs-on: ubuntu-latest
    environment: cloudflare-production
    timeout-minutes: 90
    steps:
      - name: Checkout main recovery implementation
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Request trusted action and read OIDC identities
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          base=os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']
          bearer=os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']
          def issue(audience):
              sep='&' if '?' in base else '?'
              url=base+sep+urllib.parse.urlencode({'audience':audience})
              req=urllib.request.Request(url,headers={'Authorization':'Bearer '+bearer})
              with urllib.request.urlopen(req,timeout=30) as response:
                  token=json.load(response)['value']
              if len(token)<100:
                  raise SystemExit('OIDC_TOKEN_UNAVAILABLE:'+audience)
              print('::add-mask::'+token)
              return token
          action=issue('cgp-control-plane-v3-action')
          read=issue('cgp-control-plane-v3')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as handle:
              print('CGP_ACTION_OIDC_TOKEN='+action,file=handle)
              print('CGP_READ_OIDC_TOKEN='+read,file=handle)
          PY

      - name: Recover sealed training validation and locked-test evidence
        shell: bash
        run: |
          set -euo pipefail
          python scripts/phase2_full_results_recovery_v1.py \
            --run-id "$GITHUB_RUN_ID" \
            --output "$RUNNER_TEMP/PHASE2_FULL_RESULTS_MATRIX_V1.json"

      - name: Publish recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PHASE2_FULL_RESULTS_V1-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/PHASE2_FULL_RESULTS_MATRIX_V1.json
            evidence/phase2_final_closure_v1/SELECTION_FREEZE.json
            scripts/phase2_full_results_recovery_v1.py
          retention-days: 30
          if-no-files-found: error
