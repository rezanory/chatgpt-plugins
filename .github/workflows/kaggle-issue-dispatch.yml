name: kaggle-issue-dispatch
run-name: "Kaggle dispatch for issue #${{ github.event.issue.number }}"

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  plan:
    if: startsWith(github.event.issue.title, '[KAGGLE-JOB]')
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      job: ${{ steps.plan.outputs.job }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install planner
        run: uv sync --package chatgpt-plugin-kaggle
      - name: Validate issue and build trusted matrix
        id: plan
        run: >-
          uv run --package chatgpt-plugin-kaggle python -m
          chatgpt_plugin_kaggle.actions.plan_issue
          --accounts-file plugins/kaggle/config/accounts.json
          --profiles-file plugins/kaggle/config/profiles.json
          --repo-policy-file plugins/kaggle/config/source-repos.json
      - name: Explain plan failure without echoing untrusted issue body
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          printf '%s\n' 'Kaggle dispatch rejected: stage=plan. The job contract, account mapping, execution profile, or source policy is invalid. No Kaggle credential was loaded.' > /tmp/comment.md
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md

  dispatch:
    needs: plan
    if: needs.plan.result == 'success'
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ matrix.account_environment }}
    concurrency:
      group: kaggle-submit-${{ matrix.account_id }}
      cancel-in-progress: false
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      SOURCE_GITHUB_TOKEN: ${{ secrets.SOURCE_GITHUB_TOKEN }}
      JOB_ID: ${{ matrix.job_id }}
      TASK_ID: ${{ matrix.task_id }}
      ACCOUNT_ID: ${{ matrix.account_id }}
      ACCOUNT_ENVIRONMENT: ${{ matrix.account_environment }}
      KAGGLE_OWNER: ${{ matrix.kaggle_owner }}
      ACCELERATOR: ${{ matrix.accelerator }}
      SOURCE_REPOSITORY: ${{ matrix.source_repository }}
      SOURCE_COMMIT: ${{ matrix.source_commit }}
      PROFILE: ${{ matrix.profile }}
      PARAMETERS_JSON: ${{ matrix.parameters_json }}
      JOB_INTEGRITY_HASH: ${{ matrix.job_integrity_hash }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout control-plane repository
        id: checkout_control
        uses: actions/checkout@v4
        with:
          path: _plugins

      - name: Checkout immutable target source
        id: checkout_source
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.source_repository }}
          ref: ${{ matrix.source_commit }}
          token: ${{ secrets.SOURCE_GITHUB_TOKEN || github.token }}
          path: _source
          fetch-depth: 1
          persist-credentials: false

      - uses: astral-sh/setup-uv@v6
        id: setup_uv

      - name: Install bridge and official Kaggle CLI
        id: install
        working-directory: _plugins
        run: |
          uv sync --package chatgpt-plugin-kaggle
          uv pip install "kaggle==2.2.4"

      - name: Validate API token presence without printing it
        id: credentials
        shell: bash
        run: |
          set +x
          test -n "$KAGGLE_API_TOKEN" || {
            printf '%s\n' 'KAGGLE_API_TOKEN is not configured for the selected GitHub Environment.' >&2
            exit 42
          }

      - name: Submit private source dataset and private Kaggle kernel
        id: submit
        working-directory: _plugins
        shell: bash
        run: |
          set +x
          uv run --package chatgpt-plugin-kaggle python -m chatgpt_plugin_kaggle.actions.dispatch_task \
            --job-id "$JOB_ID" \
            --task-id "$TASK_ID" \
            --account-id "$ACCOUNT_ID" \
            --account-environment "$ACCOUNT_ENVIRONMENT" \
            --owner "$KAGGLE_OWNER" \
            --source ../_source \
            --source-repository "$SOURCE_REPOSITORY" \
            --source-commit "$SOURCE_COMMIT" \
            --profile "$PROFILE" \
            --profiles-file plugins/kaggle/config/profiles.json \
            --parameters-json "$PARAMETERS_JSON" \
            --accelerator "$ACCELERATOR" \
            --github-run-id "$GITHUB_RUN_ID" \
            --job-integrity-hash "$JOB_INTEGRITY_HASH" \
            --comment-file /tmp/run-comment.md \
            --diagnostic-file /tmp/submit-diagnostic.md

      - name: Publish machine-readable run record to the control issue
        id: publish
        working-directory: _plugins
        run: >-
          uv run --package chatgpt-plugin-kaggle python -m
          chatgpt_plugin_kaggle.actions.post_comment
          --issue "$ISSUE_NUMBER" --file /tmp/run-comment.md

      - name: Publish safe submission failure marker
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKOUT_CONTROL_OUTCOME: ${{ steps.checkout_control.outcome }}
          CHECKOUT_SOURCE_OUTCOME: ${{ steps.checkout_source.outcome }}
          SETUP_UV_OUTCOME: ${{ steps.setup_uv.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          CREDENTIALS_OUTCOME: ${{ steps.credentials.outcome }}
          SUBMIT_OUTCOME: ${{ steps.submit.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: |
          stage='unknown'
          if [ "$CHECKOUT_CONTROL_OUTCOME" != 'success' ]; then stage='checkout-control';
          elif [ "$CHECKOUT_SOURCE_OUTCOME" != 'success' ]; then stage='checkout-source';
          elif [ "$SETUP_UV_OUTCOME" != 'success' ]; then stage='setup-uv';
          elif [ "$INSTALL_OUTCOME" != 'success' ]; then stage='install';
          elif [ "$CREDENTIALS_OUTCOME" != 'success' ]; then stage='credentials';
          elif [ "$SUBMIT_OUTCOME" != 'success' ]; then stage='submit';
          elif [ "$PUBLISH_OUTCOME" != 'success' ]; then stage='publish';
          fi
          printf 'Kaggle task `%s` failed during validation/packaging/submission. stage=`%s`. No automatic source repair was attempted. Workflow run: %s/%s/actions/runs/%s\n' \
            "$TASK_ID" "$stage" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > /tmp/failure.md
          if [ "$stage" = 'submit' ] && [ -f /tmp/submit-diagnostic.md ]; then
            printf '\n' >> /tmp/failure.md
            cat /tmp/submit-diagnostic.md >> /tmp/failure.md
          fi
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/failure.md
