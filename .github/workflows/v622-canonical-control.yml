name: v622-canonical-control-disabled-finalization

# Canonical M01-M12/HPO/confirmation and legacy wave launch/repair control is frozen.
# Kept as a manual no-op receipt only; no Kaggle or Cloudflare mutation is possible here.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    runs-on: [self-hosted, windows, x64, v622]
    steps:
      - name: Confirm canonical control freeze
        shell: powershell
        run: |
          Write-Host 'V6.2.2 canonical launch/repair control is disabled for finalization.'
          Write-Host 'No Kaggle compute, HPO, confirmation, Cloudflare mutation, or GitHub-hosted compute is performed.'
