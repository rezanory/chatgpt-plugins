name: cloudflare-secret-inventory-20260913

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-secret-inventory-20260913.yml'

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    environment: cloudflare-production
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      RAW_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: List Worker secret names only
        shell: bash
        run: |
          set -euo pipefail
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$RAW_CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          npx --yes wrangler@4.131.1 secret list --name chatgpt-kaggle-gateway --format json > /tmp/secrets.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/secrets.json',encoding='utf-8'))
          names=sorted({str(x.get('name','')) for x in data if isinstance(x,dict) and x.get('name')})
          print('CLOUDFLARE_SECRET_NAMES='+json.dumps(names))
          PY
