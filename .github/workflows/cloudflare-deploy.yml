name: cloudflare-deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-deploy.yml'
      - 'deploy/cloudflare-container/**'
      - 'plugins/kaggle-gateway/**'

permissions:
  contents: read

concurrency:
  group: cloudflare-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: cloudflare-production
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Cloudflare deployment account
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SUPPLIED_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare API token is not configured; deployment is skipped."
            exit 0
          fi

          response="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            'https://api.cloudflare.com/client/v4/accounts?per_page=50')"

          resolved_account_id="$(python - "$SUPPLIED_CLOUDFLARE_ACCOUNT_ID" "$response" <<'PY'
          import json
          import sys

          supplied = sys.argv[1].strip()
          payload = json.loads(sys.argv[2])
          if not payload.get("success"):
              raise SystemExit("Cloudflare Accounts API returned success=false")
          accounts = payload.get("result") or []
          ids = [str(item.get("id", "")).strip() for item in accounts if item.get("id")]
          if supplied and supplied in ids:
              print(supplied)
          elif len(ids) == 1:
              print(ids[0])
          elif not ids:
              raise SystemExit("API token cannot enumerate any Cloudflare account")
          else:
              raise SystemExit(
                  "API token can access multiple Cloudflare accounts; set the exact Account ID"
              )
          PY
          )"

          if [ -z "$resolved_account_id" ]; then
            echo "Unable to resolve Cloudflare Account ID." >&2
            exit 1
          fi

          echo "::add-mask::$resolved_account_id"
          echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "account_id=$resolved_account_id" >> "$GITHUB_OUTPUT"
          echo "Cloudflare API token and deployment account resolved successfully."

      - name: Install deployment dependencies
        if: steps.credentials.outputs.configured == 'true'
        working-directory: deploy/cloudflare-container
        run: npm install --no-audit --no-fund

      - name: Validate production package
        if: steps.credentials.outputs.configured == 'true'
        working-directory: deploy/cloudflare-container
        run: |
          npm run check
          npm run deploy:dry

      - name: Deploy Worker and Container
        if: steps.credentials.outputs.configured == 'true'
        id: deploy
        working-directory: deploy/cloudflare-container
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.credentials.outputs.account_id }}
        shell: bash
        run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | tee /tmp/cloudflare-deploy.log
          worker_url="$(sed -r 's/\x1B\[[0-9;]*[mK]//g' /tmp/cloudflare-deploy.log | grep -Eo 'https://[^[:space:]]+\.workers\.dev' | tail -n 1)"
          if [ -z "$worker_url" ]; then
            echo "Wrangler deployment succeeded but no workers.dev URL was found." >&2
            exit 1
          fi
          echo "worker_url=$worker_url" >> "$GITHUB_OUTPUT"

      - name: Verify deployed health endpoint
        if: steps.credentials.outputs.configured == 'true'
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        shell: bash
        run: |
          for attempt in $(seq 1 20); do
            if response="$(curl --fail --silent --show-error --max-time 10 "$WORKER_URL/healthz")"; then
              python - "$response" <<'PY'
          import json
          import sys

          payload = json.loads(sys.argv[1])
          assert payload.get("service") == "chatgpt-kaggle-gateway"
          assert payload.get("status") == "ready"
          PY
              echo "Cloudflare remote gateway health check PASS."
              exit 0
            fi
            sleep 3
          done
          echo "Deployed Worker did not pass /healthz validation." >&2
          exit 1

      - name: Report activation blocker
        if: steps.credentials.outputs.configured != 'true'
        run: |
          echo "SKIPPED_NOT_CONFIGURED"
          echo "Set CLOUDFLARE_API_TOKEN in the cloudflare-production environment."
