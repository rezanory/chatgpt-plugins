name: m07-a13-readonly-evidence-probe

on:
  issue_comment:
    types: [created]

permissions:
  id-token: write
  contents: read

jobs:
  probe:
    if: >-
      ${{ github.event.issue.number == 33 &&
          github.event.comment.user.id == 62356000 &&
          github.event.comment.body == 'M07_A13_READONLY_EVIDENCE_PROBE_V1' }}
    runs-on: [self-hosted, windows, x64, v622]
    timeout-minutes: 20
    steps:
      - name: Checkout exact default-branch revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Recover exact existing A13 evidence read-only
        shell: powershell
        env:
          M07_EVIDENCE_DIR: m07-a13-readonly-evidence
        run: |
          $ErrorActionPreference='Stop'
          $python=(Get-Command python.exe -ErrorAction SilentlyContinue).Source
          if(-not $python){$python=(Get-Command python -ErrorAction Stop).Source}
          & $python scripts/m07_probe_a13_evidence.py
          if($LASTEXITCODE-ne 0){throw 'M07 A13 read-only evidence probe failed'}

      - name: Preserve A13 read-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m07-a13-readonly-evidence-${{ github.run_id }}
          path: m07-a13-readonly-evidence
          if-no-files-found: warn
          retention-days: 30
