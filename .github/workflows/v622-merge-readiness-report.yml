name: v622-merge-readiness-report

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v622-merge-readiness-report.yml'

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Collect six shard artifact summaries
        shell: bash
        run: |
          base='https://chatgpt-kaggle-gateway.rezanory-chatgpt-plugins.workers.dev/recovery/v6-2-2/shard-artifacts'
          mkdir -p /tmp/v622-shards
          for shard in W01 W02 W03 W04 W05 W06; do
            ok=0
            for attempt in $(seq 1 30); do
              code="$(curl --silent --show-error --max-time 90 -o "/tmp/v622-shards/${shard}.json" -w '%{http_code}' "${base}?shard=${shard}" || true)"
              if [ "$code" = '200' ] && python - "$shard" <<'PY'
          import json
          import sys
          from pathlib import Path
          shard = sys.argv[1]
          value = json.loads(Path(f'/tmp/v622-shards/{shard}.json').read_text(encoding='utf-8'))
          assert value.get('shard_id') == shard
          assert isinstance(value.get('artifact_groups'), dict)
          PY
              then
                ok=1
                break
              fi
              sleep 10
            done
            if [ "$ok" != '1' ]; then
              echo "Shard artifact endpoint failed for $shard" >&2
              cat "/tmp/v622-shards/${shard}.json" 2>/dev/null || true
              exit 1
            fi
          done

      - name: Publish merge-readiness manifest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          shards = []
          for name in ('W01','W02','W03','W04','W05','W06'):
              shards.append(json.loads(Path(f'/tmp/v622-shards/{name}.json').read_text(encoding='utf-8')))

          def counts(groups):
              return {key: len(value or []) for key, value in (groups or {}).items()}

          summary = []
          for shard in shards:
              summary.append({
                  'shard_id': shard.get('shard_id'),
                  'model_code': shard.get('model_code'),
                  'resolution': shard.get('resolution'),
                  'model_hints': shard.get('model_hints'),
                  'enumerated_file_count': shard.get('enumerated_file_count'),
                  'truncated': shard.get('truncated'),
                  'artifact_counts': counts(shard.get('artifact_groups')),
              })

          lines = [
              '## V6.2.2 six-shard merge-readiness manifest',
              '',
              '### Summary',
              '```json',
              json.dumps(summary, indent=2),
              '```',
          ]
          for shard in shards:
              lines += [
                  '',
                  f"### {shard.get('shard_id')} — {shard.get('kernel_ref')}",
                  '```json',
                  json.dumps(shard, indent=2)[:30000],
                  '```',
              ]
          Path('/tmp/v622-merge-readiness.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          gh issue comment 18 --repo "$GITHUB_REPOSITORY" --body-file /tmp/v622-merge-readiness.md
