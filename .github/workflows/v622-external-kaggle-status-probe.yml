name: v622-external-kaggle-status-probe-retired-after-v2-incident

# V2 root cause is recorded in Issue 18. Retired to avoid racing the active V3 external bridge.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: [self-hosted, windows, x64, v622]
    steps:
      - name: Confirm probe retired
        shell: powershell
        run: |
          Write-Host 'External V2 incident diagnosis is complete.'
          Write-Host 'No Cloudflare/Kaggle/model mutation is performed.'
