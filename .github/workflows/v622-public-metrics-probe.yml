name: v622-public-metrics-probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v622-public-metrics-probe.yml'

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe public Kaggle kernel output API
        shell: bash
        run: |
          set -u
          url='https://api.kaggle.com/v1/kernels.KernelsApiService/ListKernelSessionOutput'
          body='{"userName":"azadka","kernelSlug":"pneumonia-v6-2-2-train-w01-m01-r224","pageSize":5}'
          code="$(curl --silent --show-error --max-time 60 -o /tmp/kaggle-probe.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data "$body" "$url" || true)"
          python - "$code" <<'PY'
          import json, sys
          from pathlib import Path
          code=sys.argv[1]
          p=Path('/tmp/kaggle-probe.json')
          text=p.read_text(errors='replace') if p.exists() else ''
          try:
              v=json.loads(text)
          except Exception:
              v={}
          out={'http_status':code,'file_count':len(v.get('files') or []),'code':v.get('code'),'message':v.get('message')}
          Path('/tmp/probe.md').write_text('## V6.2.2 public metrics probe\n\n```json\n'+json.dumps(out,indent=2)+'\n```\n')
          PY
      - name: Publish probe receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 18 --repo "$GITHUB_REPOSITORY" --body-file /tmp/probe.md
