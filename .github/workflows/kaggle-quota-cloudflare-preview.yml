name: kaggle-quota-cloudflare-preview

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kaggle-quota-cloudflare-preview.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  quota-preview:
    runs-on: [self-hosted, windows, x64, v622]
    environment: cloudflare-production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Read quota through ephemeral remote preview
        shell: powershell
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          Set-Location deploy/cloudflare-worker-free
          npm ci --silent
          $worker=@'
          const A=[
            ['kg-01','azadka','CGP_KAGGLE_MASTER_TOKEN'],
            ['kg-02','radlinaradlina','CGP_KAGGLE_KG02_TOKEN'],
            ['kg-03','rezanory','CGP_KAGGLE_KG03_TOKEN'],
            ['kg-04','reyhanehazad','CGP_KAGGLE_KG04_TOKEN'],
            ['kg-05','trickermark','CGP_KAGGLE_KG05_TOKEN'],
            ['kg-06','msdenis','CGP_KAGGLE_KG06_TOKEN'],
            ['kg-07','nisabulutmark','CGP_KAGGLE_KG07_TOKEN'],
            ['kg-08','mononoke44','CGP_KAGGLE_KG08_TOKEN']
          ];
          const E='https://api.kaggle.com/v1/kernels.KernelsApiService/GetAcceleratorQuotaStatistics';
          function b(v){let s='';for(const x of new TextEncoder().encode(v))s+=String.fromCharCode(x);return btoa(s)}
          function sec(v){if(v==null)return null;if(typeof v==='number')return v;if(typeof v==='object')return Number(v.seconds||0)+Number(v.nanos||0)/1e9;const m=String(v).match(/^(-?[0-9]+(?:\.[0-9]+)?)s$/);return m?Number(m[1]):(Number.isFinite(Number(v))?Number(v):null)}
          function q(o){if(!o||typeof o!=='object')return null;const u=sec(o.timeUsed??o.time_used),t=sec(o.totalTimeAllowed??o.total_time_allowed);if(u==null||t==null)return null;return{used_hours:+(u/3600).toFixed(3),remaining_hours:+(Math.max(0,t-u)/3600).toFixed(3),total_hours:+(t/3600).toFixed(3)}}
          async function p(env,[id,owner,key]){const tok=String(env[key]||'').trim();const row={account_id:id,owner_slug:owner};if(!tok)return{...row,status:'TOKEN_NOT_IN_PREVIEW'};const auth=tok.startsWith('KGAT_')?'Bearer '+tok:'Basic '+b(owner+':'+tok);try{const r=await fetch(E,{method:'POST',headers:{Authorization:auth,'Content-Type':'application/json'},body:'{}'});const x=await r.json().catch(()=>({}));return r.ok?{...row,status:'OK',gpu:q(x.gpuQuota||x.gpu_quota),tpu:q(x.tpuQuota||x.tpu_quota),refresh_at:x.quotaRefreshTime||x.quota_refresh_time||null}:{...row,status:'QUERY_ERROR',http_status:r.status}}catch(e){return{...row,status:'QUERY_ERROR',error_type:e?.name||'Error'}}}
          export default{async fetch(req,env){if(new URL(req.url).pathname!='/quota')return new Response('not found',{status:404});return Response.json(await Promise.all(A.map(a=>p(env,a))),{headers:{'Cache-Control':'no-store'}})}};
          '@
          [IO.File]::WriteAllText((Join-Path $PWD 'src/quota-preview.ts'),$worker,[Text.UTF8Encoding]::new($false))
          $cfg='{"$schema":"node_modules/wrangler/config-schema.json","name":"chatgpt-kaggle-gateway","main":"src/quota-preview.ts","compatibility_date":"2026-09-01","workers_dev":true,"preview_urls":false}'
          [IO.File]::WriteAllText((Join-Path $PWD 'wrangler.quota-preview.jsonc'),$cfg,[Text.UTF8Encoding]::new($false))
          $outLog=Join-Path $env:RUNNER_TEMP 'quota-preview.out.log'
          $errLog=Join-Path $env:RUNNER_TEMP 'quota-preview.err.log'
          $p=Start-Process -FilePath 'npx.cmd' -ArgumentList @('wrangler','dev','--remote','--config','wrangler.quota-preview.jsonc','--ip','127.0.0.1','--port','8799') -WorkingDirectory $PWD -RedirectStandardOutput $outLog -RedirectStandardError $errLog -PassThru -WindowStyle Hidden
          try {
            $result=$null
            for($i=0;$i -lt 35;$i++){
              Start-Sleep -Seconds 2
              try{$result=Invoke-RestMethod -Uri 'http://127.0.0.1:8799/quota' -TimeoutSec 15;break}catch{}
              if($p.HasExited){break}
            }
            if($null -eq $result){
              $safe=((Get-Content $outLog,$errLog -ErrorAction SilentlyContinue -Tail 80) -join "`n") -replace 'KGAT_[A-Za-z0-9_-]+','<redacted>'
              if($safe.Length -gt 3000){$safe=$safe.Substring($safe.Length-3000)}
              $result=@{status='PREVIEW_UNAVAILABLE';detail=$safe}
            }
            $json=$result|ConvertTo-Json -Depth 12
            $body="## KAGGLE QUOTA CLOUDFLARE PREVIEW`n`n``````json`n$json`n``````"
            $h=@{Authorization="Bearer $env:GITHUB_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
            Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/issues/18/comments" -Method Post -Headers $h -ContentType 'application/json' -Body (@{body=$body}|ConvertTo-Json -Compress) -TimeoutSec 30|Out-Null
          } finally { if(-not $p.HasExited){Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue} }
