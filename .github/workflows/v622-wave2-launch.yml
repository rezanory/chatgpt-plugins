name: v622-wave2-launch

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v622-wave2-launch.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: v622-wave2-launch
  cancel-in-progress: false

jobs:
  launch:
    runs-on: ubuntu-latest
    environment: cloudflare-production
    steps:
      - uses: actions/checkout@v4

      - name: Validate canonical wave plan
        shell: bash
        run: |
          url='https://chatgpt-kaggle-gateway.rezanory-chatgpt-plugins.workers.dev/recovery/v6-2-2/wave-plan?wave=2'
          ok=0
          for attempt in $(seq 1 40); do
            code="$(curl --silent --show-error --max-time 30 -o /tmp/wave-plan.json -w '%{http_code}' "$url" || true)"
            if [ "$code" = '200' ] && python - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path('/tmp/wave-plan.json').read_text(encoding='utf-8'))
          expected = [
              ('kg-02','M03',224,'W07'),
              ('kg-03','M03',320,'W08'),
              ('kg-04','M03',384,'W09'),
              ('kg-05','M04',224,'W10'),
              ('kg-06','M04',320,'W11'),
              ('kg-07','M04',384,'W12'),
          ]
          tasks = value.get('tasks') or []
          actual = [(x.get('accountId'), x.get('modelId'), x.get('resolution'), x.get('workerId')) for x in tasks]
          assert actual == expected, (actual, expected)
          PY
            then
              ok=1
              break
            fi
            sleep 10
          done
          if [ "$ok" != '1' ]; then
            echo 'Canonical wave-2 control endpoint did not become ready.' >&2
            cat /tmp/wave-plan.json 2>/dev/null || true
            exit 1
          fi

      - name: Install Worker dependencies
        working-directory: deploy/cloudflare-worker-free
        run: npm install --no-audit --no-fund

      - name: Create ephemeral project control capability
        id: capability
        working-directory: deploy/cloudflare-worker-free
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          account_id="$(printf '%s' "$RAW_CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          token="$(python - <<'PY'
          import secrets
          print(secrets.token_urlsafe(48))
          PY
          )"
          echo "::add-mask::$account_id"
          echo "::add-mask::$token"
          export CLOUDFLARE_ACCOUNT_ID="$account_id"
          printf '%s' "$token" | npx wrangler secret put CGP_PROJECT_CONTROL_TOKEN
          echo "PROJECT_CONTROL_TOKEN=$token" >> "$GITHUB_ENV"
          echo "NORMALIZED_CLOUDFLARE_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"

      - name: Submit M03-M04 canonical matrix wave
        shell: bash
        run: |
          url='https://chatgpt-kaggle-gateway.rezanory-chatgpt-plugins.workers.dev/control/v6-2-2/wave'
          ok=0
          last_code='000'
          for attempt in $(seq 1 24); do
            last_code="$(curl --silent --show-error --max-time 180 \
              -o /tmp/wave-launch.json -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer $PROJECT_CONTROL_TOKEN" \
              -H 'Content-Type: application/json' \
              --data '{"wave":2}' \
              "$url" || true)"
            if [ "$last_code" = '200' ] && python - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path('/tmp/wave-launch.json').read_text(encoding='utf-8'))
          assert value.get('wave') == 2
          results = value.get('results') or []
          assert len(results) == 6
          assert all(item.get('action') in {'submitted','existing'} for item in results)
          PY
            then
              ok=1
              break
            fi
            # Secret updates create a new Worker version; allow it to become active before retrying.
            sleep 5
          done
          if [ "$ok" != '1' ]; then
            echo "Wave launch did not succeed; last HTTP status: $last_code" >&2
            cat /tmp/wave-launch.json 2>/dev/null || true
            exit 1
          fi
          cat /tmp/wave-launch.json

      - name: Remove ephemeral project control capability
        if: always()
        working-directory: deploy/cloudflare-worker-free
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.NORMALIZED_CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          printf '{"CGP_PROJECT_CONTROL_TOKEN":null}\n' > /tmp/delete-control.json
          npx wrangler secret bulk /tmp/delete-control.json || true
          rm -f /tmp/delete-control.json

      - name: Publish safe wave receipt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('/tmp/wave-launch.json')
          if path.exists():
              try:
                  value = json.loads(path.read_text(encoding='utf-8'))
              except Exception:
                  value = {'error':'launch response was not valid JSON'}
          else:
              value = {'error':'launch response was not produced'}
          safe = {
              'wave': value.get('wave'),
              'source_template': value.get('source_template'),
              'source_fingerprint': value.get('source_fingerprint'),
              'frozen_recipe_sha256': value.get('frozen_recipe_sha256'),
              'seed': value.get('seed'),
              'head_epochs': value.get('head_epochs'),
              'finetune_epochs': value.get('finetune_epochs'),
              'results': [
                  {
                      'worker_id': item.get('workerId'),
                      'account_id': item.get('accountId'),
                      'model_id': item.get('modelId'),
                      'resolution': item.get('resolution'),
                      'kernel_ref': item.get('kernelRef'),
                      'action': item.get('action'),
                  }
                  for item in (value.get('results') or [])
              ],
              'error': value.get('error'),
          }
          Path('/tmp/wave-receipt.md').write_text(
              '## V6.2.2 Wave 2 launch receipt\n\n```json\n' + json.dumps(safe, indent=2) + '\n```\n',
              encoding='utf-8',
          )
          PY
          gh issue comment 18 --repo "$GITHUB_REPOSITORY" --body-file /tmp/wave-receipt.md
