name: kaggle-kg08-verify

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kaggle-kg08-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, windows, x64, v622]
    environment: cloudflare-production
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify kg08 through ephemeral Cloudflare preview
        shell: powershell
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          $ErrorActionPreference='Stop'
          $env:CLOUDFLARE_API_TOKEN=([string]$env:CLOUDFLARE_API_TOKEN).Trim()
          $env:CLOUDFLARE_ACCOUNT_ID=([string]$env:CLOUDFLARE_ACCOUNT_ID).Trim()
          Set-Location deploy/cloudflare-worker-free
          npm ci --silent
          $worker=@'
          const E='https://api.kaggle.com/v1/kernels.KernelsApiService/GetAcceleratorQuotaStatistics';
          function sec(v){if(v==null)return null;if(typeof v==='number')return v;if(typeof v==='object')return Number(v.seconds||0)+Number(v.nanos||0)/1e9;const m=String(v).match(/^(-?[0-9]+(?:\.[0-9]+)?)s$/);return m?Number(m[1]):Number(v)}
          function q(o){if(!o||typeof o!=='object')return null;const u=sec(o.timeUsed??o.time_used),t=sec(o.totalTimeAllowed??o.total_time_allowed);if(!Number.isFinite(u)||!Number.isFinite(t))return null;return{used_hours:+(u/3600).toFixed(3),remaining_hours:+(Math.max(0,t-u)/3600).toFixed(3),total_hours:+(t/3600).toFixed(3)}}
          export default{async fetch(req,env){const token=String(env.CGP_KAGGLE_KG08_TOKEN||'').trim();if(!token)return Response.json({account_id:'kg-08',owner_slug:'mononoke44',status:'TOKEN_NOT_CONFIGURED'});const auth=token.startsWith('KGAT_')?'Bearer '+token:'';if(!auth)return Response.json({account_id:'kg-08',owner_slug:'mononoke44',status:'UNSUPPORTED_TOKEN_FORMAT'});try{const r=await fetch(E,{method:'POST',headers:{Authorization:auth,'Content-Type':'application/json'},body:'{}'});const x=await r.json().catch(()=>({}));return Response.json(r.ok?{account_id:'kg-08',owner_slug:'mononoke44',status:'OK',gpu:q(x.gpuQuota||x.gpu_quota),tpu:q(x.tpuQuota||x.tpu_quota),refresh_at:x.quotaRefreshTime||x.quota_refresh_time||null}:{account_id:'kg-08',owner_slug:'mononoke44',status:'QUERY_ERROR',http_status:r.status})}catch(e){return Response.json({account_id:'kg-08',owner_slug:'mononoke44',status:'QUERY_ERROR',error_type:e?.name||'Error'})}}};
          '@
          [IO.File]::WriteAllText((Join-Path $PWD 'src/kg08-verify.ts'),$worker,[Text.UTF8Encoding]::new($false))
          $cfg='{"$schema":"node_modules/wrangler/config-schema.json","name":"chatgpt-kaggle-gateway","main":"src/kg08-verify.ts","compatibility_date":"2026-09-01","workers_dev":true,"preview_urls":false}'
          [IO.File]::WriteAllText((Join-Path $PWD 'wrangler.kg08-verify.jsonc'),$cfg,[Text.UTF8Encoding]::new($false))
          $outLog=Join-Path $env:RUNNER_TEMP 'kg08.out.log'; $errLog=Join-Path $env:RUNNER_TEMP 'kg08.err.log'
          $p=Start-Process -FilePath 'npx.cmd' -ArgumentList @('wrangler','dev','--remote','--config','wrangler.kg08-verify.jsonc','--ip','127.0.0.1','--port','8798') -WorkingDirectory $PWD -RedirectStandardOutput $outLog -RedirectStandardError $errLog -PassThru -WindowStyle Hidden
          try {
            $result=$null
            for($i=0;$i -lt 30;$i++){Start-Sleep -Seconds 2;try{$result=Invoke-RestMethod -Uri 'http://127.0.0.1:8798/' -TimeoutSec 15;break}catch{};if($p.HasExited){break}}
            if($null -eq $result){$result=@{account_id='kg-08';owner_slug='mononoke44';status='PREVIEW_UNAVAILABLE'}}
            Write-Host 'CGP_KG08_VERIFY_BEGIN'
            ($result|ConvertTo-Json -Depth 8 -Compress)|Write-Host
            Write-Host 'CGP_KG08_VERIFY_END'
          } finally {if(-not $p.HasExited){Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue}}
          exit 0
