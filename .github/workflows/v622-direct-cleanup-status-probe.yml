name: v622-direct-cleanup-status-probe

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report cleanup and transfer state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          runs="$(gh api "/repos/${REPO}/actions/runs?per_page=100")"
          cleanup="$(jq -c '[.workflow_runs[] | select(.name == "v622-direct-cancel-stale-runs-and-restart-transfer")] | sort_by(.created_at) | reverse | .[0] // {}' <<<"${runs}")"
          transfer="$(jq -c '[.workflow_runs[] | select(.name == "v622-kaggle-to-kaggle-finalization-artifact-transfer")] | sort_by(.created_at) | reverse | .[0] // {}' <<<"${runs}")"
          cleanup_id="$(jq -r '.id // "none"' <<<"${cleanup}")"
          cleanup_status="$(jq -r '.status // "none"' <<<"${cleanup}")"
          cleanup_conclusion="$(jq -r '.conclusion // "none"' <<<"${cleanup}")"
          transfer_id="$(jq -r '.id // "none"' <<<"${transfer}")"
          transfer_status="$(jq -r '.status // "none"' <<<"${transfer}")"
          transfer_conclusion="$(jq -r '.conclusion // "none"' <<<"${transfer}")"
          current="none"
          if [[ "${transfer_id}" != "none" ]]; then
            jobs="$(gh api "/repos/${REPO}/actions/runs/${transfer_id}/jobs?per_page=100&filter=latest")"
            current="$(jq -r '[.jobs[] as $j | ($j.steps // [])[] | select(.status == "in_progress") | ($j.name + " :: " + .name)] | .[0] // "none"' <<<"${jobs}")"
          fi
          body="## V6.2.2 direct cleanup / transfer probe

- Cleanup run ID: \`${cleanup_id}\`
- Cleanup status: \`${cleanup_status}\`
- Cleanup conclusion: \`${cleanup_conclusion}\`
- Latest transfer run ID: \`${transfer_id}\`
- Latest transfer status: \`${transfer_status}\`
- Latest transfer conclusion: \`${transfer_conclusion}\`
- Transfer current step: \`${current}\`
- Probe role: read-only Actions status; no Kaggle/Cloudflare/model compute
"
          jq -n --arg body "$body" '{body:$body}' | gh api --method POST "/repos/${REPO}/issues/18/comments" --input - >/dev/null
