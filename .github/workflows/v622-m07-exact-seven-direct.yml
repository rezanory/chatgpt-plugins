name: v622-m07-exact-seven-direct

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: pneumonia-m07-exact-seven-direct
  cancel-in-progress: false

jobs:
  launch:
    if: ${{ github.event.issue.number == 33 && github.event.comment.user.id == 62356000 && github.event.comment.body == 'PNEUMONIA_MASTER_M07_EXACT_SEVEN_RUN_V1' }}
    runs-on: [self-hosted, windows, x64, v622]
    timeout-minutes: 45
    steps:
      - name: Checkout exact launch payload
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Reconstruct and validate package-derived locked notebook
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $names=@(
            'docs/pneumonia-v6-2-2-m07-exact-part-00.b64',
            'docs/pneumonia-v6-2-2-m07-exact-part-01.b64',
            'docs/pneumonia-v6-2-2-m07-exact-part-02.b64',
            'docs/pneumonia-v6-2-2-m07-exact-part-03.b64',
            'docs/pneumonia-v6-2-2-m07-exact-part-04.b64',
            'docs/pneumonia-v6-2-2-m07-exact-part-05.b64',
            'docs/pneumonia-v6-2-2-m07-exact-part-06.b64',
            'docs/pneumonia-v6-2-2-m07-exact-part-07.b64'
          )
          $b64=''
          foreach($name in $names){
            $p=$name
            if(-not (Test-Path $p)){throw "payload piece missing: $name"}
            $piece=([IO.File]::ReadAllText($p)).Trim()
            if(-not $piece){throw "payload piece empty: $name"}
            $b64 += $piece
          }
          if($b64.Length -ne 93120){throw "payload base64 length mismatch: $($b64.Length)"}
          $gz=[Convert]::FromBase64String($b64)
          $input=[IO.MemoryStream]::new($gz)
          $zip=[IO.Compression.GZipStream]::new($input,[IO.Compression.CompressionMode]::Decompress)
          $out=Join-Path $env:RUNNER_TEMP 'PNEUMONIA_MASTER_M01_M12_M07_GATE_OPERATIONAL_SAFE.ipynb'
          $output=[IO.File]::Create($out)
          try {$zip.CopyTo($output)} finally {$output.Dispose();$zip.Dispose();$input.Dispose()}
          $sha=(Get-FileHash $out -Algorithm SHA256).Hash.ToLower()
          if($sha -ne '234b87dec5ad3bbc564956025496411f272ed94b7efdb4719f56a1f762bdcc3c'){throw "launch notebook sha mismatch: $sha"}
          $nb=[IO.File]::ReadAllText($out,[Text.Encoding]::UTF8)
          if($nb -notlike '*UNLOCK_REMAINING_MODELS = False*'){throw 'M07 manual gate is not locked false'}
          if($nb -like '*UNLOCK_REMAINING_MODELS = True*'){throw 'automatic Phase-2 unlock literal found'}
          if($nb -notlike '*896491de87f9dc2a1d7d63548b7c5c22206da11f27a37efece8efc8e1557c8a9*'){throw 'frozen split fingerprint missing'}
          if($nb -notlike '*paultimothymooney/chest-xray-pneumonia*'){throw 'raw Kermany reference missing'}
          if($nb -notlike '*__ACCOUNT_OWNER__*'){throw 'per-account persistence placeholder missing'}
          "CGP_NOTEBOOK_PATH=$out" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CGP_NOTEBOOK_SHA=$sha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "EXACT_PACKAGE_DERIVED_NOTEBOOK_VALIDATED sha=$sha source_sha=8bb444a03d26014a7e87cf5582302c7d1987bdefea98d7b47444ce03d03e04c0"

      - name: Launch all seven Kaggle accounts in parallel with azadka as master/controller
        shell: powershell
        env:
          K_MASTER: ${{ secrets.CGP_KAGGLE_MASTER_TOKEN }}
          K_KG02: ${{ secrets.CGP_KAGGLE_KG02_TOKEN }}
          K_KG03: ${{ secrets.CGP_KAGGLE_KG03_TOKEN }}
          K_KG04: ${{ secrets.CGP_KAGGLE_KG04_TOKEN }}
          K_KG05: ${{ secrets.CGP_KAGGLE_KG05_TOKEN }}
          K_KG06: ${{ secrets.CGP_KAGGLE_KG06_TOKEN }}
          K_KG07: ${{ secrets.CGP_KAGGLE_KG07_TOKEN }}
        run: |
          $ErrorActionPreference='Stop'
          $python=(Get-Command python.exe -ErrorAction SilentlyContinue).Source
          if(-not $python){$python=(Get-Command python -ErrorAction Stop).Source}
          $script=@'
          import base64, concurrent.futures, json, os, pathlib, time, urllib.error, urllib.request

          SAVE='https://api.kaggle.com/v1/kernels.KernelsApiService/SaveKernel'
          STATUS='https://api.kaggle.com/v1/kernels.KernelsApiService/GetKernelSessionStatus'
          template=pathlib.Path(os.environ['CGP_NOTEBOOK_PATH']).read_text(encoding='utf-8')
          accounts=[
              ('master','azadka','K_MASTER'),
              ('kg-02','radlinaradlina','K_KG02'),
              ('kg-03','rezanory','K_KG03'),
              ('kg-04','reyhanehazad','K_KG04'),
              ('kg-05','trickermark','K_KG05'),
              ('kg-06','msdenis','K_KG06'),
              ('kg-07','nisabulutmark','K_KG07'),
          ]

          def auth(owner, token):
              if token.startswith('KGAT_'):
                  return 'Bearer '+token
              return 'Basic '+base64.b64encode(f'{owner}:{token}'.encode()).decode()

          def post_json(url, owner, token, body, timeout=240):
              data=json.dumps(body,separators=(',',':')).encode()
              req=urllib.request.Request(url,data=data,method='POST',headers={
                  'Authorization':auth(owner,token),
                  'Content-Type':'application/json',
                  'Accept':'application/json',
                  'User-Agent':'pneumonia-m07-exact-seven-direct/1.0',
              })
              try:
                  with urllib.request.urlopen(req,timeout=timeout) as r:
                      raw=r.read().decode('utf-8','replace')
                      value=json.loads(raw) if raw else {}
                      return r.status,value
              except urllib.error.HTTPError as exc:
                  raw=exc.read(4000).decode('utf-8','replace')
                  raise RuntimeError(f'HTTP {exc.code}: {raw[:1200]}') from exc

          def submit(item):
              aid,owner,env_name=item
              token=(os.environ.get(env_name) or '').strip()
              slug=f'{owner}/pneumonia-master-m07-gate-224-exactpkg-20260828-v1'
              row={'account_id':aid,'owner':owner,'kernel_ref':slug,'master_owner':'azadka'}
              if not token:
                  row.update(submitted=False,error='TOKEN_NOT_IN_GITHUB_ACTIONS')
                  return row
              nb=template.replace('__ACCOUNT_OWNER__',owner)
              if '__ACCOUNT_OWNER__' in nb:
                  row.update(submitted=False,error='OWNER_SUBSTITUTION_INCOMPLETE')
                  return row
              if 'UNLOCK_REMAINING_MODELS = False' not in nb or 'UNLOCK_REMAINING_MODELS = True' in nb:
                  row.update(submitted=False,error='GATE_INVARIANT_FAILED')
                  return row
              body={
                  'slug':slug,
                  'newTitle':('Pneumonia M07 Gate 224 — MASTER azadka' if aid=='master' else f'Pneumonia M07 Gate 224 — worker {owner} / master azadka'),
                  'text':nb,
                  'language':'PYTHON',
                  'kernelType':'NOTEBOOK',
                  'isPrivate':True,
                  'enableGpu':True,
                  'enableInternet':True,
                  'datasetDataSources':['paultimothymooney/chest-xray-pneumonia'],
                  'kernelDataSources':['reyhanehazad/notebook906d9e6ec9'],
              }
              try:
                  http,result=post_json(SAVE,owner,token,body)
                  code=result.get('code') if isinstance(result,dict) else None
                  if isinstance(code,(int,float)) and code>=400:
                      raise RuntimeError(str(result.get('message') or f'Kaggle code={code}'))
                  row.update(submitted=True,http_status=http,provider_ref=(result.get('ref') if isinstance(result,dict) else None))
              except Exception as exc:
                  row.update(submitted=False,error=f'{type(exc).__name__}: {exc}'[:1400])
              return row

          with concurrent.futures.ThreadPoolExecutor(max_workers=7) as ex:
              future_map={ex.submit(submit,item):item for item in accounts}
              results=[fut.result() for fut in concurrent.futures.as_completed(future_map)]

          order={a[0]:i for i,a in enumerate(accounts)}
          results.sort(key=lambda x:order[x['account_id']])
          master=next(r for r in results if r['account_id']=='master')

          submitted=[r for r in results if r.get('submitted')]
          if submitted:
              time.sleep(8)
              def probe(row):
                  aid=row['account_id']; owner=row['owner']; token=(os.environ.get(dict((a[0],a[2]) for a in accounts)[aid]) or '').strip()
                  slug=row['kernel_ref'].split('/',1)[1]
                  try:
                      _,value=post_json(STATUS,owner,token,{'userName':owner,'kernelSlug':slug},timeout=60)
                      row['session_status']=value
                  except Exception as exc:
                      row['session_status_error']=f'{type(exc).__name__}: {exc}'[:700]
                  return row
              with concurrent.futures.ThreadPoolExecutor(max_workers=len(submitted)) as ex:
                  list(ex.map(probe,submitted))

          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'m07-exact-seven-direct-results.json'
          out.write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')
          ok=sum(1 for r in results if r.get('submitted'))
          fail=7-ok
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
              f.write(f'CGP_RESULTS_PATH={out}\nCGP_OK_COUNT={ok}\nCGP_FAIL_COUNT={fail}\n')
          print(json.dumps({'master_submitted':bool(master.get('submitted')),'submitted':ok,'failed':fail,'parallel_all_7':True}))
          '@
          $script | & $python -
          if($LASTEXITCODE -ne 0){throw 'direct seven-account launch script failed'}

      - name: Publish launch receipt
        if: always()
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $rows=@()
          if($env:CGP_RESULTS_PATH -and (Test-Path $env:CGP_RESULTS_PATH)){
            $r=Get-Content -Raw $env:CGP_RESULTS_PATH | ConvertFrom-Json
            foreach($x in @($r)){
              $state=if($x.submitted){'SUBMITTED'}else{'FAILED'}
              $detail=if($x.submitted){if($x.provider_ref){[string]$x.provider_ref}else{'SaveKernel accepted'}}else{([string]$x.error).Replace('|','/')}
              $session=''
              if($x.session_status){$session=($x.session_status|ConvertTo-Json -Depth 8 -Compress); if($session.Length -gt 600){$session=$session.Substring(0,600)}}
              elseif($x.session_status_error){$session=[string]$x.session_status_error}
              $rows += "| $($x.account_id) | $($x.owner) | $state | $($x.kernel_ref) | $detail | $session |"
            }
          }
          $table=($rows -join "`n")
          $state=if($env:CGP_OK_COUNT -eq '7'){'ALL_7_SUBMITTED'}else{'PARTIAL_OR_FAILED'}
          $msg=@"
          ## PNEUMONIA M07 EXACT PACKAGE $state
          - Run: ``$env:GITHUB_RUN_ID``
          - Master/controller: ``azadka``
          - Source package notebook SHA256: ``8bb444a03d26014a7e87cf5582302c7d1987bdefea98d7b47444ce03d03e04c0``
          - Operational launch payload SHA256: ``$env:CGP_NOTEBOOK_SHA``
          - Scientific gate: ``M07@224 first``
          - ``UNLOCK_REMAINING_MODELS``: ``False``
          - Phase-2 auto-launch: ``disabled``
          - Kaggle submissions: ``all 7 parallel``; master/controller: ``azadka``
          - Frozen split attached: ``reyhanehazad/notebook906d9e6ec9``
          - Raw Kermany attached: ``paultimothymooney/chest-xray-pneumonia``
          - Submitted: ``$env:CGP_OK_COUNT/7``
          - Failed: ``$env:CGP_FAIL_COUNT/7``

          | Account | Owner | State | Kernel | Submit detail | Session probe |
          |---|---|---|---|---|---|
          $table
          "@
          $payload=@{body=$msg}|ConvertTo-Json -Compress
          $h=@{Authorization="Bearer $env:GITHUB_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/issues/33/comments" -Method Post -Headers $h -ContentType 'application/json' -Body $payload | Out-Null

      - name: Fail closed unless all seven submitted
        if: always()
        shell: powershell
        run: |
          if($env:CGP_OK_COUNT -ne '7' -or $env:CGP_FAIL_COUNT -ne '0'){
            throw "Exact M07 launch incomplete: submitted=$env:CGP_OK_COUNT failed=$env:CGP_FAIL_COUNT"
          }
          Write-Host 'All seven M07 gate notebooks submitted. Phase-2 remains locked.'
