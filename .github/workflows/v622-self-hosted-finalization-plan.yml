name: v622-self-hosted-finalization-plan-retired

# The finalization plan was already captured and the final freeze passed.
# Manual no-op only so the pre-lockbox workflow audit has no obsolete gateway dependency.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: [self-hosted, windows, x64, v622]
    steps:
      - name: Confirm retired state
        shell: powershell
        run: |
          Write-Host 'Retired V6.2.2 finalization-plan probe: no gateway access, Cloudflare mutation, Kaggle compute, locked test, or external validation is performed.'
