name: pneumonia-m07-continuation-v3

on:
  issue_comment:
    types: [created]

permissions:
  id-token: write
  contents: read
  issues: write

concurrency:
  group: pneumonia-m07-continuation-v3
  cancel-in-progress: false

jobs:
  launch:
    if: ${{ github.event.issue.number == 33 && github.event.comment.user.id == 62356000 && github.event.comment.body == 'PNEUMONIA_M07_CONTINUE_FOLD4_V3' }}
    runs-on: [self-hosted, windows, x64, v622]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Reconstruct and validate continuation notebook
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $python=(Get-Command python.exe -ErrorAction SilentlyContinue).Source
          if(-not $python){$python=(Get-Command python -ErrorAction Stop).Source}
          $script=@'
          import base64,gzip,hashlib,json,os,pathlib
          src=pathlib.Path('docs/m07-resume-fold4-continuation-v3-20260830.b64')
          raw=gzip.decompress(base64.b64decode(src.read_text(encoding='utf-8').strip()))
          sha=hashlib.sha256(raw).hexdigest()
          expected='7208afd5c63fd3ca9241b037c96fa7cda3461d4ed50ec5e060ac127a8d0e4ae5'
          if sha != expected: raise RuntimeError(f'continuation sha mismatch {sha}')
          nb=json.loads(raw.decode('utf-8'))
          text=raw.decode('utf-8')
          required=[
              'c2f519845f38c1ff53d17c851f27420aa7bd7f96ccb02511d2a491115652b9f5',
              'ALLOW_RETRAIN_MISSING_FOLDS = True',
              'ALLOW_FRESH_LOCKED_TEST_INFERENCE = True',
              'reyhanehazad/m07-pneumonia-campaign-state',
              'paultimothymooney/chest-xray-pneumonia',
          ]
          for needle in required:
              if needle not in text: raise RuntimeError('missing invariant: '+needle)
          forbidden=[
              'e49371927e5419711d1622790971f7cea3da6635d67c13e7063078e9febcac5d',
              'EXPECTED_LOCKED_TEST_PRIMARY_CM = [[',
              'EXPECTED_OOF_BALANCED_ACCURACY = 0.',
          ]
          for needle in forbidden:
              if needle in text: raise RuntimeError('stale V2 assumption remains: '+needle)
          failures=[]
          for i,c in enumerate(nb.get('cells',[])):
              if c.get('cell_type')=='code':
                  try: compile(''.join(c.get('source',[])),f'cell_{i}','exec')
                  except SyntaxError as e: failures.append((i,str(e)))
          if failures: raise RuntimeError(f'compile failures: {failures[:3]}')
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'M07_CONTINUE_FOLD4_V3.ipynb'
          out.write_bytes(raw)
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
              f.write(f'CGP_NOTEBOOK_PATH={out}\nCGP_NOTEBOOK_SHA={sha}\n')
          print(json.dumps({'validated':True,'sha256':sha,'cells':len(nb.get('cells',[]))}))
          '@
          $script|&$python -
          if($LASTEXITCODE-ne 0){throw 'continuation validation failed'}

      - name: Request trusted action OIDC
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if(-not $env:ACTIONS_ID_TOKEN_REQUEST_URL -or -not $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN){throw 'OIDC context unavailable'}
          $sep=if($env:ACTIONS_ID_TOKEN_REQUEST_URL.Contains('?')){'&'}else{'?'}
          $r=Invoke-RestMethod -Uri "$($env:ACTIONS_ID_TOKEN_REQUEST_URL)$($sep)audience=cgp-control-plane-v3-action" -Headers @{Authorization="Bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN"} -TimeoutSec 30
          $token=[string]$r.value
          if($token.Length -lt 100){throw 'OIDC unavailable'}
          Write-Host "::add-mask::$token"
          [IO.File]::AppendAllText($env:GITHUB_ENV,"CGP_ACTION_OIDC_TOKEN=$token`n",[Text.UTF8Encoding]::new($false))

      - name: Save and run continuation on kg-04 only
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $python=(Get-Command python.exe -ErrorAction SilentlyContinue).Source
          if(-not $python){$python=(Get-Command python -ErrorAction Stop).Source}
          $script=@'
          import json,os,pathlib,urllib.request,urllib.error
          endpoint='https://chatgpt-kaggle-gateway.rezanory-chatgpt-plugins.workers.dev/control-plane/v3/action/kaggle'
          text=pathlib.Path(os.environ['CGP_NOTEBOOK_PATH']).read_text(encoding='utf-8')
          payload={
              'request_id':'m07-continuation-v3-kg04-20260830',
              'provider':'kaggle','operation_class':'compute','account_id':'kg-04',
              'purpose':'Resume canonical M07@224 from durable Fold 1-3 state; train missing Fold 4-5 only; compute OOF; first Locked Test once; Phase2 remains locked.',
              'service':'kernels.KernelsApiService','method':'SaveKernel',
              'body':{
                  'slug':'reyhanehazad/m07-resume-fold4-continuation-v3-20260830',
                  'newTitle':'M07 Resume Fold4 Continuation V3 20260830',
                  'text':text,'language':'PYTHON','kernelType':'NOTEBOOK',
                  'kernelExecutionType':'SAVE_AND_RUN_ALL','isPrivate':True,
                  'enableGpu':True,'enableInternet':True,
                  'datasetDataSources':['paultimothymooney/chest-xray-pneumonia']
              }
          }
          req=urllib.request.Request(endpoint,data=json.dumps(payload,separators=(',',':')).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['CGP_ACTION_OIDC_TOKEN'].strip(),'Content-Type':'application/json','Accept':'application/json','User-Agent':'m07-continuation-v3/1.0'})
          try:
              with urllib.request.urlopen(req,timeout=240) as r:
                  raw=r.read().decode('utf-8','replace'); result=json.loads(raw) if raw else {}
          except urllib.error.HTTPError as e:
              raw=e.read(8000).decode('utf-8','replace'); raise RuntimeError(f'HTTP {e.code}: {raw[:4000]}')
          if not result.get('ok'): raise RuntimeError('broker ok=false: '+json.dumps(result)[:3000])
          provider_ref=result.get('provider_ref') or (result.get('result') or {}).get('ref') or 'reyhanehazad/m07-resume-fold4-continuation-v3-20260830'
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
              f.write(f'CGP_PROVIDER_REF={provider_ref}\n')
          print(json.dumps({'accepted':True,'provider_ref':provider_ref}))
          '@
          $script|&$python -
          if($LASTEXITCODE-ne 0){throw 'Kaggle continuation submission failed'}

      - name: Publish receipt
        if: always()
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $state=if($env:CGP_PROVIDER_REF){'SAVE_AND_RUN_ALL_ACCEPTED'}else{'FAILED'}
          $msg="## M07 CONTINUATION V3 $state`n- Run: ``$env:GITHUB_RUN_ID```n- Account: ``kg-04 / reyhanehazad```n- Notebook SHA: ``$env:CGP_NOTEBOOK_SHA```n- Kernel: ``$env:CGP_PROVIDER_REF```n- Scientific resume: ``reuse HPO + Fold 1-3; train Fold 4-5; OOF; first Locked Test once```n- Phase2: ``locked``"
          $h=@{Authorization="Bearer $env:GITHUB_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/issues/33/comments" -Method Post -Headers $h -ContentType 'application/json' -Body (@{body=$msg}|ConvertTo-Json -Compress)|Out-Null
