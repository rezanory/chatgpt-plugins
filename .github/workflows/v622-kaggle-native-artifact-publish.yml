name: v622-kaggle-native-artifact-publish

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v622-kaggle-native-artifact-publish.yml'
      - 'deploy/cloudflare-worker-free/src/v622-kaggle-native-artifact-publish-worker.ts'

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: v622-cloudflare-production-mutation
  cancel-in-progress: true

jobs:
  publish:
    runs-on: [self-hosted, windows, x64, v622]
    timeout-minutes: 45
    environment: cloudflare-production
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy Kaggle-native artifact publisher bridge
        shell: powershell
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          $ErrorActionPreference = 'Stop'
          $accountId = ([string]$env:RAW_CLOUDFLARE_ACCOUNT_ID).Trim()
          if ([string]::IsNullOrWhiteSpace($env:CLOUDFLARE_API_TOKEN) -or [string]::IsNullOrWhiteSpace($accountId)) { throw 'Cloudflare credentials missing' }
          Write-Host "::add-mask::$accountId"
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "V622_CF_ACCOUNT_ID=$accountId`n", [System.Text.UTF8Encoding]::new($false))
          $env:CLOUDFLARE_ACCOUNT_ID = $accountId
          Push-Location 'deploy/cloudflare-worker-free'
          try {
            npm install --no-audit --no-fund
            if ($LASTEXITCODE -ne 0) { throw 'npm install failed' }
            npm run check
            if ($LASTEXITCODE -ne 0) { throw 'Worker typecheck failed' }
            npx wrangler deploy src/v622-kaggle-native-artifact-publish-worker.ts --name chatgpt-kaggle-gateway
            if ($LASTEXITCODE -ne 0) { throw 'Kaggle-native publisher bridge deploy failed' }
          }
          finally { Pop-Location }

      - name: Create ephemeral publisher capability
        shell: powershell
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $bytes = New-Object byte[] 48
          $rng = [System.Security.Cryptography.RandomNumberGenerator]::Create()
          try { $rng.GetBytes($bytes) } finally { $rng.Dispose() }
          $token = [Convert]::ToBase64String($bytes).TrimEnd('=').Replace('+','-').Replace('/','_')
          Write-Host "::add-mask::$token"
          $env:CLOUDFLARE_ACCOUNT_ID = $env:V622_CF_ACCOUNT_ID
          Push-Location 'deploy/cloudflare-worker-free'
          try {
            $token | npx wrangler secret put CGP_PROJECT_CONTROL_TOKEN --name chatgpt-kaggle-gateway
            if ($LASTEXITCODE -ne 0) { throw 'Publisher capability install failed' }
          }
          finally { Pop-Location }
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "V622_PUBLISH_TOKEN=$token`n", [System.Text.UTF8Encoding]::new($false))

      - name: Launch artifact publisher inside Kaggle trickermark
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{ Authorization = "Bearer $env:V622_PUBLISH_TOKEN"; 'Content-Type' = 'application/json' }
          $uri = 'https://chatgpt-kaggle-gateway.rezanory-chatgpt-plugins.workers.dev/control/v6-2-2/kaggle-native-artifact-publish/launch'
          $value = Invoke-RestMethod -Uri $uri -Method Post -Headers $headers -Body '{}' -TimeoutSec 180
          $value | ConvertTo-Json -Depth 50 | Write-Host
          if ($value.ok -eq $false) { throw "Kaggle publisher launch failed: $($value.error)" }
          if ([string]$value.target_kernel_ref -ne 'trickermark/pneumonia-v6-2-2-publish-finalization-artifacts') { throw 'Unexpected publisher target' }
          $body = "## V6.2.2 Kaggle-native artifact publisher launched`n`n- Kaggle kernel: ``trickermark/pneumonia-v6-2-2-publish-finalization-artifacts```n- Source mounted inside Kaggle: ``trickermark/pneumonia-v6-2-2-backbone-m06-r224```n- Target private Dataset: ``trickermark/pneumonia-v6-2-2-finalization-artifacts```n- Intended reader: ``azadka```n- Model compute: ``false```n- Train/HPO/confirmation: ``false```n- Locked/external: ``false```n- GitHub checkpoint transport: ``false```n- Bridge run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID`n"
          $payload = @{ body=$body } | ConvertTo-Json
          $gh = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept='application/vnd.github+json'; 'X-GitHub-Api-Version'='2022-11-28' }
          Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/issues/18/comments" -Method Post -Headers $gh -ContentType 'application/json' -Body $payload | Out-Null

      - name: Monitor Kaggle-native publisher to terminal status
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{ Authorization = "Bearer $env:V622_PUBLISH_TOKEN"; 'Content-Type' = 'application/json' }
          $uri = 'https://chatgpt-kaggle-gateway.rezanory-chatgpt-plugins.workers.dev/control/v6-2-2/kaggle-native-artifact-publish/status'
          $terminal = $null
          for ($attempt=1; $attempt -le 60; $attempt++) {
            $value = Invoke-RestMethod -Uri $uri -Method Post -Headers $headers -Body '{}' -TimeoutSec 180
            $status = ([string]$value.status).ToUpperInvariant()
            Write-Host "Kaggle publisher status $attempt/60: $status"
            if ($status -eq 'COMPLETE') { $terminal=$value; break }
            if ($status -in @('ERROR','FAILED','CANCELLED','CANCELED','DEAD')) { throw "Kaggle publisher terminated with $status" }
            Start-Sleep -Seconds 20
          }
          if ($null -eq $terminal) { throw 'Kaggle publisher did not reach COMPLETE inside monitor budget' }
          if ($null -eq $terminal.receipt) { throw 'Kaggle publisher COMPLETE without validated receipt' }
          $path = Join-Path $env:RUNNER_TEMP 'v622-kaggle-native-publish-receipt.json'
          [System.IO.File]::WriteAllText($path, ($terminal.receipt | ConvertTo-Json -Depth 50), [System.Text.UTF8Encoding]::new($false))

      - name: Journal Kaggle-native private Dataset readiness
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $r=Get-Content -Raw (Join-Path $env:RUNNER_TEMP 'v622-kaggle-native-publish-receipt.json') | ConvertFrom-Json
          $body="## V6.2.2 Kaggle-native artifact Dataset ready`n`n- Result: ``PASS```n- Dataset: ``$($r.dataset_ref)```n- Owner: ``trickermark```n- Reader: ``azadka```n- Files: ``7`` (3 configs + 3 selected checkpoints + frozen policy)`n- Source: ``trickermark/pneumonia-v6-2-2-backbone-m06-r224```n- All artifact copy/upload executed inside Kaggle: ``true```n- GitHub checkpoint transport/storage: ``false```n- Model compute: ``false```n- Next stage: ``FINAL_FREEZE_MANIFEST`` on ``azadka```n- Run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID`n"
          $payload=@{body=$body}|ConvertTo-Json
          $gh=@{Authorization="Bearer $env:GITHUB_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/issues/18/comments" -Method Post -Headers $gh -ContentType 'application/json' -Body $payload | Out-Null

      - name: Remove capability and restore canonical Worker
        if: always()
        shell: powershell
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          $ErrorActionPreference='Continue'
          if (-not [string]::IsNullOrWhiteSpace($env:V622_CF_ACCOUNT_ID)) {
            $env:CLOUDFLARE_ACCOUNT_ID=$env:V622_CF_ACCOUNT_ID
            Push-Location 'deploy/cloudflare-worker-free'
            try {
              for($a=1;$a -le 3;$a++){'y'|npx wrangler secret delete CGP_PROJECT_CONTROL_TOKEN --name chatgpt-kaggle-gateway;if($LASTEXITCODE -eq 0){break};Start-Sleep -Seconds 5}
              for($a=1;$a -le 3;$a++){npx wrangler deploy;if($LASTEXITCODE -eq 0){break};Start-Sleep -Seconds 5}
            } finally { Pop-Location }
          }

      - name: Publish Kaggle-native publisher failure
        if: failure()
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Continue'
          $body="## V6.2.2 Kaggle-native artifact publisher diagnostic`n`n- Result: ``FAILED_OR_TIMED_OUT```n- Intended execution: ``inside Kaggle trickermark```n- GitHub checkpoint transport: ``false```n- Model compute: ``false```n- Train/HPO/confirmation: ``false```n- Locked/external: ``false```n- Run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID`n"
          $payload=@{body=$body}|ConvertTo-Json
          $gh=@{Authorization="Bearer $env:GITHUB_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/issues/18/comments" -Method Post -Headers $gh -ContentType 'application/json' -Body $payload | Out-Null
