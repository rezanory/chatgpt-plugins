name: v622-self-hosted-backbone-launch

# trigger: guarded exact post-ablation launch
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v622-self-hosted-backbone-launch.yml'
      - 'deploy/cloudflare-worker-free/src/v622-backbone-launch-worker.ts'

permissions:
  contents: read
  issues: write

concurrency:
  group: v622-cloudflare-production-mutation
  cancel-in-progress: false

jobs:
  launch:
    runs-on: [self-hosted, windows, x64, v622]
    environment: cloudflare-production
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve local Python
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @()
          $command = Get-Command python.exe -ErrorAction SilentlyContinue
          if ($command) { $candidates += $command.Source }
          if (-not [string]::IsNullOrWhiteSpace($env:RUNNER_TOOL_CACHE)) {
            $pythonRoot = Join-Path $env:RUNNER_TOOL_CACHE 'Python'
            if (Test-Path $pythonRoot) {
              $candidates += Get-ChildItem -Path $pythonRoot -Filter python.exe -Recurse -ErrorAction SilentlyContinue |
                Sort-Object FullName -Descending |
                Select-Object -ExpandProperty FullName
            }
          }
          $python = $candidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $python) { throw 'No runnable Python executable found on self-hosted runner.' }
          & $python --version
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "V622_PYTHON=$python`n", [System.Text.UTF8Encoding]::new($false))

      - name: Deploy protected exact backbone launch bridge
        shell: powershell
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          $ErrorActionPreference = 'Stop'
          $accountId = ([string]$env:RAW_CLOUDFLARE_ACCOUNT_ID).Trim()
          if ([string]::IsNullOrWhiteSpace($env:CLOUDFLARE_API_TOKEN) -or [string]::IsNullOrWhiteSpace($accountId)) {
            throw 'Cloudflare deployment credentials are not configured.'
          }
          Write-Host "::add-mask::$accountId"
          $env:CLOUDFLARE_ACCOUNT_ID = $accountId
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "V622_CF_ACCOUNT_ID=$accountId`n", [System.Text.UTF8Encoding]::new($false))
          Push-Location 'deploy/cloudflare-worker-free'
          try {
            npm install --no-audit --no-fund
            if ($LASTEXITCODE -ne 0) { throw 'npm install failed' }
            npm run check
            if ($LASTEXITCODE -ne 0) { throw 'Worker typecheck failed' }
            npx wrangler deploy src/v622-backbone-launch-worker.ts --name chatgpt-kaggle-gateway
            if ($LASTEXITCODE -ne 0) { throw 'Backbone launch bridge deploy failed' }
          }
          finally { Pop-Location }

      - name: Create ephemeral launch capability
        shell: powershell
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $token = (& $env:V622_PYTHON -c "import secrets; print(secrets.token_urlsafe(48))").Trim()
          if ([string]::IsNullOrWhiteSpace($token)) { throw 'Could not generate launch capability.' }
          Write-Host "::add-mask::$token"
          $env:CLOUDFLARE_ACCOUNT_ID = $env:V622_CF_ACCOUNT_ID
          Push-Location 'deploy/cloudflare-worker-free'
          try {
            $token | npx wrangler secret put CGP_PROJECT_CONTROL_TOKEN
            if ($LASTEXITCODE -ne 0) { throw 'Could not install launch capability.' }
          }
          finally { Pop-Location }
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "V622_BACKBONE_LAUNCH_TOKEN=$token`n", [System.Text.UTF8Encoding]::new($false))

      - name: Launch exact post-ablation backbone comparison
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $uri = 'https://chatgpt-kaggle-gateway.rezanory-chatgpt-plugins.workers.dev/control/v6-2-2/launch-backbone-comparison'
          $headers = @{ Authorization = "Bearer $env:V622_BACKBONE_LAUNCH_TOKEN"; 'Content-Type' = 'application/json' }
          $result = $null
          $last = $null
          for ($attempt = 1; $attempt -le 30; $attempt++) {
            try {
              $result = Invoke-RestMethod -Uri $uri -Method Post -Headers $headers -Body '{}'
              if ($result.project -ne 'PNEUMONIA V6.2.2' -or $result.stage -ne 'post_ablation_backbone_comparison') { throw 'stale launch bridge response' }
              break
            }
            catch {
              $last = $_.Exception.Message
              Write-Host "launch bridge attempt $attempt/30 not ready: $last"
              Start-Sleep -Seconds 3
            }
          }
          if (-not $result) { throw "Launch bridge did not converge: $last" }
          if ($result.recipe_sha256 -ne '27cae8c59e06b609f9dfd02b526d807dc359b2bb14ae7bc5ee77c68c7553b08f') { throw 'Recipe SHA mismatch in launch receipt' }
          if ($result.target_kernel_ref -ne 'trickermark/pneumonia-v6-2-2-backbone-m06-r224') { throw 'Unexpected target kernel ref' }
          if (@('submitted','existing') -notcontains [string]$result.action) { throw "Unexpected launch action: $($result.action)" }
          $result | ConvertTo-Json -Depth 20 | Set-Content -Encoding utf8 "$env:RUNNER_TEMP\v622-backbone-launch-result.json"
          Write-Host ($result | ConvertTo-Json -Depth 20)

      - name: Publish launch receipt
        if: success()
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $result = Get-Content -Raw "$env:RUNNER_TEMP\v622-backbone-launch-result.json" | ConvertFrom-Json
          $launched = if ($result.action -eq 'submitted') { 'true' } else { 'false_existing_kernel' }
          $body = "## V6.2.2 post-ablation backbone launch receipt`n`n- Action: $($result.action)`n- Kernel: $($result.target_kernel_ref)`n- Kaggle backbone-comparison compute launched now: $launched`n- Selected model: M06 / r224`n- Frozen recipe SHA-256: $($result.recipe_sha256)`n- Backbones: convnext_tiny, densenet121, efficientnetv2b0, resnet50v2`n- Identical seed list: 42`n- Canonical M01-M12 runs rerun: false`n- HPO/confirmation repeated: false`n- Locked official test used: false`n- External cohort used: false`n- GitHub run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID`n"
          $payload = @{ body = $body } | ConvertTo-Json
          $headers = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/issues/18/comments" -Method Post -Headers $headers -ContentType 'application/json' -Body $payload | Out-Null

      - name: Remove capability and restore canonical Worker
        if: always()
        shell: powershell
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          $ErrorActionPreference = 'Continue'
          if (-not [string]::IsNullOrWhiteSpace($env:V622_CF_ACCOUNT_ID)) {
            $env:CLOUDFLARE_ACCOUNT_ID = $env:V622_CF_ACCOUNT_ID
            Push-Location 'deploy/cloudflare-worker-free'
            try {
              '{"CGP_PROJECT_CONTROL_TOKEN":null}' | Set-Content -Encoding utf8 "$env:RUNNER_TEMP\v622-delete-control.json"
              npx wrangler secret bulk "$env:RUNNER_TEMP\v622-delete-control.json"
              Remove-Item "$env:RUNNER_TEMP\v622-delete-control.json" -Force -ErrorAction SilentlyContinue
              npx wrangler deploy
              if ($LASTEXITCODE -ne 0) { Write-Error 'Canonical Worker restore deploy failed.' }
            }
            finally { Pop-Location }
          }

      - name: Publish launch diagnostic on failure
        if: failure()
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Continue'
          $body = "## V6.2.2 post-ablation backbone launch diagnostic`n`n- Launch workflow failed before a successful launch receipt.`n- No canonical M01-M12 rerun, HPO, locked test, or external evaluation was requested by this workflow.`n- GitHub run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID`n"
          $payload = @{ body = $body } | ConvertTo-Json
          $headers = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/issues/18/comments" -Method Post -Headers $headers -ContentType 'application/json' -Body $payload | Out-Null
