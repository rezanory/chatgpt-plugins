name: v622-self-hosted-free-bridge

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v622-self-hosted-free-bridge.yml'
      - 'deploy/cloudflare-worker-free/**'

permissions:
  contents: read
  issues: write

concurrency:
  group: v622-self-hosted-free-bridge
  cancel-in-progress: false

jobs:
  bridge:
    runs-on: [self-hosted, windows, x64, v622]
    environment: cloudflare-production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Deploy current Cloudflare Worker source
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $accountId = ($env:RAW_CLOUDFLARE_ACCOUNT_ID ?? '').Trim()
          if ([string]::IsNullOrWhiteSpace($env:CLOUDFLARE_API_TOKEN) -or [string]::IsNullOrWhiteSpace($accountId)) {
            throw 'Cloudflare deployment credentials are not configured.'
          }
          if ($accountId -notmatch '^[A-Za-z0-9_-]+$') {
            throw 'Cloudflare Account ID contains unsupported characters.'
          }
          Write-Host "::add-mask::$accountId"
          $env:CLOUDFLARE_ACCOUNT_ID = $accountId
          Push-Location deploy/cloudflare-worker-free
          try {
            npm install --no-audit --no-fund
            if ($LASTEXITCODE -ne 0) { throw 'npm install failed' }
            npm run check
            if ($LASTEXITCODE -ne 0) { throw 'Worker typecheck failed' }
            npm run deploy:dry
            if ($LASTEXITCODE -ne 0) { throw 'Worker dry-run deploy failed' }
            npx wrangler deploy
            if ($LASTEXITCODE -ne 0) { throw 'Worker production deploy failed' }
          }
          finally {
            Pop-Location
          }

      - name: Read fresh lightweight Wave 6 status
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://chatgpt-kaggle-gateway.rezanory-chatgpt-plugins.workers.dev/recovery/v6-2-2/wave-status?wave=6'
          $target = Join-Path $env:RUNNER_TEMP 'v622-wave6.json'
          $ok = $false
          for ($attempt = 1; $attempt -le 8; $attempt++) {
            try {
              $response = Invoke-WebRequest -Uri $url -Method Get -TimeoutSec 30 -UseBasicParsing
              if ($response.StatusCode -eq 200) {
                $value = $response.Content | ConvertFrom-Json
                if ($value.project -eq 'PNEUMONIA V6.2.2' -and [int]$value.wave -eq 6 -and @($value.tasks).Count -eq 6) {
                  [System.IO.File]::WriteAllText($target, $response.Content, [System.Text.UTF8Encoding]::new($false))
                  $ok = $true
                  break
                }
              }
            }
            catch {
              Write-Host "Wave 6 probe attempt $attempt did not return a valid response."
            }
            Start-Sleep -Seconds 5
          }
          if (-not $ok) { throw 'Fresh Wave 6 lightweight probe failed.' }

          $fresh = Get-Content -Raw $target | ConvertFrom-Json
          $complete = ([int]$fresh.counts.complete -eq 6 -and [int]$fresh.counts.in_progress -eq 0 -and [int]$fresh.counts.needs_repair -eq 0 -and [int]$fresh.counts.missing -eq 0 -and [int]$fresh.counts.unknown -eq 0)
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "WAVE6_COMPLETE=$($complete.ToString().ToLowerInvariant())`n", [System.Text.UTF8Encoding]::new($false))

      - name: Publish fresh Wave 6 live progress
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import json
          import os
          import pathlib
          import urllib.request

          value = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'v622-wave6.json').read_text(encoding='utf-8'))
          body = {
              'wave': 6,
              'worker_range': ['W31', 'W36'],
              'scheduling_policy': 'per_account_predecessor_complete',
              'status_scope': 'fresh_wave6_self_hosted_free_bridge',
              'generated_at': value.get('generated_at'),
              'counts': value.get('counts') or {},
              'jobs': value.get('tasks') or [],
          }
          markdown = '## V6.2.2 Wave 6 live Kaggle progress\n\n```json\n' + json.dumps(body, indent=2) + '\n```\n'
          payload = json.dumps({'body': markdown}).encode('utf-8')
          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/18/comments"
          request = urllib.request.Request(
              url,
              data=payload,
              method='POST',
              headers={
                  'Authorization': f"Bearer {os.environ['GITHUB_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'Content-Type': 'application/json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'v622-self-hosted-free-bridge',
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status not in (200, 201):
                  raise SystemExit(f'Issue progress publication failed: HTTP {response.status}')
          '@ | python -

      - name: Recover exact 36-run validation-only snapshot
        if: env.WAVE6_COMPLETE == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import json
          import os
          import pathlib
          import time
          import urllib.request

          base = 'https://chatgpt-kaggle-gateway.rezanory-chatgpt-plugins.workers.dev/recovery/v6-2-2/shard-artifacts'
          waves = []
          for wave in range(1, 7):
              url = f'{base}?shard=RESULTS-W{wave}'
              value = None
              last_error = None
              for _ in range(8):
                  try:
                      with urllib.request.urlopen(url, timeout=60) as response:
                          candidate = json.loads(response.read().decode('utf-8'))
                      if (
                          candidate.get('project') == 'PNEUMONIA V6.2.2'
                          and candidate.get('report') == 'validation_metrics'
                          and candidate.get('wave') == wave
                          and len(candidate.get('results') or []) == 6
                      ):
                          value = candidate
                          break
                  except Exception as exc:
                      last_error = exc
                  time.sleep(5)
              if value is None:
                  raise SystemExit(f'Validation metrics Wave {wave} unavailable: {last_error}')
              waves.append(value)

          rows = []
          for wave in waves:
              rows.extend(wave.get('results') or [])
          rows.sort(key=lambda row: int(str(row.get('worker_id'))[1:]))
          expected = [f'W{i:02d}' for i in range(1, 37)]
          actual = [row.get('worker_id') for row in rows]
          if actual != expected:
              raise SystemExit(f'Canonical 36-run identity mismatch: {actual}')
          incomplete = [row.get('worker_id') for row in rows if row.get('status') != 'COMPLETE']
          missing = [row.get('worker_id') for row in rows if not isinstance(row.get('metrics'), dict)]
          if incomplete:
              raise SystemExit(f'Incomplete canonical runs: {incomplete}')
          if missing:
              raise SystemExit(f'Missing validation metrics: {missing}')

          def flatten(value, prefix=''):
              out = {}
              if isinstance(value, dict):
                  if isinstance(value.get('path'), str) and 'value' in value:
                      out[value['path']] = value.get('value')
                  for key, child in value.items():
                      path = f'{prefix}.{key}' if prefix else str(key)
                      out.update(flatten(child, path))
              elif isinstance(value, list):
                  for index, child in enumerate(value):
                      out.update(flatten(child, f'{prefix}[{index}]'))
              elif prefix:
                  out[prefix] = value
              return out

          def pick(mapping, suffix):
              for key, value in mapping.items():
                  if key == suffix or key.endswith('.' + suffix):
                      return value
              return None

          def pct(value):
              return '—' if not isinstance(value, (int, float)) else f'{100 * value:.2f}%'

          def threshold(value):
              return '—' if not isinstance(value, (int, float)) else f'{value:.6g}'

          table = []
          compact = []
          for row in rows:
              mapping = flatten(row.get('metrics'))
              vals = {
                  'accuracy': pick(mapping, 'threshold_search.accuracy'),
                  'balanced_accuracy': pick(mapping, 'threshold_search.balanced_accuracy'),
                  'precision': pick(mapping, 'threshold_search.precision'),
                  'sensitivity': pick(mapping, 'threshold_search.sensitivity') if pick(mapping, 'threshold_search.sensitivity') is not None else pick(mapping, 'threshold_search.recall'),
                  'specificity': pick(mapping, 'threshold_search.specificity'),
                  'f1': pick(mapping, 'threshold_search.f1'),
                  'threshold': pick(mapping, 'threshold_search.threshold'),
              }
              compact.append({
                  'worker_id': row.get('worker_id'),
                  'model_id': row.get('model_id'),
                  'resolution': row.get('resolution'),
                  'account_id': row.get('account_id'),
                  'raw_status': row.get('raw_status'),
                  'completion_evidence': row.get('completion_evidence'),
                  **vals,
              })
              table.append(
                  f"| {row.get('worker_id')} | {row.get('model_id')} | {row.get('resolution')} | {pct(vals['accuracy'])} | {pct(vals['balanced_accuracy'])} | {pct(vals['precision'])} | {pct(vals['sensitivity'])} | {pct(vals['specificity'])} | {pct(vals['f1'])} | {threshold(vals['threshold'])} |"
              )

          lines = [
              '## V6.2.2 validation table — exact 36-run snapshot',
              '',
              '> Validation-only. Locked official test and external cohorts were not opened or used.',
              '',
              '| Run | Model | Res | Accuracy | Balanced Acc | Precision | Sensitivity | Specificity | F1 | Threshold |',
              '|---|---:|---:|---:|---:|---:|---:|---:|---:|---:|',
              *table,
              '',
              '<details><summary>Compact JSON</summary>',
              '',
              '```json',
              json.dumps(compact, indent=2),
              '```',
              '</details>',
          ]
          markdown = '\n'.join(lines) + '\n'
          payload = json.dumps({'body': markdown}).encode('utf-8')
          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/18/comments"
          request = urllib.request.Request(
              url,
              data=payload,
              method='POST',
              headers={
                  'Authorization': f"Bearer {os.environ['GITHUB_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'Content-Type': 'application/json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'v622-self-hosted-free-bridge',
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status not in (200, 201):
                  raise SystemExit(f'Validation publication failed: HTTP {response.status}')
          '@ | python -
