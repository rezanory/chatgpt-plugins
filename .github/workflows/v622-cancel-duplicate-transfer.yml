name: v622-cancel-duplicate-transfer

on:
  workflow_dispatch:
  issue_comment:
    types: [created]
  push:
    branches: [main]
    paths:
      - '.github/workflows/v622-cancel-duplicate-transfer.yml'

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  cancel:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event.issue.number == 18 && github.event.comment.body == 'V622_CANCEL_DUPLICATE_TRANSFER') }}
    runs-on: [self-hosted, windows, x64, v622]
    timeout-minutes: 5
    steps:
      - name: Cancel exact duplicate pending transfer
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = $env:GITHUB_REPOSITORY
          $id = 32299021734
          $headers = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          $run = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/actions/runs/$id" -Headers $headers -Method Get
          $status = [string]$run.status
          if ($status -in @('pending','queued','waiting')) {
            try { Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/actions/runs/$id/cancel" -Headers $headers -Method Post -ContentType 'application/json' | Out-Null } catch { Write-Host "Cancel request returned: $($_.Exception.Message)" }
          }
          $conclusion = 'none'
          for ($i=1; $i -le 12; $i++) {
            $run = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/actions/runs/$id" -Headers $headers -Method Get
            $status = [string]$run.status
            $conclusion = if ([string]::IsNullOrWhiteSpace([string]$run.conclusion)) { 'none' } else { [string]$run.conclusion }
            if ($status -eq 'completed') { break }
            Start-Sleep -Seconds 5
          }
          $body = "## V6.2.2 duplicate transfer cleanup`n`n- Duplicate run: ``$id```n- Status: ``$status```n- Conclusion: ``$conclusion```n- Protected active transfer ``32294916570`` was not touched.`n- Model compute: ``false``.`n"
          $payload = @{ body = $body } | ConvertTo-Json
          Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/issues/18/comments" -Headers $headers -Method Post -ContentType 'application/json' -Body $payload | Out-Null
