name: phase2-master-full-kaggle-source-v5

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: v622-cloudflare-production-mutation
  cancel-in-progress: false

jobs:
  recover_build:
    runs-on: ubuntu-latest
    environment: cloudflare-production
    timeout-minutes: 90
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Preflight source-recovery implementation
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile             scripts/collect_phase2_master_full_kaggle_sources_v1.py             scripts/build_phase2_master_full_kaggle_sources_v3.py
          test "$(grep -c 'kernel_ref' deploy/cloudflare-worker-free/src/phase2-master-full-source-worker.ts)" -ge 36
          grep -q 'FULL_SOURCE_TRUNCATED' scripts/collect_phase2_master_full_kaggle_sources_v1.py
          grep -q 'total_original_cells' scripts/collect_phase2_master_full_kaggle_sources_v1.py
          echo PHASE2_MASTER_FULL_SOURCE_PREFLIGHT_PASS

      - name: Download sealed Phase-2 evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/PHASE2_FULL_MASTER"/{sources,full,closure,dual,paired,out}
          gh run download 37140085014 --repo rezanory/chatgpt-plugins             --name PHASE2_FULL_RESULTS_RECONCILED_V1-37140085014             --dir "$RUNNER_TEMP/PHASE2_FULL_MASTER/full"
          gh run download 37152774434 --repo rezanory/chatgpt-plugins             --name PHASE2_FINAL_SCIENTIFIC_CLOSURE_V1-37152774434             --dir "$RUNNER_TEMP/PHASE2_FULL_MASTER/closure"
          gh run download 37125310017 --repo rezanory/chatgpt-plugins             --name PHASE2_DUAL_PR_V1-37125310017             --dir "$RUNNER_TEMP/PHASE2_FULL_MASTER/dual"
          gh run download 37118976126 --repo rezanory/chatgpt-plugins             --name PHASE2_OOF_PAIRED_STATS_V1-37118976126             --dir "$RUNNER_TEMP/PHASE2_FULL_MASTER/paired"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy protected full-source bridge
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          account_id="$(printf '%s' "$RAW_CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          if [[ -z "$account_id" || -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "Cloudflare credentials missing" >&2
            exit 1
          fi
          echo "::add-mask::$account_id"
          echo "CLOUDFLARE_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"
          pushd deploy/cloudflare-worker-free
          npm install --no-audit --no-fund
          npm run check
          npx wrangler deploy src/phase2-master-full-source-worker.ts --name chatgpt-kaggle-gateway
          popd

      - name: Create ephemeral source-read capability
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          token="$(python - <<'PY'
          import secrets
          print(secrets.token_urlsafe(48))
          PY
          )"
          echo "::add-mask::$token"
          pushd deploy/cloudflare-worker-free
          printf '%s' "$token" | npx wrangler secret put CGP_PROJECT_CONTROL_TOKEN --name chatgpt-kaggle-gateway
          popd
          echo "PHASE2_MASTER_FULL_SOURCE_TOKEN=$token" >> "$GITHUB_ENV"
          echo "PHASE2_MASTER_FULL_SOURCE_CAP_CREATED=1" >> "$GITHUB_ENV"

      - name: Wait for full-source bridge identity
        shell: bash
        run: |
          set -euo pipefail
          base='https://chatgpt-kaggle-gateway.rezanory-chatgpt-plugins.workers.dev'
          for attempt in $(seq 1 30); do
            if body="$(curl -fsS --max-time 20 "$base/healthz" 2>/dev/null)"; then
              if python - "$body" <<'PY'
          import json,sys
          value=json.loads(sys.argv[1])
          assert value.get("service")=="phase2-master-full-source"
          assert value.get("status")=="ready"
          assert value.get("kernel_count")==36
          PY
              then
                echo "FULL_SOURCE_BRIDGE_READY attempt=$attempt"
                exit 0
              fi
            fi
            sleep 4
          done
          echo "full-source bridge did not become ready" >&2
          exit 1

      - name: Recover all 36 full Kaggle kernel sources
        shell: bash
        run: |
          set -euo pipefail
          python scripts/collect_phase2_master_full_kaggle_sources_v1.py             --output-dir "$RUNNER_TEMP/PHASE2_FULL_MASTER/sources"
          python - <<'PY'
          import json, os, pathlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"PHASE2_FULL_MASTER"/"sources"
          value=json.loads((root/"PHASE2_MASTER_FULL_SOURCE_MANIFEST.json").read_text())
          assert value["status"]=="PASS"
          assert value["kernel_count"]==36
          assert value["total_original_cells"]>=100
          assert all("<truncated>" not in (root/x["source_file"]).read_text(encoding="utf-8") for x in value["kernels"])
          print("FULL_SOURCE_36_ACCEPTANCE_PASS", value["total_original_cells"])
          PY

      - name: Build full master notebook from recovered Kaggle sources
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_phase2_master_full_kaggle_sources_v3.py             --source-root "$RUNNER_TEMP/PHASE2_FULL_MASTER/sources"             --full-results "$RUNNER_TEMP/PHASE2_FULL_MASTER/full"             --closure "$RUNNER_TEMP/PHASE2_FULL_MASTER/closure"             --dual "$RUNNER_TEMP/PHASE2_FULL_MASTER/dual"             --paired "$RUNNER_TEMP/PHASE2_FULL_MASTER/paired"             --output "$RUNNER_TEMP/PHASE2_FULL_MASTER/out/PNEUMONIA_PHASE2_MASTER_FULL_ACTUAL_KAGGLE_V3.ipynb"             --receipt "$RUNNER_TEMP/PHASE2_FULL_MASTER/out/PNEUMONIA_PHASE2_MASTER_FULL_ACTUAL_KAGGLE_V3_RECEIPT.json"
          python - <<'PY'
          import json, os, pathlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"PHASE2_FULL_MASTER"/"out"
          r=json.loads((root/"PNEUMONIA_PHASE2_MASTER_FULL_ACTUAL_KAGGLE_V3_RECEIPT.json").read_text())
          assert r["status"]=="PASS"
          assert r["real_kernel_count"]==36
          assert r["original_cell_occurrences"]>=100
          assert r["cells"]>=100
          print("FULL_MASTER_BUILD_ACCEPTANCE_PASS", json.dumps(r, sort_keys=True))
          PY

      - name: Publish full master artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PNEUMONIA_PHASE2_MASTER_FULL_ACTUAL_KAGGLE_V3-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/PHASE2_FULL_MASTER/out/PNEUMONIA_PHASE2_MASTER_FULL_ACTUAL_KAGGLE_V3.ipynb
            ${{ runner.temp }}/PHASE2_FULL_MASTER/out/PNEUMONIA_PHASE2_MASTER_FULL_ACTUAL_KAGGLE_V3_RECEIPT.json
            ${{ runner.temp }}/PHASE2_FULL_MASTER/sources/PHASE2_MASTER_FULL_SOURCE_MANIFEST.json
          if-no-files-found: warn
          retention-days: 90

      - name: Remove temporary capability and restore canonical Worker
        if: always()
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          pushd deploy/cloudflare-worker-free
          if [[ "${PHASE2_MASTER_FULL_SOURCE_CAP_CREATED:-}" == "1" ]]; then
            printf 'y\n' | npx wrangler secret delete CGP_PROJECT_CONTROL_TOKEN --name chatgpt-kaggle-gateway || true
          fi
          npx wrangler deploy
          popd
          base='https://chatgpt-kaggle-gateway.rezanory-chatgpt-plugins.workers.dev'
          for attempt in $(seq 1 30); do
            if body="$(curl -fsS --max-time 20 "$base/healthz" 2>/dev/null)"; then
              if python - "$body" <<'PY'
          import json,sys
          value=json.loads(sys.argv[1])
          assert value.get("service")=="chatgpt-kaggle-gateway"
          assert value.get("write_enabled") is False
          PY
              then
                echo "PHASE2_MASTER_CANONICAL_WORKER_RESTORE_PASS"
                exit 0
              fi
            fi
            sleep 4
          done
          echo "canonical Worker restore verification failed" >&2
          exit 1
