name: v622-local-transfer-phase-probe

on:
  workflow_dispatch:
  issue_comment:
    types: [created]
  push:
    branches: [main]
    paths:
      - '.github/workflows/v622-local-transfer-phase-probe.yml'

permissions:
  contents: read
  issues: write

jobs:
  probe:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event.issue.number == 18 && github.event.comment.body == 'V622_LOCAL_TRANSFER_PHASE_PROBE') }}
    runs-on: [self-hosted, windows, x64, v622]
    timeout-minutes: 5
    steps:
      - name: Inspect persistent transfer cache and live curl phase
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = @(
            'M06__convnext_tiny__config.json',
            'M06__convnext_tiny__final_selected.keras',
            'M06__densenet121__config.json',
            'M06__densenet121__final_selected.keras',
            'M06__resnet50v2__config.json',
            'M06__resnet50v2__final_selected.keras',
            'FROZEN_BACKBONE_ENSEMBLE_POLICY.json'
          )
          $cacheRoots = Get-ChildItem 'C:\actions-runners\v622-r*\_work' -Directory -ErrorAction SilentlyContinue | ForEach-Object {
            Join-Path $_.FullName '.v622-kaggle-transfer-cache'
          } | Where-Object { Test-Path $_ }
          $cacheLines = @()
          foreach ($name in $expected) {
            $matches = @()
            foreach ($root in $cacheRoots) {
              $p = Join-Path $root $name
              if (Test-Path $p) { $matches += Get-Item $p }
            }
            if ($matches.Count -gt 0) {
              $best = $matches | Sort-Object Length -Descending | Select-Object -First 1
              $cacheLines += "- Cache: ``$name`` | bytes: ``$($best.Length)`` | present: ``true``"
            } else {
              $cacheLines += "- Cache: ``$name`` | bytes: ``0`` | present: ``false``"
            }
          }
          $rows = @()
          $procs = Get-CimInstance Win32_Process -Filter "Name='curl.exe'" -ErrorAction SilentlyContinue
          foreach ($p in @($procs)) {
            $cmd = [string]$p.CommandLine
            if ($cmd -notmatch 'v622-kaggle' -and $cmd -notmatch 'final_selected\.keras') { continue }
            $phase = if ($cmd -match '--upload-file') { 'upload' } else { 'download' }
            $rows += "- Live curl: ``$phase`` | pid: ``$($p.ProcessId)``"
          }
          if ($rows.Count -eq 0) { $rows = @('- Live curl: `none observed`') }
          $body = "## V6.2.2 local transfer cache probe`n`n$($cacheLines -join "`n")`n`n$($rows -join "`n")`n`n- Signed URLs/tokens: ``not exposed```n- Model compute: ``false```n"
          $payload = @{ body=$body } | ConvertTo-Json
          $headers = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept='application/vnd.github+json'; 'X-GitHub-Api-Version'='2022-11-28' }
          Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/issues/18/comments" -Method Post -Headers $headers -ContentType 'application/json' -Body $payload | Out-Null
