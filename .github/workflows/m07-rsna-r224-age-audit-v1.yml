name: m07-rsna-r224-age-audit-v1

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: m07-rsna-r224-age-audit-v1
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Request trusted read OIDC identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          base=os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']
          bearer=os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']
          sep='&' if '?' in base else '?'
          url=base+sep+urllib.parse.urlencode({'audience':'cgp-control-plane-v3'})
          request=urllib.request.Request(url,headers={'Authorization':'Bearer '+bearer})
          with urllib.request.urlopen(request,timeout=30) as response:
              token=json.load(response)['value']
          if len(token)<100:
              raise SystemExit('READ_OIDC_UNAVAILABLE')
          print('::add-mask::'+token)
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as handle:
              handle.write('CGP_READ_OIDC_TOKEN='+token+'\n')
          PY

      - name: Run frozen R224 age audit
        shell: bash
        run: |
          set -euo pipefail
          python scripts/m07_rsna_age_audit_v1.py \
            --output "$RUNNER_TEMP/M07_RSNA_R224_AGE_AUDIT_V1.json" \
            --bootstraps 1000

      - name: Upload durable age-audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: M07_RSNA_R224_AGE_AUDIT_V1-\${{ github.run_id }}
          path: \${{ runner.temp }}/M07_RSNA_R224_AGE_AUDIT_V1.json
          if-no-files-found: error
          retention-days: 30
