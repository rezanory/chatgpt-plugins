name: v622-self-hosted-backbone-status-now

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v622-self-hosted-backbone-status-now.yml'

permissions:
  contents: read
  issues: write

jobs:
  status:
    runs-on: [self-hosted, windows, x64, v622]
    timeout-minutes: 5
    steps:
      - name: Read exact backbone status and publish receipt
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://chatgpt-kaggle-gateway.rezanory-chatgpt-plugins.workers.dev/recovery/v6-2-2/backbone-status'
          $value = $null
          $last = $null
          for ($attempt = 1; $attempt -le 30; $attempt++) {
            try {
              $candidate = Invoke-RestMethod -Uri $url -Method Get -TimeoutSec 30
              if ($candidate.project -eq 'PNEUMONIA V6.2.2' -and
                  $candidate.stage -eq 'post_ablation_backbone_comparison' -and
                  $candidate.kernel_ref -eq 'trickermark/pneumonia-v6-2-2-backbone-m06-r224') {
                $value = $candidate
                break
              }
              throw 'stale or unexpected status response'
            }
            catch {
              $last = $_.Exception.Message
              Start-Sleep -Seconds 5
            }
          }
          if (-not $value) { throw "Exact backbone status route did not converge: $last" }
          $status = ([string]$value.status).Trim().ToUpperInvariant()
          $body = "## V6.2.2 backbone current status`n`n- Kernel: ``trickermark/pneumonia-v6-2-2-backbone-m06-r224```n- Status: ``$status```n- Complete: ``$($value.complete)```n- Needs repair: ``$($value.needs_repair)```n- Probe error: ``$($value.probe_error)```n- Probe launched Kaggle compute: ``false```n- Locked test used: ``false```n- External data used: ``false```n- GitHub run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID`n"
          $payload = @{ body = $body } | ConvertTo-Json
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/issues/18/comments" -Method Post -Headers $headers -ContentType 'application/json' -Body $payload | Out-Null
