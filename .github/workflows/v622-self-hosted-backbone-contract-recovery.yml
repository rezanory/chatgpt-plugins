name: v622-self-hosted-backbone-contract-recovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v622-self-hosted-backbone-contract-recovery.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: v622-cloudflare-production-mutation
  cancel-in-progress: false

jobs:
  recover:
    runs-on: [self-hosted, windows, x64, v622]
    timeout-minutes: 20
    environment: cloudflare-production
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Worker dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location 'deploy/cloudflare-worker-free'
          try {
            npm install --no-audit --no-fund
            if ($LASTEXITCODE -ne 0) { throw 'npm install failed' }
          }
          finally { Pop-Location }

      - name: Deploy protected exact-file recovery bridge
        shell: powershell
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          $ErrorActionPreference = 'Stop'
          $accountId = ([string]$env:RAW_CLOUDFLARE_ACCOUNT_ID).Trim()
          if ([string]::IsNullOrWhiteSpace($env:CLOUDFLARE_API_TOKEN) -or [string]::IsNullOrWhiteSpace($accountId)) { throw 'Cloudflare credentials missing' }
          Write-Host "::add-mask::$accountId"
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "V622_CF_ACCOUNT_ID=$accountId`n", [System.Text.UTF8Encoding]::new($false))
          $env:CLOUDFLARE_ACCOUNT_ID = $accountId
          $source = @'
          import { type WorkerEnv } from "./kaggle";
          type Env = WorkerEnv & { CGP_PROJECT_CONTROL_TOKEN?: string };
          const USERNAME = "trickermark";
          const KERNEL_SLUG = "pneumonia-v6-2-2-backbone-m06-r224";
          const API_ROOT = "https://api.kaggle.com/v1/kernels.KernelsApiService";
          const WANTED = ["backbone_comparison_contracts.py", "FROZEN_SELECTED_BACKBONE_RECIPE.json"] as const;
          function json(value: unknown, status = 200): Response { return new Response(JSON.stringify(value), { status, headers: { "content-type": "application/json; charset=utf-8", "cache-control": "no-store" } }); }
          function rec(value: unknown): Record<string, unknown> { return value && typeof value === "object" && !Array.isArray(value) ? value as Record<string, unknown> : {}; }
          function authorized(request: Request, env: Env): boolean { const token = env.CGP_PROJECT_CONTROL_TOKEN?.trim(); return Boolean(token && token.length >= 32 && request.headers.get("authorization") === `Bearer ${token}`); }
          function authHeader(token: string): string { return token.startsWith("KGAT_") ? `Bearer ${token}` : `Basic ${btoa(`${USERNAME}:${token}`)}`; }
          function allowed(raw: string): URL { const url = new URL(raw); const h = url.hostname.toLowerCase(); if (url.protocol !== "https:" || !(h === "api.kaggle.com" || h === "www.kaggle.com" || h === "storage.googleapis.com" || h.endsWith(".kaggleusercontent.com") || h.endsWith(".googleusercontent.com"))) throw new Error("output URL not allowlisted"); return url; }
          async function collect(env: Env): Promise<Record<string, unknown>> {
            const token = env.CGP_KAGGLE_KG05_TOKEN?.trim(); if (!token) throw new Error("kg-05 token missing");
            const files: Array<{fileName:string,url:string}> = [];
            let pageToken = "";
            for (let page = 0; page < 20; page++) {
              const body: Record<string, unknown> = { userName: USERNAME, kernelSlug: KERNEL_SLUG, pageSize: 100 }; if (pageToken) body.pageToken = pageToken;
              const response = await fetch(`${API_ROOT}/ListKernelSessionOutput`, { method: "POST", headers: { Authorization: authHeader(token), "Content-Type": "application/json" }, body: JSON.stringify(body) });
              const payload = rec(JSON.parse(await response.text())); if (!response.ok) throw new Error(`ListKernelSessionOutput HTTP ${response.status}`);
              for (const item of Array.isArray(payload.files) ? payload.files : []) { const row = rec(item); if (typeof row.fileName === "string" && typeof row.url === "string") files.push({ fileName: row.fileName.replaceAll("\\", "/"), url: row.url }); }
              const next = typeof payload.nextPageToken === "string" ? payload.nextPageToken : typeof payload.next_page_token === "string" ? payload.next_page_token : ""; if (!next || next === pageToken) break; pageToken = next;
            }
            const out: Array<Record<string, unknown>> = [];
            for (const name of WANTED) {
              const matches = files.filter(f => f.fileName === name || f.fileName.endsWith(`/${name}`));
              if (matches.length !== 1) { out.push({ name, found: matches.length, candidates: matches.map(m => m.fileName).slice(0, 20) }); continue; }
              const response = await fetch(allowed(matches[0].url).toString(), { redirect: "follow" }); if (!response.ok) throw new Error(`${name} download HTTP ${response.status}`);
              const bytes = await response.arrayBuffer(); if (bytes.byteLength > 2 * 1024 * 1024) throw new Error(`${name} too large`);
              const sha = Array.from(new Uint8Array(await crypto.subtle.digest("SHA-256", bytes)), b => b.toString(16).padStart(2, "0")).join("");
              out.push({ name, found: 1, file_name: matches[0].fileName, bytes: bytes.byteLength, sha256: sha, content: new TextDecoder().decode(bytes) });
            }
            return { project: "PNEUMONIA V6.2.2", stage: "backbone_contract_recovery", kernel_ref: `${USERNAME}/${KERNEL_SLUG}`, outputs_enumerated: files.length, artifacts: out, kaggle_compute_launched: false, automatic_rerun_performed: false, locked_test_used: false, external_data_used: false };
          }
          export default { async fetch(request: Request, env: Env): Promise<Response> { const url = new URL(request.url); if (url.pathname !== "/control/v6-2-2/backbone-contract-recovery" || request.method !== "POST") return new Response("Not found", { status: 404 }); if (!authorized(request, env)) return new Response("Forbidden", { status: 403 }); try { return json(await collect(env)); } catch (error) { return json({ ok:false, error: error instanceof Error ? error.message.slice(0,1000) : "unknown" }, 502); } } } satisfies ExportedHandler<Env>;
          '@
          $tmp = 'deploy/cloudflare-worker-free/src/.v622-backbone-contract-recovery-worker.ts'
          [System.IO.File]::WriteAllText($tmp, $source, [System.Text.UTF8Encoding]::new($false))
          Push-Location 'deploy/cloudflare-worker-free'
          try {
            npx wrangler deploy src/.v622-backbone-contract-recovery-worker.ts --name chatgpt-kaggle-gateway
            if ($LASTEXITCODE -ne 0) { throw 'Contract recovery bridge deploy failed' }
          }
          finally { Pop-Location }

      - name: Create ephemeral recovery capability
        shell: powershell
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $bytes = New-Object byte[] 48
          $rng = [System.Security.Cryptography.RandomNumberGenerator]::Create()
          try { $rng.GetBytes($bytes) } finally { $rng.Dispose() }
          $token = [Convert]::ToBase64String($bytes).TrimEnd('=').Replace('+','-').Replace('/','_')
          Write-Host "::add-mask::$token"
          $env:CLOUDFLARE_ACCOUNT_ID = $env:V622_CF_ACCOUNT_ID
          Push-Location 'deploy/cloudflare-worker-free'
          try { $token | npx wrangler secret put CGP_PROJECT_CONTROL_TOKEN; if ($LASTEXITCODE -ne 0) { throw 'Capability install failed' } }
          finally { Pop-Location }
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "V622_RECOVER_TOKEN=$token`n", [System.Text.UTF8Encoding]::new($false))

      - name: Recover exact contract and recipe files
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $uri = 'https://chatgpt-kaggle-gateway.rezanory-chatgpt-plugins.workers.dev/control/v6-2-2/backbone-contract-recovery'
          $headers = @{ Authorization = "Bearer $env:V622_RECOVER_TOKEN"; 'Content-Type' = 'application/json' }
          $result = Invoke-RestMethod -Uri $uri -Method Post -Headers $headers -Body '{}' -TimeoutSec 90
          if ($result.project -ne 'PNEUMONIA V6.2.2' -or $result.stage -ne 'backbone_contract_recovery') { throw 'stale recovery response' }
          $root = Join-Path $env:RUNNER_TEMP 'v622-backbone-contract-recovery'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          foreach ($a in @($result.artifacts)) {
            if ([int]$a.found -eq 1 -and -not [string]::IsNullOrWhiteSpace([string]$a.content)) { [System.IO.File]::WriteAllText((Join-Path $root ([string]$a.name)), [string]$a.content, [System.Text.UTF8Encoding]::new($false)) }
          }
          [System.IO.File]::WriteAllText((Join-Path $root 'RECOVERY.json'), ($result | ConvertTo-Json -Depth 20), [System.Text.UTF8Encoding]::new($false))
          Write-Host ($result | ConvertTo-Json -Depth 6)

      - name: Upload private contract recovery
        uses: actions/upload-artifact@v4
        with:
          name: v622-backbone-contract-recovery
          path: ${{ runner.temp }}/v622-backbone-contract-recovery
          if-no-files-found: error
          retention-days: 7

      - name: Publish recovery receipt
        if: success()
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $body = "## V6.2.2 backbone contract recovery receipt`n`n- Scope: exact failed-kernel output files ``backbone_comparison_contracts.py`` + ``FROZEN_SELECTED_BACKBONE_RECIPE.json`` only`n- Kaggle compute launched: ``false```n- Automatic rerun performed: ``false```n- Locked test used: ``false```n- External data used: ``false```n- Private artifact: ``v622-backbone-contract-recovery```n- GitHub run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID`n"
          $payload = @{ body = $body } | ConvertTo-Json
          $headers = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/issues/18/comments" -Method Post -Headers $headers -ContentType 'application/json' -Body $payload | Out-Null

      - name: Remove capability and restore exact status wrapper
        if: always()
        shell: powershell
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          $ErrorActionPreference = 'Continue'
          if ($env:V622_CF_ACCOUNT_ID) {
            $env:CLOUDFLARE_ACCOUNT_ID = $env:V622_CF_ACCOUNT_ID
            Push-Location 'deploy/cloudflare-worker-free'
            try {
              '{"CGP_PROJECT_CONTROL_TOKEN":null}' | Set-Content -Encoding utf8 (Join-Path $env:RUNNER_TEMP 'v622-delete-control.json')
              npx wrangler secret bulk (Join-Path $env:RUNNER_TEMP 'v622-delete-control.json')
              npx wrangler deploy src/v622-backbone-monitor-index.ts --name chatgpt-kaggle-gateway
            }
            finally { Pop-Location }
          }
