name: soilbin-q1-v1-launch

on:
  issue_comment:
    types: [created]

permissions:
  id-token: write
  contents: read
  issues: write

concurrency:
  group: soilbin-q1-v1-kg09
  cancel-in-progress: false

jobs:
  launch:
    if: ${{ github.event.issue.number == 33 && github.event.comment.user.id == 62356000 && github.event.comment.body == 'SOILBIN_Q1_V1_LAUNCH_KG09' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout frozen payload
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Build and validate notebook
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,pathlib,py_compile,os
          root=pathlib.Path('control-plane-payloads/soilbin-q1-v1')
          runner=(root/'soilbin_q1_runner.py').read_text(encoding='utf-8')
          cond=(root/'conditions_51.csv').read_text(encoding='utf-8-sig')
          targ=(root/'targets_lc1_lc5_51.csv').read_text(encoding='utf-8-sig')
          compile(runner,'soilbin_q1_runner.py','exec')
          assert cond.count('\n')>=51 and targ.count('\n')>=51
          assert 'MODELS = [' in runner and "'ExtraTrees'" in runner and "'MLP'" in runner
          assert "DEPTH_MAP = {'LC5_peak_magnitude_N': 5, 'LC1_peak_magnitude_N': 15}" in runner
          assert 'Nested grouped CV' in runner
          source=("CONDITIONS_CSV = "+repr(cond)+"\nTARGETS_CSV = "+repr(targ)+"\n"+runner)
          nb={'cells':[{'cell_type':'markdown','metadata':{},'source':['# SoilBin Q1/Q2 evidence benchmark v1\n','CPU-only; nested grouped validation; depth mapping provisional until experimental confirmation.\n']},{'cell_type':'code','execution_count':None,'metadata':{},'outputs':[],'source':source.splitlines(keepends=True)}],
              'metadata':{'kernelspec':{'display_name':'Python 3','language':'python','name':'python3'},'language_info':{'name':'python','version':'3'},'soilbin':{'schema':'soilbin.q1.v1','cpu_only':True,'external_validation':False,'depth_mapping_status':'provisional'}},'nbformat':4,'nbformat_minor':5}
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'SOILBIN_Q1_Q2_EVIDENCE_V1.ipynb'
          out.write_text(json.dumps(nb,ensure_ascii=False,indent=1),encoding='utf-8')
          sha=hashlib.sha256(out.read_bytes()).hexdigest()
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'soilbin_payload_meta.json').write_text(json.dumps({'notebook_sha256':sha,'conditions_sha256':hashlib.sha256(cond.encode()).hexdigest(),'targets_sha256':hashlib.sha256(targ.encode()).hexdigest()},indent=2),encoding='utf-8')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
              f.write(f'CGP_NOTEBOOK_PATH={out}\nCGP_NOTEBOOK_SHA={sha}\n')
          print('SOILBIN_NOTEBOOK_OK sha='+sha)
          PY

      - name: Request trusted action OIDC
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,urllib.request
          base=os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']; sep='&' if '?' in base else '?'
          req=urllib.request.Request(base+sep+'audience=cgp-control-plane-v3-action',headers={'Authorization':'Bearer '+os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
          with urllib.request.urlopen(req,timeout=30) as r: token=json.load(r)['value']
          if len(token)<100: raise SystemExit('OIDC unavailable')
          print('::add-mask::'+token)
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f: f.write('CGP_ACTION_OIDC_TOKEN='+token+'\n')
          PY

      - name: Save and run SoilBin benchmark on empty kg-09
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,pathlib,urllib.request,urllib.error
          endpoint='https://chatgpt-kaggle-gateway.rezanory-chatgpt-plugins.workers.dev/control-plane/v3/action/kaggle'
          text=pathlib.Path(os.environ['CGP_NOTEBOOK_PATH']).read_text(encoding='utf-8')
          payload={'request_id':'soilbin-q1-v1-kg09-20260914','provider':'kaggle','operation_class':'compute','account_id':'kg-09','purpose':'PhD/Q1-Q2 SoilBin CPU benchmark: 9 model families, nested grouped CV, history ablation, depth analysis, robustness, uncertainty and evidence package. No GPU.','service':'kernels.KernelsApiService','method':'SaveKernel','body':{'slug':'mylovevpn1/soilbin-q1-q2-evidence-v1-20260914','newTitle':'SoilBin Q1 Q2 Evidence V1 20260914','text':text,'language':'PYTHON','kernelType':'NOTEBOOK','kernelExecutionType':'SAVE_AND_RUN_ALL','isPrivate':True,'enableGpu':False,'enableInternet':True}}
          req=urllib.request.Request(endpoint,data=json.dumps(payload,separators=(',',':')).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['CGP_ACTION_OIDC_TOKEN'],'Content-Type':'application/json','Accept':'application/json','User-Agent':'soilbin-q1-v1/1.0'})
          try:
              with urllib.request.urlopen(req,timeout=240) as r: result=json.loads(r.read().decode('utf-8','replace') or '{}')
          except urllib.error.HTTPError as e:
              raise SystemExit(f'Cloudflare action HTTP {e.code}: '+e.read(4000).decode('utf-8','replace'))
          if not result.get('ok'): raise SystemExit('Cloudflare action returned ok=false: '+json.dumps(result)[:1800])
          ref=result.get('provider_ref') or (result.get('result') or {}).get('ref') or 'mylovevpn1/soilbin-q1-q2-evidence-v1-20260914'
          receipt={'accepted':True,'account_id':'kg-09','owner':'mylovevpn1','kernel_ref':ref,'notebook_sha256':os.environ['CGP_NOTEBOOK_SHA'],'cpu_only':True,'gpu':False}
          path=pathlib.Path(os.environ['RUNNER_TEMP'])/'soilbin_launch_receipt.json'; path.write_text(json.dumps(receipt,indent=2),encoding='utf-8')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f: f.write(f'CGP_KERNEL_REF={ref}\nCGP_RECEIPT_PATH={path}\n')
          print(json.dumps(receipt))
          PY

      - name: Publish launch receipt
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,pathlib,urllib.request
          if os.environ.get('CGP_RECEIPT_PATH') and pathlib.Path(os.environ['CGP_RECEIPT_PATH']).exists():
              r=json.loads(pathlib.Path(os.environ['CGP_RECEIPT_PATH']).read_text())
              body=("## SOILBIN Q1/Q2 V1 LAUNCH ACCEPTED\n\n"
                    f"- Run: `{os.environ['GITHUB_RUN_ID']}`\n- Account: `{r['account_id']} / {r['owner']}`\n"
                    f"- Kernel: `{r['kernel_ref']}`\n- Notebook SHA256: `{r['notebook_sha256']}`\n"
                    "- CPU only: `true`\n- GPU: `false`\n- SAVE_AND_RUN_ALL: `accepted`\n"
                    "- Scientific status: `response currently calibrated-force proxy N; stress conversion and depth mapping confirmation remain pre-publication gates`\n")
          else:
              body=f"## SOILBIN Q1/Q2 V1 LAUNCH FAILED\n\n- Run: `{os.environ['GITHUB_RUN_ID']}`\n- SAVE_AND_RUN_ALL: `not accepted`\n"
          req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/33/comments",data=json.dumps({'body':body}).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json','User-Agent':'soilbin-launch-receipt/1.0'})
          with urllib.request.urlopen(req,timeout=30): pass
          PY
