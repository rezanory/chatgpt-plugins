name: m07-launch-status-diagnostic

on:
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  status:
    if: ${{ github.event.issue.number == 33 && github.event.comment.user.id == 62356000 && github.event.comment.body == 'M07_LAUNCH_STATUS_DIAG' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read launcher runs and publish diagnostic
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,urllib.request
          repo=os.environ['GH_REPO']; token=os.environ['GH_TOKEN']
          def get(url):
              req=urllib.request.Request(url,headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'m07-launch-status-diagnostic'})
              with urllib.request.urlopen(req,timeout=30) as r: return json.loads(r.read().decode())
          runs=get(f'https://api.github.com/repos/{repo}/actions/workflows/pneumonia-m07-continuation-v3.yml/runs?event=issue_comment&per_page=8').get('workflow_runs',[])
          rows=[]
          for r in runs:
              rows.append({'id':r.get('id'),'status':r.get('status'),'conclusion':r.get('conclusion'),'head_sha':r.get('head_sha'),'created_at':r.get('created_at'),'updated_at':r.get('updated_at'),'run_number':r.get('run_number'),'html_url':r.get('html_url')})
          body='## M07 LAUNCH STATUS DIAGNOSTIC\n```json\n'+json.dumps(rows,indent=2)+'\n```'
          data=json.dumps({'body':body}).encode()
          req=urllib.request.Request(f'https://api.github.com/repos/{repo}/issues/33/comments',data=data,method='POST',headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json','User-Agent':'m07-launch-status-diagnostic'})
          with urllib.request.urlopen(req,timeout=30) as r: r.read()
          PY