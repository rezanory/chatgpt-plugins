name: v622-kaggle-native-publisher-probe

on:
  workflow_dispatch:
  issue_comment:
    types: [created]
  push:
    branches: [main]
    paths:
      - '.github/workflows/v622-kaggle-native-publisher-probe.yml'

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  probe:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event.issue.number == 18 && github.event.comment.body == 'V622_KAGGLE_NATIVE_PUBLISHER_PROBE') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read latest publisher run
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $h=@{Authorization="Bearer $env:GITHUB_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          $runs=Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/workflows/v622-kaggle-native-artifact-publish.yml/runs?per_page=1" -Headers $h
          if (-not $runs.workflow_runs -or $runs.workflow_runs.Count -lt 1) { throw 'No publisher run found' }
          $r=$runs.workflow_runs[0]
          $jobs=Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs/$($r.id)/jobs?per_page=100" -Headers $h
          $current='none'
          foreach($j in @($jobs.jobs)) {
            foreach($s in @($j.steps)) { if($s.status -eq 'in_progress'){ $current="$($j.name) :: $($s.name)" } }
          }
          $body="## V6.2.2 Kaggle-native publisher live status`n`n- Run: $($r.html_url)`n- Run ID: ``$($r.id)```n- Status: ``$($r.status)```n- Conclusion: ``$($r.conclusion)```n- Current step: ``$current```n- Head SHA: ``$($r.head_sha)```n- Role: ``bridge/status only```n"
          $p=@{body=$body}|ConvertTo-Json
          Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/issues/18/comments" -Method Post -Headers $h -ContentType 'application/json' -Body $p | Out-Null
