name: v622-finalization-freeze-trickermark

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: v622-cloudflare-production-mutation
  cancel-in-progress: false

jobs:
  freeze:
    if: ${{ github.event_name != 'issue_comment' || (github.event.issue.number == 18 && github.event.comment.body == 'V622_FINALIZE_TRICKERMARK') }}
    runs-on: [self-hosted, windows, x64, v622]
    timeout-minutes: 60
    environment: cloudflare-production
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy protected same-owner final-freeze bridge
        shell: powershell
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          $ErrorActionPreference = 'Stop'
          $accountId = ([string]$env:RAW_CLOUDFLARE_ACCOUNT_ID).Trim()
          if ([string]::IsNullOrWhiteSpace($env:CLOUDFLARE_API_TOKEN) -or [string]::IsNullOrWhiteSpace($accountId)) { throw 'Cloudflare credentials missing' }
          Write-Host "::add-mask::$accountId"
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "V622_CF_ACCOUNT_ID=$accountId`n", [System.Text.UTF8Encoding]::new($false))
          $env:CLOUDFLARE_ACCOUNT_ID = $accountId
          Push-Location 'deploy/cloudflare-worker-free'
          try {
            npm install --no-audit --no-fund
            if ($LASTEXITCODE -ne 0) { throw 'npm install failed' }
            npm run check
            if ($LASTEXITCODE -ne 0) { throw 'Worker typecheck failed' }
            npx wrangler deploy src/v622-finalization-freeze-trickermark-worker.ts --name chatgpt-kaggle-gateway
            if ($LASTEXITCODE -ne 0) { throw 'same-owner final-freeze bridge deploy failed' }
          }
          finally { Pop-Location }

      - name: Create ephemeral finalization capability
        shell: powershell
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $bytes = New-Object byte[] 48
          $rng = [System.Security.Cryptography.RandomNumberGenerator]::Create()
          try { $rng.GetBytes($bytes) } finally { $rng.Dispose() }
          $token = [Convert]::ToBase64String($bytes).TrimEnd('=').Replace('+','-').Replace('/','_')
          Write-Host "::add-mask::$token"
          $env:CLOUDFLARE_ACCOUNT_ID = $env:V622_CF_ACCOUNT_ID
          Push-Location 'deploy/cloudflare-worker-free'
          try {
            $token | npx wrangler secret put CGP_PROJECT_CONTROL_TOKEN --name chatgpt-kaggle-gateway
            if ($LASTEXITCODE -ne 0) { throw 'Capability install failed' }
          }
          finally { Pop-Location }
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "V622_FINALIZATION_TOKEN=$token`n", [System.Text.UTF8Encoding]::new($false))

      - name: Launch exact same-owner final freeze
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{ Authorization = "Bearer $env:V622_FINALIZATION_TOKEN"; 'Content-Type' = 'application/json' }
          $uri = 'https://chatgpt-kaggle-gateway.rezanory-chatgpt-plugins.workers.dev/control/v6-2-2/finalization-freeze-same-owner/launch'
          $value = Invoke-RestMethod -Uri $uri -Method Post -Headers $headers -Body '{}' -TimeoutSec 180
          $value | ConvertTo-Json -Depth 50 | Write-Host
          if ($value.ok -eq $false) { throw "same-owner finalization launch failed: $($value.error)" }
          if ([string]$value.target_kernel_ref -ne 'trickermark/pneumonia-v6-2-2-finalization-master') { throw 'Unexpected finalization target' }
          if ([string]$value.action -eq 'existing_active') { Write-Host 'Existing active exact finalization kernel retained; no duplicate submitted.' }

      - name: Monitor final freeze to terminal status
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{ Authorization = "Bearer $env:V622_FINALIZATION_TOKEN"; 'Content-Type' = 'application/json' }
          $uri = 'https://chatgpt-kaggle-gateway.rezanory-chatgpt-plugins.workers.dev/control/v6-2-2/finalization-freeze-same-owner/status'
          $terminal = $null
          for ($attempt = 1; $attempt -le 60; $attempt++) {
            $value = Invoke-RestMethod -Uri $uri -Method Post -Headers $headers -Body '{}' -TimeoutSec 180
            $status = ([string]$value.status).ToUpperInvariant()
            Write-Host "same-owner finalization status $attempt/60: $status"
            if ($status -eq 'COMPLETE') { $terminal = $value; break }
            if ($status -in @('ERROR','FAILED','CANCELLED','CANCELED','DEAD')) { throw "same-owner finalization terminated with $status" }
            Start-Sleep -Seconds 30
          }
          if ($null -eq $terminal) { throw 'same-owner finalization did not reach COMPLETE inside monitor budget' }
          if ($null -eq $terminal.receipt) { throw 'same-owner finalization COMPLETE without validated receipt' }
          $path = Join-Path $env:RUNNER_TEMP 'v622-finalization-freeze-trickermark-receipt.json'
          [System.IO.File]::WriteAllText($path, ($terminal.receipt | ConvertTo-Json -Depth 50), [System.Text.UTF8Encoding]::new($false))

      - name: Publish FINAL_FREEZE receipt
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $r = Get-Content -Raw (Join-Path $env:RUNNER_TEMP 'v622-finalization-freeze-trickermark-receipt.json') | ConvertFrom-Json
          $ids = @($r.selected_candidate_ids) -join ', '
          $body = "## V6.2.2 FINAL_FREEZE_MANIFEST same-owner PASS`n`n- Kernel: ``trickermark/pneumonia-v6-2-2-finalization-master```n- Artifact dataset: ``trickermark/pneumonia-v6-2-2-finalization-artifacts```n- FINAL_FREEZE_MANIFEST SHA-256: ``$($r.manifest_sha256)```n- Selected artifact count: ``$($r.selected_artifact_count)```n- Selected candidates: ``$ids```n- Frozen recipe SHA-256: ``27cae8c59e06b609f9dfd02b526d807dc359b2bb14ae7bc5ee77c68c7553b08f```n- Frozen policy file SHA-256: ``7e23bbed9246d5588c67a46380b570e1c1a3e869062613b9dcdb298e2e822861```n- Qualification performed: ``false```n- Used for selection: ``false```n- Locked test used: ``false```n- External data used: ``false```n- Next permitted stage: ``INDEPENDENT_FREEZE_RECONCILIATION```n- Bridge compute: ``self-hosted/free orchestration only```n- Kaggle compute kind: ``manifest/hash only; GPU=false```n- Run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID`n"
          $payload = @{ body = $body } | ConvertTo-Json
          $headers = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/issues/18/comments" -Method Post -Headers $headers -ContentType 'application/json' -Body $payload | Out-Null

      - name: Remove capability and restore canonical Worker
        if: always()
        shell: powershell
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          $ErrorActionPreference = 'Continue'
          if (-not [string]::IsNullOrWhiteSpace($env:V622_CF_ACCOUNT_ID)) {
            $env:CLOUDFLARE_ACCOUNT_ID = $env:V622_CF_ACCOUNT_ID
            Push-Location 'deploy/cloudflare-worker-free'
            try {
              for ($attempt = 1; $attempt -le 3; $attempt++) { 'y' | npx wrangler secret delete CGP_PROJECT_CONTROL_TOKEN --name chatgpt-kaggle-gateway; if ($LASTEXITCODE -eq 0) { break }; Start-Sleep -Seconds 5 }
              for ($attempt = 1; $attempt -le 3; $attempt++) { npx wrangler deploy; if ($LASTEXITCODE -eq 0) { break }; Start-Sleep -Seconds 5 }
            }
            finally { Pop-Location }
          }

      - name: Publish narrow failure receipt
        if: failure()
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Continue'
          $body = "## V6.2.2 same-owner final-freeze diagnostic`n`n- Result: ``FAILED_OR_TIMED_OUT```n- Intended kernel: ``trickermark/pneumonia-v6-2-2-finalization-master```n- Dataset: ``trickermark/pneumonia-v6-2-2-finalization-artifacts```n- Model training/HPO/confirmation: ``false```n- Locked test/external: ``false```n- GitHub-hosted compute: ``false```n- Run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID`n"
          $payload = @{ body = $body } | ConvertTo-Json
          $headers = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/issues/18/comments" -Method Post -Headers $headers -ContentType 'application/json' -Body $payload | Out-Null
