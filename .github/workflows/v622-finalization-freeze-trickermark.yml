name: v622-finalization-freeze-trickermark-retired

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: [self-hosted, windows, x64, v622]
    steps:
      - name: Enforce azadka finalization master architecture
        shell: powershell
        run: |
          Write-Host 'RETIRED: trickermark may own/share the frozen artifact Dataset, but finalization master remains azadka.'
          Write-Host 'Use v622-kaggle-finalization-freeze-bridge after azadka Dataset reader permission is verified.'
