name: v622-grant-artifact-dataset-to-azadka-retired

# Dataset permission is already verified: trickermark dataset is Ready and azadka is READER.
# Manual no-op only; prevents any further Cloudflare/Kaggle permission mutation before lockbox.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: [self-hosted, windows, x64, v622]
    steps:
      - name: Confirm retired state
        shell: powershell
        run: |
          Write-Host 'Retired V6.2.2 Dataset permission bridge: no Cloudflare mutation, Dataset metadata update, Kaggle compute, locked test, or external validation is performed.'
