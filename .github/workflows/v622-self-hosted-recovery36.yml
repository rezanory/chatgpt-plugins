name: v622-self-hosted-recovery36

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v622-self-hosted-recovery36.yml'
      - 'deploy/cloudflare-worker-free/src/metrics.ts'

permissions:
  contents: read
  issues: write

concurrency:
  group: v622-self-hosted-recovery36
  cancel-in-progress: true

jobs:
  recover:
    runs-on: [self-hosted, windows, x64, v622]
    environment: cloudflare-production
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Deploy current read-only Worker source
        shell: powershell
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          $ErrorActionPreference = 'Stop'
          $accountId = [string]$env:RAW_CLOUDFLARE_ACCOUNT_ID
          $accountId = $accountId.Trim()
          if ([string]::IsNullOrWhiteSpace($env:CLOUDFLARE_API_TOKEN) -or [string]::IsNullOrWhiteSpace($accountId)) {
            throw 'Cloudflare deployment credentials are not configured.'
          }
          if ($accountId -notmatch '^[A-Za-z0-9_-]+$') { throw 'Invalid Cloudflare Account ID.' }
          Write-Host "::add-mask::$accountId"
          $env:CLOUDFLARE_ACCOUNT_ID = $accountId
          Push-Location 'deploy/cloudflare-worker-free'
          try {
            npm install --no-audit --no-fund
            if ($LASTEXITCODE -ne 0) { throw 'npm install failed' }
            npm run check
            if ($LASTEXITCODE -ne 0) { throw 'Worker typecheck failed' }
            npm run deploy:dry
            if ($LASTEXITCODE -ne 0) { throw 'Worker dry-run failed' }
            npx wrangler deploy
            if ($LASTEXITCODE -ne 0) { throw 'Worker production deploy failed' }
          }
          finally { Pop-Location }

      - name: Recover exact 36-run artifacts and validation evidence
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import json
          import os
          import time
          import urllib.request

          BASE = 'https://chatgpt-kaggle-gateway.rezanory-chatgpt-plugins.workers.dev/recovery/v6-2-2/shard-artifacts'

          def get_json(url, attempts=8, timeout=60):
              last = None
              for _ in range(attempts):
                  try:
                      request = urllib.request.Request(url, headers={'User-Agent': 'v622-self-hosted-recovery36'})
                      with urllib.request.urlopen(request, timeout=timeout) as response:
                          return json.loads(response.read().decode('utf-8'))
                  except Exception as exc:
                      last = exc
                      time.sleep(5)
              raise RuntimeError(f'GET failed after {attempts} attempts: {url}: {last}')

          waves = []
          for wave in range(1, 7):
              value = get_json(f'{BASE}?shard=RESULTS-W{wave}')
              assert value.get('project') == 'PNEUMONIA V6.2.2'
              assert value.get('report') == 'validation_metrics'
              assert value.get('wave') == wave
              assert len(value.get('results') or []) == 6
              waves.append(value)

          rows = []
          for value in waves:
              rows.extend(value.get('results') or [])
          rows.sort(key=lambda row: int(str(row.get('worker_id'))[1:]))
          expected = [f'W{i:02d}' for i in range(1, 37)]
          actual = [row.get('worker_id') for row in rows]
          if actual != expected:
              raise RuntimeError(f'Canonical identity mismatch: {actual}')

          incomplete = [row.get('worker_id') for row in rows if row.get('status') != 'COMPLETE']
          missing_metrics = [row.get('worker_id') for row in rows if not isinstance(row.get('metrics'), dict)]
          missing_artifacts = [row.get('worker_id') for row in rows if not isinstance(row.get('artifacts'), dict)]
          if incomplete:
              raise RuntimeError(f'Incomplete canonical runs: {incomplete}')
          if missing_metrics:
              raise RuntimeError(f'Missing validation metrics: {missing_metrics}')
          if missing_artifacts:
              raise RuntimeError(f'Missing artifact recovery payload: {missing_artifacts}')

          required_groups = ('checkpoints', 'metrics_reports', 'predictions', 'recipes_manifests')
          bad_groups = []
          for row in rows:
              groups = (row.get('artifacts') or {}).get('groups') or {}
              for group in required_groups:
                  if not groups.get(group):
                      bad_groups.append(f"{row.get('worker_id')}:{group}")
          if bad_groups:
              raise RuntimeError(f'Missing merge-relevant artifact groups: {bad_groups}')

          def flatten(value, prefix=''):
              out = {}
              if isinstance(value, dict):
                  if isinstance(value.get('path'), str) and 'value' in value:
                      out[value['path']] = value.get('value')
                  for key, child in value.items():
                      path = f'{prefix}.{key}' if prefix else str(key)
                      out.update(flatten(child, path))
              elif isinstance(value, list):
                  for index, child in enumerate(value):
                      out.update(flatten(child, f'{prefix}[{index}]'))
              elif prefix:
                  out[prefix] = value
              return out

          def pick(mapping, *suffixes):
              for suffix in suffixes:
                  for key, value in mapping.items():
                      if key == suffix or key.endswith('.' + suffix):
                          return value
              return None

          evidence = []
          for row in rows:
              mapping = flatten(row['metrics'])
              evidence.append({
                  'worker_id': row.get('worker_id'),
                  'model_id': row.get('model_id'),
                  'resolution': row.get('resolution'),
                  'account_id': row.get('account_id'),
                  'kernel_ref': row.get('kernel_ref'),
                  'raw_status': row.get('raw_status'),
                  'balanced_selection_score': pick(mapping, 'threshold_search.balanced_selection_score', 'balanced_selection_score'),
                  'min_class_recall': pick(mapping, 'threshold_search.min_class_recall', 'min_class_recall'),
                  'balanced_accuracy': pick(mapping, 'threshold_search.balanced_accuracy', 'balanced_accuracy'),
                  'f1': pick(mapping, 'threshold_search.f1', 'f1'),
                  'sensitivity': pick(mapping, 'threshold_search.sensitivity', 'threshold_search.recall', 'sensitivity', 'recall'),
                  'specificity': pick(mapping, 'threshold_search.specificity', 'specificity'),
                  'precision': pick(mapping, 'threshold_search.precision', 'precision'),
                  'accuracy': pick(mapping, 'threshold_search.accuracy', 'accuracy'),
                  'threshold': pick(mapping, 'threshold_search.threshold', 'threshold'),
              })

          artifact_summary = []
          for row in rows:
              artifacts = row['artifacts']
              groups = artifacts.get('groups') or {}
              artifact_summary.append({
                  'worker_id': row.get('worker_id'),
                  'model_id': row.get('model_id'),
                  'resolution': row.get('resolution'),
                  'account_id': row.get('account_id'),
                  'kernel_ref': row.get('kernel_ref'),
                  'enumerated_file_count': artifacts.get('enumerated_file_count'),
                  'truncated': artifacts.get('truncated'),
                  'artifact_groups': groups,
              })

          artifact_body = [
              '## V6.2.2 exact 36-run artifact recovery manifest',
              '',
              '> Read-only recovery. No Kaggle compute, HPO, threshold tuning, locked official test, or external cohort was used.',
              '',
              '```json',
              json.dumps({
                  'expected_total': 36,
                  'recovered_total': len(artifact_summary),
                  'source': '/recovery/v6-2-2/shard-artifacts?shard=RESULTS-W1..RESULTS-W6',
                  'runs': artifact_summary,
              }, indent=2),
              '```',
          ]

          def pct(value):
              return '—' if not isinstance(value, (int, float)) else f'{100 * value:.2f}%'
          def num(value):
              return '—' if not isinstance(value, (int, float)) else f'{value:.6f}'

          table = []
          for row in evidence:
              table.append(
                  f"| {row['worker_id']} | {row['model_id']} | {row['resolution']} | {num(row['balanced_selection_score'])} | {pct(row['min_class_recall'])} | {pct(row['balanced_accuracy'])} | {pct(row['f1'])} | {pct(row['sensitivity'])} | {pct(row['specificity'])} | {num(row['threshold'])} |"
              )
          validation_body = [
              '## V6.2.2 validation evidence — exact 36-run snapshot',
              '',
              '> Validation-only selection input. Locked official test and external cohorts remain unopened.',
              '',
              '| Run | Model | Res | Balanced selection score | Min class recall | Balanced acc | F1 | Sensitivity | Specificity | Threshold |',
              '|---|---:|---:|---:|---:|---:|---:|---:|---:|---:|',
              *table,
              '',
              '<details><summary>Selection input JSON</summary>',
              '',
              '```json',
              json.dumps(evidence, indent=2),
              '```',
              '</details>',
          ]

          def post(markdown):
              payload = json.dumps({'body': '\n'.join(markdown) + '\n'}).encode('utf-8')
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/18/comments",
                  data=payload,
                  method='POST',
                  headers={
                      'Authorization': f"Bearer {os.environ['GITHUB_TOKEN']}",
                      'Accept': 'application/vnd.github+json',
                      'Content-Type': 'application/json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'v622-self-hosted-recovery36',
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  if response.status not in (200, 201):
                      raise RuntimeError(f'Issue publication failed HTTP {response.status}')

          post(artifact_body)
          post(validation_body)
          print(json.dumps({'artifact_recovery_complete': True, 'validation_snapshot_complete': True, 'runs': 36}))
          '@ | python -
