name: PH04 Stage-01 External Validation on dedicated r2

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ph04-stage01-external-r2-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage01:
    name: PH04 Stage-01 exact SHA canonical CI on r2
    runs-on: [self-hosted, windows, x64, v622]
    timeout-minutes: 60
    env:
      PH04_EXPECTED_SHA: 0f8ccc2fac4cf8ac767c6f4011bfd9673a69c3db
      PH04_PRIMARY_CACHE_HEAD: 361cf101dbd6f50600a3b9f59d33f3e94729a0a5
      PH04_SOURCE_CACHE: C:\p4
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: C:/p4
      GIT_CONFIG_KEY_1: safe.directory
      GIT_CONFIG_VALUE_1: C:/p4/.git
      DJANGO_SETTINGS_MODULE: core.settings_test
      DJANGO_ENV: test
      DEBUG: 'True'
      TESTING: 'True'
      SECRET_KEY: ci-test-secret-key
      WS_TOKEN_SECRET: ci-test-ws-token-secret
      ADMIN_WS_SECRET: ci-test-admin-ws-secret
      CHANNEL_ENCRYPTION_KEY: m7MQ4AiQFrXx5cYh3h7cZkzW1g9KJcJkt6dQX8JX7jM=
      WS_ALLOWED_ORIGINS: http://localhost
      DATABASE_URL: sqlite:///test_db.sqlite3
      USE_REDIS: 'false'
      OPENAI_API_KEY: ci-openai-key
      CLAUDE_API_KEY: ci-claude-key
      DEEPSEEK_API_KEY: ci-deepseek-key
      ADMIN_API_SIGNING_SECRET: ci-admin-signing-secret
      PYTHONNOUSERSITE: '1'
    steps:
      - name: Gate dedicated r2 only
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "RUNNER_NAME=$env:RUNNER_NAME"
          Write-Host "RUNNER_OS=$env:RUNNER_OS"
          Write-Host "RUNNER_ARCH=$env:RUNNER_ARCH"
          if ($env:RUNNER_NAME -ne 'LAPTOP-13QINEIF-v622-r2') {
            throw 'WRONG_RUNNER_NO_PROJECT_WORK_EXECUTED: expected LAPTOP-13QINEIF-v622-r2'
          }
          Write-Host 'DEDICATED_R2_GATE=PASS'

      - name: Locate existing Git installation for runner service
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = New-Object System.Collections.Generic.List[string]
          foreach ($path in @(
            'C:\Program Files\Git\cmd\git.exe',
            'C:\Program Files\Git\bin\git.exe',
            'C:\Program Files (x86)\Git\cmd\git.exe'
          )) {
            if (Test-Path -LiteralPath $path) { $candidates.Add($path) }
          }
          Get-ChildItem 'C:\Users\*\AppData\Local\Programs\Git\cmd\git.exe' -File -ErrorAction SilentlyContinue | ForEach-Object {
            if (-not $candidates.Contains($_.FullName)) { $candidates.Add($_.FullName) }
          }
          Get-ChildItem 'C:\Users\*\AppData\Local\GitHubDesktop\app-*\resources\app\git\cmd\git.exe' -File -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | ForEach-Object {
            if (-not $candidates.Contains($_.FullName)) { $candidates.Add($_.FullName) }
          }
          if ($candidates.Count -lt 1) { throw 'INFRA_GIT_NOT_FOUND' }
          $gitExe = $candidates[0]
          & $gitExe --version
          if ($LASTEXITCODE -ne 0) { throw 'Located Git executable is not usable' }
          "PH04_GIT=$gitExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "PH04_GIT=$gitExe"
          Write-Host 'GIT_DISCOVERY=PASS'

      - name: Locate pinned PH04 toolchain without installing system software
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $python = 'C:\PH4-Tools\venvs\ph04-m3-stage01-361cf101\Scripts\python.exe'
          if (-not (Test-Path -LiteralPath $python)) { throw "PINNED_PYTHON_MISSING: $python" }
          & $python -c "import sys,site; print(sys.executable); print(sys.version); print('user_site_enabled=' + str(site.ENABLE_USER_SITE)); raise SystemExit(0 if sys.version_info[:3] == (3,12,7) and site.ENABLE_USER_SITE is False else 1)"
          if ($LASTEXITCODE -ne 0) { throw 'PINNED_PYTHON_VALIDATION_FAILED' }

          $phpCandidates = New-Object System.Collections.Generic.List[string]
          Get-ChildItem 'C:\PH4-Tools' -Filter 'php.exe' -File -Recurse -ErrorAction SilentlyContinue | Sort-Object FullName | ForEach-Object { $phpCandidates.Add($_.FullName) }
          foreach ($path in @('C:\php\php.exe','C:\Program Files\PHP\php.exe')) {
            if ((Test-Path -LiteralPath $path) -and -not $phpCandidates.Contains($path)) { $phpCandidates.Add($path) }
          }
          $php = $null
          foreach ($candidate in $phpCandidates) {
            $version = (& $candidate -r "echo PHP_VERSION;" 2>$null)
            if ($LASTEXITCODE -eq 0 -and ([string]$version).StartsWith('8.4.')) { $php = $candidate; break }
          }
          if (-not $php) { throw 'PINNED_PHP_84_NOT_FOUND' }

          $nodeCandidates = New-Object System.Collections.Generic.List[string]
          foreach ($path in @('C:\Program Files\nodejs\node.exe','C:\Program Files (x86)\nodejs\node.exe')) {
            if (Test-Path -LiteralPath $path) { $nodeCandidates.Add($path) }
          }
          Get-ChildItem 'C:\PH4-Tools' -Filter 'node.exe' -File -Recurse -ErrorAction SilentlyContinue | Sort-Object FullName | ForEach-Object {
            if (-not $nodeCandidates.Contains($_.FullName)) { $nodeCandidates.Add($_.FullName) }
          }
          $node = $null
          foreach ($candidate in $nodeCandidates) {
            $version = (& $candidate --version 2>$null)
            if ($LASTEXITCODE -eq 0 -and ([string]$version).StartsWith('v22.')) { $node = $candidate; break }
          }
          if (-not $node) { throw 'PINNED_NODE_22_NOT_FOUND' }

          $composerCandidates = @(Get-ChildItem 'C:\PH4-Tools' -Filter 'composer.phar' -File -Recurse -ErrorAction SilentlyContinue | Sort-Object FullName)
          $composer = $null
          foreach ($candidate in $composerCandidates) {
            & $php $candidate.FullName --version --no-ansi *> $null
            if ($LASTEXITCODE -eq 0) { $composer = $candidate.FullName; break }
          }
          if (-not $composer) { throw 'PINNED_COMPOSER_PHAR_NOT_FOUND' }

          & $python -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'PINNED_PYTHON_PIP_CHECK_FAILED' }
          $phpVersion = (& $php -r "echo PHP_VERSION;")
          $nodeVersion = (& $node --version)
          $composerVersion = (& $php $composer --version --no-ansi)
          $composerHash = (Get-FileHash -LiteralPath $composer -Algorithm SHA256).Hash

          "PH04_PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PH04_PHP=$php" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PH04_NODE=$node" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PH04_COMPOSER=$composer" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "PINNED_PYTHON=$python"
          Write-Host "PINNED_PHP=$php ($phpVersion)"
          Write-Host "PINNED_NODE=$node ($nodeVersion)"
          Write-Host "PINNED_COMPOSER=$composer"
          Write-Host "PINNED_COMPOSER_VERSION=$composerVersion"
          Write-Host "PINNED_COMPOSER_SHA256=$composerHash"
          Write-Host 'PINNED_TOOLCHAIN_DISCOVERY=PASS'

      - name: Verify read-only local chat-project source cache
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $source = $env:PH04_SOURCE_CACHE
          if (-not (Test-Path -LiteralPath $source)) { throw "PH04 source cache missing: $source" }
          $sourceHeadRaw = & $env:PH04_GIT -C $source rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'SOURCE_CACHE_REV_PARSE_FAILED' }
          $sourceHead = ([string]$sourceHeadRaw).Trim()
          Write-Host "SOURCE_CACHE_HEAD=$sourceHead"
          if ($sourceHead -ne $env:PH04_PRIMARY_CACHE_HEAD) {
            throw "SOURCE_CACHE_HEAD_MISMATCH: expected $env:PH04_PRIMARY_CACHE_HEAD got $sourceHead"
          }
          $sourceStatus = @(& $env:PH04_GIT -C $source status --short)
          if ($LASTEXITCODE -ne 0) { throw 'SOURCE_CACHE_STATUS_FAILED' }
          if ($sourceStatus.Count -gt 0) {
            $sourceStatus | ForEach-Object { Write-Host $_ }
            throw 'SOURCE_CACHE_NOT_CLEAN'
          }
          & $env:PH04_GIT -C $source cat-file -e "$env:PH04_EXPECTED_SHA^{commit}"
          if ($LASTEXITCODE -ne 0) { throw "EXACT_STAGE01_COMMIT_NOT_PRESENT_IN_SOURCE_CACHE: $env:PH04_EXPECTED_SHA" }
          Write-Host 'READ_ONLY_SOURCE_CACHE_PRECHECK=PASS'

      - name: Clone exact Stage-01 candidate locally without network
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $source = $env:PH04_SOURCE_CACHE
          $target = Join-Path $env:GITHUB_WORKSPACE 'target'
          if (Test-Path -LiteralPath $target) { Remove-Item -LiteralPath $target -Recurse -Force }
          & $env:PH04_GIT clone --no-checkout --no-hardlinks $source $target
          if ($LASTEXITCODE -ne 0) { throw 'local isolated chat-project clone failed' }
          & $env:PH04_GIT -C $target checkout --detach $env:PH04_EXPECTED_SHA
          if ($LASTEXITCODE -ne 0) { throw 'exact Stage-01 checkout failed' }
          $actual = ([string](& $env:PH04_GIT -C $target rev-parse HEAD)).Trim()
          Write-Host "TARGET_HEAD=$actual"
          if ($actual -ne $env:PH04_EXPECTED_SHA) { throw "Stage-01 SHA mismatch: $actual" }
          $status = @(& $env:PH04_GIT -C $target status --short)
          if ($status.Count -gt 0) {
            $status | ForEach-Object { Write-Host $_ }
            throw 'Fresh target checkout unexpectedly dirty'
          }
          Write-Host 'EXACT_STAGE01_LOCAL_CLONE=PASS'

      - name: Reconfirm source cache unchanged after clone
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceHead = ([string](& $env:PH04_GIT -C $env:PH04_SOURCE_CACHE rev-parse HEAD)).Trim()
          $sourceStatus = @(& $env:PH04_GIT -C $env:PH04_SOURCE_CACHE status --short)
          if ($sourceHead -ne $env:PH04_PRIMARY_CACHE_HEAD -or $sourceStatus.Count -gt 0) {
            throw 'SOURCE_CACHE_CHANGED_DURING_LOCAL_CLONE'
          }
          Write-Host 'SOURCE_CACHE_UNTOUCHED_AFTER_CLONE=PASS'

      - name: Validate pinned backend environment and immutable dependency supply chain
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:GITHUB_WORKSPACE 'target'
          $backend = Join-Path $root 'aiChatProjectPyback'
          "PYTHONPATH=$backend;$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $env:PH04_PYTHON -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'pip check failed' }
          Push-Location $root
          try {
            & $env:PH04_PYTHON scripts/scan_text_encoding.py .
            if ($LASTEXITCODE -ne 0) { throw 'UTF-8/mojibake validation failed' }
          } finally { Pop-Location }
          Push-Location $backend
          try {
            & $env:PH04_PYTHON ..\scripts\validate_dependency_supply_chain.py
            if ($LASTEXITCODE -ne 0) { throw 'dependency supply-chain validation failed' }
          } finally { Pop-Location }

      - name: Compile backend and validate architecture boundaries
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $backend = Join-Path $env:GITHUB_WORKSPACE 'target\aiChatProjectPyback'
          Push-Location $backend
          try {
            & $env:PH04_PYTHON -m compileall -q .
            if ($LASTEXITCODE -ne 0) { throw 'compileall failed' }
            & $env:PH04_PYTHON commerce/validate_source_layout.py --require-reserved-paths
            if ($LASTEXITCODE -ne 0) { throw 'source layout gate failed' }
            & $env:PH04_PYTHON commerce/validate_migration_contracts.py
            if ($LASTEXITCODE -ne 0) { throw 'migration contract gate failed' }
            & $env:PH04_PYTHON commerce/validate_architecture_boundaries.py
            if ($LASTEXITCODE -ne 0) { throw 'architecture boundary gate failed' }
            & $env:PH04_PYTHON commerce/compose_registry.py --check
            if ($LASTEXITCODE -ne 0) { throw 'composition gate failed' }
          } finally { Pop-Location }

      - name: Validate lane/source manifests and backend-plugin contract registry
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:GITHUB_WORKSPACE 'target'
          $backend = Join-Path $root 'aiChatProjectPyback'
          Push-Location $root
          try {
            & $env:PH04_PYTHON parallel_delivery/validate_lane_merge.py
            if ($LASTEXITCODE -ne 0) { throw 'lane/source manifest validation failed' }
            & $env:PH04_PYTHON -m pytest -q parallel_delivery/tests/test_lane_merge.py
            if ($LASTEXITCODE -ne 0) { throw 'lane merge tests failed' }
            & $env:PH04_PYTHON contracts/backend_plugin/v1/validate_contracts.py
            if ($LASTEXITCODE -ne 0) { throw 'backend-plugin contract registry failed' }
          } finally { Pop-Location }
          Push-Location $backend
          try {
            & $env:PH04_PYTHON -m pytest -q chat/tests/test_backend_plugin_contract_fixtures.py
            if ($LASTEXITCODE -ne 0) { throw 'backend-plugin fixture tests failed' }
          } finally { Pop-Location }

      - name: Django check and migration drift
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $backend = Join-Path $env:GITHUB_WORKSPACE 'target\aiChatProjectPyback'
          Push-Location $backend
          try {
            & $env:PH04_PYTHON manage.py check
            if ($LASTEXITCODE -ne 0) { throw 'Django check failed' }
            & $env:PH04_PYTHON manage.py makemigrations --check --dry-run
            if ($LASTEXITCODE -ne 0) { throw 'migration drift check failed' }
          } finally { Pop-Location }

      - name: Run full backend tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $backend = Join-Path $env:GITHUB_WORKSPACE 'target\aiChatProjectPyback'
          Push-Location $backend
          try {
            & $env:PH04_PYTHON -m pytest -q
            if ($LASTEXITCODE -ne 0) { throw 'full backend pytest failed' }
          } finally { Pop-Location }

      - name: Validate release and deployment tooling
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:GITHUB_WORKSPACE 'target'
          Push-Location $root
          try {
            & $env:PH04_PYTHON -m pytest -q scripts/tests/test_build_release_artifacts.py scripts/tests/test_verify_release_attestation.py scripts/tests/test_validate_dependency_supply_chain.py scripts/tests/test_mansec_cluster_i_deployment.py
            if ($LASTEXITCODE -ne 0) { throw 'release/deployment tests failed' }
          } finally { Pop-Location }

      - name: Install and validate plugin dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $plugin = Join-Path $env:GITHUB_WORKSPACE 'target\aichat-WPplugin'
          Push-Location $plugin
          try {
            & $env:PH04_PHP $env:PH04_COMPOSER install --prefer-dist --no-progress --no-interaction --no-plugins --no-scripts
            if ($LASTEXITCODE -ne 0) { throw 'composer install failed' }
            & $env:PH04_PHP $env:PH04_COMPOSER validate --strict --no-ansi
            if ($LASTEXITCODE -ne 0) { throw 'composer validate failed' }
          } finally { Pop-Location }

      - name: Lint plugin PHP
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $plugin = Join-Path $env:GITHUB_WORKSPACE 'target\aichat-WPplugin'
          $files = Get-ChildItem -LiteralPath $plugin -Recurse -File -Filter '*.php' | Where-Object { $_.FullName -notmatch '[\\/]vendor[\\/]' }
          Write-Host "PHP_LINT_FILE_COUNT=$($files.Count)"
          foreach ($file in $files) {
            & $env:PH04_PHP -l $file.FullName | Out-Host
            if ($LASTEXITCODE -ne 0) { throw "PHP lint failed: $($file.FullName)" }
          }

      - name: Run plugin tests and shared contract fixture
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $plugin = Join-Path $env:GITHUB_WORKSPACE 'target\aichat-WPplugin'
          Push-Location $plugin
          try {
            & $env:PH04_PHP $env:PH04_COMPOSER test -- --no-coverage
            if ($LASTEXITCODE -ne 0) { throw 'plugin tests failed' }
            & $env:PH04_PHP vendor/bin/phpunit tests/Unit/BackendPluginSharedContractFixturesTest.php
            if ($LASTEXITCODE -ne 0) { throw 'plugin shared contract fixture failed' }
          } finally { Pop-Location }

      - name: Run all JavaScript state and boundary selectors
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $plugin = Join-Path $env:GITHUB_WORKSPACE 'target\aichat-WPplugin'
          $tests = @(Get-ChildItem -LiteralPath (Join-Path $plugin 'tests\js') -File -Filter '*.test.js' | Sort-Object Name)
          Write-Host "JS_TEST_FILE_COUNT=$($tests.Count)"
          foreach ($test in $tests) {
            Write-Host "JS_TEST=$($test.Name)"
            & $env:PH04_NODE $test.FullName
            if ($LASTEXITCODE -ne 0) { throw "JavaScript test failed: $($test.Name)" }
          }

      - name: Final exact-SHA, tracked-diff, and source-cache hygiene
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $target = Join-Path $env:GITHUB_WORKSPACE 'target'
          $actual = ([string](& $env:PH04_GIT -C $target rev-parse HEAD)).Trim()
          if ($actual -ne $env:PH04_EXPECTED_SHA) { throw "Final target SHA moved: $actual" }
          & $env:PH04_GIT -C $target diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed' }
          $tracked = @(& $env:PH04_GIT -C $target status --short --untracked-files=no)
          if ($tracked.Count -gt 0) {
            $tracked | ForEach-Object { Write-Host $_ }
            throw 'Validation modified tracked Stage-01 files'
          }
          $sourceHead = ([string](& $env:PH04_GIT -C $env:PH04_SOURCE_CACHE rev-parse HEAD)).Trim()
          $sourceStatus = @(& $env:PH04_GIT -C $env:PH04_SOURCE_CACHE status --short)
          if ($sourceHead -ne $env:PH04_PRIMARY_CACHE_HEAD -or $sourceStatus.Count -gt 0) {
            throw 'READ_ONLY_SOURCE_CACHE_CHANGED_DURING_VALIDATION'
          }
          Write-Host 'SOURCE_CACHE_FINAL_HYGIENE=PASS'
          Write-Host 'PH04_STAGE01_EXTERNAL_R2_CANONICAL_CI=PASS'
          Write-Host "VALIDATED_SHA=$actual"

      - name: Cleanup isolated validation workspace
        if: always()
        shell: powershell
        run: |
          $target = Join-Path $env:GITHUB_WORKSPACE 'target'
          if (Test-Path -LiteralPath $target) {
            Remove-Item -LiteralPath $target -Recurse -Force -ErrorAction SilentlyContinue
          }
