name: phase2-master-actual-kaggle-sources-v2

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build_publish_verify:
    runs-on: ubuntu-latest
    environment: cloudflare-production
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Download sealed evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/in"/{full,closure,dual,paired} "$RUNNER_TEMP/out"
          gh run download 37140085014 --repo rezanory/chatgpt-plugins --name PHASE2_FULL_RESULTS_RECONCILED_V1-37140085014 --dir "$RUNNER_TEMP/in/full"
          gh run download 37152774434 --repo rezanory/chatgpt-plugins --name PHASE2_FINAL_SCIENTIFIC_CLOSURE_V1-37152774434 --dir "$RUNNER_TEMP/in/closure"
          gh run download 37125310017 --repo rezanory/chatgpt-plugins --name PHASE2_DUAL_PR_V1-37125310017 --dir "$RUNNER_TEMP/in/dual"
          gh run download 37118976126 --repo rezanory/chatgpt-plugins --name PHASE2_OOF_PAIRED_STATS_V1-37118976126 --dir "$RUNNER_TEMP/in/paired"

      - name: Request control-plane identities
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          base=os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']
          bearer=os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']
          def issue(aud):
              sep='&' if '?' in base else '?'
              req=urllib.request.Request(base+sep+urllib.parse.urlencode({'audience':aud}),headers={'Authorization':'Bearer '+bearer})
              with urllib.request.urlopen(req,timeout=30) as r: token=json.load(r)['value']
              if len(token)<100: raise SystemExit('OIDC_INVALID:'+aud)
              print('::add-mask::'+token)
              return token
          read=issue('cgp-control-plane-v3')
          action=issue('cgp-control-plane-v3-action')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
              print('CGP_READ_OIDC_TOKEN='+read,file=f)
              print('CGP_ACTION_OIDC_TOKEN='+action,file=f)
          PY

      - name: Build from 36 actual Kaggle kernels
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/build_phase2_master_actual_kaggle_sources_v2.py
          python scripts/build_phase2_master_actual_kaggle_sources_v2.py             --full-results "$RUNNER_TEMP/in/full"             --closure "$RUNNER_TEMP/in/closure"             --dual "$RUNNER_TEMP/in/dual"             --paired "$RUNNER_TEMP/in/paired"             --output "$RUNNER_TEMP/out/PNEUMONIA_PHASE2_MASTER_ACTUAL_KAGGLE_SOURCES_V2.ipynb"             --receipt "$RUNNER_TEMP/out/PNEUMONIA_PHASE2_MASTER_ACTUAL_KAGGLE_SOURCES_V2_RECEIPT.json"
          python - <<'PY'
          import json, os, pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'out'
          r=json.loads((p/'PNEUMONIA_PHASE2_MASTER_ACTUAL_KAGGLE_SOURCES_V2_RECEIPT.json').read_text())
          assert r['status']=='PASS'
          assert r['real_kernel_count']==36
          assert r['original_cell_occurrences']>=100
          assert r['cells']>=50
          print('ACTUAL_MASTER_STATIC_PASS',r['cells'],r['code_cells'],r['original_cell_occurrences'],r['output_sha256'])
          PY

      - name: Quick-save exact notebook to Kaggle master and verify source hash
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, pathlib, urllib.request, urllib.error
          action='https://chatgpt-kaggle-gateway.rezanory-chatgpt-plugins.workers.dev/control-plane/v3/action/kaggle'
          read='https://chatgpt-kaggle-gateway.rezanory-chatgpt-plugins.workers.dev/control-plane/v3/read/kaggle'
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'out'
          nb_path=root/'PNEUMONIA_PHASE2_MASTER_ACTUAL_KAGGLE_SOURCES_V2.ipynb'
          text=nb_path.read_text(encoding='utf-8')
          expected=hashlib.sha256(nb_path.read_bytes()).hexdigest()
          ref='azadka/pneumonia-phase2-master-actual-kernels-v2'
          def post(url,token,payload,timeout=240):
              req=urllib.request.Request(url,data=json.dumps(payload).encode(),headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'},method='POST')
              try:
                  with urllib.request.urlopen(req,timeout=timeout) as r:return json.load(r)
              except urllib.error.HTTPError as e:
                  return {'ok':False,'http_status':e.code,'error':e.read().decode(errors='replace')[:5000]}
          launch=post(action,os.environ['CGP_ACTION_OIDC_TOKEN'],{
            'request_id':'phase2-master-actual-sources-v2-'+os.environ['GITHUB_RUN_ID'],
            'provider':'kaggle','operation_class':'compute','account_id':'master',
            'purpose':'Save exact consolidated notebook harvested from the 36 completed Phase-2 Kaggle kernels. QUICK_SAVE only; no training or inference.',
            'service':'kernels.KernelsApiService','method':'SaveKernel',
            'body':{'slug':ref,'newTitle':'Pneumonia Phase2 Master Actual Kernels V2','text':text,'language':'PYTHON','kernelType':'NOTEBOOK','kernelExecutionType':'QUICK_SAVE','isPrivate':True,'enableGpu':False,'enableTpu':False,'enableInternet':False,'datasetDataSources':[],'competitionDataSources':[],'modelDataSources':[]}
          })
          (root/'KAGGLE_MASTER_ACTUAL_SAVE.json').write_text(json.dumps(launch,indent=2))
          result=launch.get('result') if isinstance(launch.get('result'),dict) else {}
          if not launch.get('ok') or launch.get('error') or result.get('error'):
              raise SystemExit('KAGGLE_QUICK_SAVE_REJECTED:'+json.dumps(launch))
          got=post(read,os.environ['CGP_READ_OIDC_TOKEN'],{'action':'raw_read','account_id':'master','service':'kernels.KernelsApiService','method':'GetKernel','body':{'userName':'azadka','kernelSlug':'pneumonia-phase2-master-actual-kernels-v2'}},120)
          (root/'KAGGLE_MASTER_ACTUAL_GET.json').write_text(json.dumps(got,indent=2))
          cur=got
          for _ in range(8):
              if isinstance(cur,dict) and isinstance(cur.get('result'),dict):cur=cur['result']
              else:break
          blob=cur.get('blob') if isinstance(cur,dict) else None
          source=blob.get('source') if isinstance(blob,dict) else None
          if not isinstance(source,str): raise SystemExit('KAGGLE_READBACK_SOURCE_MISSING')
          actual=hashlib.sha256(source.encode()).hexdigest()
          if actual!=expected: raise SystemExit('KAGGLE_READBACK_SHA_MISMATCH:'+expected+':'+actual)
          receipt={'schema':'pneumonia.phase2.master.actual-kaggle-sources.publish.v2','status':'PASS','kernel_ref':ref,'source_sha256':actual,'quick_save':True,'training_performed':False}
          (root/'KAGGLE_MASTER_ACTUAL_VERIFY.json').write_text(json.dumps(receipt,indent=2,sort_keys=True))
          print('KAGGLE_MASTER_ACTUAL_SOURCE_PASS',json.dumps(receipt,sort_keys=True))
          PY

      - name: Upload exact master notebook
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PNEUMONIA_PHASE2_MASTER_ACTUAL_KAGGLE_SOURCES_V2-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/out/PNEUMONIA_PHASE2_MASTER_ACTUAL_KAGGLE_SOURCES_V2.ipynb
            ${{ runner.temp }}/out/PNEUMONIA_PHASE2_MASTER_ACTUAL_KAGGLE_SOURCES_V2_RECEIPT.json
            ${{ runner.temp }}/out/KAGGLE_MASTER_ACTUAL_SAVE.json
            ${{ runner.temp }}/out/KAGGLE_MASTER_ACTUAL_VERIFY.json
          if-no-files-found: warn
          retention-days: 90
