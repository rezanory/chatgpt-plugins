name: kaggle-recover
run-name: "Kaggle recovery for issue #${{ github.event.issue.number }}"

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  plan:
    if: startsWith(github.event.issue.title, '[KAGGLE-RECOVER]')
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      recovery: ${{ steps.plan.outputs.recovery }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install recovery planner
        run: uv sync --package chatgpt-plugin-kaggle
      - name: Validate existing-run recovery contract
        id: plan
        run: >-
          uv run --package chatgpt-plugin-kaggle python -m
          chatgpt_plugin_kaggle.actions.plan_recovery
          --accounts-file plugins/kaggle/config/accounts.json
      - name: Publish safe recovery planning failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          printf '%s\n' 'Kaggle recovery request rejected before any API token was loaded. No Kaggle run was modified or submitted.' > /tmp/recovery-plan-failure.md
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/recovery-plan-failure.md

  recover:
    needs: plan
    if: needs.plan.result == 'success'
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ matrix.account_environment }}
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      RECOVERY_ID: ${{ matrix.recovery_id }}
      TASK_ID: ${{ matrix.task_id }}
      ACCOUNT_ID: ${{ matrix.account_id }}
      KERNEL_REF: ${{ matrix.kernel_ref }}
      FILE_PATTERN: ${{ matrix.file_pattern }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      GITHUB_TOKEN: ${{ github.token }}
      ARTIFACT_NAME: recovery-${{ matrix.recovery_id }}-${{ matrix.task_id }}-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install recovery client and official Kaggle CLI
        run: |
          uv sync --package chatgpt-plugin-kaggle
          uv pip install "kaggle==2.2.4"
      - name: Read existing kernel status and selected outputs
        id: status
        run: >-
          uv run --package chatgpt-plugin-kaggle python -m
          chatgpt_plugin_kaggle.actions.status_task
          --job-id "$RECOVERY_ID"
          --task-id "$TASK_ID"
          --account-id "$ACCOUNT_ID"
          --kernel-ref "$KERNEL_REF"
          --github-run-id "$GITHUB_RUN_ID"
          --artifact-name "$ARTIFACT_NAME"
          --output-dir /tmp/kaggle-recovery-evidence
          --comment-file /tmp/recovery-status.md
          --file-pattern "$FILE_PATTERN"
      - name: Upload hashed evidence for terminal existing runs
        if: steps.status.outputs.terminal == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: /tmp/kaggle-recovery-evidence
          if-no-files-found: error
          retention-days: 30
      - name: Publish sanitized existing-run status
        run: >-
          uv run --package chatgpt-plugin-kaggle python -m
          chatgpt_plugin_kaggle.actions.post_comment
          --issue "$ISSUE_NUMBER" --file /tmp/recovery-status.md
      - name: Publish safe recovery failure marker
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf 'Existing Kaggle run recovery failed for task `%s` / kernel `%s`. No Kaggle run was submitted, modified, cancelled, or restarted. Workflow run: %s/%s/actions/runs/%s\n' \
            "$TASK_ID" "$KERNEL_REF" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > /tmp/recovery-failure.md
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/recovery-failure.md
