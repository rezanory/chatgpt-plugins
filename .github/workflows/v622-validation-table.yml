name: v622-validation-table

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v622-validation-table.yml'
      - 'deploy/cloudflare-worker-free/src/metrics.ts'

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Read all six canonical validation metric waves
        shell: bash
        run: |
          set -euo pipefail
          base='https://chatgpt-kaggle-gateway.rezanory-chatgpt-plugins.workers.dev/recovery/v6-2-2/shard-artifacts'
          for wave in 1 2 3 4 5 6; do
            ok=0
            for attempt in $(seq 1 8); do
              code="$(curl --silent --show-error --max-time 60 -o "/tmp/w${wave}.json" -w '%{http_code}' "${base}?shard=RESULTS-W${wave}" || true)"
              if [ "$code" = '200' ] && WAVE="$wave" python - <<'PY'
          import json, os
          from pathlib import Path
          wave=int(os.environ['WAVE'])
          value=json.loads(Path(f'/tmp/w{wave}.json').read_text())
          assert value.get('project')=='PNEUMONIA V6.2.2'
          assert value.get('report')=='validation_metrics'
          assert value.get('wave')==wave
          assert len(value.get('results') or [])==6
          PY
              then
                ok=1
                break
              fi
              sleep 5
            done
            if [ "$ok" != '1' ]; then
              echo "Validation metrics Wave $wave did not become ready." >&2
              cat "/tmp/w${wave}.json" 2>/dev/null || true
              exit 1
            fi
          done

      - name: Build exact 36-run table
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          rows=[]
          for wave in range(1,7):
              value=json.loads(Path(f'/tmp/w{wave}.json').read_text())
              rows.extend(value.get('results') or [])
          rows.sort(key=lambda r:int(str(r.get('worker_id'))[1:]))

          expected=[f'W{i:02d}' for i in range(1,37)]
          actual=[r.get('worker_id') for r in rows]
          assert actual==expected, (actual, expected)
          incomplete=[r.get('worker_id') for r in rows if r.get('status')!='COMPLETE']
          missing_metrics=[r.get('worker_id') for r in rows if not isinstance(r.get('metrics'),dict)]
          assert not incomplete, f'incomplete canonical runs: {incomplete}'
          assert not missing_metrics, f'missing validation metrics: {missing_metrics}'

          def metric_map(obj):
              out={}
              def walk(x,p=''):
                  if isinstance(x,dict):
                      if isinstance(x.get('path'),str) and 'value' in x:
                          out[x['path']]=x.get('value')
                      for k,v in x.items():
                          q=f'{p}.{k}' if p else str(k)
                          walk(v,q)
                  elif isinstance(x,list):
                      for i,v in enumerate(x): walk(v,f'{p}[{i}]')
                  else:
                      if p: out[p]=x
              walk(obj)
              return out

          def get(m,suffix):
              exact=[v for k,v in m.items() if k==suffix or k.endswith('.'+suffix)]
              return exact[0] if exact else None

          def pct(x):
              return '—' if not isinstance(x,(int,float)) else f'{100*x:.2f}%'
          def thr(x):
              return '—' if not isinstance(x,(int,float)) else f'{x:.6g}'

          table=[]
          compact=[]
          for r in rows:
              m=metric_map(r.get('metrics'))
              vals={
                  'accuracy':get(m,'threshold_search.accuracy'),
                  'balanced_accuracy':get(m,'threshold_search.balanced_accuracy'),
                  'precision':get(m,'threshold_search.precision'),
                  'sensitivity':get(m,'threshold_search.sensitivity') if get(m,'threshold_search.sensitivity') is not None else get(m,'threshold_search.recall'),
                  'specificity':get(m,'threshold_search.specificity'),
                  'f1':get(m,'threshold_search.f1'),
                  'threshold':get(m,'threshold_search.threshold'),
              }
              compact.append({
                  'worker_id':r.get('worker_id'),
                  'model_id':r.get('model_id'),
                  'resolution':r.get('resolution'),
                  'account_id':r.get('account_id'),
                  'raw_status':r.get('raw_status'),
                  'completion_evidence':r.get('completion_evidence'),
                  **vals,
              })
              table.append(
                  f"| {r.get('worker_id')} | {r.get('model_id')} | {r.get('resolution')} | {pct(vals['accuracy'])} | {pct(vals['balanced_accuracy'])} | {pct(vals['precision'])} | {pct(vals['sensitivity'])} | {pct(vals['specificity'])} | {pct(vals['f1'])} | {thr(vals['threshold'])} |"
              )

          body=[
              '## V6.2.2 validation table — exact 36-run snapshot',
              '',
              '> Validation-only. Locked official test and external cohorts were not opened or used.',
              '',
              '| Run | Model | Res | Accuracy | Balanced Acc | Precision | Sensitivity | Specificity | F1 | Threshold |',
              '|---|---:|---:|---:|---:|---:|---:|---:|---:|---:|',
              *table,
              '',
              '<details><summary>Compact JSON</summary>',
              '',
              '```json',json.dumps(compact,indent=2),'```','</details>',
          ]
          Path('/tmp/table.md').write_text('\n'.join(body)+'\n')
          PY

      - name: Publish exact validation table
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 18 --repo "$GITHUB_REPOSITORY" --body-file /tmp/table.md
