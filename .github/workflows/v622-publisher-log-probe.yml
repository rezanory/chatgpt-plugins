name: v622-publisher-log-probe

on:
  workflow_dispatch:
  issue_comment:
    types: [created]
  push:
    branches: [main]
    paths:
      - '.github/workflows/v622-publisher-log-probe.yml'
      - 'deploy/cloudflare-worker-free/src/v622-publisher-log-probe-worker.ts'

permissions:
  contents: read
  issues: write

concurrency:
  group: v622-cloudflare-production-mutation
  cancel-in-progress: false

jobs:
  probe:
    if: ${{ github.event_name != 'issue_comment' || (github.event.issue.number == 18 && github.event.comment.body == 'V622_PUBLISHER_LOG_PROBE') }}
    runs-on: [self-hosted, windows, x64, v622]
    timeout-minutes: 15
    environment: cloudflare-production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy read-only log probe
        shell: powershell
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          $ErrorActionPreference = 'Stop'
          $id = ([string]$env:RAW_CLOUDFLARE_ACCOUNT_ID).Trim()
          Write-Host "::add-mask::$id"
          [IO.File]::AppendAllText($env:GITHUB_ENV, "V622_CF_ACCOUNT_ID=$id`n", [Text.UTF8Encoding]::new($false))
          $env:CLOUDFLARE_ACCOUNT_ID = $id
          Push-Location deploy/cloudflare-worker-free
          try {
            npm install --no-audit --no-fund
            if ($LASTEXITCODE -ne 0) { throw 'npm failed' }
            npm run check
            if ($LASTEXITCODE -ne 0) { throw 'check failed' }
            npx wrangler deploy src/v622-publisher-log-probe-worker.ts --name chatgpt-kaggle-gateway
            if ($LASTEXITCODE -ne 0) { throw 'deploy failed' }
          } finally { Pop-Location }
      - name: Create probe capability
        shell: powershell
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $b = New-Object byte[] 48
          $r = [Security.Cryptography.RandomNumberGenerator]::Create()
          try { $r.GetBytes($b) } finally { $r.Dispose() }
          $t = [Convert]::ToBase64String($b).TrimEnd('=').Replace('+','-').Replace('/','_')
          Write-Host "::add-mask::$t"
          $env:CLOUDFLARE_ACCOUNT_ID = $env:V622_CF_ACCOUNT_ID
          Push-Location deploy/cloudflare-worker-free
          try {
            $t | npx wrangler secret put CGP_PROJECT_CONTROL_TOKEN --name chatgpt-kaggle-gateway
            if ($LASTEXITCODE -ne 0) { throw 'secret failed' }
          } finally { Pop-Location }
          [IO.File]::AppendAllText($env:GITHUB_ENV, "V622_PROBE_TOKEN=$t`n", [Text.UTF8Encoding]::new($false))
      - name: Read and journal Kaggle log tail
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $h = @{ Authorization = "Bearer $env:V622_PROBE_TOKEN"; 'Content-Type' = 'application/json' }
          $v = Invoke-RestMethod -Uri 'https://chatgpt-kaggle-gateway.rezanory-chatgpt-plugins.workers.dev/control/v6-2-2/publisher-log-probe' -Method Post -Headers $h -Body '{}' -TimeoutSec 180
          $log = [string]$v.log_tail
          if ($log.Length -gt 12000) { $log = $log.Substring($log.Length - 12000) }
          $body = "## V6.2.2 Kaggle publisher log diagnostic`n`n``````text`n$log`n```````n`n- Read-only probe: ``true```n- Model compute launched: ``false```n"
          $p = @{ body = $body } | ConvertTo-Json
          $gh = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/issues/18/comments" -Method Post -Headers $gh -ContentType 'application/json' -Body $p | Out-Null
      - name: Restore canonical Worker
        if: always()
        shell: powershell
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          $ErrorActionPreference = 'Continue'
          if ($env:V622_CF_ACCOUNT_ID) {
            $env:CLOUDFLARE_ACCOUNT_ID = $env:V622_CF_ACCOUNT_ID
            Push-Location deploy/cloudflare-worker-free
            try {
              'y' | npx wrangler secret delete CGP_PROJECT_CONTROL_TOKEN --name chatgpt-kaggle-gateway
              npx wrangler deploy
            } finally { Pop-Location }
          }
