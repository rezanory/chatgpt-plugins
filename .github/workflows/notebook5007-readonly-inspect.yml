name: notebook5007-readonly-inspect

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/notebook5007-readonly-inspect.yml
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: write

jobs:
  inspect:
    if: >-
      ${{ github.event_name != 'issue_comment' ||
          (github.event.issue.number == 33 &&
           github.event.comment.user.id == 62356000 &&
           github.event.comment.body == 'NOTEBOOK5007_READONLY_INSPECT') }}
    runs-on: [self-hosted, windows, x64, v622]
    timeout-minutes: 20
    env:
      RAW_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.RAW_CLOUDFLARE_ACCOUNT_ID }}
      V622_CF_ACCOUNT_ID: ${{ secrets.V622_CF_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CGP_PROJECT_CONTROL_TOKEN: ${{ secrets.CGP_PROJECT_CONTROL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deploy protected read-only inspector, inspect exact Kaggle notebook, restore monitor
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $workerDir = Join-Path $env:GITHUB_WORKSPACE 'deploy/cloudflare-worker-free'
          $accountId = ([string]$env:RAW_CLOUDFLARE_ACCOUNT_ID).Trim()
          if (-not $accountId) { $accountId = ([string]$env:V622_CF_ACCOUNT_ID).Trim() }
          if (-not $accountId) { throw 'Cloudflare account id is unavailable' }
          if (-not ([string]$env:CLOUDFLARE_API_TOKEN).Trim()) { throw 'Cloudflare deploy token is unavailable' }
          if (-not ([string]$env:CGP_PROJECT_CONTROL_TOKEN).Trim()) { throw 'Project control token is unavailable' }
          $env:CLOUDFLARE_ACCOUNT_ID = $accountId
          $resultFile = Join-Path $env:RUNNER_TEMP 'notebook5007-readonly-inspection.json'
          Push-Location $workerDir
          try {
            npm ci
            npx --yes wrangler deploy src/notebook5007-inspect-worker.ts --config wrangler.jsonc
            $headers = @{ Authorization = "Bearer $($env:CGP_PROJECT_CONTROL_TOKEN)"; 'Content-Type' = 'application/json' }
            $uri = 'https://chatgpt-kaggle-gateway.rezanory-chatgpt-plugins.workers.dev/control/inspect/notebook5007'
            try {
              $response = Invoke-WebRequest -Uri $uri -Method Post -Headers $headers -TimeoutSec 120
              [IO.File]::WriteAllText($resultFile, [string]$response.Content, [Text.UTF8Encoding]::new($false))
              if ([int]$response.StatusCode -ne 200) { throw "Inspector HTTP $($response.StatusCode)" }
            } catch {
              if ($_.Exception.Response) {
                try {
                  $stream = $_.Exception.Response.GetResponseStream()
                  $reader = New-Object IO.StreamReader($stream)
                  $body = $reader.ReadToEnd()
                  [IO.File]::WriteAllText($resultFile, $body, [Text.UTF8Encoding]::new($false))
                } catch {}
              }
              throw
            }
            $payload = Get-Content -Raw -LiteralPath $resultFile | ConvertFrom-Json
            if ($payload.ok -eq $false) { throw "Inspector returned diagnostic: $($payload.error)" }
            Write-Host "NOTEBOOK_INSPECTION_PASS ref=$($payload.kernel_ref) source_chars=$($payload.source_chars) outputs=$($payload.output_file_count_first_page)"
          } finally {
            npx --yes wrangler deploy src/v622-backbone-monitor-index.ts --config wrangler.jsonc
            Pop-Location
          }
          Copy-Item -LiteralPath $resultFile -Destination (Join-Path $env:GITHUB_WORKSPACE 'notebook5007-readonly-inspection.json')
      - name: Upload private inspection artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notebook5007-readonly-inspection
          path: notebook5007-readonly-inspection.json
          if-no-files-found: warn
          retention-days: 1
      - name: Publish run pointer
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:GITHUB_WORKSPACE '.cgp'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $pointer = @{
            run_id = [long]$env:GITHUB_RUN_ID
            run_attempt = [int]$env:GITHUB_RUN_ATTEMPT
            source_sha = $env:GITHUB_SHA
            artifact_name = 'notebook5007-readonly-inspection'
          } | ConvertTo-Json -Compress
          [IO.File]::WriteAllText((Join-Path $dir 'notebook5007-inspection-run.json'), $pointer, [Text.UTF8Encoding]::new($false))
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .cgp/notebook5007-inspection-run.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m 'Record notebook5007 inspection run pointer'
            git push origin HEAD:main
          }
