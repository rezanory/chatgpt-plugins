name: kaggle-env-secret-key-probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kaggle-env-secret-key-probe.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  key-probe:
    runs-on: [self-hosted, windows, x64, v622]
    timeout-minutes: 5
    steps:
      - name: Read kaggle-08 environment secret public key
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $h=@{Authorization="Bearer $env:GITHUB_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          try {
            $r=Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/environments/kaggle-08/secrets/public-key" -Headers $h -TimeoutSec 30
            Write-Host 'CGP_ENV_PUBLIC_KEY_BEGIN'
            (@{key_id=[string]$r.key_id;key=[string]$r.key}|ConvertTo-Json -Compress)|Write-Host
            Write-Host 'CGP_ENV_PUBLIC_KEY_END'
          } catch {
            $code=if($_.Exception.Response){[int]$_.Exception.Response.StatusCode}else{0}
            Write-Host "CGP_ENV_PUBLIC_KEY_ERROR=$code"
            exit 0
          }
