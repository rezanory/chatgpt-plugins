name: v622-kaggle-to-kaggle-finalization-artifact-transfer

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: v622-cloudflare-production-mutation
  cancel-in-progress: false

jobs:
  transfer:
    # Transport/orchestration only. No model inference/training is performed on this runner.
    runs-on: [self-hosted, windows, x64, v622]
    timeout-minutes: 180
    environment: cloudflare-production
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve local Python
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @()
          $command = Get-Command python.exe -ErrorAction SilentlyContinue
          if ($command) { $candidates += $command.Source }
          if (-not [string]::IsNullOrWhiteSpace($env:RUNNER_TOOL_CACHE)) {
            $root = Join-Path $env:RUNNER_TOOL_CACHE 'Python'
            if (Test-Path $root) {
              $candidates += Get-ChildItem -Path $root -Filter python.exe -Recurse -ErrorAction SilentlyContinue |
                Sort-Object FullName -Descending | Select-Object -ExpandProperty FullName
            }
          }
          $python = $candidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $python) { throw 'No runnable Python found on transport runner.' }
          & $python --version
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "V622_PYTHON=$python`n", [System.Text.UTF8Encoding]::new($false))

      - name: Deploy protected Kaggle artifact-transfer bridge
        shell: powershell
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          $ErrorActionPreference = 'Stop'
          $accountId = ([string]$env:RAW_CLOUDFLARE_ACCOUNT_ID).Trim()
          if ([string]::IsNullOrWhiteSpace($env:CLOUDFLARE_API_TOKEN) -or [string]::IsNullOrWhiteSpace($accountId)) { throw 'Cloudflare credentials missing' }
          Write-Host "::add-mask::$accountId"
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "V622_CF_ACCOUNT_ID=$accountId`n", [System.Text.UTF8Encoding]::new($false))
          $env:CLOUDFLARE_ACCOUNT_ID = $accountId
          Push-Location 'deploy/cloudflare-worker-free'
          try {
            npm install --no-audit --no-fund
            if ($LASTEXITCODE -ne 0) { throw 'npm install failed' }
            npm run check
            if ($LASTEXITCODE -ne 0) { throw 'Worker typecheck failed' }
            npx wrangler deploy src/v622-finalization-artifact-transfer-worker.ts --name chatgpt-kaggle-gateway
            if ($LASTEXITCODE -ne 0) { throw 'Artifact-transfer bridge deploy failed' }
          }
          finally { Pop-Location }

      - name: Create ephemeral transfer capability
        shell: powershell
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $bytes = New-Object byte[] 48
          $rng = [System.Security.Cryptography.RandomNumberGenerator]::Create()
          try { $rng.GetBytes($bytes) } finally { $rng.Dispose() }
          $token = [Convert]::ToBase64String($bytes).TrimEnd('=').Replace('+','-').Replace('/','_')
          Write-Host "::add-mask::$token"
          $env:CLOUDFLARE_ACCOUNT_ID = $env:V622_CF_ACCOUNT_ID
          Push-Location 'deploy/cloudflare-worker-free'
          try {
            $token | npx wrangler secret put CGP_PROJECT_CONTROL_TOKEN --name chatgpt-kaggle-gateway
            if ($LASTEXITCODE -ne 0) { throw 'Transfer capability install failed' }
          }
          finally { Pop-Location }
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "V622_TRANSFER_TOKEN=$token`n", [System.Text.UTF8Encoding]::new($false))

      - name: Move exact frozen artifacts from trickermark Kaggle output to azadka private Kaggle Dataset
        timeout-minutes: 150
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:V622_PYTHON scripts/v622_kaggle_to_kaggle_transfer.py
          if ($LASTEXITCODE -ne 0) { throw 'Kaggle-to-Kaggle artifact transfer failed.' }

      - name: Remove transfer capability and restore canonical Worker
        shell: powershell
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $env:CLOUDFLARE_ACCOUNT_ID = $env:V622_CF_ACCOUNT_ID
          Push-Location 'deploy/cloudflare-worker-free'
          try {
            $deleteOk = $false
            for ($attempt = 1; $attempt -le 5; $attempt++) {
              'y' | npx wrangler secret delete CGP_PROJECT_CONTROL_TOKEN --name chatgpt-kaggle-gateway
              if ($LASTEXITCODE -eq 0) { $deleteOk = $true; break }
              Start-Sleep -Seconds (5 * $attempt)
            }
            if (-not $deleteOk) { throw 'Could not delete transfer capability.' }
            $restoreOk = $false
            for ($attempt = 1; $attempt -le 5; $attempt++) {
              npx wrangler deploy
              if ($LASTEXITCODE -eq 0) { $restoreOk = $true; break }
              Start-Sleep -Seconds (5 * $attempt)
            }
            if (-not $restoreOk) { throw 'Could not restore canonical Worker.' }
          }
          finally { Pop-Location }

      - name: Journal private azadka Dataset readiness
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Join-Path $env:RUNNER_TEMP 'v622-kaggle-to-kaggle-transfer/transfer-receipt.json'
          $r = Get-Content -Raw $path | ConvertFrom-Json
          $checkpointHashes = @($r.artifacts | Where-Object { $_.dest_name -like '*final_selected.keras' } | ForEach-Object { "$($_.dest_name)=$($_.sha256)" }) -join ', '
          $body = "## V6.2.2 azadka private artifact dataset ready`n`n- Result: ``PASS```n- Source: ``trickermark/pneumonia-v6-2-2-backbone-m06-r224`` (read-only)`n- Destination: ``azadka/pneumonia-v6-2-2-finalization-artifacts```n- Dataset version: ``$($r.dataset_version)```n- Files: ``7`` = 3 configs + 3 selected checkpoints + frozen ensemble policy`n- Checkpoint SHA-256: ``$checkpointHashes```n- GitHub artifact storage used: ``false```n- GitHub model compute performed: ``false```n- Training/HPO/confirmation: ``false```n- Locked test used: ``false```n- External validation used: ``false```n- Next stage: ``FINAL_FREEZE_MANIFEST`` on Kaggle master ``azadka```n- Transfer run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID`n"
          $payload = @{ body = $body } | ConvertTo-Json
          $headers = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/issues/18/comments" -Method Post -Headers $headers -ContentType 'application/json' -Body $payload | Out-Null

      - name: Dispatch Kaggle-native final freeze after Dataset is ready
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          $payload = @{ ref = 'main' } | ConvertTo-Json
          Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/workflows/v622-kaggle-finalization-freeze-bridge.yml/dispatches" -Method Post -Headers $headers -ContentType 'application/json' -Body $payload | Out-Null
          Write-Host 'Dispatched final freeze bridge after private azadka Dataset readiness.'

      - name: Emergency cleanup after transfer failure
        if: failure()
        shell: powershell
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          $ErrorActionPreference = 'Continue'
          if (-not [string]::IsNullOrWhiteSpace($env:V622_CF_ACCOUNT_ID)) {
            $env:CLOUDFLARE_ACCOUNT_ID = $env:V622_CF_ACCOUNT_ID
            Push-Location 'deploy/cloudflare-worker-free'
            try {
              for ($attempt = 1; $attempt -le 3; $attempt++) { 'y' | npx wrangler secret delete CGP_PROJECT_CONTROL_TOKEN --name chatgpt-kaggle-gateway; if ($LASTEXITCODE -eq 0) { break }; Start-Sleep -Seconds 5 }
              for ($attempt = 1; $attempt -le 3; $attempt++) { npx wrangler deploy; if ($LASTEXITCODE -eq 0) { break }; Start-Sleep -Seconds 5 }
            }
            finally { Pop-Location }
          }

      - name: Publish transfer diagnostic on failure
        if: failure()
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Continue'
          $failurePath = Join-Path $env:RUNNER_TEMP 'v622-kaggle-to-kaggle-transfer/failure.txt'
          $reason = if (Test-Path $failurePath) { (Get-Content -Raw $failurePath).Trim() } else { 'failure occurred before transport script produced a diagnostic' }
          if ($reason.Length -gt 1500) { $reason = $reason.Substring(0, 1500) }
          $body = "## V6.2.2 Kaggle-to-Kaggle artifact transfer diagnostic`n`n- Result: ``FAILED_OR_TIMED_OUT```n- Source: ``trickermark`` read-only Kaggle output`n- Intended destination: private Kaggle Dataset owned by ``azadka```n- Failure: ``$reason```n- GitHub artifact storage used: ``false```n- Model compute performed by GitHub: ``false```n- Locked test/external launched: ``false```n- Run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID`n"
          $payload = @{ body = $body } | ConvertTo-Json
          $headers = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/issues/18/comments" -Method Post -Headers $headers -ContentType 'application/json' -Body $payload | Out-Null
