name: control-plane-v3-action

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  action:
    if: >-
      ${{ github.event.issue.number == 33 &&
          github.event.comment.user.id == 62356000 &&
          startsWith(github.event.comment.body, 'CONTROL_PLANE_V3_ACTION ') }}
    runs-on: [self-hosted, windows, x64, v622]
    environment: cloudflare-production
    timeout-minutes: 15
    concurrency:
      group: control-plane-v3-action-${{ github.event.comment.id }}
      cancel-in-progress: false
    steps:
      - name: Validate QUICK_SAVE deploy request
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $event=Get-Content -Raw $env:GITHUB_EVENT_PATH | ConvertFrom-Json
          if([string]$event.repository.id -ne '1337215097'){throw 'repository id mismatch'}
          if([string]$event.comment.user.id -ne '62356000'){throw 'actor id mismatch'}
          $prefix='CONTROL_PLANE_V3_ACTION '
          $raw=([string]$event.comment.body).Substring($prefix.Length).Trim()
          $obj=$raw | ConvertFrom-Json
          if([string]$obj.request_id -ne 'm07-quicksave-deploy-20260824'){throw 'request id mismatch'}
      - uses: actions/checkout@v4
        with:
          ref: feature/control-plane-v3
      - name: Deploy M07 QUICK_SAVE fix worker
        shell: powershell
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          $ErrorActionPreference='Stop'
          Set-Location deploy/cloudflare-worker-free
          npm install --ignore-scripts --no-audit --no-fund
          npx --yes wrangler deploy src/m07-quicksave-fix-kg02.ts --config wrangler.jsonc
      - name: Publish QUICK_SAVE deploy receipt
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $h=@{Authorization="Bearer $env:GITHUB_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          $body="M07 QUICK_SAVE WORKER DEPLOYED | run=$env:GITHUB_RUN_ID | target=radlinaradlina/m07-resume-fold4 | execution=QUICK_SAVE_ONLY | scientific_rerun=false"
          $p=@{body=$body}|ConvertTo-Json -Compress
          Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/issues/33/comments" -Method Post -Headers $h -ContentType 'application/json' -Body $p | Out-Null
