name: control-plane-v3-action

on:
  issue_comment:
    types: [created]

permissions:
  id-token: write
  contents: read
  issues: write

concurrency:
  group: pneumonia-m07-exact-package-seven
  cancel-in-progress: false

jobs:
  action:
    if: ${{ github.event.issue.number == 33 && github.event.comment.user.id == 62356000 && github.event.comment.body == 'PNEUMONIA_MASTER_M07_GATE_LAUNCH_ALL EXACT_PACKAGE_V2' }}
    runs-on: [self-hosted, windows, x64, v622]
    timeout-minutes: 45
    steps:
      - name: Checkout exact package payload
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Reconstruct and validate package-derived locked notebook
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $names=@(
            'docs/pneumonia-v6-2-2-m07-exact-part-00.b64',
            'docs/pneumonia-v6-2-2-m07-exact-part-01.b64',
            'docs/pneumonia-v6-2-2-m07-exact-part-02.b64',
            'docs/pneumonia-v6-2-2-m07-exact-part-03.b64',
            'docs/pneumonia-v6-2-2-m07-exact-part-04.b64',
            'docs/pneumonia-v6-2-2-m07-exact-part-05.b64',
            'docs/pneumonia-v6-2-2-m07-exact-part-06.b64',
            'docs/pneumonia-v6-2-2-m07-exact-part-07.b64'
          )
          $b64=''
          foreach($name in $names){
            if(-not (Test-Path $name)){throw "payload piece missing: $name"}
            $piece=([IO.File]::ReadAllText($name)).Trim()
            if(-not $piece){throw "payload piece empty: $name"}
            $b64 += $piece
          }
          if($b64.Length -ne 93120){throw "payload base64 length mismatch: $($b64.Length)"}
          $gz=[Convert]::FromBase64String($b64)
          $input=[IO.MemoryStream]::new($gz)
          $zip=[IO.Compression.GZipStream]::new($input,[IO.Compression.CompressionMode]::Decompress)
          $out=Join-Path $env:RUNNER_TEMP 'PNEUMONIA_MASTER_M01_M12_M07_GATE_OPERATIONAL_SAFE.ipynb'
          $output=[IO.File]::Create($out)
          try {$zip.CopyTo($output)} finally {$output.Dispose();$zip.Dispose();$input.Dispose()}
          $sha=(Get-FileHash $out -Algorithm SHA256).Hash.ToLower()
          if($sha -ne '234b87dec5ad3bbc564956025496411f272ed94b7efdb4719f56a1f762bdcc3c'){throw "launch notebook sha mismatch: $sha"}
          $nb=[IO.File]::ReadAllText($out,[Text.Encoding]::UTF8)
          if($nb -notlike '*UNLOCK_REMAINING_MODELS = False*'){throw 'M07 manual gate is not locked false'}
          if($nb -like '*UNLOCK_REMAINING_MODELS = True*'){throw 'automatic Phase-2 unlock literal found'}
          if($nb -notlike '*896491de87f9dc2a1d7d63548b7c5c22206da11f27a37efece8efc8e1557c8a9*'){throw 'frozen split fingerprint missing'}
          if($nb -notlike '*paultimothymooney/chest-xray-pneumonia*'){throw 'raw Kermany reference missing'}
          if($nb -notlike '*__ACCOUNT_OWNER__*'){throw 'per-account persistence placeholder missing'}
          "CGP_NOTEBOOK_PATH=$out" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CGP_NOTEBOOK_SHA=$sha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "EXACT_PACKAGE_DERIVED_NOTEBOOK_VALIDATED source_sha=8bb444a03d26014a7e87cf5582302c7d1987bdefea98d7b47444ce03d03e04c0 launch_sha=$sha"

      - name: Request trusted GitHub OIDC action-broker identity
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if(-not $env:ACTIONS_ID_TOKEN_REQUEST_URL -or -not $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN){throw 'GitHub OIDC request context unavailable'}
          $sep=if($env:ACTIONS_ID_TOKEN_REQUEST_URL.Contains('?')){'&'}else{'?'}
          $uri="$($env:ACTIONS_ID_TOKEN_REQUEST_URL)$($sep)audience=cgp-control-plane-v3-action"
          $r=Invoke-RestMethod -Uri $uri -Headers @{Authorization="Bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN"} -TimeoutSec 30
          $token=[string]$r.value
          if($token.Length -lt 100){throw 'GitHub OIDC token unavailable'}
          Write-Host "::add-mask::$token"
          [IO.File]::AppendAllText($env:GITHUB_ENV,"CGP_ACTION_OIDC_TOKEN=$token`n",[Text.UTF8Encoding]::new($false))

      - name: Save and Run All M07 on seven Kaggle accounts concurrently
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $python=(Get-Command python.exe -ErrorAction SilentlyContinue).Source
          if(-not $python){$python=(Get-Command python -ErrorAction Stop).Source}
          $script=@'
          import concurrent.futures, json, os, pathlib, urllib.error, urllib.request

          ENDPOINT='https://chatgpt-kaggle-gateway.rezanory-chatgpt-plugins.workers.dev/control-plane/v3/action/kaggle'
          OIDC=os.environ['CGP_ACTION_OIDC_TOKEN'].strip()
          TEMPLATE=pathlib.Path(os.environ['CGP_NOTEBOOK_PATH']).read_text(encoding='utf-8')
          ACCOUNTS=[
              ('master','azadka'),
              ('kg-02','radlinaradlina'),
              ('kg-03','rezanory'),
              ('kg-04','reyhanehazad'),
              ('kg-05','trickermark'),
              ('kg-06','msdenis'),
              ('kg-07','nisabulutmark'),
          ]

          def broker(payload):
              data=json.dumps(payload,separators=(',',':')).encode()
              req=urllib.request.Request(ENDPOINT,data=data,method='POST',headers={
                  'Authorization':'Bearer '+OIDC,
                  'Content-Type':'application/json',
                  'Accept':'application/json',
                  'User-Agent':'pneumonia-m07-exact-package-seven/2.0',
              })
              try:
                  with urllib.request.urlopen(req,timeout=240) as r:
                      raw=r.read().decode('utf-8','replace')
                      return r.status,(json.loads(raw) if raw else {})
              except urllib.error.HTTPError as exc:
                  raw=exc.read(5000).decode('utf-8','replace')
                  raise RuntimeError(f'HTTP {exc.code}: {raw[:1400]}') from exc

          def submit(item):
              aid,owner=item
              slug=f'{owner}/pneumonia-master-m07-gate-224-exactpkg-20260828-v4'
              row={'account_id':aid,'owner':owner,'kernel_ref':slug,'master_owner':'azadka'}
              nb=TEMPLATE.replace('__ACCOUNT_OWNER__',owner)
              if '__ACCOUNT_OWNER__' in nb:
                  row.update(submitted=False,error='OWNER_SUBSTITUTION_INCOMPLETE'); return row
              if 'UNLOCK_REMAINING_MODELS = False' not in nb or 'UNLOCK_REMAINING_MODELS = True' in nb:
                  row.update(submitted=False,error='GATE_INVARIANT_FAILED'); return row
              payload={
                  'request_id':f'pneumonia-m07-exactpkg-{aid}-20260828-v4',
                  'provider':'kaggle',
                  'operation_class':'compute',
                  'account_id':aid,
                  'purpose':'Execute exact package M07@224 gate only; explicit Save and Run All; azadka is master/controller; Phase-2 remains locked.',
                  'service':'kernels.KernelsApiService',
                  'method':'SaveKernel',
                  'body':{
                      'slug':slug,
                      'newTitle':('Pneumonia M07 Gate 224 exact package - MASTER azadka' if aid=='master' else f'Pneumonia M07 Gate 224 exact package - worker {owner} - master azadka'),
                      'text':nb,
                      'language':'PYTHON',
                      'kernelType':'NOTEBOOK',
                      'kernelExecutionType':'SAVE_AND_RUN_ALL',
                      'isPrivate':True,
                      'enableGpu':True,
                      'enableInternet':True,
                      'datasetDataSources':['paultimothymooney/chest-xray-pneumonia'],
                      'kernelDataSources':['reyhanehazad/notebook906d9e6ec9'],
                  },
              }
              try:
                  http,result=broker(payload)
                  if not isinstance(result,dict) or not result.get('ok'):
                      raise RuntimeError('Control Plane returned ok=false')
                  row.update(submitted=True,http_status=http,provider_ref=result.get('provider_ref'),requested_ref=result.get('requested_ref'),broker_run_id=result.get('broker_run_id'),execution_type='SAVE_AND_RUN_ALL')
              except Exception as exc:
                  row.update(submitted=False,error=f'{type(exc).__name__}: {exc}'[:1600])
              return row

          with concurrent.futures.ThreadPoolExecutor(max_workers=7) as ex:
              results=[f.result() for f in concurrent.futures.as_completed([ex.submit(submit,a) for a in ACCOUNTS])]
          order={a[0]:i for i,a in enumerate(ACCOUNTS)}
          results.sort(key=lambda x:order[x['account_id']])
          ok=sum(1 for r in results if r.get('submitted'))
          fail=7-ok
          master=next(r for r in results if r['account_id']=='master')
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'m07-exact-package-seven-v2-results.json'
          out.write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
              f.write(f'CGP_RESULTS_PATH={out}\nCGP_OK_COUNT={ok}\nCGP_FAIL_COUNT={fail}\nCGP_MASTER_OK={1 if master.get("submitted") else 0}\n')
          print(json.dumps({'master_submitted':bool(master.get('submitted')),'submitted':ok,'failed':fail,'parallel_all_7':True,'execution_type':'SAVE_AND_RUN_ALL','phase2_locked':True}))
          '@
          $script | & $python -
          if($LASTEXITCODE -ne 0){throw 'seven-account broker submission script failed'}

      - name: Publish authoritative launch receipt
        if: always()
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $rows=@()
          if($env:CGP_RESULTS_PATH -and (Test-Path $env:CGP_RESULTS_PATH)){
            $r=Get-Content -Raw $env:CGP_RESULTS_PATH | ConvertFrom-Json
            foreach($x in @($r)){
              $state=if($x.submitted){'SAVE_AND_RUN_ALL_ACCEPTED'}else{'FAILED'}
              $detail=if($x.submitted){if($x.provider_ref){[string]$x.provider_ref}else{'Control Plane ok=true'}}else{([string]$x.error).Replace('|','/')}
              $rows += "| $($x.account_id) | $($x.owner) | $state | $($x.kernel_ref) | $detail |"
            }
          }
          $table=($rows -join "`n")
          $state=if($env:CGP_OK_COUNT -eq '7' -and $env:CGP_MASTER_OK -eq '1'){'ALL_7_ACCEPTED'}else{'PARTIAL_OR_FAILED'}
          $msg=@"
          ## PNEUMONIA M07 EXACT PACKAGE SAVE_AND_RUN $state
          - Run: ``$env:GITHUB_RUN_ID``
          - Master/controller: ``azadka``
          - Source package notebook SHA256: ``8bb444a03d26014a7e87cf5582302c7d1987bdefea98d7b47444ce03d03e04c0``
          - Operational launch payload SHA256: ``$env:CGP_NOTEBOOK_SHA``
          - Scientific gate: ``M07@224 first``
          - Execution type: ``SAVE_AND_RUN_ALL``
          - ``UNLOCK_REMAINING_MODELS``: ``False``
          - Phase-2 auto-launch: ``disabled``
          - Submission topology: ``7 accounts concurrently``
          - Master accepted: ``$env:CGP_MASTER_OK``
          - Submitted/accepted: ``$env:CGP_OK_COUNT/7``
          - Failed: ``$env:CGP_FAIL_COUNT/7``
          - RUNNING is not claimed until Kaggle session telemetry confirms it.

          | Account | Owner | State | Kernel | Detail |
          |---|---|---|---|---|
          $table
          "@
          $h=@{Authorization="Bearer $env:GITHUB_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/issues/33/comments" -Method Post -Headers $h -ContentType 'application/json' -Body (@{body=$msg}|ConvertTo-Json -Compress) | Out-Null

      - name: Fail closed unless all seven and master accepted
        if: always()
        shell: powershell
        run: |
          if($env:CGP_OK_COUNT -ne '7' -or $env:CGP_FAIL_COUNT -ne '0' -or $env:CGP_MASTER_OK -ne '1'){
            throw "M07 exact-package Save and Run incomplete: accepted=$env:CGP_OK_COUNT failed=$env:CGP_FAIL_COUNT master=$env:CGP_MASTER_OK"
          }
          Write-Host 'All seven exact-package M07 Save and Run All calls accepted; azadka is master/controller; Phase-2 remains locked.'
