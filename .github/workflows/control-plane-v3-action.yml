name: control-plane-v3-action

on:
  issue_comment:
    types: [created]

permissions:
  id-token: write
  contents: read
  issues: write

jobs:
  action:
    if: ${{ github.event.issue.number == 33 && startsWith(github.event.comment.body, 'PNEUMONIA_MASTER_M07_GATE_LAUNCH_ALL') }}
    runs-on: [self-hosted, windows, x64, v622]
    timeout-minutes: 45
    steps:
      - name: Checkout verified READY payload
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Reconstruct and validate READY M07 notebook
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root='control-plane-payloads/pneumonia-master-m07-gate-ready'
          $names=@(
            'part-00.b64','part-01.b64','part-02.b64','part-03.b64','part-04.b64','part-05.b64',
            'repair-v2/p06-00.b64','repair-v2/p06-01.b64','repair-v2/p06-02.b64','repair-v2/p06-03.b64','repair-v2/p06-04.b64',
            'repair-v2/p07-00.b64','repair-v2/p07-01.b64','repair-v2/p07-02.b64','repair-v2/p07-03.b64','repair-v2/p07-04.b64',
            'part-08.b64','part-09.b64','part-10.b64'
          )
          $b64=''
          foreach($name in $names){
            $p=Join-Path $root $name
            if(-not (Test-Path $p)){throw "READY payload missing: $name"}
            $piece=([IO.File]::ReadAllText($p)).Trim()
            if(-not $piece){throw "READY payload empty: $name"}
            $b64 += $piece
          }
          if($b64.Length -ne 101048){throw "READY base64 length mismatch: $($b64.Length)"}
          if(($b64.Length % 4) -ne 0){throw 'READY base64 framing invalid'}
          $gz=[Convert]::FromBase64String($b64)
          $input=[IO.MemoryStream]::new($gz)
          $zip=[IO.Compression.GZipStream]::new($input,[IO.Compression.CompressionMode]::Decompress)
          $out=Join-Path $env:RUNNER_TEMP 'PNEUMONIA_MASTER_M01_M12_M07_GATE_READY.ipynb'
          $output=[IO.File]::Create($out)
          try {$zip.CopyTo($output)} finally {$output.Dispose();$zip.Dispose();$input.Dispose()}
          $sha=(Get-FileHash $out -Algorithm SHA256).Hash.ToLower()
          if($sha -ne 'eb8a53d6e7ad6dc687411cc999f3218e548b2ad0abee07e990c3bfb4670848eb'){throw "READY notebook sha mismatch: $sha"}
          $nb=[IO.File]::ReadAllText($out,[Text.Encoding]::UTF8)
          if($nb -notlike '*UNLOCK_REMAINING_MODELS = False*'){throw 'M07 gate is not locked false'}
          if($nb -notlike '*896491de87f9dc2a1d7d63548b7c5c22206da11f27a37efece8efc8e1557c8a9*'){throw 'frozen split fingerprint missing'}
          if($nb -notlike '*AUTO_REBUILT_SPLIT_HASH_MISMATCH*'){throw 'deterministic split guard missing'}
          if($nb -notlike '*paultimothymooney/chest-xray-pneumonia*'){throw 'raw Kermany ref missing'}
          if($nb -notlike '*__ACCOUNT_OWNER__*'){throw 'owner placeholder missing'}
          if($nb -like '*reyhanehazad/notebook906d9e6ec9*'){throw 'private split notebook dependency present'}
          if($nb -like '*radlinaradlina/m07-frozen-split-clone*'){throw 'private split clone dependency present'}
          "CGP_NOTEBOOK_PATH=$out" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CGP_NOTEBOOK_SHA=$sha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "READY_VALIDATED sha=$sha length=$($b64.Length)"

      - name: SaveKernel auto-run on seven Kaggle accounts
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $accounts=@(
            @{id='master';owner='azadka'},
            @{id='kg-02';owner='radlinaradlina'},
            @{id='kg-03';owner='rezanory'},
            @{id='kg-04';owner='reyhanehazad'},
            @{id='kg-05';owner='trickermark'},
            @{id='kg-06';owner='msdenis'},
            @{id='kg-07';owner='nisabulutmark'}
          )
          $template=[IO.File]::ReadAllText($env:CGP_NOTEBOOK_PATH,[Text.Encoding]::UTF8)
          $results=@()
          foreach($a in $accounts){
            $id=[string]$a.id
            $owner=[string]$a.owner
            $kernelSlug='pneumonia-master-m07-gate-224-ready-v4-20260828-v1'
            $kernelRef="$owner/$kernelSlug"
            try {
              if(-not $env:ACTIONS_ID_TOKEN_REQUEST_URL -or -not $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN){throw 'OIDC request context unavailable'}
              $sep=if($env:ACTIONS_ID_TOKEN_REQUEST_URL.Contains('?')){'&'}else{'?'}
              $oidcUri="$($env:ACTIONS_ID_TOKEN_REQUEST_URL)$($sep)audience=cgp-control-plane-v3-action"
              $oidc=Invoke-RestMethod -Uri $oidcUri -Headers @{Authorization="Bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN"} -TimeoutSec 30
              $token=[string]$oidc.value
              if($token.Length -lt 100){throw 'OIDC token unavailable'}
              Write-Host "::add-mask::$token"
              $nb=$template.Replace('__ACCOUNT_OWNER__',$owner)
              if($nb -like '*__ACCOUNT_OWNER__*'){throw 'owner substitution incomplete'}
              $obj=@{
                request_id="pneumonia-master-m07-ready-v4-$id-20260828-v1"
                provider='kaggle'
                operation_class='compute'
                account_id=$id
                purpose='Execute verified READY M07@224 gate only. Kaggle SaveKernel auto-runs the saved version. Phase-2 remains locked.'
                service='kernels.KernelsApiService'
                method='SaveKernel'
                body=@{
                  slug=$kernelRef
                  newTitle="Pneumonia Master M07 Gate 224 READY v4 - $owner"
                  text=$nb
                  language='PYTHON'
                  kernelType='NOTEBOOK'
                  isPrivate=$true
                  enableGpu=$true
                  enableInternet=$true
                  datasetDataSources=@('paultimothymooney/chest-xray-pneumonia')
                }
              }
              $json=$obj | ConvertTo-Json -Depth 40 -Compress
              $r=Invoke-RestMethod -Uri 'https://chatgpt-kaggle-gateway.rezanory-chatgpt-plugins.workers.dev/control-plane/v3/action/kaggle' -Method Post -Headers @{Authorization="Bearer $token"} -ContentType 'application/json' -Body $json -TimeoutSec 240
              if(-not $r.ok){throw 'Control Plane returned ok=false'}
              $providerRef=if($r.provider_ref){[string]$r.provider_ref}elseif($r.result -and $r.result.ref){[string]$r.result.ref}else{$kernelRef}
              $results += [pscustomobject]@{account_id=$id;owner=$owner;ok=$true;kernel_ref=$kernelRef;provider_ref=$providerRef}
              Write-Host "SAVEKERNEL_AUTORUN_SUBMITTED $id $kernelRef provider_ref=$providerRef"
            } catch {
              $msg=[string]$_.Exception.Message
              if($msg.Length -gt 1200){$msg=$msg.Substring(0,1200)}
              $results += [pscustomobject]@{account_id=$id;owner=$owner;ok=$false;kernel_ref=$kernelRef;error=$msg}
              Write-Warning "SAVEKERNEL_AUTORUN_FAILED $id $owner :: $msg"
            }
          }
          $out=Join-Path $env:RUNNER_TEMP 'm07-ready-v4-submit.json'
          [IO.File]::WriteAllText($out,($results | ConvertTo-Json -Depth 20),[Text.UTF8Encoding]::new($false))
          $ok=@($results | Where-Object {$_.ok}).Count
          $fail=@($results | Where-Object {-not $_.ok}).Count
          "CGP_RESULTS_PATH=$out" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CGP_OK_COUNT=$ok" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CGP_FAIL_COUNT=$fail" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "READY_V4_SUBMISSION_SUMMARY submitted=$ok failed=$fail"

      - name: Publish launch receipt
        if: always()
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $state=if($env:CGP_FAIL_COUNT -eq '0' -and $env:CGP_OK_COUNT -eq '7'){'ALL_SUBMITTED'}else{'PARTIAL_OR_FAILED'}
          $rows=@()
          if($env:CGP_RESULTS_PATH -and (Test-Path $env:CGP_RESULTS_PATH)){
            $r=Get-Content -Raw $env:CGP_RESULTS_PATH | ConvertFrom-Json
            foreach($x in @($r)){
              $s=if($x.ok){'SAVEKERNEL_AUTORUN_SUBMITTED'}else{'FAILED'}
              $d=if($x.ok){[string]$x.provider_ref}else{([string]$x.error).Replace('|','/')}
              $rows += "| $($x.account_id) | $($x.owner) | $s | $($x.kernel_ref) | $d |"
            }
          }
          $table=($rows -join "`n")
          $msg=@"
          ## PNEUMONIA M07 READY V4 $state
          - Run: ``$env:GITHUB_RUN_ID``
          - Runner: ``$env:RUNNER_NAME``
          - Notebook SHA256: ``$env:CGP_NOTEBOOK_SHA``
          - SaveKernel auto-run: ``true``
          - ``UNLOCK_REMAINING_MODELS``: ``False``
          - Private split notebook dependency: ``removed``
          - Successful submissions: ``$env:CGP_OK_COUNT/7``
          - Failed submissions: ``$env:CGP_FAIL_COUNT/7``
          - RUNNING will only be reported after Kaggle session telemetry confirms it.

          | Account | Owner | State | Kernel | Detail |
          |---|---|---|---|---|
          $table
          "@
          $h=@{Authorization="Bearer $env:GITHUB_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/issues/33/comments" -Method Post -Headers $h -ContentType 'application/json' -Body (@{body=$msg}|ConvertTo-Json -Compress) | Out-Null

      - name: Fail closed unless all seven submitted
        if: always()
        shell: powershell
        run: |
          if($env:CGP_FAIL_COUNT -ne '0' -or $env:CGP_OK_COUNT -ne '7'){
            throw "READY v4 submission incomplete: submitted=$env:CGP_OK_COUNT failed=$env:CGP_FAIL_COUNT"
          }
          Write-Host 'Seven of seven SaveKernel auto-run requests submitted. Phase-2 locked.'
