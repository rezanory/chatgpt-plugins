name: control-plane-v3-action

on:
  issue_comment:
    types: [created]

permissions:
  id-token: write
  contents: read
  issues: write

concurrency:
  group: pneumonia-m07-uploaded-zip-seven
  cancel-in-progress: false

jobs:
  launch-uploaded-zip:
    if: ${{ github.event.issue.number == 33 && github.event.comment.user.id == 62356000 && github.event.comment.body == 'PNEUMONIA_MASTER_M07_RUN_UPLOADED_ZIP_V1' }}
    runs-on: [self-hosted, windows, x64, v622]
    timeout-minutes: 45
    steps:
      - name: Checkout exact uploaded-package payload
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Reconstruct and validate operational-safe notebook
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $names=@(
            'docs/pneumonia-v6-2-2-m07-exact-part-00.b64',
            'docs/pneumonia-v6-2-2-m07-exact-part-01.b64',
            'docs/pneumonia-v6-2-2-m07-exact-part-02.b64',
            'docs/pneumonia-v6-2-2-m07-exact-part-03.b64',
            'docs/pneumonia-v6-2-2-m07-exact-part-04.b64',
            'docs/pneumonia-v6-2-2-m07-exact-part-05.b64',
            'docs/pneumonia-v6-2-2-m07-exact-part-06.b64',
            'docs/pneumonia-v6-2-2-m07-exact-part-07.b64'
          )
          $b64=''
          foreach($name in $names){if(-not(Test-Path $name)){throw "missing $name"};$b64+=([IO.File]::ReadAllText($name)).Trim()}
          if($b64.Length -ne 93120){throw "base64 length mismatch $($b64.Length)"}
          $input=[IO.MemoryStream]::new([Convert]::FromBase64String($b64))
          $zip=[IO.Compression.GZipStream]::new($input,[IO.Compression.CompressionMode]::Decompress)
          $out=Join-Path $env:RUNNER_TEMP 'M07_UPLOADED_ZIP_OPERATIONAL_SAFE.ipynb'
          $output=[IO.File]::Create($out)
          try{$zip.CopyTo($output)}finally{$output.Dispose();$zip.Dispose();$input.Dispose()}
          $sha=(Get-FileHash $out -Algorithm SHA256).Hash.ToLower()
          if($sha -ne '234b87dec5ad3bbc564956025496411f272ed94b7efdb4719f56a1f762bdcc3c'){throw "operational sha mismatch $sha"}
          $nb=[IO.File]::ReadAllText($out,[Text.Encoding]::UTF8)
          if($nb -notlike '*UNLOCK_REMAINING_MODELS = False*'){throw 'M07 gate not locked'}
          if($nb -like '*UNLOCK_REMAINING_MODELS = True*'){throw 'Phase2 unlock found'}
          if($nb -notlike '*896491de87f9dc2a1d7d63548b7c5c22206da11f27a37efece8efc8e1557c8a9*'){throw 'split fingerprint missing'}
          if($nb -notlike '*__ACCOUNT_OWNER__*'){throw 'owner placeholder missing'}
          "CGP_NOTEBOOK_PATH=$out"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CGP_NOTEBOOK_SHA=$sha"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Request trusted action OIDC
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if(-not $env:ACTIONS_ID_TOKEN_REQUEST_URL -or -not $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN){throw 'OIDC context unavailable'}
          $sep=if($env:ACTIONS_ID_TOKEN_REQUEST_URL.Contains('?')){'&'}else{'?'}
          $r=Invoke-RestMethod -Uri "$($env:ACTIONS_ID_TOKEN_REQUEST_URL)$($sep)audience=cgp-control-plane-v3-action" -Headers @{Authorization="Bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN"} -TimeoutSec 30
          $token=[string]$r.value
          if($token.Length -lt 100){throw 'OIDC unavailable'}
          Write-Host "::add-mask::$token"
          [IO.File]::AppendAllText($env:GITHUB_ENV,"CGP_ACTION_OIDC_TOKEN=$token`n",[Text.UTF8Encoding]::new($false))

      - name: SAVE_AND_RUN_ALL uploaded M07 on seven accounts
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $python=(Get-Command python.exe -ErrorAction SilentlyContinue).Source
          if(-not $python){$python=(Get-Command python -ErrorAction Stop).Source}
          $script=@'
          import concurrent.futures,json,os,pathlib,urllib.request,urllib.error
          endpoint='https://chatgpt-kaggle-gateway.rezanory-chatgpt-plugins.workers.dev/control-plane/v3/action/kaggle'
          oidc=os.environ['CGP_ACTION_OIDC_TOKEN'].strip()
          template=pathlib.Path(os.environ['CGP_NOTEBOOK_PATH']).read_text(encoding='utf-8')
          accounts=[('master','azadka'),('kg-02','radlinaradlina'),('kg-03','rezanory'),('kg-04','reyhanehazad'),('kg-05','trickermark'),('kg-06','msdenis'),('kg-07','nisabulutmark')]
          def call(payload):
              req=urllib.request.Request(endpoint,data=json.dumps(payload,separators=(',',':')).encode(),method='POST',headers={'Authorization':'Bearer '+oidc,'Content-Type':'application/json','Accept':'application/json','User-Agent':'m07-uploaded-zip-run/2.0'})
              try:
                  with urllib.request.urlopen(req,timeout=240) as r:
                      raw=r.read().decode('utf-8','replace');return json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  raw=e.read(5000).decode('utf-8','replace');raise RuntimeError(f'HTTP {e.code}: {raw[:1800]}')
          def submit(item):
              aid,owner=item
              kernel_slug='m07-gate-224-zip-v2-20260829'
              kernel_ref=f'{owner}/{kernel_slug}'
              row={'account_id':aid,'owner':owner,'kernel_ref':kernel_ref}
              nb=template.replace('__ACCOUNT_OWNER__',owner)
              payload={
                  'request_id':f'm07-uploaded-zip-{aid}-20260829-v2',
                  'provider':'kaggle','operation_class':'compute','account_id':aid,
                  'purpose':'Execute the user-uploaded M07@224 gate package now. Explicit SAVE_AND_RUN_ALL. Master azadka. Stop after M07. Phase2 remains locked.',
                  'service':'kernels.KernelsApiService','method':'SaveKernel',
                  'body':{
                      'slug':kernel_ref,
                      'newTitle':f'M07 Gate 224 ZIP V2 20260829 - {owner}',
                      'text':nb,
                      'language':'PYTHON','kernelType':'NOTEBOOK',
                      'kernelExecutionType':'SAVE_AND_RUN_ALL',
                      'isPrivate':True,'enableGpu':True,'enableInternet':True,
                      'datasetDataSources':['paultimothymooney/chest-xray-pneumonia'],
                      'kernelDataSources':['reyhanehazad/notebook906d9e6ec9']
                  }
              }
              try:
                  r=call(payload)
                  if not r.get('ok'):raise RuntimeError('broker ok=false')
                  row.update(ok=True,provider_ref=r.get('provider_ref') or (r.get('result') or {}).get('ref'),raw=json.dumps(r,ensure_ascii=False,separators=(',',':'))[:1800])
              except Exception as e:
                  row.update(ok=False,error=f'{type(e).__name__}: {e}'[:1800])
              return row
          with concurrent.futures.ThreadPoolExecutor(max_workers=7) as ex:
              results=list(ex.map(submit,accounts))
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'m07-uploaded-zip-results.json'
          out.write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')
          ok=sum(1 for r in results if r.get('ok'));master=next(r for r in results if r['account_id']=='master')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
              f.write(f'CGP_RESULTS_PATH={out}\nCGP_OK_COUNT={ok}\nCGP_FAIL_COUNT={7-ok}\nCGP_MASTER_OK={1 if master.get("ok") else 0}\n')
          print(json.dumps({'save_and_run_all_accepted':ok,'failed':7-ok,'master':bool(master.get('ok')),'parallel':True}))
          '@
          $script|&$python -
          if($LASTEXITCODE-ne 0){throw 'submission script failed'}

      - name: Publish truthful execution receipt
        if: always()
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $rows=@()
          if($env:CGP_RESULTS_PATH-and(Test-Path $env:CGP_RESULTS_PATH)){
            $r=Get-Content -Raw $env:CGP_RESULTS_PATH|ConvertFrom-Json
            foreach($x in @($r)){
              $state=if($x.ok){'SAVE_AND_RUN_ALL_ACCEPTED'}else{'FAILED'}
              $detail=if($x.ok){[string]$x.provider_ref}else{([string]$x.error).Replace('|','/')}
              if($detail.Length -gt 900){$detail=$detail.Substring(0,900)}
              $rows+="| $($x.account_id) | $($x.owner) | $state | $($x.kernel_ref) | $detail |"
            }
          }
          $state=if($env:CGP_OK_COUNT-eq'7'-and$env:CGP_MASTER_OK-eq'1'){'ALL_7_SAVE_AND_RUN_ACCEPTED'}else{'PARTIAL_OR_FAILED'}
          $msg="## PNEUMONIA M07 UPLOADED ZIP $state`n- Run: ``$env:GITHUB_RUN_ID```n- Master/controller: ``azadka```n- Uploaded source SHA256: ``8bb444a03d26014a7e87cf5582302c7d1987bdefea98d7b47444ce03d03e04c0```n- Operational-safe SHA256: ``$env:CGP_NOTEBOOK_SHA```n- Execution type: ``SAVE_AND_RUN_ALL```n- M07@224 only: ``true```n- UNLOCK_REMAINING_MODELS: ``False```n- Phase-2: ``disabled```n- Parallel: ``7 accounts```n- Accepted: ``$env:CGP_OK_COUNT/7```n- Failed: ``$env:CGP_FAIL_COUNT/7```n- Important: accepted means execution request accepted; RUNNING is confirmed separately from Kaggle telemetry.`n`n| Account | Owner | State | Kernel | Detail |`n|---|---|---|---|---|`n$($rows-join"`n")"
          $h=@{Authorization="Bearer $env:GITHUB_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/issues/33/comments" -Method Post -Headers $h -ContentType 'application/json' -Body (@{body=$msg}|ConvertTo-Json -Compress)|Out-Null

      - name: Fail closed unless all seven Save and Run requests accepted
        if: always()
        shell: powershell
        run: |
          if($env:CGP_OK_COUNT-ne'7'-or$env:CGP_FAIL_COUNT-ne'0'-or$env:CGP_MASTER_OK-ne'1'){throw "M07 execution incomplete accepted=$env:CGP_OK_COUNT failed=$env:CGP_FAIL_COUNT master=$env:CGP_MASTER_OK"}
          Write-Host 'All seven explicit SAVE_AND_RUN_ALL requests accepted; Phase2 locked.'
