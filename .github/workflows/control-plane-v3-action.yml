name: control-plane-v3-action

on:
  issue_comment:
    types: [created]

permissions:
  id-token: write
  issues: write
  contents: read

jobs:
  action:
    if: >-
      ${{ github.event.issue.number == 33 &&
          github.event.comment.user.id == 62356000 &&
          startsWith(github.event.comment.body, 'CONTROL_PLANE_V3_ACTION ') }}
    runs-on: [self-hosted, windows, x64, online-visit]
    environment: cloudflare-production
    timeout-minutes: 10
    concurrency:
      group: control-plane-v3-action-${{ github.event.comment.id }}
      cancel-in-progress: false
    steps:
      - name: Parse bounded action payload
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $event=Get-Content -Raw $env:GITHUB_EVENT_PATH | ConvertFrom-Json
          if([string]$event.repository.id -ne '1337215097'){throw 'repository id mismatch'}
          if([string]$event.comment.user.id -ne '62356000'){throw 'actor id mismatch'}
          $comment=[string]$event.comment.body
          $prefix='CONTROL_PLANE_V3_ACTION '
          if(-not $comment.StartsWith($prefix)){throw 'action prefix mismatch'}
          $raw=$comment.Substring($prefix.Length).Trim()
          if($raw.Length -lt 2 -or $raw.Length -gt 30000){throw 'action payload length invalid'}
          $obj=$raw | ConvertFrom-Json
          $requestId=[string]$obj.request_id
          $provider=[string]$obj.provider
          $op=[string]$obj.operation_class
          if($requestId -notmatch '^[A-Za-z0-9._:-]{3,120}$'){throw 'invalid request_id'}
          if($provider -ne 'kaggle'){throw 'temporary repair action supports kaggle only'}
          if($op -ne 'compute'){throw 'temporary repair action supports compute only'}
          $payload=Join-Path $env:RUNNER_TEMP 'control-plane-v3-action.json'
          [IO.File]::WriteAllText($payload,$raw,[Text.UTF8Encoding]::new($false))
          "CGP_ACTION_PAYLOAD=$payload" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CGP_ACTION_REQUEST_ID=$requestId" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CGP_ACTION_PROVIDER=$provider" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CGP_ACTION_CLASS=$op" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Publish action start marker
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $h=@{Authorization="Bearer $env:GITHUB_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          $body="M07 REPAIR2 ACTION START | run=$env:GITHUB_RUN_ID | account=kg-02 | target=radlinaradlina | cpu_only=true | scientific_rerun=false"
          $p=@{body=$body}|ConvertTo-Json -Compress
          Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/issues/33/comments" -Method Post -Headers $h -ContentType 'application/json' -Body $p | Out-Null

      - name: Request GitHub OIDC action identity
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if(-not $env:ACTIONS_ID_TOKEN_REQUEST_URL -or -not $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN){throw 'GitHub OIDC request context unavailable'}
          $sep=if($env:ACTIONS_ID_TOKEN_REQUEST_URL.Contains('?')){'&'}else{'?'}
          $uri="$($env:ACTIONS_ID_TOKEN_REQUEST_URL)$($sep)audience=cgp-control-plane-v3-action"
          $h=@{Authorization="Bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN"}
          $r=Invoke-RestMethod -Uri $uri -Headers $h -TimeoutSec 30
          $token=[string]$r.value
          if($token.Length -lt 100){throw 'GitHub OIDC token unavailable'}
          Write-Host "::add-mask::$token"
          [IO.File]::AppendAllText($env:GITHUB_ENV,"CGP_ACTION_OIDC_TOKEN=$token`n",[Text.UTF8Encoding]::new($false))

      - name: Execute Repair2 provider action
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $body=Get-Content -Raw $env:CGP_ACTION_PAYLOAD
          $headers=@{Authorization="Bearer $env:CGP_ACTION_OIDC_TOKEN"}
          $out=Join-Path $env:RUNNER_TEMP 'control-plane-v3-action-result.json'
          try {
            $response=Invoke-RestMethod -Uri 'https://chatgpt-kaggle-gateway.rezanory-chatgpt-plugins.workers.dev/control-plane/v3/action/kaggle' -Method Post -Headers $headers -ContentType 'application/json' -Body $body -TimeoutSec 180
            $response | ConvertTo-Json -Depth 50 | Set-Content -Encoding utf8 $out
            $code=0
          } catch {
            @{ok=$false;error=$_.Exception.Message} | ConvertTo-Json -Compress | Set-Content -Encoding utf8 $out
            $code=2
          }
          "CGP_ACTION_RESULT=$out" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CGP_ACTION_EXIT=$code" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          exit 0

      - name: Publish Repair2 action receipt
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $raw=Get-Content -Raw $env:CGP_ACTION_RESULT
          if($raw.Length -gt 50000){$raw=$raw.Substring(0,50000)+"`n<truncated>"}
          $status=if($env:CGP_ACTION_EXIT -eq '0'){'PASS'}else{'DIAGNOSTIC'}
          $body="## M07 REPAIR2 ACTION $status`n`n- Run: ``$env:GITHUB_RUN_ID```n- Account: ``kg-02 / radlinaradlina```n- CPU only: ``true```n- Scientific rerun: ``false```n- Locked Test rerun: ``false```n`n``````json`n$raw`n``````"
          $h=@{Authorization="Bearer $env:GITHUB_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          $p=@{body=$body}|ConvertTo-Json -Compress
          Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/issues/33/comments" -Method Post -Headers $h -ContentType 'application/json' -Body $p | Out-Null
          if($env:CGP_ACTION_EXIT -ne '0'){throw 'Repair2 provider action returned diagnostic'}
