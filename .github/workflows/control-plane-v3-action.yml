name: control-plane-v3-action

on:
  issue_comment:
    types: [created]

permissions:
  id-token: write
  contents: read
  issues: write

jobs:
  status:
    if: ${{ github.event.issue.number == 33 && github.event.comment.user.id == 62356000 && github.event.comment.body == 'PNEUMONIA_MASTER_M07_GATE_STATUS_ACTION_V1' }}
    runs-on: [self-hosted, windows, x64, v622]
    timeout-minutes: 20
    steps:
      - name: Request trusted action OIDC
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if(-not $env:ACTIONS_ID_TOKEN_REQUEST_URL -or -not $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN){throw 'OIDC context unavailable'}
          $sep=if($env:ACTIONS_ID_TOKEN_REQUEST_URL.Contains('?')){'&'}else{'?'}
          $r=Invoke-RestMethod -Uri "$($env:ACTIONS_ID_TOKEN_REQUEST_URL)$($sep)audience=cgp-control-plane-v3-action" -Headers @{Authorization="Bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN"} -TimeoutSec 30
          $token=[string]$r.value
          if($token.Length -lt 100){throw 'OIDC unavailable'}
          Write-Host "::add-mask::$token"
          [IO.File]::AppendAllText($env:GITHUB_ENV,"CGP_ACTION_OIDC_TOKEN=$token`n",[Text.UTF8Encoding]::new($false))

      - name: Probe seven existing M07 sessions in parallel
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $python=(Get-Command python.exe -ErrorAction SilentlyContinue).Source
          if(-not $python){$python=(Get-Command python -ErrorAction Stop).Source}
          $script=@'
          import concurrent.futures, json, os, pathlib, re, urllib.error, urllib.request

          ENDPOINT='https://chatgpt-kaggle-gateway.rezanory-chatgpt-plugins.workers.dev/control-plane/v3/action/kaggle'
          OIDC=os.environ['CGP_ACTION_OIDC_TOKEN'].strip()
          ACCOUNTS=[('master','azadka'),('kg-02','radlinaradlina'),('kg-03','rezanory'),('kg-04','reyhanehazad'),('kg-05','trickermark'),('kg-06','msdenis'),('kg-07','nisabulutmark')]

          def broker(payload):
              req=urllib.request.Request(ENDPOINT,data=json.dumps(payload,separators=(',',':')).encode(),method='POST',headers={
                  'Authorization':'Bearer '+OIDC,
                  'Content-Type':'application/json',
                  'Accept':'application/json',
                  'User-Agent':'m07-session-probe/1.0',
              })
              try:
                  with urllib.request.urlopen(req,timeout=90) as r:
                      raw=r.read().decode('utf-8','replace')
                      return json.loads(raw) if raw else {}
              except urllib.error.HTTPError as exc:
                  raw=exc.read(5000).decode('utf-8','replace')
                  raise RuntimeError(f'HTTP {exc.code}: {raw[:1400]}') from exc

          def classify(value):
              text=json.dumps(value,ensure_ascii=False,separators=(',',':'))
              upper=text.upper()
              for state in ('RUNNING','QUEUED','COMPLETE','COMPLETED','ERROR','FAILED','CANCELLED','CANCELED'):
                  if state in upper:
                      return state
              return 'UNCLASSIFIED'

          def probe(item):
              aid,owner=item
              slug='m07-gate-224-pkg-v1'
              payload={
                  'request_id':f'm07-status-{aid}-20260828-v1',
                  'provider':'kaggle',
                  'operation_class':'privileged',
                  'account_id':aid,
                  'purpose':'Read-only status probe of the already-submitted M07 gate. Do not launch, save, rerun, resume, or mutate any Kaggle kernel.',
                  'service':'kernels.KernelsApiService',
                  'method':'GetKernelSessionStatus',
                  'body':{'userName':owner,'kernelSlug':slug},
              }
              row={'account_id':aid,'owner':owner,'kernel_ref':f'{owner}/{slug}'}
              try:
                  response=broker(payload)
                  if not response.get('ok'):
                      raise RuntimeError('broker ok=false')
                  result=response.get('result') or {}
                  row.update(ok=True,state=classify(result),raw=json.dumps(result,ensure_ascii=False,separators=(',',':'))[:1000])
              except Exception as exc:
                  row.update(ok=False,state='PROBE_FAILED',error=f'{type(exc).__name__}: {exc}'[:1200])
              return row

          with concurrent.futures.ThreadPoolExecutor(max_workers=7) as ex:
              rows=list(ex.map(probe,ACCOUNTS))
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'m07-session-status.json'
          out.write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding='utf-8')
          good=sum(1 for r in rows if r.get('ok'))
          running=sum(1 for r in rows if r.get('state')=='RUNNING')
          queued=sum(1 for r in rows if r.get('state')=='QUEUED')
          complete=sum(1 for r in rows if r.get('state') in ('COMPLETE','COMPLETED'))
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
              f.write(f'CGP_STATUS_PATH={out}\nCGP_PROBE_OK={good}\nCGP_RUNNING={running}\nCGP_QUEUED={queued}\nCGP_COMPLETE={complete}\n')
          print(json.dumps({'probe_ok':good,'running':running,'queued':queued,'complete':complete,'read_only':True,'kaggle_compute_launched':False}))
          '@
          $script | & $python -
          if($LASTEXITCODE -ne 0){throw 'status probe script failed'}

      - name: Publish session telemetry receipt
        if: always()
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $rows=@()
          if($env:CGP_STATUS_PATH -and (Test-Path $env:CGP_STATUS_PATH)){
            $r=Get-Content -Raw $env:CGP_STATUS_PATH | ConvertFrom-Json
            foreach($x in @($r)){
              $detail=if($x.ok){[string]$x.raw}else{([string]$x.error).Replace('|','/')}
              if($detail.Length -gt 700){$detail=$detail.Substring(0,700)}
              $rows += "| $($x.account_id) | $($x.owner) | $($x.state) | $($x.kernel_ref) | $detail |"
            }
          }
          $msg="## PNEUMONIA M07 SESSION TELEMETRY`n- Run: ``$env:GITHUB_RUN_ID```n- Master/controller: ``azadka```n- Probe only: ``true```n- Kaggle compute launched by probe: ``false```n- Probe success: ``$env:CGP_PROBE_OK/7```n- RUNNING: ``$env:CGP_RUNNING```n- QUEUED: ``$env:CGP_QUEUED```n- COMPLETE: ``$env:CGP_COMPLETE```n- Phase-2 mutation: ``false```n`n| Account | Owner | Session state | Kernel | Raw bounded result |`n|---|---|---|---|---|`n$($rows-join"`n")"
          $h=@{Authorization="Bearer $env:GITHUB_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/issues/33/comments" -Method Post -Headers $h -ContentType 'application/json' -Body (@{body=$msg}|ConvertTo-Json -Compress) | Out-Null
