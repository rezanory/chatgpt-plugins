name: v622-kaggle-finalization-freeze-bridge-retired

# FINAL_FREEZE_MANIFEST on azadka already passed and is immutable.
# Manual no-op only; no duplicate final-freeze launch or Cloudflare mutation is allowed before lockbox.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: [self-hosted, windows, x64, v622]
    steps:
      - name: Confirm retired state
        shell: powershell
        run: |
          Write-Host 'Retired V6.2.2 final-freeze bridge: no Cloudflare mutation, Kaggle finalization launch, locked test, or external validation is performed.'
