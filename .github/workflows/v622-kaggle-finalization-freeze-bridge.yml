name: v622-kaggle-finalization-freeze-bridge

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v622-kaggle-finalization-freeze-bridge.yml'
      - 'deploy/cloudflare-worker-free/src/v622-finalization-freeze-worker.ts'

permissions:
  contents: read
  issues: write

concurrency:
  group: v622-cloudflare-production-mutation
  cancel-in-progress: false

jobs:
  bridge:
    # Bridge/orchestration only. All freeze computation runs in Kaggle master azadka.
    runs-on: [self-hosted, windows, x64, v622]
    timeout-minutes: 75
    environment: cloudflare-production
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy protected Kaggle finalization-freeze bridge
        shell: powershell
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          $ErrorActionPreference = 'Stop'
          $accountId = ([string]$env:RAW_CLOUDFLARE_ACCOUNT_ID).Trim()
          if ([string]::IsNullOrWhiteSpace($env:CLOUDFLARE_API_TOKEN) -or [string]::IsNullOrWhiteSpace($accountId)) { throw 'Cloudflare credentials missing' }
          Write-Host "::add-mask::$accountId"
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "V622_CF_ACCOUNT_ID=$accountId`n", [System.Text.UTF8Encoding]::new($false))
          $env:CLOUDFLARE_ACCOUNT_ID = $accountId
          Push-Location 'deploy/cloudflare-worker-free'
          try {
            npm install --no-audit --no-fund
            if ($LASTEXITCODE -ne 0) { throw 'npm install failed' }
            npm run check
            if ($LASTEXITCODE -ne 0) { throw 'Worker typecheck failed' }
            npx wrangler deploy src/v622-finalization-freeze-worker.ts --name chatgpt-kaggle-gateway
            if ($LASTEXITCODE -ne 0) { throw 'Finalization-freeze bridge deploy failed' }
          }
          finally { Pop-Location }

      - name: Create ephemeral finalization capability
        shell: powershell
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $bytes = New-Object byte[] 48
          $rng = [System.Security.Cryptography.RandomNumberGenerator]::Create()
          try { $rng.GetBytes($bytes) } finally { $rng.Dispose() }
          $token = [Convert]::ToBase64String($bytes).TrimEnd('=').Replace('+','-').Replace('/','_')
          Write-Host "::add-mask::$token"
          $env:CLOUDFLARE_ACCOUNT_ID = $env:V622_CF_ACCOUNT_ID
          Push-Location 'deploy/cloudflare-worker-free'
          try {
            $token | npx wrangler secret put CGP_PROJECT_CONTROL_TOKEN --name chatgpt-kaggle-gateway
            if ($LASTEXITCODE -ne 0) { throw 'Capability install failed' }
          }
          finally { Pop-Location }
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "V622_FINALIZATION_TOKEN=$token`n", [System.Text.UTF8Encoding]::new($false))

      - name: Launch Kaggle-native final freeze
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{ Authorization = "Bearer $env:V622_FINALIZATION_TOKEN"; 'Content-Type' = 'application/json' }
          $uri = 'https://chatgpt-kaggle-gateway.rezanory-chatgpt-plugins.workers.dev/control/v6-2-2/finalization-freeze/launch'
          $value = Invoke-RestMethod -Uri $uri -Method Post -Headers $headers -Body '{}' -TimeoutSec 180
          $value | ConvertTo-Json -Depth 50 | Write-Host
          if ($value.ok -eq $false) { throw "Kaggle finalization launch failed: $($value.error)" }
          if ([string]$value.target_kernel_ref -ne 'azadka/pneumonia-v6-2-2-finalization-master') { throw 'Unexpected finalization target' }
          Write-Host 'AZADKA_FINALIZATION_LAUNCH_ACCEPTED'

      - name: Monitor Kaggle final freeze to terminal status
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{ Authorization = "Bearer $env:V622_FINALIZATION_TOKEN"; 'Content-Type' = 'application/json' }
          $uri = 'https://chatgpt-kaggle-gateway.rezanory-chatgpt-plugins.workers.dev/control/v6-2-2/finalization-freeze/status'
          $terminal = $null
          for ($attempt = 1; $attempt -le 60; $attempt++) {
            $value = Invoke-RestMethod -Uri $uri -Method Post -Headers $headers -Body '{}' -TimeoutSec 180
            $status = ([string]$value.status).ToUpperInvariant()
            Write-Host "Kaggle finalization status attempt $attempt/60: $status"
            if ($status -eq 'COMPLETE') { $terminal = $value; break }
            if ($status -in @('ERROR','FAILED','CANCELLED','CANCELED','DEAD')) { throw "Kaggle finalization terminated with $status" }
            Start-Sleep -Seconds 30
          }
          if ($null -eq $terminal) { throw 'Kaggle finalization freeze did not reach COMPLETE inside monitor budget' }
          if ($null -eq $terminal.receipt) { throw 'Kaggle finalization COMPLETE without validated freeze receipt' }
          $receiptPath = Join-Path $env:RUNNER_TEMP 'v622-finalization-freeze-receipt.json'
          [System.IO.File]::WriteAllText($receiptPath, ($terminal.receipt | ConvertTo-Json -Depth 50), [System.Text.UTF8Encoding]::new($false))

      - name: Publish Kaggle-native FINAL_FREEZE receipt best-effort
        continue-on-error: true
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Continue'
          $receipt = Get-Content -Raw (Join-Path $env:RUNNER_TEMP 'v622-finalization-freeze-receipt.json') | ConvertFrom-Json
          $ids = @($receipt.selected_candidate_ids) -join ', '
          $body = "V6.2.2 FINAL_FREEZE_MANIFEST PASS | master=azadka | kernel=azadka/pneumonia-v6-2-2-finalization-master | dataset=trickermark/pneumonia-v6-2-2-finalization-artifacts | manifest_sha256=$($receipt.manifest_sha256) | selected=$ids | locked_test_used=false | external_data_used=false | next=$($receipt.next_permitted_stage) | run=$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $payload = @{ body = $body } | ConvertTo-Json -Compress
          $headers = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/issues/18/comments" -Method Post -Headers $headers -ContentType 'application/json' -Body $payload | Out-Null

      - name: Remove capability and restore canonical Worker
        if: always()
        shell: powershell
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          $ErrorActionPreference = 'Continue'
          if (-not [string]::IsNullOrWhiteSpace($env:V622_CF_ACCOUNT_ID)) {
            $env:CLOUDFLARE_ACCOUNT_ID = $env:V622_CF_ACCOUNT_ID
            Push-Location 'deploy/cloudflare-worker-free'
            try {
              for ($attempt = 1; $attempt -le 3; $attempt++) {
                'y' | npx wrangler secret delete CGP_PROJECT_CONTROL_TOKEN --name chatgpt-kaggle-gateway
                if ($LASTEXITCODE -eq 0) { break }
                Start-Sleep -Seconds 5
              }
              for ($attempt = 1; $attempt -le 3; $attempt++) {
                npx wrangler deploy
                if ($LASTEXITCODE -eq 0) { break }
                Start-Sleep -Seconds 5
              }
            }
            finally { Pop-Location }
          }

      - name: Publish bridge failure receipt best-effort
        if: failure()
        continue-on-error: true
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $body = "V6.2.2 Kaggle-native final-freeze FAILED_OR_TIMED_OUT | intended_master=azadka | model_compute_on_github=false | training_hpo_confirmation=false | locked_test=false | external_validation=false | run=$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $payload = @{ body = $body } | ConvertTo-Json -Compress
          $headers = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/issues/18/comments" -Method Post -Headers $headers -ContentType 'application/json' -Body $payload | Out-Null
