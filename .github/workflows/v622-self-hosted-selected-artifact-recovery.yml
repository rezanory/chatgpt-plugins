name: v622-self-hosted-selected-artifact-recovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v622-self-hosted-selected-artifact-recovery.yml'
      - 'deploy/cloudflare-worker-free/src/v622-selected-artifact-recovery-worker.ts'

permissions:
  contents: read
  issues: write

concurrency:
  group: v622-cloudflare-production-mutation
  cancel-in-progress: false

jobs:
  recover:
    runs-on: [self-hosted, windows, x64, v622]
    timeout-minutes: 180
    environment: cloudflare-production
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy protected selected artifact recovery bridge
        shell: powershell
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          $ErrorActionPreference = 'Stop'
          $accountId = ([string]$env:RAW_CLOUDFLARE_ACCOUNT_ID).Trim()
          if ([string]::IsNullOrWhiteSpace($env:CLOUDFLARE_API_TOKEN) -or [string]::IsNullOrWhiteSpace($accountId)) { throw 'Cloudflare credentials missing' }
          Write-Host "::add-mask::$accountId"
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "V622_CF_ACCOUNT_ID=$accountId`n", [System.Text.UTF8Encoding]::new($false))
          $env:CLOUDFLARE_ACCOUNT_ID = $accountId
          Push-Location 'deploy/cloudflare-worker-free'
          try {
            npm install --no-audit --no-fund
            if ($LASTEXITCODE -ne 0) { throw 'npm install failed' }
            npm run check
            if ($LASTEXITCODE -ne 0) { throw 'Worker typecheck failed' }
            npx wrangler deploy src/v622-selected-artifact-recovery-worker.ts --name chatgpt-kaggle-gateway
            if ($LASTEXITCODE -ne 0) { throw 'Selected artifact recovery bridge deploy failed' }
          }
          finally { Pop-Location }

      - name: Create ephemeral recovery capability
        shell: powershell
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $bytes = New-Object byte[] 48
          $rng = [System.Security.Cryptography.RandomNumberGenerator]::Create()
          try { $rng.GetBytes($bytes) } finally { $rng.Dispose() }
          $token = [Convert]::ToBase64String($bytes).TrimEnd('=').Replace('+','-').Replace('/','_')
          Write-Host "::add-mask::$token"
          $env:CLOUDFLARE_ACCOUNT_ID = $env:V622_CF_ACCOUNT_ID
          Push-Location 'deploy/cloudflare-worker-free'
          try {
            $token | npx wrangler secret put CGP_PROJECT_CONTROL_TOKEN
            if ($LASTEXITCODE -ne 0) { throw 'Capability install failed' }
          }
          finally { Pop-Location }
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "V622_RECOVERY_TOKEN=$token`n", [System.Text.UTF8Encoding]::new($false))

      - name: Recover exact six selected artifacts
        timeout-minutes: 150
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $uri = 'https://chatgpt-kaggle-gateway.rezanory-chatgpt-plugins.workers.dev/control/v6-2-2/selected-artifact-recovery'
          $headers = @{ Authorization = "Bearer $env:V622_RECOVERY_TOKEN"; 'Content-Type' = 'application/json' }

          function Get-SelectedRecoverySnapshot {
            $last = $null
            for ($attempt = 1; $attempt -le 12; $attempt++) {
              try {
                $candidate = Invoke-RestMethod -Uri $uri -Method Post -Headers $headers -Body '{}' -TimeoutSec 90
                if ($candidate.project -ne 'PNEUMONIA V6.2.2' -or
                    $candidate.stage -ne 'selected_backbone_checkpoint_config_recovery' -or
                    $candidate.status -ne 'COMPLETE' -or
                    $candidate.kernel_ref -ne 'trickermark/pneumonia-v6-2-2-backbone-m06-r224' -or
                    [int]$candidate.target_count -ne 6) {
                  throw 'stale selected recovery response'
                }
                if ($candidate.recipe_sha256 -ne '27cae8c59e06b609f9dfd02b526d807dc359b2bb14ae7bc5ee77c68c7553b08f') { throw 'Recipe hash mismatch' }
                if ($candidate.frozen_policy_sha256 -ne '7e23bbed9246d5588c67a46380b570e1c1a3e869062613b9dcdb298e2e822861') { throw 'Policy hash mismatch' }
                if ($candidate.locked_test_used -ne $false -or $candidate.external_data_used -ne $false) { throw 'Locked/external data unexpectedly used' }
                return $candidate
              }
              catch {
                $last = $_.Exception.Message
                if ($attempt -lt 12) { Start-Sleep -Seconds 5 }
              }
            }
            throw "Selected recovery bridge did not converge: $last"
          }

          $initial = Get-SelectedRecoverySnapshot
          $plan = @()
          $seen = @{}
          foreach ($target in @($initial.targets)) {
            $candidateId = [string]$target.candidate_id
            $role = [string]$target.role
            $basename = [string]$target.basename
            $sourceName = [string]$target.source_file_name
            if (@('M06__convnext_tiny','M06__densenet121','M06__resnet50v2') -notcontains $candidateId) { throw "Unexpected candidate: $candidateId" }
            if (@('config','checkpoint') -notcontains $role) { throw "Unexpected artifact role: $role" }
            if ($role -eq 'config' -and $basename -ne 'config.json') { throw 'Unexpected config basename' }
            if ($role -eq 'checkpoint' -and $basename -ne 'final_selected.keras') { throw 'Unexpected checkpoint basename' }
            $key = "$candidateId|$role"
            if ($seen.ContainsKey($key)) { throw "Duplicate selected artifact: $key" }
            $seen[$key] = $true
            $plan += [pscustomobject]@{
              candidate_id = $candidateId
              role = $role
              basename = $basename
              source_file_name = $sourceName
              expected_sha256 = if ($role -eq 'config') { [string]$target.expected_sha256 } else { $null }
            }
          }
          if ($plan.Count -ne 6 -or $seen.Count -ne 6) { throw 'Selected artifact recovery cardinality mismatch' }

          $root = Join-Path $env:RUNNER_TEMP 'v622-selected-backbone-checkpoints-configs'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $rows = @()

          foreach ($target in $plan) {
            $candidateId = [string]$target.candidate_id
            $role = [string]$target.role
            $basename = [string]$target.basename
            $sourceName = [string]$target.source_file_name
            $key = "$candidateId|$role"
            $dir = Join-Path $root $candidateId
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            $dest = Join-Path $dir $basename
            $downloaded = $false
            $downloadLast = $null

            for ($downloadAttempt = 1; $downloadAttempt -le 4; $downloadAttempt++) {
              try {
                # Kaggle output URLs can be time-limited. Refresh the exact six-link snapshot
                # immediately before every download instead of reusing links captured at step start.
                $fresh = Get-SelectedRecoverySnapshot
                $matches = @($fresh.targets | Where-Object {
                  [string]$_.candidate_id -eq $candidateId -and
                  [string]$_.role -eq $role -and
                  [string]$_.basename -eq $basename -and
                  [string]$_.source_file_name -eq $sourceName
                })
                if ($matches.Count -ne 1) { throw "Fresh recovery target must resolve exactly once for $key; found $($matches.Count)" }
                $downloadUrl = [string]$matches[0].url
                if ([string]::IsNullOrWhiteSpace($downloadUrl)) { throw "Fresh recovery URL missing for $key" }
                if (Test-Path $dest) { Remove-Item -Force $dest }
                Write-Host "Downloading $key (attempt $downloadAttempt/4) from freshly issued output URL"
                Invoke-WebRequest -Uri $downloadUrl -OutFile $dest -UseBasicParsing -TimeoutSec 3600
                if (-not (Test-Path $dest)) { throw "Download missing: $key" }
                $bytes = (Get-Item $dest).Length
                if ($bytes -le 0) { throw "Downloaded empty artifact: $key" }
                $downloaded = $true
                break
              }
              catch {
                $downloadLast = $_.Exception.Message
                if (Test-Path $dest) { Remove-Item -Force $dest -ErrorAction SilentlyContinue }
                if ($downloadAttempt -lt 4) { Start-Sleep -Seconds (5 * $downloadAttempt) }
              }
            }
            if (-not $downloaded) { throw "Selected artifact download failed after retries for ${key}: $downloadLast" }

            $sha = (Get-FileHash -Algorithm SHA256 -Path $dest).Hash.ToLowerInvariant()
            $bytes = (Get-Item $dest).Length
            if ($role -eq 'config') {
              $expected = ([string]$target.expected_sha256).ToLowerInvariant()
              if ($sha -ne $expected) { throw "Config SHA mismatch for $candidateId" }
            }
            $rows += [ordered]@{
              candidate_id = $candidateId
              role = $role
              source_file_name = $sourceName
              local_path = "$candidateId/$basename"
              bytes = [int64]$bytes
              sha256 = $sha
              expected_sha256 = if ($role -eq 'config') { [string]$target.expected_sha256 } else { $null }
            }
          }

          if ($rows.Count -ne 6) { throw 'Selected artifact recovery row count mismatch' }
          $manifest = [ordered]@{
            schema_version = 1
            project = 'PNEUMONIA V6.2.2'
            status = 'RECOVERED_SELECTED_ONLY'
            kernel_ref = 'trickermark/pneumonia-v6-2-2-backbone-m06-r224'
            recipe_sha256 = '27cae8c59e06b609f9dfd02b526d807dc359b2bb14ae7bc5ee77c68c7553b08f'
            frozen_policy_sha256 = '7e23bbed9246d5588c67a46380b570e1c1a3e869062613b9dcdb298e2e822861'
            selected_candidate_ids = @('M06__convnext_tiny','M06__densenet121','M06__resnet50v2')
            artifacts = $rows
            selected_artifact_count = 6
            kaggle_compute_launched = $false
            canonical_m01_m12_rerun = $false
            hpo_or_confirmation_repeated = $false
            locked_test_used = $false
            external_data_used = $false
          }
          $manifestPath = Join-Path $root 'SELECTED_ARTIFACT_MANIFEST.json'
          [System.IO.File]::WriteAllText($manifestPath, ($manifest | ConvertTo-Json -Depth 20), [System.Text.UTF8Encoding]::new($false))
          $manifestSha = (Get-FileHash -Algorithm SHA256 -Path $manifestPath).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP 'v622-selected-manifest-sha.txt'), $manifestSha, [System.Text.UTF8Encoding]::new($false))
          Write-Host "Recovered exactly six selected checkpoint/config artifacts; manifest_sha256=$manifestSha"

      - name: Upload private selected checkpoint/config bundle
        uses: actions/upload-artifact@v4
        with:
          name: v622-selected-backbone-checkpoints-configs
          path: ${{ runner.temp }}/v622-selected-backbone-checkpoints-configs
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish selected artifact recovery receipt
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'v622-selected-backbone-checkpoints-configs'
          $value = Get-Content -Raw (Join-Path $root 'SELECTED_ARTIFACT_MANIFEST.json') | ConvertFrom-Json
          $manifestSha = Get-Content -Raw (Join-Path $env:RUNNER_TEMP 'v622-selected-manifest-sha.txt')
          $checkpoints = @($value.artifacts | Where-Object { $_.role -eq 'checkpoint' })
          $cp = @($checkpoints | ForEach-Object { "$($_.candidate_id)=$($_.sha256)" }) -join ', '
          $body = "## V6.2.2 selected checkpoints/configs recovered`n`n- Kernel: ``$($value.kernel_ref)```n- Scope: exactly 3 ``config.json`` + 3 ``final_selected.keras`` for frozen ensemble members`n- Config hashes matched canonical run index: ``PASS`` `n- Selected artifact manifest SHA-256: ``$manifestSha```n- Checkpoint SHA-256: ``$cp```n- Private artifact: ``v622-selected-backbone-checkpoints-configs```n- Kaggle compute launched: ``false```n- Locked test used: ``false```n- External data used: ``false```n- GitHub-hosted compute used: ``false```n- GitHub run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID`n"
          $payload = @{ body = $body } | ConvertTo-Json
          $headers = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/issues/18/comments" -Method Post -Headers $headers -ContentType 'application/json' -Body $payload | Out-Null

      - name: Remove capability and restore canonical Worker
        if: always()
        shell: powershell
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          $ErrorActionPreference = 'Continue'
          if (-not [string]::IsNullOrWhiteSpace($env:V622_CF_ACCOUNT_ID)) {
            $env:CLOUDFLARE_ACCOUNT_ID = $env:V622_CF_ACCOUNT_ID
            Push-Location 'deploy/cloudflare-worker-free'
            try {
              '{"CGP_PROJECT_CONTROL_TOKEN":null}' | Set-Content -Encoding utf8 (Join-Path $env:RUNNER_TEMP 'v622-delete-control.json')
              npx wrangler secret bulk (Join-Path $env:RUNNER_TEMP 'v622-delete-control.json')
              npx wrangler deploy
            }
            finally { Pop-Location }
          }

      - name: Publish selected artifact recovery failure receipt
        if: failure()
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Continue'
          $body = "## V6.2.2 selected checkpoint/config recovery diagnostic receipt`n`n- Result: ``FAILED_OR_TIMED_OUT`` `n- Scope: selected 3 configs + 3 checkpoints recovery only`n- Kaggle compute launched: ``false```n- Canonical M01-M12 rerun: ``false```n- HPO/confirmation repeated: ``false```n- Locked test used: ``false```n- External data used: ``false```n- GitHub run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID`n- Action: inspect the failed recovery step; do not launch training/HPO/locked-test work.`n"
          try {
            $payload = @{ body = $body } | ConvertTo-Json
            $headers = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
            Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/issues/18/comments" -Method Post -Headers $headers -ContentType 'application/json' -Body $payload | Out-Null
          }
          catch {
            Write-Warning "Could not publish failure diagnostic receipt: $($_.Exception.Message)"
          }
