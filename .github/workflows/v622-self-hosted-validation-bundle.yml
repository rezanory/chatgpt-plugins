name: v622-self-hosted-validation-bundle

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: v622-cloudflare-production-mutation
  cancel-in-progress: false

jobs:
  collect:
    runs-on: [self-hosted, windows, x64, v622]
    environment: cloudflare-production
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve local Python
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @()
          $command = Get-Command python.exe -ErrorAction SilentlyContinue
          if ($command) { $candidates += $command.Source }
          if (-not [string]::IsNullOrWhiteSpace($env:RUNNER_TOOL_CACHE)) {
            $pythonRoot = Join-Path $env:RUNNER_TOOL_CACHE 'Python'
            if (Test-Path $pythonRoot) {
              $candidates += Get-ChildItem -Path $pythonRoot -Filter python.exe -Recurse -ErrorAction SilentlyContinue |
                Sort-Object FullName -Descending |
                Select-Object -ExpandProperty FullName
            }
          }
          $python = $candidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $python) { throw 'No runnable Python executable found on self-hosted runner.' }
          & $python --version
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "V622_PYTHON=$python`n", [System.Text.UTF8Encoding]::new($false))

      - name: Deploy protected validation artifact bridge
        shell: powershell
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          $ErrorActionPreference = 'Stop'
          $accountId = ([string]$env:RAW_CLOUDFLARE_ACCOUNT_ID).Trim()
          if ([string]::IsNullOrWhiteSpace($env:CLOUDFLARE_API_TOKEN) -or [string]::IsNullOrWhiteSpace($accountId)) {
            throw 'Cloudflare deployment credentials are not configured.'
          }
          Write-Host "::add-mask::$accountId"
          $env:CLOUDFLARE_ACCOUNT_ID = $accountId
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "V622_CF_ACCOUNT_ID=$accountId`n", [System.Text.UTF8Encoding]::new($false))
          Push-Location 'deploy/cloudflare-worker-free'
          try {
            npm install --no-audit --no-fund
            if ($LASTEXITCODE -ne 0) { throw 'npm install failed' }
            npm run check
            if ($LASTEXITCODE -ne 0) { throw 'Worker typecheck failed' }
            npx wrangler deploy src/v622-selection-artifact-worker.ts --name chatgpt-kaggle-gateway
            if ($LASTEXITCODE -ne 0) { throw 'Validation artifact bridge deploy failed' }
          }
          finally { Pop-Location }

      - name: Create ephemeral bundle capability
        shell: powershell
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $token = (& $env:V622_PYTHON -c "import secrets; print(secrets.token_urlsafe(48))").Trim()
          if ([string]::IsNullOrWhiteSpace($token)) { throw 'Could not generate validation bundle capability.' }
          Write-Host "::add-mask::$token"
          $env:CLOUDFLARE_ACCOUNT_ID = $env:V622_CF_ACCOUNT_ID
          Push-Location 'deploy/cloudflare-worker-free'
          try {
            $token | npx wrangler secret put CGP_PROJECT_CONTROL_TOKEN
            if ($LASTEXITCODE -ne 0) { throw 'Could not install bundle capability.' }
          }
          finally { Pop-Location }
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "V622_SELECTION_TOKEN=$token`n", [System.Text.UTF8Encoding]::new($false))

      - name: Collect canonical validation bundle
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:V622_PYTHON scripts/v622_collect_validation_bundle.py
          if ($LASTEXITCODE -ne 0) { throw 'Validation bundle collection failed.' }

      - name: Upload private validation bundle
        uses: actions/upload-artifact@v4
        with:
          name: v622-validation-bundle
          path: ${{ runner.temp }}/v622-validation-bundle
          if-no-files-found: error
          retention-days: 3
          compression-level: 6

      - name: Publish bundle receipt
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $body = "## V6.2.2 validation bundle ready`n`n- Run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID`n- Artifact: `v622-validation-bundle``n- Contents: W01..W36 `final_report.json`, `validation_metrics.json`, `val_predictions.csv` + recovered governance sources.`n- Locked official test/external cohorts: not accessed.`n- Training/HPO/confirmation: not repeated.`n"
          $payload = @{ body = $body } | ConvertTo-Json
          $headers = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/issues/18/comments" -Method Post -Headers $headers -ContentType 'application/json' -Body $payload | Out-Null

      - name: Remove capability and restore canonical Worker
        if: always()
        shell: powershell
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          $ErrorActionPreference = 'Continue'
          if (-not [string]::IsNullOrWhiteSpace($env:V622_CF_ACCOUNT_ID)) {
            $env:CLOUDFLARE_ACCOUNT_ID = $env:V622_CF_ACCOUNT_ID
            Push-Location 'deploy/cloudflare-worker-free'
            try {
              '{"CGP_PROJECT_CONTROL_TOKEN":null}' | Set-Content -Encoding utf8 "$env:RUNNER_TEMP\v622-delete-control.json"
              npx wrangler secret bulk "$env:RUNNER_TEMP\v622-delete-control.json"
              Remove-Item "$env:RUNNER_TEMP\v622-delete-control.json" -Force -ErrorAction SilentlyContinue
              npx wrangler deploy
              if ($LASTEXITCODE -ne 0) { Write-Error 'Canonical Worker restore deploy failed.' }
            }
            finally { Pop-Location }
          }

      - name: Remove local validation bundle
        if: always()
        shell: powershell
        run: |
          Remove-Item "$env:RUNNER_TEMP\v622-validation-bundle" -Recurse -Force -ErrorAction SilentlyContinue
