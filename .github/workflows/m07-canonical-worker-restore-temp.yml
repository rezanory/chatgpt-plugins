name: m07-canonical-worker-restore-temp

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  restore:
    if: >-
      ${{ github.event.issue.number == 33 &&
          github.event.comment.user.id == 62356000 &&
          github.event.comment.body == 'M07_CANONICAL_WORKER_RESTORE' }}
    runs-on: [self-hosted, windows, x64, v622]
    environment: cloudflare-production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/control-plane-v3
      - name: Deploy canonical configured worker
        shell: powershell
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          $ErrorActionPreference='Stop'
          Set-Location deploy/cloudflare-worker-free
          npm install --ignore-scripts --no-audit --no-fund
          npx --yes wrangler deploy --config wrangler.jsonc
      - name: Publish canonical restore receipt
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $h=@{Authorization="Bearer $env:GITHUB_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          $body="M07 CANONICAL WORKER RESTORED | run=$env:GITHUB_RUN_ID | main=src/v622-backbone-monitor-index.ts | temp_worker=false"
          $p=@{body=$body}|ConvertTo-Json -Compress
          Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/issues/33/comments" -Method Post -Headers $h -ContentType 'application/json' -Body $p | Out-Null
