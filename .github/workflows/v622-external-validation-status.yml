name: v622-external-validation-status

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  status:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.issue.number == 18 && github.event.comment.body == 'V622_EXTERNAL_STATUS') }}
    runs-on: [self-hosted, windows, x64, v622]
    timeout-minutes: 5
    steps:
      - name: Report latest real external-validation run and active runs
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $h=@{Authorization="Bearer $env:GITHUB_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          $runs=Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs?per_page=100" -Headers $h
          $r=@($runs.workflow_runs|Where-Object{$_.name-eq'v622-external-validation' -and ($_.status-in@('queued','in_progress','waiting','pending','requested') -or $_.conclusion-ne'skipped')}|Sort-Object created_at -Descending|Select-Object -First 1)
          $active=@($runs.workflow_runs|Where-Object{$_.status-in@('queued','in_progress','waiting','pending','requested')}|Sort-Object created_at)
          $activeText=if($active.Count-eq 0){'none'}else{($active|ForEach-Object{"$($_.id):$($_.name):$($_.status)"})-join ','}
          if(-not $r){$body="V6.2.2 EXTERNAL LIVE | no non-skipped run found | active=$activeText"}else{$run=$r[0];$jobs=Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs/$($run.id)/jobs?filter=latest&per_page=100" -Headers $h;$current='none';$launch='not_seen';foreach($j in @($jobs.jobs)){foreach($s in @($j.steps)){if($s.name-eq'Launch external validation once'){$launch="$($s.status)/$($s.conclusion)"};if($s.status-eq'in_progress'){$current="$($j.name) :: $($s.name)"}}};$conclusion=if([string]::IsNullOrWhiteSpace([string]$run.conclusion)){'none'}else{[string]$run.conclusion};$body="V6.2.2 EXTERNAL LIVE | run=$($run.id) | status=$($run.status) | conclusion=$conclusion | launch=$launch | current=$current | head=$($run.head_sha) | active=$activeText"}
          $p=@{body=$body}|ConvertTo-Json -Compress
          Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/issues/18/comments" -Method Post -Headers $h -ContentType 'application/json' -Body $p|Out-Null
