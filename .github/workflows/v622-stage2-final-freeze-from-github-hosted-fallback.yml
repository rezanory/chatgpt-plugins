name: v622-stage2-final-freeze-from-github-hosted-fallback

on:
  workflow_run:
    workflows:
      - v622-github-hosted-selected-artifact-recovery-fallback
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  freeze:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download ConvNeXt selected files
        uses: actions/download-artifact@v4
        with:
          name: v622-selected-M06-convnext-tiny
          path: ${{ runner.temp }}/v622-freeze-inputs/convnext
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Download DenseNet selected files
        uses: actions/download-artifact@v4
        with:
          name: v622-selected-M06-densenet121
          path: ${{ runner.temp }}/v622-freeze-inputs/densenet
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Download ResNet selected files
        uses: actions/download-artifact@v4
        with:
          name: v622-selected-M06-resnet50v2
          path: ${{ runner.temp }}/v622-freeze-inputs/resnet
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Download Stage 1 recovery manifest
        uses: actions/download-artifact@v4
        with:
          name: v622-selected-backbone-recovery-manifest
          path: ${{ runner.temp }}/v622-freeze-inputs/manifest
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Reconcile and create FINAL_FREEZE_MANIFEST
        shell: bash
        env:
          ROOT: ${{ runner.temp }}/v622-freeze-inputs
          STAGE1_RUN_ID: ${{ github.event.workflow_run.id }}
          STAGE1_RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          manifest_path=root/'manifest'/'SELECTED_ARTIFACT_MANIFEST.json'
          manifest_sha_path=root/'manifest'/'SELECTED_ARTIFACT_MANIFEST.sha256'
          def sha(p):
              h=hashlib.sha256()
              with p.open('rb') as f:
                  for c in iter(lambda:f.read(1024*1024),b''): h.update(c)
              return h.hexdigest()
          if not manifest_path.is_file() or not manifest_sha_path.is_file(): raise SystemExit('Stage 1 manifest payload incomplete')
          manifest_sha=sha(manifest_path)
          if manifest_sha != manifest_sha_path.read_text().strip().lower(): raise SystemExit('Stage 1 manifest SHA mismatch')
          s=json.loads(manifest_path.read_text())
          ids=['M06__convnext_tiny','M06__densenet121','M06__resnet50v2']
          expected_cfg={
            'M06__convnext_tiny':'167cb7b1d17b3978f2b4f47f55e315a1d4fae293006d897d25d13b5074dadcea',
            'M06__densenet121':'c9b3107715849a633d90689902298c110bbb7c9c1bc1c8a6ac9ff1693f55386e',
            'M06__resnet50v2':'dce7845aa7c07ccb913cded8e9ff368e7061f3a43723ded21f8a94dba9fab697'}
          dirs={'M06__convnext_tiny':root/'convnext','M06__densenet121':root/'densenet','M06__resnet50v2':root/'resnet'}
          assert s['project']=='PNEUMONIA V6.2.2'
          assert s['status']=='RECOVERED_SELECTED_ONLY'
          assert s['kernel_ref']=='trickermark/pneumonia-v6-2-2-backbone-m06-r224'
          assert s['recipe_sha256']=='27cae8c59e06b609f9dfd02b526d807dc359b2bb14ae7bc5ee77c68c7553b08f'
          assert s['frozen_policy_sha256']=='7e23bbed9246d5588c67a46380b570e1c1a3e869062613b9dcdb298e2e822861'
          assert s['selected_candidate_ids']==ids
          assert s['selected_artifact_count']==6
          assert s['locked_test_used'] is False and s['external_data_used'] is False
          rows=s['artifacts']; assert len(rows)==6
          by={(r['candidate_id'],r['role']):r for r in rows}; assert len(by)==6
          reconciled=[]
          for cid in ids:
              for role,base in [('config','config.json'),('checkpoint','final_selected.keras')]:
                  p=dirs[cid]/base
                  if not p.is_file() or p.stat().st_size<=0: raise SystemExit(f'missing {cid} {role}')
                  d=sha(p); source=by[(cid,role)]
                  if d != source['sha256'].lower(): raise SystemExit(f'SHA mismatch {cid} {role}')
                  if p.stat().st_size != int(source['bytes']): raise SystemExit(f'size mismatch {cid} {role}')
                  if role=='config' and d != expected_cfg[cid]: raise SystemExit(f'canonical config mismatch {cid}')
                  reconciled.append({'candidate_id':cid,'role':role,'basename':base,'bytes':p.stat().st_size,'sha256':d,'source_file_name':source.get('source_file_name')})
          final={
            'schema_version':1,'project':'PNEUMONIA V6.2.2','stage':'FINAL_FREEZE_MANIFEST','status':'FROZEN',
            'stage1_recovery_run_id':int(os.environ['STAGE1_RUN_ID']),'stage1_recovery_run_url':os.environ['STAGE1_RUN_URL'],
            'stage1_selected_artifact_manifest_sha256':manifest_sha,
            'source_kernel':'trickermark/pneumonia-v6-2-2-backbone-m06-r224',
            'recipe_sha256':'27cae8c59e06b609f9dfd02b526d807dc359b2bb14ae7bc5ee77c68c7553b08f',
            'frozen_policy_sha256':'7e23bbed9246d5588c67a46380b570e1c1a3e869062613b9dcdb298e2e822861',
            'selected_candidate_ids':ids,
            'ensemble_weights':{i:{'numerator':1,'denominator':3} for i in ids},
            'selection_evidence':{'oof_balanced_accuracy':0.9977578475,'oof_mcc':0.9913388287,'false_positives':0,'false_negatives':2},
            'artifacts':reconciled,'selected_artifact_count':6,'reconciliation':'PASS',
            'locked_test_used':False,'external_data_used':False,'new_kaggle_compute_launched':False,
            'canonical_m01_m12_rerun':False,'hpo_or_confirmation_repeated':False,
            'next_permitted_stage':'OFFICIAL_LOCKED_TEST'}
          outdir=root/'final-freeze'; outdir.mkdir(parents=True,exist_ok=True)
          out=outdir/'FINAL_FREEZE_MANIFEST.json'; out.write_text(json.dumps(final,indent=2,sort_keys=True)+'\n')
          d=sha(out); (outdir/'FINAL_FREEZE_MANIFEST.sha256').write_text(d+'\n')
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write('FINAL_FREEZE_MANIFEST_SHA256='+d+'\n')
          print('FINAL_FREEZE_MANIFEST_SHA256='+d)
          PY

      - name: Upload FINAL_FREEZE_MANIFEST
        uses: actions/upload-artifact@v4
        with:
          name: v622-final-freeze-manifest
          path: ${{ runner.temp }}/v622-freeze-inputs/final-freeze
          if-no-files-found: error
          retention-days: 90

      - name: Journal Stage 2 PASS
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          STAGE1_RUN_URL: ${{ github.event.workflow_run.html_url }}
          FREEZE_SHA: ${{ env.FINAL_FREEZE_MANIFEST_SHA256 }}
        run: |
          set -euo pipefail
          body="$(cat <<EOF
          ## V6.2.2 FINAL_FREEZE_MANIFEST

          - Stage 2 reconciliation: \`PASS\`
          - Stage 1 source run: ${STAGE1_RUN_URL}
          - Selected candidates: \`M06__convnext_tiny, M06__densenet121, M06__resnet50v2\`
          - Ensemble weights: \`1/3, 1/3, 1/3\`
          - Recipe SHA-256: \`27cae8c59e06b609f9dfd02b526d807dc359b2bb14ae7bc5ee77c68c7553b08f\`
          - Frozen policy SHA-256: \`7e23bbed9246d5588c67a46380b570e1c1a3e869062613b9dcdb298e2e822861\`
          - FINAL_FREEZE_MANIFEST SHA-256: \`${FREEZE_SHA}\`
          - Private artifact: \`v622-final-freeze-manifest\`
          - Locked test used: \`false\`
          - External data used: \`false\`
          - New Kaggle compute launched: \`false\`
          - Next permitted stage: \`OFFICIAL_LOCKED_TEST\`

          Stage 2 is frozen. This workflow does not launch the locked test.
          EOF
          )"
          jq -n --arg body "$body" '{body:$body}' | gh api --method POST "/repos/${REPO}/issues/18/comments" --input - >/dev/null
