name: v622-self-hosted-final-freeze-reconciliation-disabled-kaggle-native

# V6.2.2 architecture rule:
# GitHub is the control plane / bridge / journal only.
# Final freeze, ensemble inference, locked-test evaluation, and external validation
# must execute inside Kaggle. This workflow intentionally performs no computation.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    runs-on: [self-hosted, windows, x64, v622]
    timeout-minutes: 5
    steps:
      - name: Confirm Kaggle-native finalization policy
        shell: powershell
        run: |
          Write-Host 'V6.2.2 runner-side final-freeze computation is disabled.'
          Write-Host 'GitHub is bridge/journal only.'
          Write-Host 'Freeze, ensemble inference, locked test, and external validation belong in Kaggle master azadka.'
          Write-Host 'No checkpoint download, hashing, inference, locked-test, external-validation, or Kaggle submission occurs here.'
