name: v622-current-wave-progress

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/v622-control.json'
      - '.github/workflows/v622-wave2-progress.yml'
      - 'deploy/cloudflare-worker-free/src/matrix-run.ts'
      - 'deploy/cloudflare-worker-free/src/wave-status.ts'
      - 'deploy/cloudflare-worker-free/src/index.ts'

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve latest successfully launched canonical wave
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/18/comments" --paginate > /tmp/v622-comments.json
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          comments = json.loads(Path('/tmp/v622-comments.json').read_text(encoding='utf-8'))
          latest = None
          for comment in comments:
              body = str(comment.get('body') or '')
              if not body.startswith('## V6.2.2 strict control receipt'):
                  continue
              match = re.search(r'```json\s*(\{.*?\})\s*```', body, flags=re.S)
              if not match:
                  continue
              try:
                  receipt = json.loads(match.group(1))
              except Exception:
                  continue
              if receipt.get('action') != 'launch_wave':
                  continue
              if receipt.get('error') not in (None, ''):
                  continue
              results = receipt.get('results') or []
              if len(results) != 6:
                  continue
              try:
                  wave = int(receipt.get('wave'))
              except Exception:
                  continue
              if not 2 <= wave <= 6:
                  continue
              latest = (str(comment.get('created_at') or ''), wave, str(receipt.get('request_id') or ''))

          if latest is None:
              latest = ('', 1, 'recovered-wave1-baseline')

          _, wave, request_id = latest
          Path('/tmp/v622-current-wave.env').write_text(
              f'CURRENT_WAVE={wave}\nCURRENT_REQUEST_ID={request_id}\n',
              encoding='utf-8',
          )
          PY
          cat /tmp/v622-current-wave.env >> "$GITHUB_ENV"

      - name: Read canonical matrix with lightweight per-wave probes
        shell: bash
        run: |
          base='https://chatgpt-kaggle-gateway.rezanory-chatgpt-plugins.workers.dev/recovery/v6-2-2/wave-status'
          for wave in $(seq 1 6); do
            ok=0
            for attempt in $(seq 1 24); do
              code="$(curl --silent --show-error --max-time 120 \
                -o "/tmp/v622-wave-${wave}.json" -w '%{http_code}' \
                "${base}?wave=${wave}" || true)"
              if [ "$code" = '200' ] && WAVE="$wave" python - <<'PY'
          import json
          import os
          from pathlib import Path
          wave = int(os.environ['WAVE'])
          value = json.loads(Path(f'/tmp/v622-wave-{wave}.json').read_text(encoding='utf-8'))
          assert value.get('project') == 'PNEUMONIA V6.2.2'
          assert value.get('wave') == wave
          assert len(value.get('tasks') or []) == 6
          PY
              then
                ok=1
                break
              fi
              sleep 5
            done
            if [ "$ok" != '1' ]; then
              echo "Wave $wave lightweight status endpoint did not become ready." >&2
              cat "/tmp/v622-wave-${wave}.json" 2>/dev/null || true
              exit 1
            fi
          done

      - name: Publish pipelined matrix safe progress
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          current_wave = int(os.environ['CURRENT_WAVE'])
          request_id = os.environ.get('CURRENT_REQUEST_ID') or None
          waves = {}
          all_tasks = []
          for wave in range(1, 7):
              value = json.loads(Path(f'/tmp/v622-wave-{wave}.json').read_text(encoding='utf-8'))
              waves[wave] = value
              all_tasks.extend(value.get('tasks') or [])

          totals = {
              'expected_total': 36,
              'complete': sum(1 for row in all_tasks if row.get('lifecycle') == 'complete'),
              'in_progress': sum(1 for row in all_tasks if row.get('lifecycle') == 'in_progress'),
              'needs_repair': sum(1 for row in all_tasks if row.get('lifecycle') == 'needs_repair'),
              'missing': sum(1 for row in all_tasks if row.get('lifecycle') == 'missing'),
              'unknown': sum(1 for row in all_tasks if row.get('lifecycle') == 'unknown'),
          }
          totals['created'] = totals['complete'] + totals['in_progress'] + totals['needs_repair']
          totals['remaining_not_created'] = totals['missing']

          current = waves[current_wave]
          body = {
              'wave': current_wave,
              'worker_range': [f'W{1 + (current_wave - 1) * 6:02d}', f'W{current_wave * 6:02d}'],
              'launch_request_id': request_id,
              'scheduling_policy': 'per_account_predecessor_complete',
              'canonical_matrix_summary': totals,
              'wave_summaries': {
                  str(wave): waves[wave].get('counts') or {}
                  for wave in range(1, 7)
              },
              'counts': current.get('counts') or {},
              'jobs': current.get('tasks') or [],
          }
          Path('/tmp/v622-current-wave.md').write_text(
              f'## V6.2.2 Wave {current_wave} live Kaggle progress\n\n```json\n'
              + json.dumps(body, indent=2) + '\n```\n',
              encoding='utf-8',
          )
          PY
          gh issue comment 18 --repo "$GITHUB_REPOSITORY" --body-file /tmp/v622-current-wave.md
