name: v622-current-wave-progress

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/v622-control.json'
      - '.github/workflows/v622-wave2-progress.yml'
      - 'deploy/cloudflare-worker-free/src/wave-status.ts'
      - 'deploy/cloudflare-worker-free/src/index.ts'

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Read all six waves with lightweight status probes
        shell: bash
        run: |
          base='https://chatgpt-kaggle-gateway.rezanory-chatgpt-plugins.workers.dev/recovery/v6-2-2/wave-status'
          for wave in $(seq 1 6); do
            ok=0
            for attempt in $(seq 1 24); do
              code="$(curl --silent --show-error --max-time 120 \
                -o "/tmp/v622-wave-${wave}.json" -w '%{http_code}' \
                "${base}?wave=${wave}" || true)"
              if [ "$code" = '200' ] && python - "$wave" <<'PY'
          import json
          import sys
          from pathlib import Path
          wave = int(sys.argv[1])
          value = json.loads(Path(f'/tmp/v622-wave-{wave}.json').read_text(encoding='utf-8'))
          assert value.get('project') == 'PNEUMONIA V6.2.2'
          assert value.get('wave') == wave
          assert len(value.get('tasks') or []) == 6
          PY
              then
                ok=1
                break
              fi
              sleep 5
            done
            if [ "$ok" != '1' ]; then
              echo "Wave $wave status endpoint did not become ready." >&2
              cat "/tmp/v622-wave-${wave}.json" 2>/dev/null || true
              exit 1
            fi
          done

      - name: Publish current wave safe progress
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          waves = []
          for wave in range(1, 7):
              value = json.loads(Path(f'/tmp/v622-wave-{wave}.json').read_text(encoding='utf-8'))
              waves.append(value)

          current_wave = 1
          for value in waves:
              tasks = value.get('tasks') or []
              if any(row.get('status') != 'NOT_FOUND' for row in tasks):
                  current_wave = int(value['wave'])

          current = waves[current_wave - 1]
          totals = {
              'expected_total': 36,
              'complete': 0,
              'in_progress': 0,
              'needs_repair': 0,
              'missing': 0,
              'unknown': 0,
          }
          created = 0
          for value in waves:
              tasks = value.get('tasks') or []
              for row in tasks:
                  status = row.get('status')
                  lifecycle = row.get('lifecycle')
                  if status != 'NOT_FOUND':
                      created += 1
                  if lifecycle == 'complete':
                      totals['complete'] += 1
                  elif lifecycle == 'in_progress':
                      totals['in_progress'] += 1
                  elif lifecycle == 'needs_repair':
                      totals['needs_repair'] += 1
                  elif lifecycle == 'missing':
                      totals['missing'] += 1
                  else:
                      totals['unknown'] += 1
          totals['created'] = created
          totals['remaining_not_created'] = max(0, 36 - created)

          body = {
              'wave': current_wave,
              'worker_range': [f'W{1 + (current_wave - 1) * 6:02d}', f'W{current_wave * 6:02d}'],
              'canonical_matrix_summary': totals,
              'counts': current.get('counts'),
              'jobs': current.get('tasks'),
          }
          Path('/tmp/v622-current-wave.md').write_text(
              f'## V6.2.2 Wave {current_wave} live Kaggle progress\n\n```json\n'
              + json.dumps(body, indent=2) + '\n```\n',
              encoding='utf-8',
          )
          PY
          gh issue comment 18 --repo "$GITHUB_REPOSITORY" --body-file /tmp/v622-current-wave.md
