  launch-exact-runtime-from-artifact:
    name: Retired direct-credential M07 launcher
    needs: launch-m07-continuation
    if: ${{ false }}
    runs-on: [self-hosted, windows, x64, v622]
    timeout-minutes: 15
    environment: ${{ (github.event.inputs.recovery == 'M07_RUNTIME_M07_R320_A02' || github.event.inputs.recovery == 'M07_RUNTIME_M07_R320_A03') && 'kaggle-03' || 'kaggle-05' }}
    env:
      RETIRED_DIRECT_CREDENTIAL_REMOVED: 'true'
      EXPECTED_SHA256: ${{ github.event.inputs.recovery == 'M07_RUNTIME_M07_R320_A02' && '5f5d06cb073f4f96f4ae361a7c5d153ad94a254b0faa0ea38e1c0e985b5b75da' || github.event.inputs.recovery == 'M07_RUNTIME_M07_R320_A03' && '2c538a32e13e4a7af8c454b87490b30eea8d996e64abab37e32b092b914aca73' || github.event.inputs.recovery == 'M07_RUNTIME_M07_R320_A07' && 'FROM_ARTIFACT' || '5b33160907ce01624b00b4c3be89f3226fd4b6f61141cef7c149eb22c288a6c9' }}
      EXPECTED_OWNER: ${{ (github.event.inputs.recovery == 'M07_RUNTIME_M07_R320_A02' || github.event.inputs.recovery == 'M07_RUNTIME_M07_R320_A03') && 'rezanory' || 'trickermark' }}
      EXPECTED_ACCOUNT: ${{ (github.event.inputs.recovery == 'M07_RUNTIME_M07_R320_A02' || github.event.inputs.recovery == 'M07_RUNTIME_M07_R320_A03') && 'kg-03' || 'kg-05' }}
      EXPECTED_KERNEL_REF: ${{ github.event.inputs.recovery == 'M07_RUNTIME_M07_R320_A02' && 'rezanory/m07-runtime-r320-a02-20260915' || github.event.inputs.recovery == 'M07_RUNTIME_M07_R320_A03' && 'rezanory/m07-runtime-r320-a03-20260915' || github.event.inputs.recovery == 'M07_RUNTIME_M07_R320_A07' && 'FROM_ARTIFACT' || 'trickermark/m07-runtime-r384-a01-20260915' }}
      EXPECTED_RESOLUTION: ${{ (github.event.inputs.recovery == 'M07_RUNTIME_M07_R320_A02' || github.event.inputs.recovery == 'M07_RUNTIME_M07_R320_A03' || github.event.inputs.recovery == 'M07_RUNTIME_M07_R320_A07') && '320' || '384' }}
      EXPECTED_ATTEMPT: ${{ github.event.inputs.recovery == 'M07_RUNTIME_M07_R320_A02' && '2' || github.event.inputs.recovery == 'M07_RUNTIME_M07_R320_A03' && '3' || github.event.inputs.recovery == 'M07_RUNTIME_M07_R320_A07' && '7' || '1' }}
      EXPECTED_TITLE: ${{ github.event.inputs.recovery == 'M07_RUNTIME_M07_R320_A02' && 'M07 Runtime R320 A02 20260915' || github.event.inputs.recovery == 'M07_RUNTIME_M07_R320_A03' && 'M07 Runtime R320 A03 20260915' || github.event.inputs.recovery == 'M07_RUNTIME_M07_R320_A07' && 'FROM_ARTIFACT' || 'M07 Runtime R384 A01 20260915' }}
      EXPECTED_SOURCE_STATE_HANDLE: ${{ (github.event.inputs.recovery == 'M07_RUNTIME_M07_R320_A02' || github.event.inputs.recovery == 'M07_RUNTIME_M07_R320_A03') && 'rezanory/m07-gate-r320-state-v1-7/versions/4' || github.event.inputs.recovery == 'M07_RUNTIME_M07_R320_A07' && 'trickermark/m07-r320-producer-v4-bridge-e3884dd1/versions/1' || 'NONE' }}
      EXPECTED_MACHINE_SHAPE: NvidiaTeslaT4
    steps:
      - name: Download the exact notebook built by this run
        uses: actions/download-artifact@v4
        with:
          name: m07-runtime-notebook-${{ github.run_id }}
          path: exact-runtime

      - name: Verify identity, exact bytes and immutable runtime contract
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $python=(Get-Command python.exe -ErrorAction SilentlyContinue).Source
          if(-not $python){$python=(Get-Command python -ErrorAction Stop).Source}
          $script=@'
          import base64, hashlib, json, os, pathlib, re, urllib.request

          token=(os.environ.get('RETIRED_DIRECT_CREDENTIAL_REMOVED') or '').strip()
          if not token:
              raise SystemExit('BLOCKED_ADMISSION_AUTHORITY_MISSING: kg-05 token absent')
          owner=os.environ['EXPECTED_OWNER']
          auth=('Bearer '+token if token.startswith('RETIRED_BEARER_PREFIX_') else
                'Basic '+base64.b64encode(f'{owner}:{token}'.encode()).decode())

          def post(service, method, body, timeout=60):
              req=urllib.request.Request(
                  f'https://api.kaggle.com/v1/{service}/{method}',
                  data=json.dumps(body,separators=(',',':')).encode(),
                  method='POST',
                  headers={'Authorization':auth,'Content-Type':'application/json',
                  'Accept':'application/json','User-Agent':'m07-exact-runtime-launch/1.0'},
              )
              with urllib.request.urlopen(req,timeout=timeout) as response:
                  raw=response.read().decode('utf-8','replace')
                  return response.status,(json.loads(raw) if raw else {})

          _,listed=post('kernels.KernelsApiService','ListKernels',{'group':'PROFILE','pageSize':10})
          detected=''
          for item in listed.get('kernels') or []:
              detected=(item.get('author') or '').strip()
              if not detected:
                  ref=(item.get('ref') or '').strip()
                  if '/' in ref: detected=ref.split('/',1)[0]
              if detected: break
          if detected.lower()!=owner.lower():
              raise SystemExit(f'BLOCKED_EXACT_OBJECT_IDENTITY_MISMATCH: expected={owner} detected={detected or "UNKNOWN"}')

          paths=list(pathlib.Path('exact-runtime').rglob('*.ipynb'))
          if len(paths)!=1:
              raise SystemExit(f'BLOCKED_EXACT_OBJECT_IDENTITY_MISMATCH: notebook_count={len(paths)}')
          path=paths[0]
          raw=path.read_bytes()
          sha=hashlib.sha256(raw).hexdigest()
          manifest_path=pathlib.Path('exact-runtime')/'m07_runtime_notebook.sha256'
          slug_path=pathlib.Path('exact-runtime')/'m07_kernel_slug.txt'
          title_path=pathlib.Path('exact-runtime')/'m07_kernel_title.txt'
          if not manifest_path.is_file() or not slug_path.is_file() or not title_path.is_file():
              raise SystemExit('BLOCKED_EXACT_OBJECT_IDENTITY_MISMATCH: runtime identity sidecars missing')
          manifest_sha=manifest_path.read_text(encoding='utf-8-sig').strip().lower()
          if not re.fullmatch(r'[0-9a-f]{64}',manifest_sha) or manifest_sha!=sha:
              raise SystemExit(f'BLOCKED_EXACT_OBJECT_IDENTITY_MISMATCH: artifact_sha={sha} manifest_sha={manifest_sha}')
          hard_expected=os.environ['EXPECTED_SHA256'].strip()
          if hard_expected!='FROM_ARTIFACT' and sha!=hard_expected:
              raise SystemExit(f'BLOCKED_EXACT_OBJECT_IDENTITY_MISMATCH: sha={sha}')
          artifact_kernel_ref=slug_path.read_text(encoding='utf-8-sig').strip()
          artifact_title=title_path.read_text(encoding='utf-8-sig').strip()
          if os.environ['EXPECTED_KERNEL_REF']=='FROM_ARTIFACT':
              run_id=re.escape(os.environ['GITHUB_RUN_ID'])
              if not re.fullmatch(r'trickermark/m07-runtime-r320-a07-\d{8}-'+run_id,artifact_kernel_ref):
                  raise SystemExit(f'BLOCKED_EXACT_OBJECT_IDENTITY_MISMATCH: A07 kernel_ref={artifact_kernel_ref}')
              if not re.fullmatch(r'M07 Runtime R320 A07 \d{8} '+run_id,artifact_title):
                  raise SystemExit(f'BLOCKED_EXACT_OBJECT_IDENTITY_MISMATCH: A07 title={artifact_title}')
          else:
              if artifact_kernel_ref!=os.environ['EXPECTED_KERNEL_REF'] or artifact_title!=os.environ['EXPECTED_TITLE']:
                  raise SystemExit('BLOCKED_EXACT_OBJECT_IDENTITY_MISMATCH: historical slug/title drift')
          notebook=json.loads(raw.decode('utf-8'))
          meta=notebook.get('metadata',{}).get('cgp_continuation',{})
          runtime=meta.get('runtime_partition') or {}
          required={
              'campaign_id':'d260914d',
              'persistence_handle':'rezanory/m07-final-5fold-fix2-d260914d',
              'locked_test_used':False,
              'external_used':False,
              'phase2_unlocked':True,
          }
          for key,value in required.items():
              if meta.get(key)!=value:
                  raise SystemExit(f'BLOCKED_EXACT_EVIDENCE_LINEAGE_MISMATCH: {key}={meta.get(key)!r}')
          runtime_required={
              'enabled':True,'resolution':int(os.environ['EXPECTED_RESOLUTION']),
              'attempt':int(os.environ['EXPECTED_ATTEMPT']),
              'account_id':os.environ['EXPECTED_ACCOUNT'],
              'owner':os.environ['EXPECTED_OWNER'],
              'source_persistence_handle':'rezanory/m07-final-5fold-fix2-d260914d',
              'source_phase2_state_handle': (
                  None if os.environ['EXPECTED_SOURCE_STATE_HANDLE']=='NONE'
                  else os.environ['EXPECTED_SOURCE_STATE_HANDLE']
              ),
              'max_new_folds':1,
          }
          for key,value in runtime_required.items():
              if runtime.get(key)!=value:
                  raise SystemExit(f'BLOCKED_EXACT_EVIDENCE_LINEAGE_MISMATCH: runtime.{key}={runtime.get(key)!r}')
          pathlib.Path('verified-notebook-path.txt').write_text(str(path),encoding='utf-8')
          pathlib.Path('verified-notebook-sha256.txt').write_text(sha,encoding='utf-8')
          pathlib.Path('verified-kernel-ref.txt').write_text(artifact_kernel_ref,encoding='utf-8')
          pathlib.Path('verified-kernel-title.txt').write_text(artifact_title,encoding='utf-8')
          print(json.dumps({'identity':'PASS','owner':detected,'sha256':sha,
                            'kernel_ref':artifact_kernel_ref,
                            'runtime_partition':runtime},sort_keys=True))
          '@
          $script | & $python -
          if($LASTEXITCODE-ne 0){throw 'M07 exact runtime identity validation failed'}

      - name: Submit once and prove the Kaggle session is admitted
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $python=(Get-Command python.exe -ErrorAction SilentlyContinue).Source
          if(-not $python){$python=(Get-Command python -ErrorAction Stop).Source}
          $script=@'
          import base64, json, os, pathlib, time, urllib.error, urllib.request

          token=(os.environ.get('RETIRED_DIRECT_CREDENTIAL_REMOVED') or '').strip()
          owner=os.environ['EXPECTED_OWNER']
          auth=('Bearer '+token if token.startswith('RETIRED_BEARER_PREFIX_') else
                'Basic '+base64.b64encode(f'{owner}:{token}'.encode()).decode())
          notebook_path=pathlib.Path(pathlib.Path('verified-notebook-path.txt').read_text(encoding='utf-8'))
          notebook_sha=pathlib.Path('verified-notebook-sha256.txt').read_text(encoding='utf-8').strip()
          kernel_ref=pathlib.Path('verified-kernel-ref.txt').read_text(encoding='utf-8').strip()
          kernel_title=pathlib.Path('verified-kernel-title.txt').read_text(encoding='utf-8').strip()
          kernel_owner,slug=kernel_ref.split('/',1)
          if kernel_owner!=owner:
              raise SystemExit('BLOCKED_EXACT_OBJECT_IDENTITY_MISMATCH: kernel owner drift')

          def post(service, method, body, timeout=240, allow_missing=False):
              req=urllib.request.Request(
                  f'https://api.kaggle.com/v1/{service}/{method}',
                  data=json.dumps(body,separators=(',',':')).encode(),
                  method='POST',
                  headers={'Authorization':auth,'Content-Type':'application/json',
                           'Accept':'application/json','User-Agent':'m07-exact-runtime-launch/1.0'},
              )
              try:
                  with urllib.request.urlopen(req,timeout=timeout) as response:
                      raw=response.read().decode('utf-8','replace')
                      return response.status,(json.loads(raw) if raw else {})
              except urllib.error.HTTPError as exc:
                  raw=exc.read(4000).decode('utf-8','replace')
                  if allow_missing and exc.code in (400,404):
                      return exc.code,{'missing':True,'detail':raw[:600]}
                  raise RuntimeError(f'HTTP {exc.code}: {raw[:1200]}') from exc

          _,before=post('kernels.KernelsApiService','GetKernelSessionStatus',
                        {'userName':owner,'kernelSlug':slug},timeout=60,allow_missing=True)
          _,listed=post('kernels.KernelsApiService','ListKernels',
                        {'group':'PROFILE','pageSize':100},timeout=60)
          exact_exists=any(
              (item.get('ref') or '').lower()==kernel_ref.lower()
              for item in (listed.get('kernels') or []) if isinstance(item,dict)
          )
          existing_text=json.dumps(before,sort_keys=True).upper()
          active_or_complete=any(state in existing_text for state in ('RUNNING','QUEUED','COMPLETE'))
          if exact_exists and not active_or_complete:
              raise SystemExit(
                  'BLOCKED_IMMUTABLE_SOURCE_HYGIENE: runtime candidate already exists '
                  f'without admissible active/complete state: {existing_text[:800]}'
              )
          action='REUSED_EXISTING' if active_or_complete else 'SUBMITTED_NEW'
          if not active_or_complete:
              # The phase-2 state dataset is intentionally not attached here:
              # Kaggle rejects a private dataset with no published version in
              # non-interactive sessions.  The notebook treats that exact
              # first-run condition as an explicit empty-state admission and
              # creates the state snapshot only after the stage completes.
              dataset_sources=['paultimothymooney/chest-xray-pneumonia',
                               'rezanory/m07-final-5fold-fix2-d260914d']
              if int(os.environ['EXPECTED_RESOLUTION'])==320 and int(os.environ['EXPECTED_ATTEMPT'])==7:
                  dataset_sources.append('trickermark/m07-r320-producer-v4-bridge-e3884dd1')
              body={
                  'slug':kernel_ref,
                  'newTitle':kernel_title,
                  'text':notebook_path.read_text(encoding='utf-8'),
                  'language':'PYTHON','kernelType':'NOTEBOOK',
                  'kernelExecutionType':'SAVE_AND_RUN_ALL',
                  'isPrivate':True,'enableGpu':True,'enableInternet':True,
                  'machineShape':os.environ['EXPECTED_MACHINE_SHAPE'],
                  'datasetDataSources':dataset_sources,
              }
              _,saved=post('kernels.KernelsApiService','SaveKernel',body)
              provider_code=saved.get('code') if isinstance(saved,dict) else None
              if isinstance(provider_code,(int,float)) and provider_code>=400:
                  raise SystemExit(f'KAGGLE_SAVE_REJECTED: {saved}')
          else:
              saved={'preflight':before}

          observed=None
          for _ in range(4):
              time.sleep(5)
              _,observed=post('kernels.KernelsApiService','GetKernelSessionStatus',
                              {'userName':owner,'kernelSlug':slug},timeout=60)
              text=json.dumps(observed,sort_keys=True).upper()
              if any(state in text for state in ('RUNNING','QUEUED','COMPLETE','ERROR','CANCEL')):
                  break
          evidence={'schema':'m07.d260914d.runtime.launch.receipt.v1','action':action,
                    'account_id':os.environ['EXPECTED_ACCOUNT'],'owner':owner,'kernel_ref':kernel_ref,
                    'resolution':int(os.environ['EXPECTED_RESOLUTION']),
                    'attempt':int(os.environ['EXPECTED_ATTEMPT']),
                    'machine_shape':os.environ['EXPECTED_MACHINE_SHAPE'],
                    'notebook_sha256':notebook_sha,'save_result':saved,
                    'session_status':observed,'github_run_id':os.environ['GITHUB_RUN_ID'],
                    'source_sha':os.environ['GITHUB_SHA']}
          pathlib.Path('runtime-launch-receipt.json').write_text(
              json.dumps(evidence,ensure_ascii=False,indent=2),encoding='utf-8')
          status_text=json.dumps(observed,sort_keys=True).upper()
          if not any(state in status_text for state in ('RUNNING','QUEUED','COMPLETE')):
              raise SystemExit(f'BLOCKED_VALIDATION_INFRASTRUCTURE: session not admitted: {status_text[:1200]}')
          print(json.dumps({'launch':'PASS','action':action,'kernel_ref':kernel_ref,
                            'notebook_sha256':notebook_sha,
                            'session_status':observed},ensure_ascii=False,sort_keys=True))
          '@
          $script | & $python -
          if($LASTEXITCODE-ne 0){throw 'M07 exact runtime admission failed'}

      - name: Preserve exact runtime launch receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m07-runtime-launch-receipt-${{ github.run_id }}
          path: runtime-launch-receipt.json
          if-no-files-found: warn
          retention-days: 30

  soilbin_q1_v4_raw_waveform:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          github.actor_id == 62356000 &&
          github.event.inputs.recovery == 'SOILBIN_V4_RAW_WAVEFORM' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout frozen SoilBin V4 payload
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Request trusted action OIDC identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          base=os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']; sep='&' if '?' in base else '?'
          req=urllib.request.Request(base+sep+'audience=cgp-control-plane-v3-action',headers={'Authorization':'Bearer '+os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
          with urllib.request.urlopen(req,timeout=30) as r: token=json.load(r)['value']
          if len(token)<100: raise SystemExit('OIDC unavailable')
          print('::add-mask::'+token)
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as h: h.write('CGP_ACTION_OIDC_TOKEN='+token+'\n')
          PY

      - name: Validate, build and launch SoilBin V4 through Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          python control-plane-payloads/soilbin-q1-v4/launch_soilbin_v4_cloudflare.py

      - name: Build SoilBin V4 launch receipt
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os, pathlib
          p=os.environ.get('SOILBIN_V4_RECEIPT_PATH','')
          if p and pathlib.Path(p).exists():
              r=json.loads(pathlib.Path(p).read_text(encoding='utf-8'))
              body=(f"## SOILBIN Q1/Q2 V4 LAUNCH ACCEPTED\n\n- Run: `{os.environ['GITHUB_RUN_ID']}`\n- Kernel: `{r['kernel_ref']}`\n- Notebook SHA256: `{r['notebook_sha256']}`\n- Runner SHA256: `{r['runner_sha256']}`\n- Raw timeseries SHA256: `{r['raw_timeseries_source_sha256']}`\n- CPU only: `true`\n- Current-pass waveform used: `false`\n- External labels used: `false`\n")
          else:
              body=f"## SOILBIN Q1/Q2 V4 LAUNCH FAILED\n\n- Run: `{os.environ['GITHUB_RUN_ID']}`"
          summary=pathlib.Path(os.environ['RUNNER_TEMP'])/'soilbin_v4_launch_summary.md'
          summary.write_text(body,encoding='utf-8')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as h:
              h.write(f"SOILBIN_V4_SUMMARY_PATH={summary}\n")
          print(body)
          PY

      - name: Upload SoilBin V4 launch receipt artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soilbin-v4-launch-${{ github.run_id }}
          path: ${{ env.SOILBIN_V4_SUMMARY_PATH }}
          if-no-files-found: error
          retention-days: 30

  build-m07-r320-producer-bridge:
    name: Build exact M07 R320 producer recovery bridge on kg05
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          github.event.inputs.recovery == 'M07_BUILD_R320_PRODUCER_BRIDGE' }}
    runs-on: [self-hosted, windows, x64, v622]
    timeout-minutes: 15
    steps:
      - name: Request trusted action OIDC identity
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if(-not $env:ACTIONS_ID_TOKEN_REQUEST_URL -or -not $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN){throw 'OIDC context unavailable'}
          $sep=if($env:ACTIONS_ID_TOKEN_REQUEST_URL.Contains('?')){'&'}else{'?'}
          $r=Invoke-RestMethod -Uri "$($env:ACTIONS_ID_TOKEN_REQUEST_URL)$($sep)audience=cgp-control-plane-v3-action" -Headers @{Authorization="Bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN"} -TimeoutSec 30
          $token=[string]$r.value
          if($token.Length -lt 100){throw 'OIDC unavailable'}
          Write-Host "::add-mask::$token"
          [IO.File]::AppendAllText($env:GITHUB_ENV,"CGP_ACTION_OIDC_TOKEN=$token`n",[Text.UTF8Encoding]::new($false))

      - name: Submit exact CPU producer bridge through trusted broker
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $payload=@{
            request_id="m07-r320-producer-bridge-$env:GITHUB_RUN_ID"
            provider='kaggle'
            operation_class='compute'
            account_id='kg-05'
            purpose='Create exactly one private kg-05 bridge from verified R320 producer folds 1-4; CPU only, no training, no Locked Test.'
            service='m07.RecoveryBridge'
            method='CreateProducerMirror'
            body=@{slug="trickermark/m07-r320-producer-bridge-$env:GITHUB_RUN_ID"}
          } | ConvertTo-Json -Compress -Depth 10
          $headers=@{Authorization="Bearer $env:CGP_ACTION_OIDC_TOKEN";'Content-Type'='application/json';Accept='application/json';'User-Agent'='m07-r320-producer-bridge/2.0'}
          $result=Invoke-RestMethod -Uri 'https://chatgpt-kaggle-gateway.rezanory-chatgpt-plugins.workers.dev/control-plane/v3/action/kaggle' -Method Post -Headers $headers -Body $payload -TimeoutSec 240
          if(-not $result.ok){throw 'producer bridge broker submission rejected'}
          $ref=if($result.provider_ref){[string]$result.provider_ref}elseif($result.result.ref){[string]$result.result.ref}else{''}
          if(-not $ref){throw 'producer bridge provider ref missing'}
          Write-Host "M07_R320_PRODUCER_BRIDGE_SUBMITTED kernel=$ref target=trickermark/m07-r320-producer-v4-bridge-e3884dd1 gpu=false training=false"

  probe-m07-r320-producer-bridge:
    name: Probe exact M07 R320 producer bridge mount on kg05
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          github.event.inputs.recovery == 'M07_PROBE_R320_PRODUCER_BRIDGE' }}
    runs-on: [self-hosted, windows, x64, v622]
    timeout-minutes: 20
    steps:
      - name: Request trusted action OIDC identity
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if(-not $env:ACTIONS_ID_TOKEN_REQUEST_URL -or -not $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN){throw 'OIDC context unavailable'}
          $sep=if($env:ACTIONS_ID_TOKEN_REQUEST_URL.Contains('?')){'&'}else{'?'}
          $r=Invoke-RestMethod -Uri "$($env:ACTIONS_ID_TOKEN_REQUEST_URL)$($sep)audience=cgp-control-plane-v3-action" -Headers @{Authorization="Bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN"} -TimeoutSec 30
          $token=[string]$r.value
          if($token.Length -lt 100){throw 'OIDC unavailable'}
          Write-Host "::add-mask::$token"
          [IO.File]::AppendAllText($env:GITHUB_ENV,"CGP_ACTION_OIDC_TOKEN=$token`n",[Text.UTF8Encoding]::new($false))

      - name: Submit isolated CPU bridge mount probe
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $script=@'
          import hashlib, json
          from pathlib import Path
          base=Path('/kaggle/input')
          candidates=[
              base/'m07-r320-producer-v4-bridge-e3884dd1',
              base/'datasets'/'trickermark'/'m07-r320-producer-v4-bridge-e3884dd1',
          ]
          root=next((p for p in candidates if (p/'BRIDGE_RECEIPT.json').is_file() and (p/'CAMPAIGN_STATE.json').is_file()),None)
          if root is None:
              matches=[]
              for receipt_path in base.rglob('BRIDGE_RECEIPT.json'):
                  candidate=receipt_path.parent
                  marker_path=candidate/'CAMPAIGN_STATE.json'
                  if not marker_path.is_file():
                      continue
                  try:
                      receipt_probe=json.loads(receipt_path.read_text(encoding='utf-8'))
                      campaign_probe=json.loads(marker_path.read_text(encoding='utf-8'))
                  except Exception:
                      continue
                  if (receipt_probe.get('schema')=='m07.r320.producer.bridge.v2'
                          and receipt_probe.get('status')=='COMPLETE'
                          and receipt_probe.get('target_dataset')=='trickermark/m07-r320-producer-v4-bridge-e3884dd1'
                          and campaign_probe.get('receipt_sha256')=='e3884dd10e323d2f0925660599a420964781111d850664e8c88a830324460c77'):
                      matches.append(candidate)
              unique=[]
              seen=set()
              for candidate in matches:
                  key=candidate.resolve().as_posix()
                  if key not in seen:
                      seen.add(key); unique.append(candidate)
              assert len(unique)==1, 'M07_BRIDGE_MOUNT_ROOT_DISCOVERY_MISMATCH:'+str([p.as_posix() for p in unique])
              root=unique[0]
          print('M07_BRIDGE_MOUNT_ROOT '+root.as_posix())
          marker=root/'CAMPAIGN_STATE.json'
          bridge=root/'BRIDGE_RECEIPT.json'
          assert marker.is_file(), 'M07_BRIDGE_CAMPAIGN_STATE_MISSING'
          assert bridge.is_file(), 'M07_BRIDGE_RECEIPT_MISSING'
          campaign=json.loads(marker.read_text(encoding='utf-8'))
          receipt=json.loads(bridge.read_text(encoding='utf-8'))
          assert campaign.get('schema')=='phase2.state.v2' and campaign.get('status')=='COMPLETE'
          assert campaign.get('model_id')=='M07' and int(campaign.get('resolution'))==320
          assert campaign.get('receipt_sha256')=='e3884dd10e323d2f0925660599a420964781111d850664e8c88a830324460c77'
          assert (campaign.get('run_contract') or {}).get('split_fingerprint')=='896491de87f9dc2a1d7d63548b7c5c22206da11f27a37efece8efc8e1557c8a9'
          assert ((campaign.get('run_contract') or {}).get('extra') or {}).get('recipe_fingerprint')=='02c77dd257612e866756b16270f71816e61fb9f2403e14126aaacb9f01a8da0b'
          expected={'FOLD_1_RECOVERY.zip':'cd18468bf9305bb801f809098f8917462b16fb69fe9313b8bd17f2a95a7d1531','FOLD_2_RECOVERY.zip':'a75967888cec5cea6133a2ed457bb998edb9ada01442be88b2cc35e970e6f72d','FOLD_3_RECOVERY.zip':'4b04f657ddfcab61dc720f17ba4a8a5a8f234cd2bb7ed10b64e7357e049a9ad6','FOLD_4_RECOVERY.zip':'74a7c69c572a66a139beb99dfa375185ce2f25e96689642eac2a1e56928deb93'}
          assert receipt.get('schema')=='m07.r320.producer.bridge.v2' and receipt.get('status')=='COMPLETE'
          assert receipt.get('target_dataset')=='trickermark/m07-r320-producer-v4-bridge-e3884dd1'
          assert receipt.get('archive_sha256')==expected
          assert campaign.get('artifact_sha256')==expected
          assert receipt.get('sealed_fold_ids')==[1,2,3,4] and receipt.get('missing_fold_ids')==[5]
          assert receipt.get('locked_test_used_for_training') is False and receipt.get('external_used_for_training') is False
          assert receipt.get('training_performed') is False and receipt.get('mutable_dataset_versions_5_6_used') is False
          fold_receipts=receipt.get('fold_receipts') or {}
          assert sorted(fold_receipts.keys())==['1','2','3','4']
          assert not (root/'FOLD_5_RECOVERY').exists(), 'M07_BRIDGE_FOLD5_MUST_BE_ABSENT'
          observed={}
          verified_artifacts=0
          for fold_id in range(1,5):
              fold_root=root/f'FOLD_{fold_id}_RECOVERY'/'FOLDS'/f'fold_{fold_id}'
              completed=fold_root/'COMPLETED.json'
              assert completed.is_file(), 'M07_BRIDGE_FOLD_RECEIPT_MISSING:'+str(fold_id)
              fold_payload=json.loads(completed.read_text(encoding='utf-8'))
              fold_meta=fold_receipts[str(fold_id)]
              assert fold_payload.get('schema')=='pneumonia.phase2.fold.v1.7' and fold_payload.get('status')=='COMPLETED'
              assert (fold_payload.get('model_id'),int(fold_payload.get('resolution',-1)),int(fold_payload.get('fold_id',-1)))==('M07',320,fold_id)
              assert fold_payload.get('confirmed_m07_recipe_fingerprint')=='02c77dd257612e866756b16270f71816e61fb9f2403e14126aaacb9f01a8da0b'
              assert fold_payload.get('split_fingerprint')=='896491de87f9dc2a1d7d63548b7c5c22206da11f27a37efece8efc8e1557c8a9'
              assert fold_payload.get('locked_test_used_for_training') is False and fold_payload.get('external_used_for_training') is False
              assert fold_payload.get('receipt_sha256')==fold_meta.get('receipt_sha256')
              assert fold_payload.get('run_fingerprint')==fold_meta.get('run_fingerprint')
              artifact_manifest=fold_meta.get('artifact_sha256') or {}
              assert artifact_manifest and (fold_payload.get('artifact_sha256') or {})==artifact_manifest
              fold_observed={}
              for file_name,expected_sha in sorted(artifact_manifest.items()):
                  assert isinstance(file_name,str) and file_name and file_name==Path(file_name).name and file_name not in {'.','..'}
                  p=fold_root/file_name
                  assert p.is_file(), 'M07_BRIDGE_FOLD_ARTIFACT_MISSING:'+str(fold_id)+':'+file_name
                  h=hashlib.sha256()
                  with p.open('rb') as fh:
                      for chunk in iter(lambda:fh.read(8*1024*1024),b''): h.update(chunk)
                  actual=h.hexdigest()
                  assert actual==expected_sha, 'M07_BRIDGE_FOLD_ARTIFACT_SHA_MISMATCH:'+str(fold_id)+':'+file_name
                  fold_observed[file_name]=actual
                  verified_artifacts+=1
              observed[str(fold_id)]={'receipt_sha256':fold_payload.get('receipt_sha256'),'artifacts':fold_observed}
          print('M07_R320_PRODUCER_BRIDGE_PROBE '+json.dumps({'status':'PASS','archive_sha256':expected,'folds':observed,'verified_artifact_count':verified_artifacts,'sealed_fold_ids':[1,2,3,4],'missing_fold_ids':[5]},sort_keys=True,separators=(',',':')))
          '@
          $payload=@{
            request_id="m07-r320-producer-bridge-probe-$env:GITHUB_RUN_ID"
            provider='kaggle'
            operation_class='compute'
            account_id='kg-05'
            purpose='CPU-only verification of the exact private producer recovery bridge; no training, no upload, no Locked Test.'
            service='kernels.KernelsApiService'
            method='SaveKernel'
            body=@{
              slug="trickermark/m07-r320-producer-bridge-probe-$env:GITHUB_RUN_ID"
              newTitle="M07 R320 Producer Bridge Probe $env:GITHUB_RUN_ID"
              text=$script
              language='PYTHON'
              kernelType='SCRIPT'
              kernelExecutionType='SAVE_AND_RUN_ALL'
              isPrivate=$true
              enableGpu=$false
              enableInternet=$false
              datasetDataSources=@('trickermark/m07-r320-producer-v4-bridge-e3884dd1')
            }
          } | ConvertTo-Json -Compress -Depth 20
          $headers=@{Authorization="Bearer $env:CGP_ACTION_OIDC_TOKEN";'Content-Type'='application/json';Accept='application/json';'User-Agent'='m07-r320-producer-bridge-probe/1.0'}
          $result=Invoke-RestMethod -Uri 'https://chatgpt-kaggle-gateway.rezanory-chatgpt-plugins.workers.dev/control-plane/v3/action/kaggle' -Method Post -Headers $headers -Body $payload -TimeoutSec 240
          if(-not $result.ok){throw 'bridge mount probe submission rejected'}
          $providerRef=if($result.provider_ref){[string]$result.provider_ref}elseif($result.result.ref){[string]$result.result.ref}else{''}
          Write-Host "M07_R320_PRODUCER_BRIDGE_PROBE_SUBMITTED kernel=trickermark/m07-r320-producer-bridge-probe-$env:GITHUB_RUN_ID provider_ref=$providerRef gpu=false training=false"

  probe-m07-runtime-predecessor-mount:
    name: Probe immutable M07 runtime predecessor mount on kg05
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          github.event.inputs.recovery == 'M07_PROBE_RUNTIME_PREDECESSOR_MOUNT' }}
    runs-on: [self-hosted, windows, x64, v622]
    timeout-minutes: 20
    steps:
      - name: Request trusted action OIDC identity
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if(-not $env:ACTIONS_ID_TOKEN_REQUEST_URL -or -not $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN){throw 'OIDC context unavailable'}
          $sep=if($env:ACTIONS_ID_TOKEN_REQUEST_URL.Contains('?')){'&'}else{'?'}
          $r=Invoke-RestMethod -Uri "$($env:ACTIONS_ID_TOKEN_REQUEST_URL)$($sep)audience=cgp-control-plane-v3-action" -Headers @{Authorization="Bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN"} -TimeoutSec 30
          $token=[string]$r.value
          if($token.Length -lt 100){throw 'OIDC unavailable'}
          Write-Host "::add-mask::$token"
          [IO.File]::AppendAllText($env:GITHUB_ENV,"CGP_ACTION_OIDC_TOKEN=$token`n",[Text.UTF8Encoding]::new($false))

      - name: Submit CPU-only immutable predecessor mount probe
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $script=@'
          import hashlib, json
          from pathlib import Path

          HANDLE='rezanory/m07-final-5fold-fix2-d260914d'
          SLUG='m07-final-5fold-fix2-d260914d'
          MANIFEST='PERSISTENCE_MANIFEST_V1_4.json'
          SPLIT='896491de87f9dc2a1d7d63548b7c5c22206da11f27a37efece8efc8e1557c8a9'
          base=Path('/kaggle/input').resolve()
          assert base.is_dir(), 'M07_RUNTIME_PREDECESSOR_INPUT_ROOT_MISSING'
          matches=[]
          diagnostics=[]
          for manifest_path in sorted(base.rglob(MANIFEST)):
              candidate=manifest_path.parent.resolve()
              try:
                  relative=candidate.relative_to(base).as_posix()
              except ValueError:
                  continue
              if SLUG not in relative.lower():
                  continue
              try:
                  payload=json.loads(manifest_path.read_text(encoding='utf-8'))
                  body={key:value for key,value in payload.items() if key!='receipt_sha256'}
                  encoded=json.dumps(body,sort_keys=True,separators=(',',':'),ensure_ascii=False,allow_nan=False)
                  observed_seal=hashlib.sha256(encoded.encode('utf-8')).hexdigest()
                  contract=payload.get('run_contract') or {}
                  extra=contract.get('extra') or {}
                  artifacts=payload.get('artifact_sha256')
                  ok=(
                      payload.get('status')=='SEALED'
                      and payload.get('receipt_sha256')==observed_seal
                      and contract.get('stage')=='M07_PERSISTENCE_CAMPAIGN'
                      and contract.get('model_id')=='M07'
                      and int(contract.get('resolution',-1))==224
                      and contract.get('split_fingerprint')==SPLIT
                      and extra.get('dataset_handle')==HANDLE
                      and isinstance(artifacts,dict)
                      and bool(artifacts)
                  )
                  missing=[]
                  expanded=[]
                  if ok:
                      for name in sorted(artifacts):
                          direct=candidate/name
                          expanded_path=candidate/name[:-4] if str(name).endswith('.zip') else None
                          if direct.is_file():
                              continue
                          if expanded_path is not None and expanded_path.is_dir():
                              expanded.append(str(name))
                              continue
                          missing.append(str(name))
                      ok=not missing
                  diagnostics.append({
                      'relative_root':relative,
                      'sealed':payload.get('status'),
                      'receipt_seal_matches':payload.get('receipt_sha256')==observed_seal,
                      'artifact_count':len(artifacts) if isinstance(artifacts,dict) else -1,
                      'missing':missing,
                  })
                  if ok:
                      matches.append((candidate,payload,expanded))
              except Exception as exc:
                  diagnostics.append({'relative_root':relative,'error':f'{type(exc).__name__}: {exc}'})
          unique=[]
          seen=set()
          for candidate,payload,expanded in matches:
              key=candidate.as_posix()
              if key not in seen:
                  seen.add(key); unique.append((candidate,payload,expanded))
          assert len(unique)==1, 'M07_RUNTIME_PREDECESSOR_MOUNT_DISCOVERY_MISMATCH:'+json.dumps(diagnostics,sort_keys=True)
          root,payload,expanded=unique[0]
          print('M07_RUNTIME_PREDECESSOR_MOUNT_PROBE '+json.dumps({
              'status':'PASS',
              'handle':HANDLE,
              'relative_root':root.relative_to(base).as_posix(),
              'manifest':MANIFEST,
              'receipt_sha256':payload.get('receipt_sha256'),
              'artifact_count':len(payload.get('artifact_sha256') or {}),
              'expanded_archives':expanded,
              'dynamic_attach_used':False,
              'read_only':True,
              'gpu':False,
              'training':False,
              'locked_test':False,
          },sort_keys=True,separators=(',',':')))
          '@
          $payload=@{
            request_id="m07-runtime-predecessor-mount-probe-$env:GITHUB_RUN_ID"
            provider='kaggle'
            operation_class='compute'
            account_id='kg-05'
            purpose='CPU-only verification of the pre-attached immutable M07 R224 predecessor mount; no dynamic attach, no training, no upload, no Locked Test.'
            service='kernels.KernelsApiService'
            method='SaveKernel'
            body=@{
              slug="trickermark/m07-runtime-predecessor-mount-probe-$env:GITHUB_RUN_ID"
              newTitle="M07 Runtime Predecessor Mount Probe $env:GITHUB_RUN_ID"
              text=$script
              language='PYTHON'
              kernelType='SCRIPT'
              kernelExecutionType='SAVE_AND_RUN_ALL'
              isPrivate=$true
              enableGpu=$false
              enableInternet=$false
              datasetDataSources=@('rezanory/m07-final-5fold-fix2-d260914d')
            }
          } | ConvertTo-Json -Compress -Depth 20
          $headers=@{Authorization="Bearer $env:CGP_ACTION_OIDC_TOKEN";'Content-Type'='application/json';Accept='application/json';'User-Agent'='m07-runtime-predecessor-mount-probe/1.0'}
          $result=Invoke-RestMethod -Uri 'https://chatgpt-kaggle-gateway.rezanory-chatgpt-plugins.workers.dev/control-plane/v3/action/kaggle' -Method Post -Headers $headers -Body $payload -TimeoutSec 240
          if(-not $result.ok){throw 'runtime predecessor mount probe submission rejected'}
          $providerRef=if($result.provider_ref){[string]$result.provider_ref}elseif($result.result.ref){[string]$result.result.ref}else{''}
          if(-not $providerRef){throw 'runtime predecessor mount probe provider ref missing'}
          Write-Host "M07_RUNTIME_PREDECESSOR_MOUNT_PROBE_SUBMITTED kernel=trickermark/m07-runtime-predecessor-mount-probe-$env:GITHUB_RUN_ID provider_ref=$providerRef gpu=false training=false locked_test=false"
