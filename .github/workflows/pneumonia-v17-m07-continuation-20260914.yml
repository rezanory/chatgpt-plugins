          path: exact-phase2-unit
          run-id: ${{ steps.recovery_identity.outputs.source_run_id }}
          github-token: ${{ github.token }}

      - name: Download exact original Phase-2 launch receipt artifact
        uses: actions/download-artifact@v4
        with:
          name: phase2-unit-orchestration-receipt-${{ steps.recovery_identity.outputs.source_run_id }}
          path: exact-phase2-orchestration
          run-id: ${{ steps.recovery_identity.outputs.source_run_id }}
          github-token: ${{ github.token }}

      - name: Validate recovered Phase-2 artifact identity
        id: recovered_contract
        shell: powershell
        env:
          SOURCE_TOKEN: ${{ steps.recovery_identity.outputs.source_token }}
          SOURCE_RUN_ID: ${{ steps.recovery_identity.outputs.source_run_id }}
          SOURCE_SHA: ${{ steps.recovery_identity.outputs.source_sha }}
        run: |
          $ErrorActionPreference='Stop'
          $notebooks=@(Get-ChildItem -LiteralPath exact-phase2-unit -Recurse -Filter *.ipynb)
          $contracts=@(Get-ChildItem -LiteralPath exact-phase2-unit -Recurse -Filter phase2_unit_contract.json)
          $launchReceipts=@(Get-ChildItem -LiteralPath exact-phase2-orchestration -Recurse -Filter phase2-unit-launch-receipt.json)
          if($notebooks.Count-ne 1-or $contracts.Count-ne 1-or $launchReceipts.Count-ne 1){throw 'BLOCKED_EXACT_OBJECT_IDENTITY_MISMATCH: recovered Phase2 artifact inventory invalid'}
          $contract=Get-Content -LiteralPath $contracts[0].FullName -Raw|ConvertFrom-Json
          $launch=Get-Content -LiteralPath $launchReceipts[0].FullName -Raw|ConvertFrom-Json
          $sha=(Get-FileHash -Algorithm SHA256 -LiteralPath $notebooks[0].FullName).Hash.ToLowerInvariant()
          if([string]$contract.token-ne $env:SOURCE_TOKEN-or [string]$contract.run_id-ne $env:SOURCE_RUN_ID){throw 'BLOCKED_EXACT_EVIDENCE_LINEAGE_MISMATCH: recovered Phase2 contract identity drift'}
          if($sha-ne [string]$contract.notebook_sha256){throw 'BLOCKED_EXACT_OBJECT_IDENTITY_MISMATCH: recovered Phase2 notebook SHA drift'}
          if([string]$contract.kernel_ref-notmatch '^[a-z0-9_-]+/p17-p2-m(0[1-6]|0[8-9]|1[0-2])-r224-a[0-9]{2}-20[0-9]{6}-[0-9]+$'){throw 'BLOCKED_EXACT_OBJECT_IDENTITY_MISMATCH: recovered Phase2 kernel ref invalid'}
          if([string]$launch.schema-ne 'pneumonia.phase2.unit.orchestration.v1'-or [string]$launch.status-ne 'ORCHESTRATION_ACCEPTED_PENDING_SCIENTIFIC_TERMINAL'-or $launch.accepted-ne $true){throw 'BLOCKED_EXACT_EVIDENCE_LINEAGE_MISMATCH: recovered Phase2 launch receipt status invalid'}
          if([string]$launch.runtime_stage-ne $env:SOURCE_TOKEN-or [string]$launch.github_run_id-ne $env:SOURCE_RUN_ID-or [string]$launch.broker_run_id-ne $env:SOURCE_RUN_ID){throw 'BLOCKED_EXACT_EVIDENCE_LINEAGE_MISMATCH: recovered Phase2 launch run identity drift'}
          if([string]$launch.source_sha-ne $env:SOURCE_SHA-or [string]$launch.broker_sha-ne $env:SOURCE_SHA){throw 'BLOCKED_EXACT_EVIDENCE_LINEAGE_MISMATCH: recovered Phase2 launch SHA drift'}
          if([string]$launch.kernel_ref-ne [string]$contract.kernel_ref-or [string]$launch.notebook_sha256-ne $sha-or [string]$launch.account_id-ne [string]$contract.account_id-or [string]$launch.owner-ne [string]$contract.owner){throw 'BLOCKED_EXACT_EVIDENCE_LINEAGE_MISMATCH: recovered Phase2 launch/contract drift'}
          $providerParts=([string]$launch.provider_ref).Trim('/').Split('/')
          if($providerParts.Count-ne 3-or $providerParts[0]-ne 'code'){throw 'BLOCKED_EXACT_OBJECT_IDENTITY_MISMATCH: recovered Phase2 provider ref invalid'}
          $providerKernelRef="$($providerParts[1])/$($providerParts[2])"
          $expectedProviderKernelRef="$([string]$contract.owner)/pneumonia-v1-7-phase2-$(([string]$contract.model_id).ToLowerInvariant())-r$([int]$contract.resolution)-a$(([int]$contract.attempt).ToString('00'))-$env:SOURCE_RUN_ID"
          if($providerKernelRef-ne $expectedProviderKernelRef){throw 'BLOCKED_EXACT_OBJECT_IDENTITY_MISMATCH: recovered Phase2 provider kernel ref drift'}
          [IO.File]::AppendAllText(
            $env:GITHUB_OUTPUT,
            "kernel_ref=$([string]$contract.kernel_ref)`nprovider_kernel_ref=$providerKernelRef`nnotebook_sha256=$sha`n",
            [Text.UTF8Encoding]::new($false)
          )

      - name: Request trusted read OIDC identity for recovered Phase-2 verification
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if(-not $env:ACTIONS_ID_TOKEN_REQUEST_URL-or -not $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN){throw 'GitHub OIDC request context unavailable'}
          $sep=if($env:ACTIONS_ID_TOKEN_REQUEST_URL.Contains('?')){'&'}else{'?'}
          $oidc=Invoke-RestMethod -Uri "$($env:ACTIONS_ID_TOKEN_REQUEST_URL)$($sep)audience=cgp-control-plane-v3" -Headers @{Authorization="Bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN"} -TimeoutSec 30
          $token=[string]$oidc.value
          if($token.Length-lt100){throw 'GitHub read OIDC token unavailable'}
          Write-Host "::add-mask::$token"
          [IO.File]::AppendAllText($env:GITHUB_ENV,"CGP_READ_OIDC_TOKEN=$token`n",[Text.UTF8Encoding]::new($false))

      - name: Verify exact recovered Phase-2 terminal and scientific receipt
        id: phase2_recover
        shell: powershell
        env:
          SOURCE_TOKEN: ${{ steps.recovery_identity.outputs.source_token }}
          SOURCE_RUN_ID: ${{ steps.recovery_identity.outputs.source_run_id }}
          SOURCE_KERNEL_REF: ${{ steps.recovered_contract.outputs.kernel_ref }}
          SOURCE_PROVIDER_KERNEL_REF: ${{ steps.recovered_contract.outputs.provider_kernel_ref }}
        run: |
          $ErrorActionPreference='Stop'
          $python=(Get-Command python.exe -ErrorAction SilentlyContinue).Source
          if(-not $python){$python=(Get-Command python -ErrorAction Stop).Source}
          & $python scripts/pneumonia_phase2_runtime.py verify `
            --token $env:SOURCE_TOKEN `
            --run-id $env:SOURCE_RUN_ID `
            --kernel-ref $env:SOURCE_KERNEL_REF `
            --provider-kernel-ref $env:SOURCE_PROVIDER_KERNEL_REF `
            --evidence-dir phase2-terminal-evidence
          if($LASTEXITCODE-ne 0){throw 'Recovered Phase2 terminal/scientific validation failed'}
          $verification=Get-Content -LiteralPath phase2-terminal-evidence\phase2-unit-verification.json -Raw|ConvertFrom-Json
          if([string]$verification.status-ne 'SCIENTIFIC_RECEIPT_PASS'){throw 'Recovered Phase2 exact scientific PASS missing'}
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT,"next_token=$([string]$verification.next_token)`n",[Text.UTF8Encoding]::new($false))

      - name: Preserve recovered Phase-2 terminal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-unit-recovered-terminal-evidence-${{ steps.recovery_identity.outputs.source_run_id }}-${{ github.run_id }}
          path: phase2-terminal-evidence
          if-no-files-found: warn
          retention-days: 30

      - name: Dispatch exact successor after recovered scientific verification
        if: ${{ steps.phase2_recover.outputs.next_token != '' }}
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NEXT_PHASE2_TOKEN: ${{ steps.phase2_recover.outputs.next_token }}
        run: |
          $ErrorActionPreference='Stop'
          if($env:NEXT_PHASE2_TOKEN-notmatch '^PHASE2_UNIT_M(0[1-6]|0[8-9]|1[0-2])_R(224|320|384)_A[0-9]{2}$'){throw 'Phase2 successor token invalid'}
          $headers=@{Authorization="Bearer $env:GITHUB_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          $payload=@{ref='main';inputs=@{recovery=$env:NEXT_PHASE2_TOKEN}}|ConvertTo-Json -Depth 4 -Compress
          Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/workflows/pneumonia-v17-m07-continuation-20260914.yml/dispatches" -Headers $headers -ContentType 'application/json' -Body $payload
          Write-Host "PHASE2_SUCCESSOR_DISPATCHED=$env:NEXT_PHASE2_TOKEN"

  verify-phase2-unit-terminal:
    name: Verify exact Phase-2 unit scientific terminal
    needs: launch-m07-continuation
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main' &&
          startsWith(github.event.inputs.recovery, 'PHASE2_UNIT_') }}
    runs-on: [self-hosted, windows, x64, v622]
    timeout-minutes: 240
    env:
      PHASE2_UNIT_TOKEN: ${{ github.event.inputs.recovery }}
      PHASE2_EXPECTED_KERNEL_REF: ${{ needs.launch-m07-continuation.outputs.runtime_kernel_ref }}
      PHASE2_PROVIDER_KERNEL_REF: ${{ needs.launch-m07-continuation.outputs.runtime_provider_kernel_ref }}
      PHASE2_EXPECTED_NOTEBOOK_SHA256: ${{ needs.launch-m07-continuation.outputs.runtime_notebook_sha256 }}
      PHASE2_EXPECTED_RESTORED_FOLDS_JSON: ${{ needs.launch-m07-continuation.outputs.runtime_expected_restored_folds_json }}
    steps:
      - name: Checkout exact workflow revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download exact generated Phase-2 unit artifact
        uses: actions/download-artifact@v4
        with:
          name: phase2-unit-notebook-${{ github.run_id }}
          path: exact-phase2-unit

      - name: Validate exact Phase-2 unit artifact identity
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $notebooks=@(Get-ChildItem -LiteralPath exact-phase2-unit -Recurse -Filter *.ipynb)
          $contracts=@(Get-ChildItem -LiteralPath exact-phase2-unit -Recurse -Filter phase2_unit_contract.json)
          if($notebooks.Count-ne 1-or $contracts.Count-ne 1){throw 'BLOCKED_EXACT_OBJECT_IDENTITY_MISMATCH: Phase2 artifact inventory invalid'}
          $sha=(Get-FileHash -Algorithm SHA256 -LiteralPath $notebooks[0].FullName).Hash.ToLowerInvariant()
          if($sha-ne $env:PHASE2_EXPECTED_NOTEBOOK_SHA256){throw 'BLOCKED_EXACT_OBJECT_IDENTITY_MISMATCH: Phase2 notebook SHA drift'}
          $contract=Get-Content -LiteralPath $contracts[0].FullName -Raw | ConvertFrom-Json
          if([string]$contract.token-ne $env:PHASE2_UNIT_TOKEN-or [string]$contract.kernel_ref-ne $env:PHASE2_EXPECTED_KERNEL_REF){throw 'BLOCKED_EXACT_EVIDENCE_LINEAGE_MISMATCH: Phase2 contract identity drift'}
          $restored=ConvertTo-Json -InputObject @($contract.expected_restored_folds) -Compress
          if($restored-ne $env:PHASE2_EXPECTED_RESTORED_FOLDS_JSON){throw 'BLOCKED_EXACT_EVIDENCE_LINEAGE_MISMATCH: Phase2 predecessor fold binding drift'}

      - name: Request trusted read OIDC identity for Phase-2 verification
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if(-not $env:ACTIONS_ID_TOKEN_REQUEST_URL -or -not $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN){throw 'GitHub OIDC request context unavailable'}
          $sep=if($env:ACTIONS_ID_TOKEN_REQUEST_URL.Contains('?')){'&'}else{'?'}
          $oidc=Invoke-RestMethod -Uri "$($env:ACTIONS_ID_TOKEN_REQUEST_URL)$($sep)audience=cgp-control-plane-v3" -Headers @{Authorization="Bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN"} -TimeoutSec 30
          $token=[string]$oidc.value
          if($token.Length-lt100){throw 'GitHub read OIDC token unavailable'}
          Write-Host "::add-mask::$token"
          [IO.File]::AppendAllText($env:GITHUB_ENV,"CGP_READ_OIDC_TOKEN=$token`n",[Text.UTF8Encoding]::new($false))

      - name: Wait for exact Phase-2 terminal and validate scientific receipt
        id: phase2_verify
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $python=(Get-Command python.exe -ErrorAction SilentlyContinue).Source
          if(-not $python){$python=(Get-Command python -ErrorAction Stop).Source}
          & $python scripts/pneumonia_phase2_runtime.py verify `
            --token $env:PHASE2_UNIT_TOKEN `
            --run-id $env:GITHUB_RUN_ID `
            --kernel-ref $env:PHASE2_EXPECTED_KERNEL_REF `
            --provider-kernel-ref $env:PHASE2_PROVIDER_KERNEL_REF `
            --evidence-dir phase2-terminal-evidence `
            --expected-restored-folds-json $env:PHASE2_EXPECTED_RESTORED_FOLDS_JSON
          if($LASTEXITCODE-ne 0){throw 'Phase2 terminal/scientific validation failed'}
          $verification=Get-Content -LiteralPath phase2-terminal-evidence\phase2-unit-verification.json -Raw | ConvertFrom-Json
          if([string]$verification.status-ne 'SCIENTIFIC_RECEIPT_PASS'){throw 'Phase2 exact scientific PASS missing'}
          $next=[string]$verification.next_token
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT,"scientific_status=$([string]$verification.scientific_status)`nnext_token=$next`n",[Text.UTF8Encoding]::new($false))

      - name: Preserve Phase-2 terminal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-unit-terminal-evidence-${{ github.run_id }}
          path: phase2-terminal-evidence
          if-no-files-found: warn
          retention-days: 30

      - name: Dispatch exact successor after scientific verification
        if: ${{ steps.phase2_verify.outputs.next_token != '' }}
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NEXT_PHASE2_TOKEN: ${{ steps.phase2_verify.outputs.next_token }}
        run: |
          $ErrorActionPreference='Stop'
          if($env:NEXT_PHASE2_TOKEN-notmatch '^PHASE2_UNIT_M(0[1-6]|0[8-9]|1[0-2])_R(224|320|384)_A[0-9]{2}$'){throw 'Phase2 successor token invalid'}
          $headers=@{Authorization="Bearer $env:GITHUB_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          $payload=@{ref='main';inputs=@{recovery=$env:NEXT_PHASE2_TOKEN}} | ConvertTo-Json -Depth 4 -Compress
          Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/workflows/pneumonia-v17-m07-continuation-20260914.yml/dispatches" -Headers $headers -ContentType 'application/json' -Body $payload
          Write-Host "PHASE2_SUCCESSOR_DISPATCHED=$env:NEXT_PHASE2_TOKEN"

  verify-m07-runtime-terminal:
    name: Verify M07 runtime scientific terminal
    needs: launch-m07-continuation
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main' &&
          startsWith(github.event.inputs.recovery, 'M07_RUNTIME_M07_R') }}
    runs-on: [self-hosted, windows, x64, v622]
    timeout-minutes: 240
    env:
      M07_RUNTIME_STAGE: ${{ github.event.inputs.recovery }}
      M07_EXPECTED_KERNEL_REF: ${{ needs.launch-m07-continuation.outputs.runtime_kernel_ref }}
      M07_EXPECTED_NOTEBOOK_SHA256: ${{ needs.launch-m07-continuation.outputs.runtime_notebook_sha256 }}
    steps:
      - name: Checkout exact workflow revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download exact generated runtime artifact
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: m07-runtime-notebook-${{ github.run_id }}
          path: exact-runtime

      - name: Request trusted read OIDC identity for runtime terminal verification
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if(-not $env:ACTIONS_ID_TOKEN_REQUEST_URL -or -not $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN){throw 'GitHub OIDC request context unavailable'}
          $sep=if($env:ACTIONS_ID_TOKEN_REQUEST_URL.Contains('?')){'&'}else{'?'}
          $oidc=Invoke-RestMethod -Uri "$($env:ACTIONS_ID_TOKEN_REQUEST_URL)$($sep)audience=cgp-control-plane-v3" -Headers @{Authorization="Bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN"} -TimeoutSec 30
          $token=[string]$oidc.value
          if($token.Length-lt100){throw 'GitHub read OIDC token unavailable'}
          Write-Host "::add-mask::$token"
          [IO.File]::AppendAllText($env:GITHUB_ENV,"CGP_READ_OIDC_TOKEN=$token`n",[Text.UTF8Encoding]::new($false))

      - name: Wait for exact Kaggle terminal state and validate scientific receipt
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $python=(Get-Command python.exe -ErrorAction SilentlyContinue).Source
          if(-not $python){$python=(Get-Command python -ErrorAction Stop).Source}
          $script=@'
          import json, os, pathlib, sys, time, urllib.error, urllib.parse, urllib.request
          sys.path.insert(0, str(pathlib.Path('scripts').resolve()))
          from m07_runtime_contract import (
              extract_session_state, expected_runtime_contract,
              parse_runtime_token, validate_runtime_receipt,
          )

          runtime_token=os.environ['M07_RUNTIME_STAGE'].strip()
          resolution,attempt=parse_runtime_token(runtime_token)
          expected=expected_runtime_contract(runtime_token)
          owner=expected['owner']
          account_id=expected['account_id']
          slug_files=list(pathlib.Path('exact-runtime').rglob('m07_kernel_slug.txt'))
          exported_kernel_ref=os.environ.get('M07_EXPECTED_KERNEL_REF','').strip()
          if exported_kernel_ref:
              kernel_ref=exported_kernel_ref
              if slug_files:
                  if len(slug_files)!=1:
                      raise SystemExit(f'BLOCKED_EXACT_OBJECT_IDENTITY_MISMATCH: slug_sidecars={len(slug_files)}')
                  artifact_kernel_ref=slug_files[0].read_text(encoding='utf-8-sig').strip()
                  if artifact_kernel_ref!=kernel_ref:
                      raise SystemExit('BLOCKED_EXACT_OBJECT_IDENTITY_MISMATCH: artifact/exported kernel ref drift')
          elif len(slug_files)==1:
              kernel_ref=slug_files[0].read_text(encoding='utf-8-sig').strip()
          else:
              raise SystemExit(f'BLOCKED_EXACT_OBJECT_IDENTITY_MISMATCH: exported_kernel_ref_missing slug_sidecars={len(slug_files)}')
          kernel_owner,kernel_slug=kernel_ref.split('/',1)
          if kernel_owner.lower()!=owner.lower():
              raise SystemExit('BLOCKED_EXACT_OBJECT_IDENTITY_MISMATCH: runtime owner drift')

          endpoint='https://chatgpt-kaggle-gateway.rezanory-chatgpt-plugins.workers.dev/control-plane/v3/read/kaggle'
          oidc_state={
              'token': os.environ.get('CGP_READ_OIDC_TOKEN','').strip(),
              'issued_monotonic': time.monotonic(),
          }
          if len(oidc_state['token'])<100:
              raise SystemExit('BLOCKED_ADMISSION_AUTHORITY_MISSING: read OIDC unavailable')

          def refresh_oidc():
              request_url=os.environ.get('ACTIONS_ID_TOKEN_REQUEST_URL','').strip()
              request_token=os.environ.get('ACTIONS_ID_TOKEN_REQUEST_TOKEN','').strip()
              if not request_url or len(request_token)<20:
                  raise RuntimeError('Runtime terminal OIDC refresh context unavailable')
              sep='&' if '?' in request_url else '?'
              target=request_url+sep+'audience='+urllib.parse.quote('cgp-control-plane-v3',safe='')
              payload=None
              last_error=None
              for attempt in range(1,5):
                  req=urllib.request.Request(
                      target,headers={'Authorization':'Bearer '+request_token,'Accept':'application/json'},
                  )
                  try:
                      with urllib.request.urlopen(req,timeout=30) as response:
                          payload=json.loads(response.read().decode('utf-8','replace') or '{}')
                      break
                  except urllib.error.HTTPError as exc:
                      if not (exc.code in {408,429} or 500 <= exc.code <= 599) or attempt >= 4:
                          raise
                      last_error=exc
                  except (urllib.error.URLError, TimeoutError, OSError) as exc:
                      if attempt >= 4:
                          raise
                      last_error=exc
                  wait_seconds=5*attempt
                  print(
                      'M07_RUNTIME_OIDC_REFRESH_RETRY',
                      json.dumps({'context':'terminal','attempt':attempt,'wait_seconds':wait_seconds,'error':type(last_error).__name__},sort_keys=True),
                      flush=True,
                  )
                  time.sleep(wait_seconds)
              if payload is None:
                  raise RuntimeError('Runtime terminal OIDC refresh exhausted transient retries') from last_error
              token=str(payload.get('value') or '').strip()
              if len(token)<100:
                  raise RuntimeError('Runtime terminal OIDC refresh returned no token')
              oidc_state['token']=token
              oidc_state['issued_monotonic']=time.monotonic()
              return token

          def read(payload,timeout=90):
              if time.monotonic()-float(oidc_state['issued_monotonic'])>=120:
                  refresh_oidc()

              def broker_request(token):
                  req=urllib.request.Request(
                      endpoint,data=json.dumps(payload,separators=(',',':')).encode(),method='POST',
                      headers={'Authorization':'Bearer '+token,'Content-Type':'application/json',
                               'Accept':'application/json','User-Agent':'m07-runtime-terminal/2.2'},
                  )
                  last_error=None
                  for attempt in range(1,5):
                      try:
                          with urllib.request.urlopen(req,timeout=timeout) as response:
                              return json.loads(response.read().decode('utf-8','replace') or '{}')
                      except urllib.error.HTTPError as exc:
                          if exc.code not in {408,429} and not 500 <= exc.code <= 599:
                              raise
                          last_error=exc
                      except (urllib.error.URLError, TimeoutError, OSError) as exc:
                          last_error=exc
                      if attempt==4:
                          raise RuntimeError(
                              'Runtime terminal read broker transient retry exhausted'
                          ) from last_error
                      delay=min(2**(attempt-1),4)
                      print(
                          f'M07_RUNTIME_READ_RETRY scope=terminal '
                          f'attempt={attempt} delay={delay}s',
                          flush=True,
                      )
                      time.sleep(delay)
                  raise RuntimeError(
                      'Runtime terminal read broker transient retry exhausted'
                  ) from last_error

              try:
                  value=broker_request(oidc_state['token'])
              except urllib.error.HTTPError as exc:
                  detail=exc.read(4000).decode('utf-8','replace')
                  if exc.code==403 and 'GitHub OIDC JWT expired' in detail:
                      value=broker_request(refresh_oidc())
                  else:
                      raise RuntimeError(f'Runtime terminal read HTTP {exc.code}: {detail[:1600]}') from exc
              if value.get('ok') is not True or value.get('read_only') is not True:
                  raise RuntimeError('Runtime terminal read broker did not return ok/read_only')
              result=value.get('result')
              if not isinstance(result,dict):
                  raise RuntimeError('Runtime terminal read result missing')
              return result

          evidence_dir=pathlib.Path('runtime-terminal-evidence')
          evidence_dir.mkdir(parents=True,exist_ok=True)
          started=time.time()
          history=[]
          terminal_payload=None
          terminal_state=None
          for poll in range(631):
              payload=read({
                  'action':'raw_read','account_id':account_id,
                  'service':'kernels.KernelsApiService','method':'GetKernelSessionStatus',
                  'body':{'userName':owner,'kernelSlug':kernel_slug},
              },timeout=60)
              state=extract_session_state(payload)
              history.append({'poll':poll,'elapsed_seconds':round(time.time()-started,1),'state':state})
              print('M07_RUNTIME_STATUS',json.dumps(history[-1],sort_keys=True))
              if state in {'COMPLETE','ERROR','CANCEL'}:
                  terminal_payload=payload
                  terminal_state=state
                  break
              if poll==630:
                  break
              time.sleep(20)

          terminal_receipt={
              'schema':'m07.d260914d.runtime.terminal.v1','runtime_stage':runtime_token,
              'kernel_ref':kernel_ref,'resolution':resolution,'attempt':attempt,
              'account_id':account_id,'terminal_state':terminal_state,
              'session_status':terminal_payload,
              'poll_count':len(history),'elapsed_seconds':round(time.time()-started,1),
              'scientific_receipt_validated':False,
              'read_transport':'control-plane-v3-oidc',
              'github_run_id':os.environ.get('GITHUB_RUN_ID',''),
              'source_sha':os.environ.get('GITHUB_SHA',''),
          }
          terminal_path=evidence_dir/'runtime-terminal-receipt.json'
          terminal_path.write_text(json.dumps(terminal_receipt,ensure_ascii=False,indent=2),encoding='utf-8')
          if terminal_state is None:
              raise SystemExit('BLOCKED_VALIDATION_INFRASTRUCTURE: runtime did not reach terminal state inside 210 minutes')
          if terminal_state!='COMPLETE':
              log_tail = ''
              log_error = None
              try:
                  live=read({
                      'action':'live_log','account_id':account_id,
                      'kernel_ref':kernel_ref,'max_chars':40000,
                  },timeout=120)
                  log_tail=str(live.get('log_tail') or '')[-40000:]
              except Exception as exc:
                  log_error=f'{type(exc).__name__}: {exc}'
              if log_tail:
                  (evidence_dir/'runtime-error-log-tail.txt').write_text(log_tail,encoding='utf-8')
              terminal_receipt['runtime_error_log_tail_present']=bool(log_tail)
              terminal_receipt['runtime_error_log_capture_error']=log_error
              terminal_receipt['status']=f'SCIENTIFIC_TERMINAL_{terminal_state}'
              terminal_path.write_text(
                  json.dumps(terminal_receipt,ensure_ascii=False,indent=2),encoding='utf-8'
              )
              raise SystemExit(
                  f'M07_RUNTIME_SCIENTIFIC_TERMINAL_{terminal_state}; '
                  'see runtime-terminal-evidence/runtime-error-log-tail.txt'
              )

          expected_name=f'M07_RUNTIME_R{resolution}_A{attempt:02d}_RECEIPT.json'
          exact_output=read({
              'action':'output_json_files',
              'account_id':account_id,
              'kernel_ref':kernel_ref,
              'file_names':[expected_name],
              'max_bytes_per_file':262144,
          },timeout=180)
          if exact_output.get('account_id')!=account_id or exact_output.get('kernel_ref')!=kernel_ref:
              raise SystemExit('BLOCKED_EXACT_EVIDENCE_LINEAGE_MISMATCH: output broker identity drift')
          if exact_output.get('signed_urls_returned') is not False:
              raise SystemExit('BLOCKED_VALIDATION_INFRASTRUCTURE: signed output URLs escaped read broker')
          exact_files=exact_output.get('files')
          if not isinstance(exact_files,list) or len(exact_files)!=1:
              count=0 if not isinstance(exact_files,list) else len(exact_files)
              raise SystemExit(
                  f'BLOCKED_EXACT_EVIDENCE_LINEAGE_MISMATCH: runtime_receipt_matches={count} expected={expected_name}'
              )
          exact_item=exact_files[0]
          if not isinstance(exact_item,dict) or exact_item.get('file_name')!=expected_name:
              raise SystemExit('BLOCKED_EXACT_EVIDENCE_LINEAGE_MISMATCH: output broker requested-file drift')
          source_name=str(exact_item.get('source_file_name') or '')
          if pathlib.PurePosixPath(source_name).name!=expected_name:
              raise SystemExit('BLOCKED_EXACT_EVIDENCE_LINEAGE_MISMATCH: runtime receipt source basename drift')
          scientific=exact_item.get('json')
          if not isinstance(scientific,dict):
              raise SystemExit('BLOCKED_EXACT_EVIDENCE_LINEAGE_MISMATCH: runtime receipt JSON missing')
          report=validate_runtime_receipt(scientific,token=runtime_token)
          scientific_path=evidence_dir/expected_name
          scientific_path.write_text(json.dumps(scientific,ensure_ascii=False,indent=2),encoding='utf-8')
          terminal_receipt['scientific_receipt_validated']=True
          terminal_receipt['scientific_report']=report
          terminal_receipt['status']='SCIENTIFIC_RECEIPT_PASS'
          terminal_path.write_text(json.dumps(terminal_receipt,ensure_ascii=False,indent=2),encoding='utf-8')
          print('M07_RUNTIME_TERMINAL_SCIENTIFIC_PASS',json.dumps({
              'kernel_ref':kernel_ref,'terminal_state':terminal_state,**report
          },sort_keys=True))
          '@
          $script | & $python -
          if($LASTEXITCODE-ne 0){throw 'M07 runtime terminal/scientific validation failed'}

      - name: Preserve runtime terminal evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: m07-runtime-terminal-evidence-${{ github.run_id }}
          path: runtime-terminal-evidence
          if-no-files-found: warn
          retention-days: 30

