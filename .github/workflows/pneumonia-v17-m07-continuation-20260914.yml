          $launch=@($jobs.jobs|Where-Object{$_.name-eq 'launch-m07-continuation'})
          if($launch.Count-ne 1-or [string]$launch[0].conclusion-ne 'success'){throw 'BLOCKED_PREDECESSOR_EXACT_GREEN_MISSING: Phase2 launch job is not exact green'}
          $artifacts=Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs/$env:SOURCE_RUN_ID/artifacts?per_page=100" -Headers $headers
          $expected="phase2-unit-notebook-$env:SOURCE_RUN_ID"
          $matches=@($artifacts.artifacts|Where-Object{$_.name-eq $expected-and -not $_.expired})
          if($matches.Count-ne 1){throw 'BLOCKED_EXACT_OBJECT_IDENTITY_MISMATCH: exact Phase2 source artifact unavailable'}
          $expectedReceipt="phase2-unit-orchestration-receipt-$env:SOURCE_RUN_ID"
          $receiptMatches=@($artifacts.artifacts|Where-Object{$_.name-eq $expectedReceipt-and -not $_.expired})
          if($receiptMatches.Count-ne 1){throw 'BLOCKED_EXACT_OBJECT_IDENTITY_MISMATCH: exact Phase2 launch receipt artifact unavailable'}

      - name: Download exact original Phase-2 unit artifact
        uses: actions/download-artifact@v4
        with:
