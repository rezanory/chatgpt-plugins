      - name: Enforce immutable runtime attempt and duplicate-GPU preflight
        if: ${{ github.ref == 'refs/heads/main' && startsWith(github.event.inputs.recovery, 'M07_RUNTIME_M07_R') }}
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $python=(Get-Command python.exe -ErrorAction SilentlyContinue).Source
          if(-not $python){$python=(Get-Command python -ErrorAction Stop).Source}
          $script=@'
          import json, os, pathlib, sys, time, urllib.error, urllib.parse, urllib.request
          sys.path.insert(0, str(pathlib.Path('scripts').resolve()))
          from m07_runtime_contract import (
              assess_runtime_inventory, expected_runtime_contract,
              parse_runtime_kernel_ref, validate_runtime_state_dataset,
          )

          runtime_token=os.environ['CGP_RUNTIME_STAGE'].strip()
          expected=expected_runtime_contract(runtime_token)
          owner=expected['owner']
          resolution=int(expected['resolution'])
          endpoint='https://chatgpt-kaggle-gateway.rezanory-chatgpt-plugins.workers.dev/control-plane/v3/read/kaggle'
          oidc_state={
              'token': os.environ.get('CGP_READ_OIDC_TOKEN','').strip(),
              'issued_monotonic': time.monotonic(),
          }
          if len(oidc_state['token'])<100:
              raise SystemExit('BLOCKED_ADMISSION_AUTHORITY_MISSING: read OIDC unavailable')

          def refresh_oidc():
              request_url=os.environ.get('ACTIONS_ID_TOKEN_REQUEST_URL','').strip()
              request_token=os.environ.get('ACTIONS_ID_TOKEN_REQUEST_TOKEN','').strip()
              if not request_url or len(request_token)<20:
                  raise RuntimeError('Runtime admission OIDC refresh context unavailable')
              sep='&' if '?' in request_url else '?'
              target=request_url+sep+'audience='+urllib.parse.quote('cgp-control-plane-v3',safe='')
              payload=None
              last_error=None
              for attempt in range(1,5):
                  req=urllib.request.Request(
                      target,headers={'Authorization':'Bearer '+request_token,'Accept':'application/json'},
                  )
                  try:
                      with urllib.request.urlopen(req,timeout=30) as response:
                          payload=json.loads(response.read().decode('utf-8','replace') or '{}')
                      break
                  except urllib.error.HTTPError as exc:
                      if not (exc.code in {408,429} or 500 <= exc.code <= 599) or attempt >= 4:
                          raise
                      last_error=exc
                  except (urllib.error.URLError, TimeoutError, OSError) as exc:
                      if attempt >= 4:
                          raise
                      last_error=exc
                  wait_seconds=5*attempt
                  print(
                      'M07_RUNTIME_OIDC_REFRESH_RETRY',
                      json.dumps({'context':'admission','attempt':attempt,'wait_seconds':wait_seconds,'error':type(last_error).__name__},sort_keys=True),
                      flush=True,
                  )
                  time.sleep(wait_seconds)
              if payload is None:
                  raise RuntimeError('Runtime admission OIDC refresh exhausted transient retries') from last_error
              token=str(payload.get('value') or '').strip()
              if len(token)<100:
                  raise RuntimeError('Runtime admission OIDC refresh returned no token')
              oidc_state['token']=token
              oidc_state['issued_monotonic']=time.monotonic()
              return token

          def read(payload):
              if time.monotonic()-float(oidc_state['issued_monotonic'])>=120:
                  refresh_oidc()

              def broker_request(token):
                  req=urllib.request.Request(
                      endpoint,data=json.dumps(payload,separators=(',',':')).encode(),method='POST',
                      headers={'Authorization':'Bearer '+token,'Content-Type':'application/json',
                               'Accept':'application/json','User-Agent':'m07-runtime-admission/1.2'},
                  )
                  last_error=None
                  for attempt in range(1,5):
                      try:
                          with urllib.request.urlopen(req,timeout=90) as response:
                              return json.loads(response.read().decode('utf-8','replace') or '{}')
                      except urllib.error.HTTPError as exc:
                          if exc.code not in {408,429} and not 500 <= exc.code <= 599:
                              raise
                          last_error=exc
                      except (urllib.error.URLError, TimeoutError, OSError) as exc:
                          last_error=exc
                      if attempt==4:
                          raise RuntimeError(
                              'Runtime admission read broker transient retry exhausted'
                          ) from last_error
                      delay=min(2**(attempt-1),4)
                      print(
                          f'M07_RUNTIME_READ_RETRY scope=admission '
                          f'attempt={attempt} delay={delay}s',
                          flush=True,
                      )
                      time.sleep(delay)
                  raise RuntimeError(
                      'Runtime admission read broker transient retry exhausted'
                  ) from last_error

              try:
                  value=broker_request(oidc_state['token'])
              except urllib.error.HTTPError as exc:
                  detail=exc.read(4000).decode('utf-8','replace')
                  if exc.code==403 and 'GitHub OIDC JWT expired' in detail:
                      value=broker_request(refresh_oidc())
                  else:
                      raise RuntimeError(f'Runtime admission read HTTP {exc.code}: {detail[:1600]}') from exc
              if value.get('ok') is not True or value.get('read_only') is not True:
                  raise RuntimeError('Runtime admission read broker did not return ok/read_only')
              result=value.get('result')
              if not isinstance(result,dict):
                  raise RuntimeError('Runtime admission read result missing')
              return result

          listed=read({
              'action':'raw_read','account_id':expected['account_id'],
              'service':'kernels.KernelsApiService','method':'ListKernels',
              'body':{'group':'PROFILE','user':owner,'sortBy':'DATE_RUN','page':1,'pageSize':100},
          })
          kernels=[item for item in (listed.get('kernels') or []) if isinstance(item,dict)]
          statuses={}
          for item in kernels:
              ref=str(item.get('ref') or '').strip()
              parsed=parse_runtime_kernel_ref(ref)
              if parsed is None or parsed['owner'].lower()!=owner.lower() or parsed['resolution']!=resolution:
                  continue
              slug=ref.split('/',1)[1]
              statuses[ref]=read({
                  'action':'raw_read','account_id':expected['account_id'],
                  'service':'kernels.KernelsApiService','method':'GetKernelSessionStatus',
                  'body':{'userName':owner,'kernelSlug':slug},
              })
          report=assess_runtime_inventory(token=runtime_token,kernels=kernels,statuses=statuses)
          if resolution == 384 and int(expected['attempt']) > 1:
              dataset=read({
                  'action':'raw_read','account_id':expected['account_id'],
                  'service':'datasets.DatasetApiService','method':'GetDataset',
                  'body':{'ownerSlug':'trickermark','datasetSlug':'m07-gate-r384-state-v1-7'},
              })
              report['state_dataset']=validate_runtime_state_dataset(
                  dataset,token=runtime_token
              )
          report.update({
              'schema':'m07.d260914d.runtime.admission.v1',
              'account_id':expected['account_id'],'owner':owner,
              'source_sha':os.environ.get('GITHUB_SHA',''),
              'github_run_id':os.environ.get('GITHUB_RUN_ID',''),
          })
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'m07-runtime-admission-preflight.json'
          out.write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print('M07_RUNTIME_ADMISSION_PASS',json.dumps(report,sort_keys=True))
          '@
          $script | & $python -
          if($LASTEXITCODE-ne 0){throw 'M07 immutable runtime admission preflight failed'}

      - name: Enforce exact Phase-2 unit and duplicate-GPU preflight
        if: ${{ github.ref == 'refs/heads/main' && startsWith(github.event.inputs.recovery, 'PHASE2_UNIT_') }}
