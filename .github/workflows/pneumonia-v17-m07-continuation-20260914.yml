            'PHASE2_VERIFY_M12_R224_A01'=@{token='PHASE2_UNIT_M12_R224_A01';run_id='35531424115'}
            'PHASE2_VERIFY_M01_R224_A03'=@{token='PHASE2_UNIT_M01_R224_A03';run_id='35539262689';source_sha='a52431acca1d3ae55f17c045f649d01a8b8a71c8'}
            'PHASE2_VERIFY_M02_R224_A03'=@{token='PHASE2_UNIT_M02_R224_A03';run_id='35539265230';source_sha='a52431acca1d3ae55f17c045f649d01a8b8a71c8'}
            'PHASE2_VERIFY_M03_R224_A03'=@{token='PHASE2_UNIT_M03_R224_A03';run_id='35539268161';source_sha='a52431acca1d3ae55f17c045f649d01a8b8a71c8'}
            'PHASE2_VERIFY_M04_R224_A03'=@{token='PHASE2_UNIT_M04_R224_A03';run_id='35539270533';source_sha='a52431acca1d3ae55f17c045f649d01a8b8a71c8'}
            'PHASE2_VERIFY_M05_R224_A03'=@{token='PHASE2_UNIT_M05_R224_A03';run_id='35539272554';source_sha='a52431acca1d3ae55f17c045f649d01a8b8a71c8'}
            'PHASE2_VERIFY_M06_R224_A03'=@{token='PHASE2_UNIT_M06_R224_A03';run_id='35539274778';source_sha='a52431acca1d3ae55f17c045f649d01a8b8a71c8'}
            'PHASE2_VERIFY_M08_R224_A03'=@{token='PHASE2_UNIT_M08_R224_A03';run_id='35539277136';source_sha='a52431acca1d3ae55f17c045f649d01a8b8a71c8'}
            'PHASE2_VERIFY_M09_R224_A03'=@{token='PHASE2_UNIT_M09_R224_A03';run_id='35539279566';source_sha='a52431acca1d3ae55f17c045f649d01a8b8a71c8'}
            'PHASE2_VERIFY_M10_R224_A03'=@{token='PHASE2_UNIT_M10_R224_A03';run_id='35539282287';source_sha='a52431acca1d3ae55f17c045f649d01a8b8a71c8'}
            'PHASE2_VERIFY_M11_R224_A03'=@{token='PHASE2_UNIT_M11_R224_A03';run_id='35539284809';source_sha='a52431acca1d3ae55f17c045f649d01a8b8a71c8'}
            'PHASE2_VERIFY_M12_R224_A03'=@{token='PHASE2_UNIT_M12_R224_A03';run_id='35539287827';source_sha='a52431acca1d3ae55f17c045f649d01a8b8a71c8'}
            'PHASE2_VERIFY_M01_R224_A09'=@{token='PHASE2_UNIT_M01_R224_A09';run_id='35565651205';source_sha='eb17d2d6964864bba89b0d32fa17332dd3c30b78'}
            'PHASE2_VERIFY_M04_R224_A09'=@{token='PHASE2_UNIT_M04_R224_A09';run_id='35565652015';source_sha='eb17d2d6964864bba89b0d32fa17332dd3c30b78'}
          }
          $identity=$map[$env:PHASE2_RECOVERY_MARKER]
          if($null-eq $identity){throw 'BLOCKED_ADMISSION_AUTHORITY_MISSING: Phase2 recovery marker is not allowlisted'}
          $sourceSha=if($identity.source_sha){[string]$identity.source_sha}else{$env:PHASE2_INITIAL_LAUNCH_SHA}
          [IO.File]::AppendAllText(
            $env:GITHUB_OUTPUT,
            "source_token=$($identity.token)`nsource_run_id=$($identity.run_id)`nsource_sha=$sourceSha`n",
