                  result = json.loads(response.read().decode("utf-8", "replace") or "{}")
          except urllib.error.HTTPError as error:
              raise SystemExit(f"Continuation SaveKernel HTTP {error.code}: {error.read(4000).decode('utf-8', 'replace')[:1800]}")
          if not result.get("ok"):
              raise SystemExit("Continuation action broker returned ok=false")
          provider_ref = result.get("provider_ref") or (result.get("result") or {}).get("ref")
          launch = {
              "schema": ("pneumonia.phase2.unit.orchestration.v1"
                         if runtime_stage.startswith("PHASE2_UNIT_")
                         else "m07.d260914d.runtime.orchestration.v2"),
              "status": "ORCHESTRATION_ACCEPTED_PENDING_SCIENTIFIC_TERMINAL",
              "accepted": True,
              "runtime_stage": runtime_stage,
              "account_id": os.environ["CGP_ACCOUNT_ID"].strip(),
              "owner": os.environ["CGP_ACCOUNT_OWNER"].strip(),
              "kernel_ref": os.environ["CGP_KERNEL_SLUG"].strip(),
              "kernel_title": os.environ["CGP_KERNEL_TITLE"].strip(),
              "notebook_sha256": os.environ.get("CGP_NOTEBOOK_SHA256", "").strip(),
              "provider_ref": provider_ref,
              "broker_run_id": result.get("broker_run_id"),
              "broker_sha": result.get("broker_sha"),
              "github_run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "source_sha": os.environ.get("GITHUB_SHA", ""),
              "dataset_sources": dataset_sources,
              "machine_shape": body.get("machineShape"),
              "scientific_pass": False,
          }
          if runtime_stage.startswith(("M07_RUNTIME_M07_R", "PHASE2_UNIT_")):
              receipt_name = ("phase2-unit-launch-receipt.json"
                              if runtime_stage.startswith("PHASE2_UNIT_")
                              else "m07-runtime-launch-receipt.json")
              pathlib.Path(os.environ["RUNNER_TEMP"], receipt_name).write_text(
                  json.dumps(launch, ensure_ascii=False, indent=2), encoding="utf-8"
              )
          if runtime_stage.startswith("PHASE2_UNIT_"):
              provider_path = str(provider_ref or "").strip().strip("/").split("/")
              if len(provider_path) != 3 or provider_path[0].lower() != "code":
                  raise SystemExit("Phase2 SaveKernel provider_ref missing or invalid")
              provider_kernel_ref = f"{provider_path[1]}/{provider_path[2]}"
              expected_provider_ref = (
                  f"{os.environ['CGP_ACCOUNT_OWNER'].strip()}/"
                  f"pneumonia-v1-7-phase2-{runtime_stage[12:15].lower()}-"
                  f"r{runtime_stage[17:20]}-a{runtime_stage[22:24]}-"
                  f"{os.environ.get('GITHUB_RUN_ID', '')}"
              )
              if provider_kernel_ref.lower() != expected_provider_ref.lower():
                  raise SystemExit("Phase2 SaveKernel provider_ref identity drift")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  output.write(f"provider_kernel_ref={provider_kernel_ref}\n")
          print(json.dumps(launch, ensure_ascii=False))
          '@
          $script | & $python -
          if($LASTEXITCODE -ne 0){throw 'Scientific runtime SaveKernel submission failed'}

      - name: Preserve runtime orchestration receipt
        if: ${{ always() && (startsWith(github.event.inputs.recovery, 'M07_RUNTIME_M07_R') || startsWith(github.event.inputs.recovery, 'PHASE2_UNIT_')) }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ startsWith(github.event.inputs.recovery, 'PHASE2_UNIT_') && 'phase2-unit-orchestration-receipt' || 'm07-runtime-orchestration-receipt' }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/m07-runtime-launch-receipt.json
            ${{ runner.temp }}/m07-runtime-admission-preflight.json
            ${{ runner.temp }}/phase2-unit-launch-receipt.json
            ${{ runner.temp }}/phase2-unit-admission-preflight.json
          if-no-files-found: warn
          retention-days: 30

      - name: Publish continuation launch receipt
        if: ${{ always() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $h=@{Authorization="Bearer $env:GITHUB_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          $mode=if($env:CGP_RUNTIME_STAGE -like 'PHASE2_UNIT_*'){$env:CGP_RUNTIME_STAGE}elseif($env:CGP_RUNTIME_STAGE -like 'M07_RUNTIME_M07_R*'){$env:CGP_RUNTIME_STAGE}elseif($env:CGP_PHASE2_UNLOCK -eq 'true'){'PHASE2 UNLOCK'}else{'LOCKED TEST DIAGNOSTICS FIX1'}
          $approval=if($env:CGP_RUNTIME_STAGE -like 'PHASE2_UNIT_*'){$env:CGP_RUNTIME_STAGE}elseif($env:CGP_RUNTIME_STAGE -like 'M07_RUNTIME_M07_R*'){$env:CGP_RUNTIME_STAGE}elseif($env:CGP_PHASE2_UNLOCK -eq 'true'){'M07_PHASE2_UNLOCK_APPROVED_BY_USER'}else{'none'}
          $body="## PNEUMONIA V1.7 $mode ATTEMPT`n- GitHub run: ``$env:GITHUB_RUN_ID```n- Account: ``$env:CGP_ACCOUNT_ID`` / ``$env:CGP_ACCOUNT_OWNER```n- Kernel: ``$env:CGP_KERNEL_SLUG```n- Predecessor: ``rezanory/m07-final-5fold-fix2-20260914`` exact COMPLETE + artifact PASS`n- Scientific guard: exact persisted evidence is reused; bounded runtime mode completes at most one missing fold and defers locked-test reporting until five folds are validated`n- Approval token: ``$approval```n- This is an orchestration receipt only; PASS requires Kaggle completion and exact scientific evidence."
          Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/issues/33/comments" -Method Post -Headers $h -ContentType 'application/json; charset=utf-8' -Body (@{body=$body}|ConvertTo-Json -Compress) | Out-Null

  recover-phase2-unit-terminal:
    name: Recover exact initial Phase-2 unit scientific terminal
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
