      - name: Request trusted read OIDC identity for runtime admission
        if: ${{ github.ref == 'refs/heads/main' && (startsWith(github.event.inputs.recovery, 'M07_RUNTIME_M07_R') || startsWith(github.event.inputs.recovery, 'PHASE2_UNIT_')) }}
        shell: powershell
        run: |
