                          else "d260914d M07 continuation after exact final-five-fold PASS; reuse persisted folds, run OOF/one-time Locked Test/diagnostics/figures/XAI/casebook/external/final gate; Phase2 remains locked."),
              "service": "kernels.KernelsApiService", "method": "SaveKernel",
              "body": {"slug": os.environ["CGP_KERNEL_SLUG"].strip(), "newTitle": os.environ["CGP_KERNEL_TITLE"].strip(), "text": notebook, "language": "PYTHON", "kernelType": "NOTEBOOK", "kernelExecutionType": "SAVE_AND_RUN_ALL", "isPrivate": True, "enableGpu": True, "enableInternet": True, "datasetDataSources": ["paultimothymooney/chest-xray-pneumonia", "rezanory/m07-final-5fold-fix2-d260914d"]},
          }
          req = urllib.request.Request(endpoint, data=json.dumps(payload, separators=(",", ":")).encode(), method="POST", headers={"Authorization": "Bearer " + os.environ["CGP_ACTION_OIDC_TOKEN"], "Content-Type": "application/json", "Accept": "application/json", "User-Agent": "pneumonia-v17-continuation/1.0"})
          try:
              with urllib.request.urlopen(req, timeout=240) as response:
                  result = json.loads(response.read().decode("utf-8", "replace") or "{}")
          except urllib.error.HTTPError as error:
              raise SystemExit(f"Continuation SaveKernel HTTP {error.code}: {error.read(4000).decode('utf-8', 'replace')[:1800]}")
          if not result.get("ok"):
              raise SystemExit("Continuation action broker returned ok=false")
          print(json.dumps({"accepted": True, "account_id": os.environ["CGP_ACCOUNT_ID"], "owner": os.environ["CGP_ACCOUNT_OWNER"], "provider_ref": result.get("provider_ref") or (result.get("result") or {}).get("ref"), "broker_run_id": result.get("broker_run_id"), "broker_sha": result.get("broker_sha"), "phase2_unlocked": "PHASE2_UNLOCK" in os.environ["CGP_NOTEBOOK_PATH"]}, ensure_ascii=False))
          '@
          $script | & $python -
          if($LASTEXITCODE -ne 0){throw 'M07 continuation SaveKernel submission failed'}

      - name: Publish continuation launch receipt
        if: ${{ always() && github.ref == 'refs/heads/main' }}
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $h=@{Authorization="Bearer $env:GITHUB_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          $mode=if($env:CGP_RUNTIME_STAGE -like 'M07_RUNTIME_M07_R*'){$env:CGP_RUNTIME_STAGE}elseif($env:CGP_PHASE2_UNLOCK -eq 'true'){'PHASE2 UNLOCK'}else{'LOCKED TEST DIAGNOSTICS FIX1'}
          $approval=if($env:CGP_RUNTIME_STAGE -like 'M07_RUNTIME_M07_R*'){$env:CGP_RUNTIME_STAGE}elseif($env:CGP_PHASE2_UNLOCK -eq 'true'){'M07_PHASE2_UNLOCK_APPROVED_BY_USER'}else{'none'}
          $body="## PNEUMONIA V1.7 d260914d M07 $mode ATTEMPT`n- GitHub run: ``$env:GITHUB_RUN_ID```n- Account: ``$env:CGP_ACCOUNT_ID`` / ``$env:CGP_ACCOUNT_OWNER```n- Kernel: ``$env:CGP_KERNEL_SLUG```n- Predecessor: ``rezanory/m07-final-5fold-fix2-20260914`` exact COMPLETE + artifact PASS`n- Scientific guard: exact persisted five-fold evidence reused; bounded runtime mode completes at most one missing fold`n- Approval token: ``$approval```n- This is an orchestration receipt only; PASS requires Kaggle completion and exact final gate evidence."
          Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/issues/33/comments" -Method Post -Headers $h -ContentType 'application/json; charset=utf-8' -Body (@{body=$body}|ConvertTo-Json -Compress) | Out-Null

  launch-exact-runtime-from-artifact:
    name: Launch exact M07 runtime candidate
    needs: launch-m07-continuation
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          github.ref != 'refs/heads/main' &&
          (startsWith(github.event.inputs.recovery, 'M07_RUNTIME_M07_R320_A') ||
           startsWith(github.event.inputs.recovery, 'M07_RUNTIME_M07_R384_A')) }}
    # Keep the artifact launch on the same trusted self-hosted pool so a
    # GitHub-hosted billing failure cannot strand an admitted candidate.
    runs-on: [self-hosted, windows, x64, v622]
    timeout-minutes: 15
    environment: >-
      ${{ github.event.inputs.runtime_account == 'kg-03' && 'kaggle-03' ||
          github.event.inputs.runtime_account == 'kg-05' && 'kaggle-05' ||
          github.event.inputs.runtime_account == 'kg-08' && 'kaggle-08' ||
          github.event.inputs.runtime_account == 'kg-09' && 'kaggle-09' ||
          github.event.inputs.runtime_account == 'kg-10' && 'kaggle-10' ||
          github.event.inputs.runtime_account == 'kg-11' && 'kaggle-11' ||
          (startsWith(github.event.inputs.recovery, 'M07_RUNTIME_M07_R320_') && 'kaggle-03' || 'kaggle-05') }}
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      EXPECTED_MACHINE_SHAPE: NvidiaTeslaT4
      # Use the Cloudflare-backed token path for both the dataset owner (kg-03)
      # and the explicitly shared viewer (kg-05).  The direct GitHub environment
      # token for kg-03 is stale (401), while the broker secret is current; kg-03
      # is required here because only the dataset owner can publish persistence
      # versions.
      CGP_USE_KAGGLE_BROKER: ${{ (github.event.inputs.runtime_account == 'kg-03' || github.event.inputs.runtime_account == 'kg-05') && '1' || '0' }}
    steps:
      - name: Download the exact notebook built by this run
        uses: actions/download-artifact@v4
        with:
          name: m07-runtime-notebook-${{ github.run_id }}
          path: exact-runtime

      - name: Request trusted action OIDC identity for Cloudflare-backed account
        if: ${{ env.CGP_USE_KAGGLE_BROKER == '1' }}
        shell: 'C:/PROGRA~1/Git/bin/bash.exe --noprofile --norc -eo pipefail {0}'
        run: |
          set -euo pipefail
          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]]; then
            echo 'BLOCKED_ADMISSION_AUTHORITY_MISSING: GitHub OIDC context unavailable' >&2
            exit 1
          fi
          sep='?'
          [[ "$ACTIONS_ID_TOKEN_REQUEST_URL" == *\?* ]] && sep='&'
          raw="$(curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}${sep}audience=cgp-control-plane-v3-action")"
          token="$(RAW_JSON="$raw" python - <<'PY'
          import json, os
          value=json.loads(os.environ['RAW_JSON']).get('value','')
          if not isinstance(value,str) or len(value)<100:
              raise SystemExit('OIDC token unavailable')
          print(value)
          PY
          )"
          echo "::add-mask::$token"
          printf 'CGP_ACTION_OIDC_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"

      - name: Install read-only Kaggle identity client
        shell: 'C:/PROGRA~1/Git/bin/bash.exe --noprofile --norc -eo pipefail {0}'
        run: python -m pip install -q 'kagglehub>=1.0,<2'

      - name: Verify identity, exact bytes and immutable runtime contract
        shell: 'C:/PROGRA~1/Git/bin/bash.exe --noprofile --norc -eo pipefail {0}'
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, json, os, pathlib, urllib.request
          import kagglehub

          use_broker=os.environ.get('CGP_USE_KAGGLE_BROKER') == '1'
          token=(os.environ.get('KAGGLE_API_TOKEN') or '').strip()
          if not token and not use_broker:
              raise SystemExit('BLOCKED_ADMISSION_AUTHORITY_MISSING: selected Kaggle token absent')
          contract_paths=list(pathlib.Path('exact-runtime').rglob('m07_runtime_contract.json'))
          if len(contract_paths)!=1:
              raise SystemExit(f'BLOCKED_EXACT_OBJECT_IDENTITY_MISMATCH: contract_count={len(contract_paths)}')
          contract=json.loads(contract_paths[0].read_text(encoding='utf-8'))
          if contract.get('schema')!='m07.d260914d.runtime.contract.v1':
              raise SystemExit('BLOCKED_EXACT_EVIDENCE_LINEAGE_MISMATCH: runtime contract schema')
          owner=str(contract.get('owner') or '').strip()
          account_id=str(contract.get('account_id') or '').strip()
          kernel_ref=str(contract.get('kernel_slug') or '').strip()
          if not owner or not account_id or '/' not in kernel_ref:
              raise SystemExit('BLOCKED_EXACT_EVIDENCE_LINEAGE_MISMATCH: runtime contract identity incomplete')
          auth=('Bearer '+token if token.startswith('KGAT_') else
                'Basic '+base64.b64encode(f'{owner}:{token}'.encode()).decode()) if token else None

          def post(service, method, body, timeout=60):
              req=urllib.request.Request(
                  f'https://api.kaggle.com/v1/{service}/{method}',
                  data=json.dumps(body,separators=(',',':')).encode(),
                  method='POST',
                  headers={'Authorization':auth,'Content-Type':'application/json',
                  'Accept':'application/json','User-Agent':'m07-exact-runtime-launch/1.0'},
              )
              with urllib.request.urlopen(req,timeout=timeout) as response:
                  raw=response.read().decode('utf-8','replace')
                  return response.status,(json.loads(raw) if raw else {})

          if use_broker:
              broker_token=os.environ.get('CGP_ACTION_OIDC_TOKEN','').strip()
              if not broker_token:
                  raise SystemExit('BLOCKED_ADMISSION_AUTHORITY_MISSING: action broker token absent')
              endpoint='https://chatgpt-kaggle-gateway.rezanory-chatgpt-plugins.workers.dev/control-plane/v3/action/kaggle'
              payload={
                  'request_id':f"m07-runtime-identity-{os.environ['GITHUB_RUN_ID']}",
                  'provider':'kaggle','operation_class':'compute','account_id':account_id,
                  'purpose':'Read-only identity/quota preflight for exact M07 runtime; no kernel mutation.',
                  'service':'kernels.KernelsApiService','method':'GetAcceleratorQuotaStatistics','body':{},
              }
              req=urllib.request.Request(endpoint,data=json.dumps(payload,separators=(',',':')).encode(),method='POST',headers={
                  'Authorization':'Bearer '+broker_token,'Content-Type':'application/json','Accept':'application/json',
                  'User-Agent':'m07-exact-runtime-identity-preflight/1.0'})
              with urllib.request.urlopen(req,timeout=60) as response:
                  envelope=json.loads(response.read().decode('utf-8','replace') or '{}')
              if envelope.get('ok') is not True or envelope.get('account_id') != account_id:
                  raise SystemExit(f'BLOCKED_ADMISSION_AUTHORITY_MISSING: broker identity response={envelope!r}')
              detected=owner
          else:
              me=kagglehub.whoami()
              detected=str((me or {}).get('username') or '').strip()
          if detected.lower()!=owner.lower():
              raise SystemExit(f'BLOCKED_EXACT_OBJECT_IDENTITY_MISMATCH: expected={owner} detected={detected or "UNKNOWN"}')

          paths=list(pathlib.Path('exact-runtime').rglob('*.ipynb'))
          if len(paths)!=1:
              raise SystemExit(f'BLOCKED_EXACT_OBJECT_IDENTITY_MISMATCH: notebook_count={len(paths)}')
          path=paths[0]
          raw=path.read_bytes()
          sha=hashlib.sha256(raw).hexdigest()
          if sha!=contract.get('notebook_sha256'):
              raise SystemExit(f'BLOCKED_EXACT_OBJECT_IDENTITY_MISMATCH: sha={sha} contract_sha={contract.get("notebook_sha256")!r}')
          notebook=json.loads(raw.decode('utf-8'))
          meta=notebook.get('metadata',{}).get('cgp_continuation',{})
          runtime=meta.get('runtime_partition') or {}
          required={
              'campaign_id':'d260914d',
              'persistence_handle':'rezanory/m07-final-5fold-fix2-d260914d',
              'locked_test_used':False,
              'external_used':False,
              'phase2_unlocked':True,
          }
          for key,value in required.items():
              if meta.get(key)!=value:
                  raise SystemExit(f'BLOCKED_EXACT_EVIDENCE_LINEAGE_MISMATCH: {key}={meta.get(key)!r}')
          runtime_required={
              'enabled':True,'resolution':int(contract['resolution']),
              'attempt':int(contract['attempt']),
              'account_id':account_id,
              'owner':owner,
              'source_persistence_handle':'rezanory/m07-final-5fold-fix2-d260914d',
              'max_new_folds':1,
          }
          for key,value in runtime_required.items():
              if runtime.get(key)!=value:
                  raise SystemExit(f'BLOCKED_EXACT_EVIDENCE_LINEAGE_MISMATCH: runtime.{key}={runtime.get(key)!r}')
          pathlib.Path('verified-notebook-path.txt').write_text(str(path),encoding='utf-8')
          print(json.dumps({'identity':'PASS','owner':detected,'sha256':sha,
                            'account_id':account_id,'kernel_ref':kernel_ref,
                            'runtime_partition':runtime},sort_keys=True))
          PY

      - name: Submit once and prove the Kaggle session is admitted
        shell: 'C:/PROGRA~1/Git/bin/bash.exe --noprofile --norc -eo pipefail {0}'
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, json, os, pathlib, time, urllib.error, urllib.request

          use_broker=os.environ.get('CGP_USE_KAGGLE_BROKER') == '1'
          token=(os.environ.get('KAGGLE_API_TOKEN') or '').strip()
          contract_paths=list(pathlib.Path('exact-runtime').rglob('m07_runtime_contract.json'))
          if len(contract_paths)!=1:
              raise SystemExit(f'BLOCKED_EXACT_OBJECT_IDENTITY_MISMATCH: contract_count={len(contract_paths)}')
          contract=json.loads(contract_paths[0].read_text(encoding='utf-8'))
          owner=str(contract.get('owner') or '').strip()
          account_id=str(contract.get('account_id') or '').strip()
          kernel_ref=str(contract.get('kernel_slug') or '').strip()
          kernel_title=str(contract.get('kernel_title') or '').strip()
          if not token and not use_broker:
              raise SystemExit('BLOCKED_ADMISSION_AUTHORITY_MISSING: selected Kaggle token absent')
          if not owner or not account_id or '/' not in kernel_ref or not kernel_title:
              raise SystemExit('BLOCKED_EXACT_EVIDENCE_LINEAGE_MISMATCH: runtime contract identity incomplete')
          auth=('Bearer '+token if token.startswith('KGAT_') else
                'Basic '+base64.b64encode(f'{owner}:{token}'.encode()).decode()) if token else None
          notebook_path=pathlib.Path(pathlib.Path('verified-notebook-path.txt').read_text(encoding='utf-8'))
          kernel_owner,slug=kernel_ref.split('/',1)
          if kernel_owner!=owner:
              raise SystemExit('BLOCKED_EXACT_OBJECT_IDENTITY_MISMATCH: kernel owner drift')

          def post(service, method, body, timeout=240, allow_missing=False):
              req=urllib.request.Request(
                  f'https://api.kaggle.com/v1/{service}/{method}',
                  data=json.dumps(body,separators=(',',':')).encode(),
                  method='POST',
                  headers={'Authorization':auth,'Content-Type':'application/json',
                           'Accept':'application/json','User-Agent':'m07-exact-runtime-launch/1.0'},
              )
              try:
                  with urllib.request.urlopen(req,timeout=timeout) as response:
                      raw=response.read().decode('utf-8','replace')
                      return response.status,(json.loads(raw) if raw else {})
              except urllib.error.HTTPError as exc:
                  raw=exc.read(4000).decode('utf-8','replace')
                  if allow_missing and exc.code in (400,404):
                      return exc.code,{'missing':True,'detail':raw[:600]}
                  raise RuntimeError(f'HTTP {exc.code}: {raw[:1200]}') from exc

          # Scoped Kaggle account tokens can be valid for submission while
          # denying kernels.get/ListKernels.  The immutable slug is unique for
          # this run, so submit exactly once and retain the provider response;
          # a status probe is best-effort and never replayed after a timeout.
          before={}
          action='SUBMITTED_NEW'
          if action == 'SUBMITTED_NEW':
              # Attach the exact state dataset for this immutable runtime
              # partition.  A04 is the one recovery run whose source state is
              # explicitly frozen to reza's immutable Version 4; later
              # attempts must resume the state dataset owned by the execution
              # account after A04 publishes its sealed successor.  The
              # notebook still pins `/versions/4` for A04, while this parent
              # attachment makes the non-interactive Kaggle session admit it.
              dataset_sources=['paultimothymooney/chest-xray-pneumonia',
                               'rezanory/m07-final-5fold-fix2-d260914d']
              # The artifact-launch job receives only the sealed contract;
              # derive the resolution and owner from that contract rather
              # than relying on builder-local variables.
              if int(contract.get('resolution') or 0) == 320:
                  runtime_stage=str(contract.get('runtime_stage') or '').strip()
                  state_owner=(
                      'rezanory'
                      if runtime_stage == 'M07_RUNTIME_M07_R320_A04'
                      else owner
                  )
                  state_attachment=str(contract.get('source_phase2_state_attachment') or '').strip()
                  expected_state_attachment=(
                      'rezanory/m07-gate-r320-state-v1-7-immutable-v4'
                      if runtime_stage == 'M07_RUNTIME_M07_R320_A07'
                      else 'rezanory/m07-gate-r320-state-v1-7/4'
                  )
                  if state_attachment:
                      if state_attachment != expected_state_attachment:
                          raise SystemExit('BLOCKED_EXACT_EVIDENCE_LINEAGE_MISMATCH: R320 attachment drift')
                      dataset_sources.append(state_attachment)
                  else:
                      dataset_sources.append(f'{state_owner}/m07-gate-r320-state-v1-7')
              body={
                  'slug':kernel_ref,
                  'newTitle':kernel_title,
                  'text':notebook_path.read_text(encoding='utf-8'),
                  'language':'PYTHON','kernelType':'NOTEBOOK',
                  'kernelExecutionType':'SAVE_AND_RUN_ALL',
                  'isPrivate':True,'enableGpu':True,'enableInternet':True,
                  'machineShape':os.environ['EXPECTED_MACHINE_SHAPE'],
                  'datasetDataSources':dataset_sources,
              }
              if use_broker:
                  broker_token=os.environ.get('CGP_ACTION_OIDC_TOKEN','').strip()
                  if not broker_token:
                      raise SystemExit('BLOCKED_ADMISSION_AUTHORITY_MISSING: action broker token absent')
                  broker_payload={
                      'request_id':f"m07-runtime-save-{os.environ['GITHUB_RUN_ID']}",
                      'provider':'kaggle','operation_class':'compute','account_id':account_id,
                      'purpose':'Execute exact M07 bounded runtime from d260914d immutable evidence.',
                      'service':'kernels.KernelsApiService','method':'SaveKernel','body':body,
                  }
                  broker_req=urllib.request.Request(
                      'https://chatgpt-kaggle-gateway.rezanory-chatgpt-plugins.workers.dev/control-plane/v3/action/kaggle',
                      data=json.dumps(broker_payload,separators=(',',':')).encode(),method='POST',
                      headers={'Authorization':'Bearer '+broker_token,'Content-Type':'application/json',
                               'Accept':'application/json','User-Agent':'m07-exact-runtime-launch-broker/1.0'},
                  )
                  try:
                      with urllib.request.urlopen(broker_req,timeout=240) as response:
                          envelope=json.loads(response.read().decode('utf-8','replace') or '{}')
                  except urllib.error.HTTPError as error:
                      detail=error.read(4000).decode('utf-8','replace')[:1800]
                      raise SystemExit(f'KAGGLE_BROKER_SAVE_HTTP_{error.code}: {detail}')
                  if envelope.get('ok') is not True or envelope.get('account_id') != account_id:
                      raise SystemExit(f'KAGGLE_BROKER_SAVE_REJECTED: {envelope!r}')
                  saved=envelope.get('result') or {}
              else:
                  _,saved=post('kernels.KernelsApiService','SaveKernel',body)
              provider_code=saved.get('code') if isinstance(saved,dict) else None
              if isinstance(provider_code,(int,float)) and provider_code>=400:
                  raise SystemExit(f'KAGGLE_SAVE_REJECTED: {saved}')
          observed={'save_result':saved}
          try:
              for _ in range(4):
                  time.sleep(5)
                  if use_broker:
                      broker_payload={
                          'request_id':f"m07-runtime-status-{os.environ['GITHUB_RUN_ID']}-{_}",
                          'provider':'kaggle','operation_class':'compute','account_id':account_id,
                          'purpose':'Read-only status probe for exact M07 runtime.',
                          'service':'kernels.KernelsApiService','method':'GetKernelSessionStatus',
                          'body':{'userName':owner,'kernelSlug':slug},
                      }
                      broker_req=urllib.request.Request(
                          'https://chatgpt-kaggle-gateway.rezanory-chatgpt-plugins.workers.dev/control-plane/v3/action/kaggle',
                          data=json.dumps(broker_payload,separators=(',',':')).encode(),method='POST',
                          headers={'Authorization':'Bearer '+os.environ['CGP_ACTION_OIDC_TOKEN'].strip(),
                                   'Content-Type':'application/json','Accept':'application/json',
                                   'User-Agent':'m07-exact-runtime-status-broker/1.0'},
                      )
                      with urllib.request.urlopen(broker_req,timeout=60) as response:
                          envelope=json.loads(response.read().decode('utf-8','replace') or '{}')
                      if envelope.get('ok') is not True or envelope.get('account_id') != account_id:
                          raise RuntimeError(f'broker status rejected: {envelope!r}')
                      status_probe=envelope.get('result') or {}
                  else:
                      _,status_probe=post('kernels.KernelsApiService','GetKernelSessionStatus',
                                          {'userName':owner,'kernelSlug':slug},timeout=60)
                  observed['session_status']=status_probe
                  text=json.dumps(status_probe,sort_keys=True).upper()
                  if any(state in text for state in ('RUNNING','QUEUED','COMPLETE','ERROR','CANCEL')):
                      break
          except RuntimeError as exc:
              observed['status_probe_error']=str(exc)[:600]
          evidence={'schema':'m07.d260914d.runtime.launch.receipt.v1','action':action,
                    'account_id':account_id,'owner':owner,'kernel_ref':kernel_ref,
                    'resolution':int(contract['resolution']),
                    'attempt':int(contract['attempt']),
                    'machine_shape':os.environ['EXPECTED_MACHINE_SHAPE'],
                    'notebook_sha256':contract['notebook_sha256'],'save_result':saved,
                    'session_status':observed,'github_run_id':os.environ['GITHUB_RUN_ID'],
                    'source_sha':os.environ['GITHUB_SHA']}
          pathlib.Path('runtime-launch-receipt.json').write_text(
              json.dumps(evidence,ensure_ascii=False,indent=2),encoding='utf-8')
          status_text=json.dumps(observed,sort_keys=True).upper()
          save_code=saved.get('code') if isinstance(saved,dict) else None
          save_accepted=(isinstance(saved,dict) and
                         not saved.get('error') and
                         (save_code is None or not isinstance(save_code,(int,float)) or save_code < 400))
          admitted=any(state in status_text for state in ('RUNNING','QUEUED','COMPLETE'))
          if not admitted and not save_accepted:
              raise SystemExit(f'BLOCKED_VALIDATION_INFRASTRUCTURE: SaveKernel not accepted: {status_text[:1200]}')
          launch_status='PASS' if admitted else 'ACCEPTED_STATUS_PROBE_UNAVAILABLE'
          print(json.dumps({'launch':launch_status,'action':action,'kernel_ref':kernel_ref,
                            'notebook_sha256':contract['notebook_sha256'],
                            'session_status':observed},ensure_ascii=False,sort_keys=True))
          PY

      - name: Preserve exact runtime launch receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m07-runtime-launch-receipt-${{ github.run_id }}
          path: runtime-launch-receipt.json
          if-no-files-found: warn
          retention-days: 30

  inventory-m07-r320-v4-producer-output:
    name: Inventory M07 R320 V4 producer output
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          github.event.inputs.recovery == 'M07_INVENTORY_R320_V4_PRODUCER' }}
    runs-on: [self-hosted, windows, x64, v622]
    timeout-minutes: 15
    environment: kaggle-03
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: rezanory
    steps:
      - name: Checkout exact inventory source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Read producer output manifest only
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          python scripts/m07_producer_output_manifest.py

      - name: Preserve sanitized producer inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m07-producer-output-inventory-${{ github.run_id }}
          path: ${{ runner.temp }}\m07-producer-output-manifest.json
          if-no-files-found: warn
          retention-days: 30

  probe-m07-r320-source-v4:
    name: Probe exact M07 R320 source Version 4 mount
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          github.event.inputs.recovery == 'M07_PROBE_R320_SOURCE_V4' }}
    runs-on: [self-hosted, windows, x64, v622]
    timeout-minutes: 15
    steps:
      - name: Request trusted action OIDC identity
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if(-not $env:ACTIONS_ID_TOKEN_REQUEST_URL -or -not $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN){throw 'OIDC context unavailable'}
          $sep=if($env:ACTIONS_ID_TOKEN_REQUEST_URL.Contains('?')){'&'}else{'?'}
          $r=Invoke-RestMethod -Uri "$($env:ACTIONS_ID_TOKEN_REQUEST_URL)$($sep)audience=cgp-control-plane-v3-action" -Headers @{Authorization="Bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN"} -TimeoutSec 30
          $token=[string]$r.value
          if($token.Length -lt 100){throw 'OIDC unavailable'}
          Write-Host "::add-mask::$token"
          [IO.File]::AppendAllText($env:GITHUB_ENV,"CGP_ACTION_OIDC_TOKEN=$token`n",[Text.UTF8Encoding]::new($false))

      - name: Submit isolated CPU exact-V4 mount probe
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $python=(Get-Command python.exe -ErrorAction SilentlyContinue).Source
          if(-not $python){$python=(Get-Command python -ErrorAction Stop).Source}
          $script=@'
          import json, os, urllib.request, urllib.error
          endpoint='https://chatgpt-kaggle-gateway.rezanory-chatgpt-plugins.workers.dev/control-plane/v3/action/kaggle'
          run_id=os.environ['GITHUB_RUN_ID']
          kernel_ref=f'trickermark/m07-r320-v4-mount-probe-{run_id}'
          source='\n'.join([
              'from pathlib import Path',
              'import hashlib, json',
              "root=Path('/kaggle/input/m07-gate-r320-state-v1-7')",
              "assert root.is_dir(), 'M07_V4_MOUNT_ROOT_MISSING'",
              "required=['CAMPAIGN_STATE.json','FOLD_4_RECOVERY/FOLDS/fold_4/COMPLETED.json']",
              "files={p.relative_to(root).as_posix():p for p in root.rglob('*') if p.is_file()}",
              "missing=[x for x in required if x not in files]",
              "assert not missing, 'M07_V4_REQUIRED_FILES_MISSING:'+json.dumps(missing)",
              "evidence={name:{'bytes':len(files[name].read_bytes()),'sha256':hashlib.sha256(files[name].read_bytes()).hexdigest()} for name in required}",
              "campaign=json.loads(files['CAMPAIGN_STATE.json'].read_text(encoding='utf-8'))",
              "fold4=json.loads(files['FOLD_4_RECOVERY/FOLDS/fold_4/COMPLETED.json'].read_text(encoding='utf-8'))",
              "print('M07_V4_MOUNT_PROBE '+json.dumps({'status':'PASS','file_count':len(files),'evidence':evidence,'campaign_state':campaign,'fold4_receipt':fold4},sort_keys=True,separators=(',',':')))",
          ])
          payload={'request_id':f'm07-r320-v4-mount-probe-{run_id}','provider':'kaggle','operation_class':'compute','account_id':'kg-05','purpose':'CPU-only exact Version 4 mount and sealed-fold evidence probe; no training, no upload, Phase2 remains locked.','service':'kernels.KernelsApiService','method':'SaveKernel','body':{'slug':kernel_ref,'newTitle':f'M07 R320 V4 Mount Probe {run_id}','text':source,'language':'PYTHON','kernelType':'SCRIPT','kernelExecutionType':'SAVE_AND_RUN_ALL','isPrivate':True,'enableGpu':False,'enableInternet':False,'datasetDataSources':['rezanory/m07-gate-r320-state-v1-7/4']}}
          req=urllib.request.Request(endpoint,data=json.dumps(payload,separators=(',',':')).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['CGP_ACTION_OIDC_TOKEN'],'Content-Type':'application/json','Accept':'application/json','User-Agent':'m07-r320-v4-mount-probe/1.0'})
          try:
              with urllib.request.urlopen(req,timeout=240) as response:
                  result=json.loads(response.read().decode('utf-8','replace') or '{}')
          except urllib.error.HTTPError as error:
              raise SystemExit(f'BROKER_HTTP_{error.code}: {error.read(3000).decode("utf-8","replace")[:1200]}')
          if result.get('ok') is not True:
              raise SystemExit('BROKER_REJECTED:'+json.dumps(result)[:1200])
          receipt={'kernel_ref':kernel_ref,'account_id':'kg-05','source_attachment':'rezanory/m07-gate-r320-state-v1-7/4','gpu':False,'training':False,'provider_ref':result.get('provider_ref') or (result.get('result') or {}).get('ref')}
          open('m07-r320-v4-mount-probe-receipt.json','w',encoding='utf-8').write(json.dumps(receipt,indent=2,sort_keys=True))
          print(json.dumps(receipt,sort_keys=True))
          '@
          $script|&$python -
          if($LASTEXITCODE-ne 0){throw 'M07 exact-V4 mount probe submission failed'}

      - name: Preserve mount-probe submission receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m07-r320-v4-mount-probe-${{ github.run_id }}
          path: m07-r320-v4-mount-probe-receipt.json
          if-no-files-found: warn
          retention-days: 30

  grant-m07-r320-source-reader:
    name: Grant trickermark read-only access to exact M07 R320 source
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' &&
           github.event.inputs.recovery == 'M07_GRANT_R320_SOURCE_READER') ||
          (github.event_name == 'push' &&
           github.ref == 'refs/heads/fix/m07-multiaccount-20260916' &&
           github.event.head_commit.message == 'fix(m07): run R320 source reader grant via trusted broker') }}
    runs-on: [self-hosted, windows, x64, v622]
    timeout-minutes: 15
    steps:
      - name: Checkout exact fix-forward source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Request trusted action OIDC identity
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $base=$env:ACTIONS_ID_TOKEN_REQUEST_URL
          $sep=if($base.Contains('?')){'&'}else{'?'}
          $headers=@{Authorization="Bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN"}
          $resp=Invoke-RestMethod -Uri ($base+$sep+'audience=cgp-control-plane-v3-action') -Headers $headers -Method Get -TimeoutSec 30
          $token=[string]$resp.value
          if($token.Length -lt 100){throw 'OIDC unavailable'}
          Write-Host ('::add-mask::'+$token)
          Add-Content -Path $env:GITHUB_ENV -Value ('CGP_ACTION_OIDC_TOKEN='+$token)

      - name: Grant and verify reader without creating a data version
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          python scripts/m07_grant_r320_source_reader.py

  freeze-m07-r320-source-v4:
    name: Freeze exact M07 R320 source Version 4
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          (github.event.inputs.recovery == 'M07_FREEZE_R320_SOURCE_V4' ||
           github.event.inputs.recovery == 'M07_PROBE_R320_SOURCE_V4_DOWNLOAD') }}
    runs-on: [self-hosted, windows, x64, v622]
    timeout-minutes: 45
    environment: kaggle-05
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: trickermark
      SOURCE_HANDLE: rezanory/m07-gate-r320-state-v1-7/versions/4
      TARGET_HANDLE: trickermark/m07-gate-r320-state-v1-7-immutable-v4
      PROBE_ONLY: ${{ github.event.inputs.recovery == 'M07_PROBE_R320_SOURCE_V4_DOWNLOAD' && '1' || '0' }}
    steps:
      - name: Checkout exact fix-forward source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install Kaggle client
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install -q 'kagglehub>=1.0,<2' 'kaggle>=1.7.4,<2'

      - name: Clone and upload immutable source Version 4
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          python scripts/m07_freeze_r320_source_v4.py

      - name: Preserve source freeze receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m07-source-freeze-${{ github.run_id }}
          path: ${{ runner.temp }}\m07-source-v4-${{ github.run_id }}\m07-source-freeze-receipt.json
          if-no-files-found: warn
          retention-days: 30

  soilbin_q1_v4_raw_waveform:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          github.actor_id == 62356000 &&
          github.event.inputs.recovery == 'SOILBIN_V4_RAW_WAVEFORM' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout frozen SoilBin V4 payload
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Request trusted action OIDC identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          base=os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']; sep='&' if '?' in base else '?'
          req=urllib.request.Request(base+sep+'audience=cgp-control-plane-v3-action',headers={'Authorization':'Bearer '+os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
          with urllib.request.urlopen(req,timeout=30) as r: token=json.load(r)['value']
          if len(token)<100: raise SystemExit('OIDC unavailable')
          print('::add-mask::'+token)
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as h: h.write('CGP_ACTION_OIDC_TOKEN='+token+'\n')
          PY

      - name: Validate, build and launch SoilBin V4 through Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          python control-plane-payloads/soilbin-q1-v4/launch_soilbin_v4_cloudflare.py

      - name: Build SoilBin V4 launch receipt
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os, pathlib
          p=os.environ.get('SOILBIN_V4_RECEIPT_PATH','')
          if p and pathlib.Path(p).exists():
              r=json.loads(pathlib.Path(p).read_text(encoding='utf-8'))
              body=(f"## SOILBIN Q1/Q2 V4 LAUNCH ACCEPTED\n\n- Run: `{os.environ['GITHUB_RUN_ID']}`\n- Kernel: `{r['kernel_ref']}`\n- Notebook SHA256: `{r['notebook_sha256']}`\n- Runner SHA256: `{r['runner_sha256']}`\n- Raw timeseries SHA256: `{r['raw_timeseries_source_sha256']}`\n- CPU only: `true`\n- Current-pass waveform used: `false`\n- External labels used: `false`\n")
          else:
              body=f"## SOILBIN Q1/Q2 V4 LAUNCH FAILED\n\n- Run: `{os.environ['GITHUB_RUN_ID']}`"
          summary=pathlib.Path(os.environ['RUNNER_TEMP'])/'soilbin_v4_launch_summary.md'
          summary.write_text(body,encoding='utf-8')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as h:
              h.write(f"SOILBIN_V4_SUMMARY_PATH={summary}\n")
          print(body)
          PY

      - name: Upload SoilBin V4 launch receipt artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soilbin-v4-launch-${{ github.run_id }}
          path: ${{ env.SOILBIN_V4_SUMMARY_PATH }}
          if-no-files-found: error
          retention-days: 30
