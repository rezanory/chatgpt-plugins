          SOURCE_SHA: ${{ steps.recovery_identity.outputs.source_sha }}
        run: |
          $ErrorActionPreference='Stop'
          $headers=@{Authorization="Bearer $env:GITHUB_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          $run=Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs/$env:SOURCE_RUN_ID" -Headers $headers
          if([string]$run.id-ne $env:SOURCE_RUN_ID-or [string]$run.head_sha-ne $env:SOURCE_SHA){throw 'BLOCKED_EXACT_EVIDENCE_LINEAGE_MISMATCH: Phase2 source run SHA drift'}
          if([string]$run.event-ne 'workflow_dispatch'-or [string]$run.path-ne '.github/workflows/pneumonia-v17-m07-continuation-20260914.yml'){throw 'BLOCKED_EXACT_EVIDENCE_LINEAGE_MISMATCH: Phase2 source workflow drift'}
