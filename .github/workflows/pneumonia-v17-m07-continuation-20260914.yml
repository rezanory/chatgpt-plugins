          if runtime_stage.startswith(("M07_RUNTIME_M07_R", "PHASE2_UNIT_")):
              body["machineShape"] = "NvidiaTeslaT4"
          payload = {
              "request_id": os.environ["CGP_REQUEST_ID"].strip(),
              "provider": "kaggle", "operation_class": "compute", "account_id": os.environ["CGP_ACCOUNT_ID"].strip(),
              "purpose": (f"d260914d bounded M07 runtime recovery {runtime_stage}: restore only sealed folds, complete at most one missing fold, persist it, and exit successfully."
                          if runtime_stage.startswith("M07_RUNTIME_M07_R")
                          else f"Pneumonia V1.7 bounded {runtime_stage}: restore only the exact model/resolution state, complete at most one missing fold, and run locked-test reporting only after five validated folds."
                          if runtime_stage.startswith("PHASE2_UNIT_")
                          else "d260914d M07 explicit manual unlock: complete R320/R384 M07 Gate, then run the remaining M01-M06/M08-M12 Phase-2 matrix; reuse exact persisted R224 five folds, never retrain M07 in Phase-2."
                          if "PHASE2_UNLOCK" in os.environ["CGP_NOTEBOOK_PATH"]
                          else "d260914d M07 continuation after exact final-five-fold PASS; reuse persisted folds, run OOF/one-time Locked Test/diagnostics/figures/XAI/casebook/external/final gate; Phase2 remains locked."),
              "service": "kernels.KernelsApiService", "method": "SaveKernel", "body": body,
          }
          req = urllib.request.Request(endpoint, data=json.dumps(payload, separators=(",", ":")).encode(), method="POST", headers={"Authorization": "Bearer " + os.environ["CGP_ACTION_OIDC_TOKEN"], "Content-Type": "application/json", "Accept": "application/json", "User-Agent": "pneumonia-v17-continuation/1.0"})
          try:
