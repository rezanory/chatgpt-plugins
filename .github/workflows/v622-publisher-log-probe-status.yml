name: v622-publisher-log-probe-status

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v622-publisher-log-probe-status.yml'

permissions:
  actions: read
  issues: write

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report latest log-probe run
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $h=@{Authorization="Bearer $env:GITHUB_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          $rs=Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/workflows/v622-publisher-log-probe.yml/runs?per_page=1" -Headers $h
          if(-not $rs.workflow_runs){throw 'no log-probe run'}
          $r=$rs.workflow_runs[0]; $js=Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs/$($r.id)/jobs?per_page=100" -Headers $h
          $cur='none'; foreach($j in @($js.jobs)){foreach($s in @($j.steps)){if($s.status -eq 'in_progress'){$cur="$($j.name) :: $($s.name)"}}}
          $body="## V6.2.2 publisher log-probe live status`n`n- Run: $($r.html_url)`n- Run ID: ``$($r.id)```n- Status: ``$($r.status)```n- Conclusion: ``$($r.conclusion)```n- Current step: ``$cur```n"
          $p=@{body=$body}|ConvertTo-Json; Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/issues/18/comments" -Method Post -Headers $h -ContentType 'application/json' -Body $p|Out-Null
