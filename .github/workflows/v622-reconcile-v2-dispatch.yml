name: v622-reconcile-v2-dispatch

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  dispatch:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.issue.number == 18 && github.event.comment.body == 'V622_RECONCILE_V2_RUN') }}
    runs-on: [self-hosted, windows, x64, v622]
    timeout-minutes: 5
    steps:
      - name: Dispatch canonical reconciliation v2 once
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $h=@{Authorization="Bearer $env:GITHUB_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          $runs=Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/workflows/v622-finalization-reconcile-v2.yml/runs?per_page=10" -Headers $h
          $active=@($runs.workflow_runs|Where-Object{$_.status-in@('queued','in_progress','pending','waiting','requested')})
          if($active.Count-gt 0){Write-Host "Existing active v2 run retained: $($active[0].id)";exit 0}
          $p=@{ref='main'}|ConvertTo-Json -Compress
          Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/workflows/v622-finalization-reconcile-v2.yml/dispatches" -Method Post -Headers $h -ContentType 'application/json' -Body $p|Out-Null
          Write-Host 'V622_RECONCILIATION_V2_DISPATCHED'
