name: v622-self-hosted-selected-artifact-index

# trigger: recover selected candidate filenames after backbone COMPLETE
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v622-self-hosted-selected-artifact-index.yml'
      - 'deploy/cloudflare-worker-free/src/v622-selected-artifact-index-worker.ts'

permissions:
  contents: read
  issues: write

concurrency:
  group: v622-cloudflare-production-mutation
  cancel-in-progress: false

jobs:
  index:
    runs-on: [self-hosted, windows, x64, v622]
    timeout-minutes: 25
    environment: cloudflare-production
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy protected read-only selected artifact index
        shell: powershell
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          $ErrorActionPreference = 'Stop'
          $accountId = ([string]$env:RAW_CLOUDFLARE_ACCOUNT_ID).Trim()
          if ([string]::IsNullOrWhiteSpace($env:CLOUDFLARE_API_TOKEN) -or [string]::IsNullOrWhiteSpace($accountId)) { throw 'Cloudflare credentials missing' }
          Write-Host "::add-mask::$accountId"
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "V622_CF_ACCOUNT_ID=$accountId`n", [System.Text.UTF8Encoding]::new($false))
          $env:CLOUDFLARE_ACCOUNT_ID = $accountId
          Push-Location 'deploy/cloudflare-worker-free'
          try {
            npm install --no-audit --no-fund
            if ($LASTEXITCODE -ne 0) { throw 'npm install failed' }
            npm run check
            if ($LASTEXITCODE -ne 0) { throw 'Worker typecheck failed' }
            npx wrangler deploy src/v622-selected-artifact-index-worker.ts --name chatgpt-kaggle-gateway
            if ($LASTEXITCODE -ne 0) { throw 'Selected artifact index deploy failed' }
          }
          finally { Pop-Location }

      - name: Create ephemeral read-only capability
        shell: powershell
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $bytes = New-Object byte[] 48
          $rng = [System.Security.Cryptography.RandomNumberGenerator]::Create()
          try { $rng.GetBytes($bytes) } finally { $rng.Dispose() }
          $token = [Convert]::ToBase64String($bytes).TrimEnd('=').Replace('+','-').Replace('/','_')
          Write-Host "::add-mask::$token"
          $env:CLOUDFLARE_ACCOUNT_ID = $env:V622_CF_ACCOUNT_ID
          Push-Location 'deploy/cloudflare-worker-free'
          try {
            $token | npx wrangler secret put CGP_PROJECT_CONTROL_TOKEN
            if ($LASTEXITCODE -ne 0) { throw 'Capability install failed' }
          }
          finally { Pop-Location }
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "V622_INDEX_TOKEN=$token`n", [System.Text.UTF8Encoding]::new($false))

      - name: Enumerate selected candidate output names only
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $uri = 'https://chatgpt-kaggle-gateway.rezanory-chatgpt-plugins.workers.dev/control/v6-2-2/selected-artifact-index'
          $headers = @{ Authorization = "Bearer $env:V622_INDEX_TOKEN"; 'Content-Type' = 'application/json' }
          $result = $null
          $last = $null
          for ($attempt = 1; $attempt -le 20; $attempt++) {
            try {
              $candidate = Invoke-RestMethod -Uri $uri -Method Post -Headers $headers -Body '{}' -TimeoutSec 90
              if ($candidate.project -eq 'PNEUMONIA V6.2.2' -and
                  $candidate.stage -eq 'selected_backbone_artifact_index' -and
                  $candidate.status -eq 'COMPLETE' -and
                  $candidate.kernel_ref -eq 'trickermark/pneumonia-v6-2-2-backbone-m06-r224') {
                $result = $candidate
                break
              }
              throw 'stale artifact index response'
            } catch {
              $last = $_.Exception.Message
              Start-Sleep -Seconds 3
            }
          }
          if (-not $result) { throw "Selected artifact index did not converge: $last" }
          if ($result.locked_test_used -ne $false -or $result.external_data_used -ne $false) { throw 'Selection index unexpectedly consumed locked/external data' }
          $expected = @('M06__convnext_tiny__seed-42','M06__densenet121__seed-42','M06__resnet50v2__seed-42')
          foreach ($id in $expected) {
            if ($null -eq $result.selected_files.$id) { throw "Missing selected candidate index: $id" }
          }
          $target = Join-Path $env:RUNNER_TEMP 'v622-selected-artifact-index.json'
          [System.IO.File]::WriteAllText($target, ($result | ConvertTo-Json -Depth 20), [System.Text.UTF8Encoding]::new($false))
          Write-Host "Selected candidate artifact index collected for $($expected.Count) candidates."
          foreach ($id in $expected) {
            $count = @($result.selected_files.$id).Count
            Write-Host "$id file_count=$count"
          }

      - name: Upload private selected artifact index
        uses: actions/upload-artifact@v4
        with:
          name: v622-selected-artifact-index
          path: ${{ runner.temp }}/v622-selected-artifact-index.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish selected artifact index receipt
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $value = Get-Content -Raw (Join-Path $env:RUNNER_TEMP 'v622-selected-artifact-index.json') | ConvertFrom-Json
          $counts = @()
          foreach ($id in @('M06__convnext_tiny__seed-42','M06__densenet121__seed-42','M06__resnet50v2__seed-42')) {
            $counts += "$id=$(@($value.selected_files.$id).Count)"
          }
          $body = "## V6.2.2 selected checkpoint/config index recovered`n`n- Kernel: ``$($value.kernel_ref)```n- Status: ``$($value.status)```n- Selected candidates only: ``$($counts -join ', ')```n- Private artifact: ``v622-selected-artifact-index```n- Kaggle compute launched: ``false```n- Locked test used: ``false```n- External data used: ``false```n- GitHub-hosted compute used: ``false```n- GitHub run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID`n"
          $payload = @{ body = $body } | ConvertTo-Json
          $headers = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/issues/18/comments" -Method Post -Headers $headers -ContentType 'application/json' -Body $payload | Out-Null

      - name: Remove capability and restore canonical Worker
        if: always()
        shell: powershell
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          $ErrorActionPreference = 'Continue'
          if (-not [string]::IsNullOrWhiteSpace($env:V622_CF_ACCOUNT_ID)) {
            $env:CLOUDFLARE_ACCOUNT_ID = $env:V622_CF_ACCOUNT_ID
            Push-Location 'deploy/cloudflare-worker-free'
            try {
              '{"CGP_PROJECT_CONTROL_TOKEN":null}' | Set-Content -Encoding utf8 (Join-Path $env:RUNNER_TEMP 'v622-delete-control.json')
              npx wrangler secret bulk (Join-Path $env:RUNNER_TEMP 'v622-delete-control.json')
              npx wrangler deploy
            }
            finally { Pop-Location }
          }
