name: v623-p0-sandbox

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: v623-p0-single-model-sandbox
  cancel-in-progress: false

jobs:
  p0:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.issue.number == 18 && github.event.comment.body == 'V623_P0_RUN') }}
    runs-on: [self-hosted, windows, x64, v622]
    timeout-minutes: 420
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Publish P0 runner start marker
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $h=@{Authorization="Bearer $env:GITHUB_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          $body="V6.2.3-P0 RUNNER START | github_run_id=$env:GITHUB_RUN_ID | runner=$env:RUNNER_NAME | head=$env:GITHUB_SHA | kaggle_launched=false"
          $p=@{body=$body}|ConvertTo-Json -Compress
          Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/issues/18/comments" -Method Post -Headers $h -ContentType 'application/json' -Body $p|Out-Null

      - name: Download exact recovered W16 source artifact
        uses: actions/download-artifact@v4
        with:
          name: v622-selected-kernel-source
          github-token: ${{ github.token }}
          repository: rezanory/chatgpt-plugins
          run-id: 32197039097
          path: ${{ runner.temp }}/v622-w16-source

      - name: Assemble and safety-check P0 Kaggle template
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $python=(Get-Command python.exe -ErrorAction SilentlyContinue).Source
          if(-not $python){throw 'python.exe not found on self-hosted runner'}
          $part0=(Get-Content -Raw 'scripts/v623_p0_sandbox.py.b64.part00').Trim()
          $part1=(Get-Content -Raw 'scripts/v623_p0_sandbox.py.b64.part01').Trim()
          $raw=[Convert]::FromBase64String($part0+$part1)
          $template=Join-Path $env:RUNNER_TEMP 'v623_p0_sandbox.py'
          $text=[Text.Encoding]::UTF8.GetString($raw)
          $bad='raise RuntimeError "Shadow materialization count mismatch"'
          $good='raise RuntimeError("Shadow materialization count mismatch")'
          $count=([regex]::Matches($text,[regex]::Escape($bad))).Count
          if($count -ne 1){throw "Expected exactly one known P0 syntax typo; found $count"}
          $text=$text.Replace($bad,$good)
          [IO.File]::WriteAllText($template,$text,[Text.UTF8Encoding]::new($false))
          & $python -m py_compile $template
          if($LASTEXITCODE -ne 0){throw 'P0 template does not compile after known-typo repair'}
          $audit=@'
          import ast,json,re,sys
          from pathlib import Path
          path=Path(sys.argv[1]); src=path.read_text(encoding='utf-8'); tree=ast.parse(src)
          if '__SOURCE_ZIP_B64__' not in src: raise SystemExit('missing source ZIP placeholder')
          if not re.search(r'for\s+partition\s+in\s+\(\s*["\']train["\']\s*,\s*["\']val["\']\s*\)',src):
              raise SystemExit('development-only train/val enumeration marker missing')
          if 'dirs[:] = [d for d in dirs if d.lower() != "test"' not in src:
              raise SystemExit('explicit test-directory pruning marker missing')
          def call_name(fn):
              if isinstance(fn,ast.Name): return fn.id
              if isinstance(fn,ast.Attribute):
                  left=call_name(fn.value)
                  return (left+'.' if left else '')+fn.attr
              return ''
          def target_names(node):
              out=[]
              for t in node.targets if isinstance(node,ast.Assign) else []:
                  if isinstance(t,ast.Name): out.append(t.id.lower())
              return out
          for node in ast.walk(tree):
              if isinstance(node,ast.Assign) and any(x in {'cmd','command','train_cmd','train_command'} for x in target_names(node)):
                  seg=(ast.get_source_segment(src,node) or '').lower()
                  if re.search(r'\bcal(?:_|\b)',seg) or 'shadow' in seg:
                      raise SystemExit('CAL/SHADOW appears in training command construction; refusing GPU launch')
          training_calls=[]; all_calls=[]
          for node in ast.walk(tree):
              if not isinstance(node,ast.Call): continue
              name=call_name(node.func); low=name.lower()
              if name: all_calls.append(name)
              seg=ast.get_source_segment(src,node) or ''
              seglow=seg.lower()
              if 'fit_platt_calibrator' in low or 'select_threshold' in low or 'apply_platt_calibrator' in low:
                  continue
              is_training=('train' in low or low.endswith('.fit') or low=='fit' or 'run_experiment' in low or low.startswith('subprocess.'))
              if is_training:
                  training_calls.append(name)
                  if re.search(r'\bcal(?:_|\b)',seglow) or 'shadow' in seglow:
                      raise SystemExit(f'CAL/SHADOW appears in training-like call {name}; refusing GPU launch')
          if not training_calls:
              print('P0_AST_CALL_INVENTORY='+json.dumps(sorted(set(all_calls))))
              raise SystemExit('no canonical training-like call found')
          required=['P0_RECEIPT.json','locked_test_used','external_data_used','P0_SPLIT_RECEIPT.json','test_partition_enumerated']
          missing=[x for x in required if x not in src]
          if missing: raise SystemExit('missing P0 safety receipt markers: '+','.join(missing))
          print({'p0_preflight':'PASS','training_calls':sorted(set(training_calls)),'locked_test_enumeration':'forbidden_by_template'})
          '@
          $audit | & $python - $template
          if($LASTEXITCODE -ne 0){throw 'P0 static leakage preflight failed'}
          "V623_P0_TEMPLATE=$template" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Publish P0 preflight PASS marker
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $h=@{Authorization="Bearer $env:GITHUB_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          $body="V6.2.3-P0 PREFLIGHT PASS | github_run_id=$env:GITHUB_RUN_ID | development_only=true | locked_test=false | external=false | kaggle_launch_next=true"
          $p=@{body=$body}|ConvertTo-Json -Compress
          Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/issues/18/comments" -Method Post -Headers $h -ContentType 'application/json' -Body $p|Out-Null

      - name: Launch and monitor development-only P0 on Kaggle
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
          K_MASTER: ${{ secrets.CGP_KAGGLE_MASTER_TOKEN }}
          K_KG02: ${{ secrets.CGP_KAGGLE_KG02_TOKEN }}
          K_KG03: ${{ secrets.CGP_KAGGLE_KG03_TOKEN }}
          K_KG04: ${{ secrets.CGP_KAGGLE_KG04_TOKEN }}
          K_KG05: ${{ secrets.CGP_KAGGLE_KG05_TOKEN }}
          K_KG06: ${{ secrets.CGP_KAGGLE_KG06_TOKEN }}
          K_KG07: ${{ secrets.CGP_KAGGLE_KG07_TOKEN }}
        run: |
          $ErrorActionPreference='Stop'
          $python=(Get-Command python.exe -ErrorAction SilentlyContinue).Source
          if(-not $python){throw 'python.exe not found on self-hosted runner'}
          $src=Join-Path $env:RUNNER_TEMP 'v622-w16-source'
          & $python scripts/v623_p0_control.py --source-artifact-dir $src --template $env:V623_P0_TEMPLATE
          if($LASTEXITCODE -ne 0){throw 'V6.2.3-P0 control failed'}
