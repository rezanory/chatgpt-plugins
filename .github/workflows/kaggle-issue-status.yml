name: kaggle-issue-status
run-name: "Kaggle status for issue #${{ github.event.issue.number }}"

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  plan:
    if: >-
      startsWith(github.event.issue.title, '[KAGGLE-JOB]') &&
      github.event.comment.body == '/kaggle status'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_tasks: ${{ steps.plan.outputs.has_tasks }}
      missing_tasks: ${{ steps.plan.outputs.missing_tasks }}
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --package chatgpt-plugin-kaggle
      - name: Resolve active run records from issue comments
        id: plan
        run: >-
          uv run --package chatgpt-plugin-kaggle python -m
          chatgpt_plugin_kaggle.actions.plan_status
          --accounts-file plugins/kaggle/config/accounts.json
      - name: No active tasks
        if: steps.plan.outputs.has_tasks != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          printf '%s\n' 'No non-terminal Kaggle task with a valid run record needs a status refresh.' > /tmp/no-active.md
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/no-active.md

  status:
    needs: plan
    if: needs.plan.result == 'success' && needs.plan.outputs.has_tasks == 'true'
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ matrix.account_environment }}
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      JOB_ID: ${{ matrix.job_id }}
      TASK_ID: ${{ matrix.task_id }}
      ACCOUNT_ID: ${{ matrix.account_id }}
      KERNEL_REF: ${{ matrix.kernel_ref }}
      ARTIFACT_NAME: kaggle-${{ matrix.job_id }}-${{ matrix.task_id }}-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install status collector and official Kaggle CLI
        run: |
          uv sync --package chatgpt-plugin-kaggle
          uv pip install "kaggle==2.2.4"
      - name: Query status and sanitize evidence
        id: status
        run: >-
          uv run --package chatgpt-plugin-kaggle python -m
          chatgpt_plugin_kaggle.actions.status_task
          --job-id "$JOB_ID"
          --task-id "$TASK_ID"
          --account-id "$ACCOUNT_ID"
          --kernel-ref "$KERNEL_REF"
          --github-run-id "$GITHUB_RUN_ID"
          --artifact-name "$ARTIFACT_NAME"
          --output-dir /tmp/kaggle-evidence
          --comment-file /tmp/status-comment.md
      - name: Upload hashed evidence for terminal tasks
        if: steps.status.outputs.terminal == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: /tmp/kaggle-evidence
          if-no-files-found: error
          retention-days: 30
      - name: Publish sanitized status record
        run: >-
          uv run --package chatgpt-plugin-kaggle python -m
          chatgpt_plugin_kaggle.actions.post_comment
          --issue "$ISSUE_NUMBER" --file /tmp/status-comment.md
      - name: Publish safe status-collection failure marker
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf 'Status collection failed for task `%s`. No source code was modified. Workflow run: %s/%s/actions/runs/%s\n' \
            "$TASK_ID" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > /tmp/status-failure.md
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/status-failure.md
