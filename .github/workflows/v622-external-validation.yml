name: v622-external-validation

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: v622-cloudflare-production-mutation
  cancel-in-progress: false

jobs:
  external:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.issue.number == 18 && github.event.comment.body == 'V622_EXTERNAL_VALIDATION_RUN') }}
    runs-on: [self-hosted, windows, x64, v622]
    timeout-minutes: 120
    environment: cloudflare-production
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Revalidate external-only gate
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $h=@{Authorization="Bearer $env:GITHUB_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          $all=@();$page=1
          do{$batch=Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/issues/18/comments?per_page=100&page=$page" -Headers $h;$all+=@($batch);$page++}while(@($batch).Count -eq 100)
          $text=($all|ForEach-Object{[string]$_.body}) -join "`n"
          if($text -notmatch 'FINAL_FREEZE_MANIFEST PASS.*2313023819c9eec669d835b99dcc2524b03bb0da236c2ec8f98c4e1221948414'){throw 'final freeze PASS missing'}
          if($text -notmatch 'FINAL_FREEZE_RECONCILIATION PASS[\s\S]*99a319c8d397342aaefd3c15e0eb8f968a973738f55ef97925a2a16da8c485d8'){throw 'reconciliation PASS missing'}
          if($text -notmatch 'LOCKBOX HARDENING PASS[\s\S]*Workflow mutation markers found: `0`[\s\S]*Remaining mutators: `none`'){throw 'hardening PASS missing'}
          if($text -notmatch 'OFFICIAL LOCKED TEST PASS[\s\S]*Completion SHA-256: `2ecc67f4268f812604e51db5b46d2ece36f9de12ff7baf3cf0bbbc8df4a58ada`[\s\S]*Next permitted stage: `EXTERNAL_VALIDATION`'){throw 'locked-test PASS/next-stage binding missing'}
          if($text -match '## V6\.2\.2 EXTERNAL VALIDATION PASS'){throw 'external validation PASS already exists; relaunch forbidden'}
          $root=Join-Path $env:GITHUB_WORKSPACE '.github/workflows';$markers=@('CLOUDFLARE_API_TOKEN','wrangler deploy','CGP_PROJECT_CONTROL_TOKEN','chatgpt-kaggle-gateway');$bad=@()
          foreach($f in Get-ChildItem $root -File){if($f.Extension -notin @('.yml','.yaml') -or $f.Name -eq 'v622-external-validation.yml'){continue};$raw=Get-Content -Raw $f.FullName;if(@($markers|Where-Object{$raw.Contains($_)}).Count -gt 0){$bad+=$f.Name}}
          if($bad.Count -gt 0){throw "unauthorized mutating workflows remain before external stage: $($bad -join ', ')"}
          Write-Host 'EXTERNAL_PREFLIGHT_PASS'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download exact recovered W16 source artifact
        uses: actions/download-artifact@v4
        with:
          name: v622-selected-kernel-source
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 32197039097
          path: ${{ runner.temp }}/v622-w16-source

      - name: Build exact-source external-validation payload
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $src=Join-Path $env:RUNNER_TEMP 'v622-w16-source';$payload=Join-Path $env:GITHUB_WORKSPACE 'deploy/cloudflare-worker-free/src/v622-external-validation-payload.ts';$meta=Join-Path $env:RUNNER_TEMP 'v622-external-validation-payload.json'
          node scripts/v622_build_external_validation_payload.mjs $src scripts/v622_external_validation_template.py $payload $meta
          if($LASTEXITCODE -ne 0){throw 'external payload build failed'}
          Copy-Item -Force scripts/v622_external_validation_worker_template.ts.txt deploy/cloudflare-worker-free/src/v622-external-validation-worker.ts
          $m=Get-Content -Raw $meta|ConvertFrom-Json
          if($m.w16_notebook_sha256 -ne '5abff78b9b10a13792b6d1b6cd24df780a64d16b7ec891d2ed74628dbb0b910b'){throw 'W16 source SHA mismatch'}
          if($m.official_locked_test_completion_sha256 -ne '2ecc67f4268f812604e51db5b46d2ece36f9de12ff7baf3cf0bbbc8df4a58ada'){throw 'locked completion binding mismatch'}
          [IO.File]::AppendAllText($env:GITHUB_ENV,"V622_EXTERNAL_SCRIPT_SHA=$($m.external_validation_script_sha256)`n",[Text.UTF8Encoding]::new($false))

      - name: Deploy protected external-validation bridge
        shell: powershell
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          $ErrorActionPreference='Stop';$id=([string]$env:RAW_CLOUDFLARE_ACCOUNT_ID).Trim();if(-not $id -or -not $env:CLOUDFLARE_API_TOKEN){throw 'Cloudflare credentials missing'};Write-Host "::add-mask::$id";[IO.File]::AppendAllText($env:GITHUB_ENV,"V622_CF_ACCOUNT_ID=$id`n",[Text.UTF8Encoding]::new($false));$env:CLOUDFLARE_ACCOUNT_ID=$id;Push-Location deploy/cloudflare-worker-free;try{npm install --no-audit --no-fund;if($LASTEXITCODE-ne 0){throw 'npm failed'};npm run check;if($LASTEXITCODE-ne 0){throw 'typecheck failed'};npx wrangler deploy src/v622-external-validation-worker.ts --name chatgpt-kaggle-gateway;if($LASTEXITCODE-ne 0){throw 'external bridge deploy failed'}}finally{Pop-Location}

      - name: Create ephemeral external capability
        shell: powershell
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          $b=New-Object byte[] 48;$r=[Security.Cryptography.RandomNumberGenerator]::Create();try{$r.GetBytes($b)}finally{$r.Dispose()};$t=[Convert]::ToBase64String($b).TrimEnd('=').Replace('+','-').Replace('/','_');Write-Host "::add-mask::$t";$env:CLOUDFLARE_ACCOUNT_ID=$env:V622_CF_ACCOUNT_ID;Push-Location deploy/cloudflare-worker-free;try{$t|npx wrangler secret put CGP_PROJECT_CONTROL_TOKEN --name chatgpt-kaggle-gateway;if($LASTEXITCODE-ne 0){throw 'secret failed'}}finally{Pop-Location};[IO.File]::AppendAllText($env:GITHUB_ENV,"V622_EXTERNAL_TOKEN=$t`n",[Text.UTF8Encoding]::new($false))

      - name: Launch external validation once
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop';$base='https://chatgpt-kaggle-gateway.rezanory-chatgpt-plugins.workers.dev';$h=@{Authorization="Bearer $env:V622_EXTERNAL_TOKEN";'Content-Type'='application/json'};$v=$null;$last='not ready'
          for($i=1;$i-le 24;$i++){try{$x=Invoke-RestMethod -Uri "$base/healthz" -Method Get -TimeoutSec 30;if($x.service-ne'v622-external-validation'){throw 'stale bridge'};$v=Invoke-RestMethod -Uri "$base/control/v6-2-2/external-validation/launch" -Method Post -Headers $h -Body '{}' -TimeoutSec 180;break}catch{$last=$_.Exception.Message;Write-Host "external readiness $i/24: $last";Start-Sleep 5}}
          if(-not $v){throw "external launch did not converge: $last"};$v|ConvertTo-Json -Depth 30|Write-Host;if($v.ok-eq$false){throw $v.error};if($v.target_kernel_ref-ne'azadka/pneumonia-v6-2-2-external-validation'){throw 'unexpected external target'}
          $body="## V6.2.2 EXTERNAL VALIDATION LAUNCHED`n`n- Kaggle master: ``azadka```n- Kernel: ``azadka/pneumonia-v6-2-2-external-validation```n- Cohorts: ``ashery/chexpert`` + ``nih-chest-xrays/sample```n- GPU: ``true``; Internet: ``false```n- Frozen threshold/calibration/weights only; retuning: ``false```n- Locked-test completion SHA: ``2ecc67f4268f812604e51db5b46d2ece36f9de12ff7baf3cf0bbbc8df4a58ada```n- Exact W16 source SHA: ``5abff78b9b10a13792b6d1b6cd24df780a64d16b7ec891d2ed74628dbb0b910b```n- Generated external script SHA: ``$env:V622_EXTERNAL_SCRIPT_SHA```n- Training/HPO/confirmation/reselection: ``false```n- Run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID`n";$p=@{body=$body}|ConvertTo-Json -Compress;$gh=@{Authorization="Bearer $env:GITHUB_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'};Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/issues/18/comments" -Method Post -Headers $gh -ContentType 'application/json' -Body $p|Out-Null

      - name: Monitor external validation to terminal status
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';$h=@{Authorization="Bearer $env:V622_EXTERNAL_TOKEN";'Content-Type'='application/json'};$uri='https://chatgpt-kaggle-gateway.rezanory-chatgpt-plugins.workers.dev/control/v6-2-2/external-validation/status';$terminal=$null;$last=''
          for($i=1;$i-le 180;$i++){try{$v=Invoke-RestMethod -Uri $uri -Method Post -Headers $h -Body '{}' -TimeoutSec 180;$s=([string]$v.status).ToUpperInvariant();Write-Host "external validation $i/180: $s";if($s-eq'COMPLETE'){$terminal=$v;break};if($s-in@('ERROR','FAILED','CANCELLED','CANCELED','DEAD')){throw "terminal external failure $s; automatic rerun forbidden"}}catch{if($_.Exception.Message-match'terminal external failure'){throw};$last=$_.Exception.Message;Write-Host "external status transport $i/180: $last"};Start-Sleep 20}
          if(-not $terminal){throw "external validation not COMPLETE: $last"};if(-not $terminal.receipt){throw 'external COMPLETE without validated receipt'};$terminal.receipt|ConvertTo-Json -Depth 50|Set-Content -Encoding utf8 "$env:RUNNER_TEMP\v622-external-validation-receipt.json"

      - name: Publish external-validation PASS
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $r=Get-Content -Raw "$env:RUNNER_TEMP\v622-external-validation-receipt.json"|ConvertFrom-Json;$c=$r.cohorts;$body="## V6.2.2 EXTERNAL VALIDATION PASS`n`n- Kernel: ``azadka/pneumonia-v6-2-2-external-validation```n- Summary SHA-256: ``$($r.summary_sha256)```n- CheXpert valid n: ``$($c.chexpert_valid.n_samples)`` | Balanced accuracy: ``$($c.chexpert_valid.metrics.balanced_accuracy)`` | MCC: ``$($c.chexpert_valid.metrics.mcc)```n- NIH pneumonia-vs-No Finding n: ``$($c.nih_pneumonia_vs_no_finding.n_samples)`` | Balanced accuracy: ``$($c.nih_pneumonia_vs_no_finding.metrics.balanced_accuracy)`` | MCC: ``$($c.nih_pneumonia_vs_no_finding.metrics.mcc)```n- Independence audit: ``$($r.independence_audit.status)```n- Threshold/calibration/weights retuned: ``false```n- Official locked-test feedback used: ``false```n- Training/HPO/confirmation/reselection: ``false```n- Next permitted stage: ``$($r.next_permitted_stage)```n- Run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID`n";$p=@{body=$body}|ConvertTo-Json -Compress;$h=@{Authorization="Bearer $env:GITHUB_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'};Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/issues/18/comments" -Method Post -Headers $h -ContentType 'application/json' -Body $p|Out-Null

      - name: Remove capability and restore canonical Worker
        if: always()
        shell: powershell
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          $ErrorActionPreference='Continue';if($env:V622_CF_ACCOUNT_ID){$env:CLOUDFLARE_ACCOUNT_ID=$env:V622_CF_ACCOUNT_ID;Push-Location deploy/cloudflare-worker-free;try{'y'|npx wrangler secret delete CGP_PROJECT_CONTROL_TOKEN --name chatgpt-kaggle-gateway;npx wrangler deploy}finally{Pop-Location}}

      - name: Publish external diagnostic
        if: failure()
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $body="## V6.2.2 EXTERNAL VALIDATION DIAGNOSTIC`n`n- Result: ``FAILED_OR_INCOMPLETE```n- Automatic rerun: ``FORBIDDEN_PENDING_INCIDENT_REVIEW```n- Frozen model/threshold/calibration/weights remain unchanged.`n- Training/HPO/confirmation/reselection: ``false```n- Run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID`n";$p=@{body=$body}|ConvertTo-Json -Compress;$h=@{Authorization="Bearer $env:GITHUB_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'};Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/issues/18/comments" -Method Post -Headers $h -ContentType 'application/json' -Body $p|Out-Null
