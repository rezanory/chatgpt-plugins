name: control-plane-v3-validate

on:
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: control-plane-v3-validation
  cancel-in-progress: false

jobs:
  validate:
    if: ${{ github.event.issue.number == 33 && github.event.comment.body == 'CONTROL_PLANE_V3_VALIDATE' }}
    runs-on: [self-hosted, windows, x64, v622]
    timeout-minutes: 90
    steps:
      - name: Resolve validation branch head
        id: resolve
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $h=@{Authorization="Bearer $env:GITHUB_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          $r=Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/git/ref/heads/feature/control-plane-v3" -Headers $h -TimeoutSec 30
          $sha=[string]$r.object.sha
          if($sha -notmatch '^[0-9a-f]{40}$'){throw 'Unable to resolve feature/control-plane-v3 SHA'}
          "sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "CONTROL_PLANE_V3_VALIDATED_HEAD=$sha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "CONTROL_PLANE_V3_VALIDATED_HEAD=$sha"

      - name: Checkout exact control-plane v3 head
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.sha }}

      - name: Publish validation start marker
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $h=@{Authorization="Bearer $env:GITHUB_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          $body="CONTROL PLANE V3 VALIDATION START | run=$env:GITHUB_RUN_ID | head=$env:CONTROL_PLANE_V3_VALIDATED_HEAD | cloudflare_deploy=false | kaggle_compute=false | p0_modified=false"
          $p=@{body=$body}|ConvertTo-Json -Compress
          Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/issues/33/comments" -Method Post -Headers $h -ContentType 'application/json' -Body $p|Out-Null

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Python workspace
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $python=(Get-Command python.exe -ErrorAction SilentlyContinue).Source
          if(-not $python){$python=(Get-Command python -ErrorAction Stop).Source}
          & $python -m pip install --disable-pip-version-check `
            -e packages/core `
            -e packages/github-bridge `
            -e packages/repair-engine `
            -e plugins/kaggle `
            -e plugins/kaggle-gateway `
            'pytest>=8.4' 'ruff>=0.12'
          if($LASTEXITCODE -ne 0){throw 'Python workspace install failed'}
          "CONTROL_PLANE_V3_PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Ruff v3 and touched provider files
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & $env:CONTROL_PLANE_V3_PYTHON -m ruff check `
            packages/core/src/chatgpt_plugins_core/capability_registry.py `
            packages/core/src/chatgpt_plugins_core/capability_router.py `
            packages/core/src/chatgpt_plugins_core/cli_transport.py `
            packages/core/tests/test_capability_registry.py `
            packages/core/tests/test_capability_router.py `
            packages/core/tests/test_cli_transport.py `
            packages/core/tests/test_control_plane_http_safety.py `
            packages/core/tests/test_control_plane_v3_worker_contract.py `
            scripts/control_plane_discover.py `
            scripts/control_plane_http.py `
            plugins/kaggle/src/chatgpt_plugin_kaggle/kaggle_cli.py
          if($LASTEXITCODE -ne 0){throw 'Ruff failed'}

      - name: Python compile
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & $env:CONTROL_PLANE_V3_PYTHON -m compileall -q packages plugins scripts/control_plane_discover.py scripts/control_plane_http.py
          if($LASTEXITCODE -ne 0){throw 'Python compile failed'}

      - name: Bootstrap portable Git for tests
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          & powershell -NoProfile -ExecutionPolicy Bypass -File scripts/bootstrap_git.ps1
          if($LASTEXITCODE -ne 0){throw 'portable Git bootstrap failed'}
          git --version
          if($LASTEXITCODE -ne 0){throw 'Git unavailable after bootstrap'}

      - name: Python test suite
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & $env:CONTROL_PLANE_V3_PYTHON -m pytest
          if($LASTEXITCODE -ne 0){throw 'pytest failed'}

      - name: Cloudflare TypeScript and Wrangler validation
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Push-Location deploy/cloudflare-worker-free
          try {
            npm install --no-audit --no-fund
            if($LASTEXITCODE -ne 0){throw 'npm install failed'}
            npm run check
            if($LASTEXITCODE -ne 0){throw 'Cloudflare TypeScript/Wrangler check failed'}
          } finally { Pop-Location }

      - name: Bootstrap current official CLIs
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          & powershell -NoProfile -ExecutionPolicy Bypass -File scripts/bootstrap_control_plane_tools.ps1
          if($LASTEXITCODE -ne 0){throw 'control-plane CLI bootstrap failed'}

      - name: Discover current provider capability trees
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:RUNNER_TEMP 'control-plane-v3-capabilities.json'
          & $env:CONTROL_PLANE_V3_PYTHON scripts/control_plane_discover.py --provider all --depth 2 --json-out $out
          if($LASTEXITCODE -ne 0){throw 'capability discovery failed'}
          $sha=(Get-FileHash -Algorithm SHA256 $out).Hash.ToLowerInvariant()
          "CONTROL_PLANE_V3_DISCOVERY_SHA=$sha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CONTROL_PLANE_V3_DISCOVERY_FILE=$out" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload capability discovery receipt
        uses: actions/upload-artifact@v4
        with:
          name: control-plane-v3-capability-discovery
          path: ${{ env.CONTROL_PLANE_V3_DISCOVERY_FILE }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish validation PASS
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $h=@{Authorization="Bearer $env:GITHUB_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          $body="## CONTROL PLANE V3 VALIDATION PASS`n`n- Branch: ``feature/control-plane-v3```n- Validated head: ``$env:CONTROL_PLANE_V3_VALIDATED_HEAD```n- Python lint/compile/tests: ``PASS```n- Cloudflare TypeScript/Wrangler check: ``PASS```n- Official CLI bootstrap: ``PASS```n- Runtime capability discovery: ``PASS```n- Discovery SHA-256: ``$env:CONTROL_PLANE_V3_DISCOVERY_SHA```n- Cloudflare deploy: ``false```n- Kaggle compute: ``false```n- Active P0 modified: ``false```n- Run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID`n"
          $p=@{body=$body}|ConvertTo-Json -Compress
          Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/issues/33/comments" -Method Post -Headers $h -ContentType 'application/json' -Body $p|Out-Null

      - name: Publish validation diagnostic
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: powershell
        run: |
          $h=@{Authorization="Bearer $env:GITHUB_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          $body="## CONTROL PLANE V3 VALIDATION DIAGNOSTIC`n`n- Result: ``FAILED```n- Branch: ``feature/control-plane-v3```n- Attempted head: ``$env:CONTROL_PLANE_V3_VALIDATED_HEAD```n- Cloudflare deploy attempted: ``false```n- Kaggle compute launched: ``false```n- Active P0 modified: ``false```n- Run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID`n"
          $p=@{body=$body}|ConvertTo-Json -Compress
          Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/issues/33/comments" -Method Post -Headers $h -ContentType 'application/json' -Body $p|Out-Null
