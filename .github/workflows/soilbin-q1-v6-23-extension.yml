name: soilbin-q1-v6-23-extension

on:
  issue_comment:
    types: [created]

permissions:
  id-token: write
  contents: read
  issues: write

concurrency:
  group: soilbin-q1-v6-23-kg09
  cancel-in-progress: false

jobs:
  launch-and-collect:
    if: ${{ github.event.issue.number == 134 && github.event.comment.user.id == 62356000 && github.event.comment.body == 'SOILBIN_Q1_V6_23_LAUNCH_KG09' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate V6 23-item payload
        shell: bash
        run: |
          set -euo pipefail
          ROOT='control-plane-payloads/soilbin-q1-v6-23-extension'
          python -m py_compile "$ROOT/soilbin_v6_23_runner.py" "$ROOT/launch_soilbin_v6_23_cloudflare.py"
          python - <<'PY'
          import pathlib
          root=pathlib.Path('control-plane-payloads/soilbin-q1-v6-23-extension')
          r=(root/'soilbin_v6_23_runner.py').read_text(encoding='utf-8')
          required=[
            'EXPECTED_23_ITEMS_GOT','does_not_supersede_v5','ITEM_4_10_HISTORY_SHUFFLE',
            'ITEM_5_3_SPECTRAL','ITEM_5_5_INFORMATION_DESIGN','ITEM_5_8_TSP',
            'RESULTS_V6_23.json','random_split_used'
          ]
          for token in required:
              if token not in r: raise SystemExit('missing guard: '+token)
          print('V6_23_PAYLOAD_OK')
          PY

      - name: Request trusted write OIDC
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,urllib.request,urllib.parse
          base=os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']; sep='&' if '?' in base else '?'
          target=base+sep+'audience='+urllib.parse.quote('cgp-control-plane-v3-action',safe='')
          req=urllib.request.Request(target,headers={'Authorization':'Bearer '+os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
          with urllib.request.urlopen(req,timeout=30) as r: token=json.load(r)['value']
          if len(token)<100: raise SystemExit('write OIDC unavailable')
          print('::add-mask::'+token)
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f: f.write('CGP_ACTION_OIDC_TOKEN='+token+'\n')
          PY

      - name: Save and run V6 23-item extension on Kaggle kg-09
        shell: bash
        run: |
          set -euo pipefail
          python control-plane-payloads/soilbin-q1-v6-23-extension/launch_soilbin_v6_23_cloudflare.py

      - name: Request trusted read OIDC
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,urllib.request,urllib.parse
          base=os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']; sep='&' if '?' in base else '?'
          target=base+sep+'audience='+urllib.parse.quote('cgp-control-plane-v3',safe='')
          req=urllib.request.Request(target,headers={'Authorization':'Bearer '+os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
          with urllib.request.urlopen(req,timeout=30) as r: token=json.load(r)['value']
          if len(token)<100: raise SystemExit('read OIDC unavailable')
          print('::add-mask::'+token)
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f: f.write('CGP_READ_OIDC_TOKEN='+token+'\n')
          PY

      - name: Poll Kaggle until terminal and collect compact results
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,pathlib,time,urllib.request,urllib.error
          endpoint='https://chatgpt-kaggle-gateway.rezanory-chatgpt-plugins.workers.dev/control-plane/v3/read/kaggle'
          token=os.environ['CGP_READ_OIDC_TOKEN']
          account='kg-09'
          raw_ref=os.environ.get('SOILBIN_V6_23_KERNEL_REF','').strip()
          ref=raw_ref.removeprefix('/code/')
          if '/' not in ref: raise SystemExit('invalid launched kernel ref: '+raw_ref)
          owner,slug=ref.split('/',1)
          def call(payload,timeout=120):
              req=urllib.request.Request(endpoint,data=json.dumps(payload,separators=(',',':')).encode(),method='POST',
                  headers={'Authorization':'Bearer '+token,'Content-Type':'application/json','Accept':'application/json','User-Agent':'soilbin-v6-23-evidence/1.0'})
              with urllib.request.urlopen(req,timeout=timeout) as r:
                  val=json.loads(r.read().decode('utf-8','replace') or '{}')
              if val.get('ok') is not True or val.get('read_only') is not True:
                  raise RuntimeError('read broker rejected: '+json.dumps(val)[:1200])
              return val.get('result') or {}
          last={}
          for attempt in range(90):
              last=call({'action':'raw_read','account_id':account,'service':'kernels.KernelsApiService',
                         'method':'GetKernelSessionStatus','body':{'userName':owner,'kernelSlug':slug}},60)
              txt=json.dumps(last,ensure_ascii=False,sort_keys=True).upper()
              print('KAGGLE_STATUS',attempt,txt[:1000],flush=True)
              if 'COMPLETE' in txt:
                  break
              if any(x in txt for x in ['ERROR','FAILED','CANCELLED']):
                  raise SystemExit('Kaggle terminal failure: '+txt[:1800])
              time.sleep(20)
          else:
              raise SystemExit('Kaggle status polling timed out')
          out=call({'action':'output_json_files','account_id':account,'kernel_ref':ref,
                    'file_names':['RESULTS_V6_23.json','MASTER_MANIFEST_V6_23.json'],
                    'max_bytes_per_file':262144},180)
          files=out.get('files') or []
          if len(files)!=2: raise SystemExit('expected 2 evidence files, got '+str(len(files)))
          dest=pathlib.Path(os.environ['RUNNER_TEMP'])/'soilbin-v6-23-evidence'
          dest.mkdir(parents=True,exist_ok=True)
          by={}
          for f in files:
              name=str(f.get('file_name') or '')
              value=f.get('json')
              if not isinstance(value,dict): raise SystemExit('missing JSON for '+name)
              by[name]=value
              (dest/name).write_text(json.dumps(value,ensure_ascii=False,indent=2),encoding='utf-8')
          results=by['RESULTS_V6_23.json']
          if len(results.get('items') or [])!=23: raise SystemExit('23-item completeness gate failed')
          summary={
            'kernel_ref':ref,
            'kaggle_terminal_complete':True,
            'items':len(results['items']),
            'v5_locked_reference':results.get('v5_locked_reference'),
            'multichannel_memory':results.get('multichannel_memory'),
            'raw_vs_summary':results.get('raw_vs_summary'),
            'lc_ablation':results.get('lc_ablation'),
            'history_shuffle':results.get('history_shuffle'),
            'spectral_vs_current':results.get('spectral_vs_current'),
            'tsp':results.get('tsp'),
          }
          (dest/'EVIDENCE_SUMMARY.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as h:
              h.write('SOILBIN_V6_23_EVIDENCE_DIR='+str(dest)+'\n')
              h.write('SOILBIN_V6_23_ITEMS=23\n')
          print('SOILBIN_V6_23_KAGGLE_COMPLETE',json.dumps(summary,ensure_ascii=False),flush=True)
          PY

      - name: Upload V6 23-item evidence
        uses: actions/upload-artifact@v4
        with:
          name: soilbin-v6-23-kaggle-evidence
          path: ${{ env.SOILBIN_V6_23_EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish completion receipt
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,pathlib,urllib.request
          ok=os.environ.get('SOILBIN_V6_23_ITEMS')=='23'
          title='COMPLETE' if ok else 'FAILED_OR_INCOMPLETE'
          body=(f"## SOILBIN V6 — 23-item Kaggle run {title}\n\n"
                f"- GitHub run: `{os.environ['GITHUB_RUN_ID']}`\n"
                f"- Kaggle: `kg-09 / mylovevpn1`\n"
                f"- Kernel: `{os.environ.get('SOILBIN_V6_23_KERNEL_REF','unknown')}`\n"
                f"- 23-item evidence gate: `{'23/23' if ok else 'not verified'}`\n"
                "- V5 frozen claims remain unchanged; V6 is post-lock exploratory.\n")
          req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/134/comments",
              data=json.dumps({'body':body}).encode(),method='POST',
              headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],'Accept':'application/vnd.github+json',
                       'X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json','User-Agent':'soilbin-v6-23/1.0'})
          with urllib.request.urlopen(req,timeout=30): pass
          PY


  collect-only:
    if: ${{ github.event.issue.number == 134 && github.event.comment.user.id == 62356000 && github.event.comment.body == 'SOILBIN_Q1_V6_23_COLLECT_KG09' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Request trusted read OIDC
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,urllib.request,urllib.parse
          base=os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']; sep='&' if '?' in base else '?'
          target=base+sep+'audience='+urllib.parse.quote('cgp-control-plane-v3',safe='')
          req=urllib.request.Request(target,headers={'Authorization':'Bearer '+os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
          with urllib.request.urlopen(req,timeout=30) as r: token=json.load(r)['value']
          if len(token)<100: raise SystemExit('read OIDC unavailable')
          print('::add-mask::'+token)
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f: f.write('CGP_READ_OIDC_TOKEN='+token+'\n')
          PY

      - name: Poll existing Kaggle run and collect compact results
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,pathlib,time,urllib.request,urllib.error
          endpoint='https://chatgpt-kaggle-gateway.rezanory-chatgpt-plugins.workers.dev/control-plane/v3/read/kaggle'
          token=os.environ['CGP_READ_OIDC_TOKEN']
          account='kg-09'
          ref='mylovevpn1/soilbin-q1-q2-v6-23-item-extension-20260928'
          owner,slug=ref.split('/',1)
          def call(payload,timeout=120):
              req=urllib.request.Request(endpoint,data=json.dumps(payload,separators=(',',':')).encode(),method='POST',
                  headers={'Authorization':'Bearer '+token,'Content-Type':'application/json','Accept':'application/json','User-Agent':'soilbin-v6-23-collect/1.0'})
              try:
                  with urllib.request.urlopen(req,timeout=timeout) as r:
                      val=json.loads(r.read().decode('utf-8','replace') or '{}')
              except urllib.error.HTTPError as e:
                  detail=e.read(4000).decode('utf-8','replace')
                  raise RuntimeError(f'read broker HTTP {e.code}: {detail}') from e
              if val.get('ok') is not True or val.get('read_only') is not True:
                  raise RuntimeError('read broker rejected: '+json.dumps(val)[:1500])
              return val.get('result') or {}
          last={}
          for attempt in range(90):
              last=call({'action':'raw_read','account_id':account,'service':'kernels.KernelsApiService',
                         'method':'GetKernelSessionStatus','body':{'userName':owner,'kernelSlug':slug}},60)
              txt=json.dumps(last,ensure_ascii=False,sort_keys=True).upper()
              print('KAGGLE_STATUS',attempt,txt[:1500],flush=True)
              if 'COMPLETE' in txt:
                  break
              if any(x in txt for x in ['ERROR','FAILED','CANCELLED']):
                  raise SystemExit('Kaggle terminal failure: '+txt[:2500])
              time.sleep(20)
          else:
              raise SystemExit('Kaggle status polling timed out')
          out=call({'action':'output_json_files','account_id':account,'kernel_ref':ref,
                    'file_names':['RESULTS_V6_23.json','MASTER_MANIFEST_V6_23.json'],
                    'max_bytes_per_file':262144},180)
          files=out.get('files') or []
          if len(files)!=2: raise SystemExit('expected 2 evidence files, got '+str(len(files))+' :: '+json.dumps(out)[:2000])
          dest=pathlib.Path(os.environ['RUNNER_TEMP'])/'soilbin-v6-23-evidence'
          dest.mkdir(parents=True,exist_ok=True)
          by={}
          for f in files:
              name=str(f.get('file_name') or '')
              value=f.get('json')
              if not isinstance(value,dict): raise SystemExit('missing JSON for '+name)
              by[name]=value
              (dest/name).write_text(json.dumps(value,ensure_ascii=False,indent=2),encoding='utf-8')
          results=by['RESULTS_V6_23.json']
          if len(results.get('items') or [])!=23: raise SystemExit('23-item completeness gate failed')
          summary={
            'kernel_ref':ref,
            'kaggle_terminal_complete':True,
            'items':len(results['items']),
            'v5_locked_reference':results.get('v5_locked_reference'),
            'multichannel_memory':results.get('multichannel_memory'),
            'memory_depth':results.get('memory_depth'),
            'leave_one_pass_out':results.get('leave_one_pass_out'),
            'raw_vs_summary':results.get('raw_vs_summary'),
            'shared_vs_pass_heads':results.get('shared_vs_pass_heads'),
            'recursive_mean_abs_error_N':results.get('recursive_mean_abs_error_N'),
            'missing_pass_reconstruction_group_mae_N':results.get('missing_pass_reconstruction_group_mae_N'),
            'missing_slot_estimates':results.get('missing_slot_estimates'),
            'lc_ablation':results.get('lc_ablation'),
            'history_shuffle':results.get('history_shuffle'),
            'missing_history_robustness':results.get('missing_history_robustness'),
            'multi_horizon':results.get('multi_horizon'),
            'pass_graph_total_positive_gain_N':results.get('pass_graph_total_positive_gain_N'),
            'lc_graph_mean_abs_partial_corr':results.get('lc_graph_mean_abs_partial_corr'),
            'spectral_gap':results.get('spectral_gap'),
            'effective_resistance_interpretable':results.get('effective_resistance_interpretable'),
            'd_optimal_order':results.get('d_optimal_order'),
            'spectral_regularization':results.get('spectral_regularization'),
            'spectral_vs_current':results.get('spectral_vs_current'),
            'tsp':results.get('tsp')
          }
          (dest/'EVIDENCE_SUMMARY.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as h:
              h.write('SOILBIN_V6_23_EVIDENCE_DIR='+str(dest)+'\n')
              h.write('SOILBIN_V6_23_ITEMS=23\n')
          print('SOILBIN_V6_23_KAGGLE_COMPLETE',json.dumps(summary,ensure_ascii=False),flush=True)
          PY

      - name: Upload V6 23-item evidence
        uses: actions/upload-artifact@v4
        with:
          name: soilbin-v6-23-kaggle-evidence
          path: ${{ env.SOILBIN_V6_23_EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish collection receipt
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,urllib.request
          ok=os.environ.get('SOILBIN_V6_23_ITEMS')=='23'
          title='COMPLETE' if ok else 'FAILED_OR_INCOMPLETE'
          body=(f"## SOILBIN V6 — evidence collection {title}\n\n"
                f"- GitHub run: `{os.environ['GITHUB_RUN_ID']}`\n"
                "- Kaggle: `kg-09 / mylovevpn1`\n"
                "- Kernel: `mylovevpn1/soilbin-q1-q2-v6-23-item-extension-20260928`\n"
                f"- 23-item evidence gate: `{'23/23' if ok else 'not verified'}`\n"
                "- This was read-only collection; no duplicate Kaggle launch.\n")
          req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/134/comments",
              data=json.dumps({'body':body}).encode(),method='POST',
              headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],'Accept':'application/vnd.github+json',
                       'X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json','User-Agent':'soilbin-v6-23/1.0'})
          with urllib.request.urlopen(req,timeout=30): pass
          PY

  v7-launch-and-collect:
    if: ${{ github.event.issue.number == 134 && github.event.comment.user.id == 62356000 && github.event.comment.body == 'SOILBIN_Q1_V7_MEMORY_SPECTRAL_LAUNCH_KG09' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate V7 payload
        shell: bash
        run: |
          set -euo pipefail
          ROOT='control-plane-payloads/soilbin-q1-v7-memory-spectral'
          python -m py_compile "$ROOT/soilbin_v7_runner.py" "$ROOT/launch_soilbin_v7_cloudflare.py"
          python - <<'PY'
          import pathlib
          root=pathlib.Path('control-plane-payloads/soilbin-q1-v7-memory-spectral')
          r=(root/'soilbin_v7_runner.py').read_text(encoding='utf-8')
          required=['D_V5_BASELINE','M3_LAG3','FUSION_EXPLICIT','SPECTRAL_AUGMENT_PASS',
                    'FULL_M3_SUM_FUSION_SPECTRAL','V5_BASELINE_REPRODUCTION_DRIFT_GT_2PCT',
                    'RESULTS_V7.json','does_not_supersede_v5']
          for token in required:
              if token not in r: raise SystemExit('missing V7 guard: '+token)
          print('SOILBIN_V7_PAYLOAD_OK')
          PY

      - name: Request trusted write OIDC
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,urllib.request,urllib.parse
          base=os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']; sep='&' if '?' in base else '?'
          target=base+sep+'audience='+urllib.parse.quote('cgp-control-plane-v3-action',safe='')
          req=urllib.request.Request(target,headers={'Authorization':'Bearer '+os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
          with urllib.request.urlopen(req,timeout=30) as r: token=json.load(r)['value']
          if len(token)<100: raise SystemExit('write OIDC unavailable')
          print('::add-mask::'+token)
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f: f.write('CGP_ACTION_OIDC_TOKEN='+token+'\\n')
          PY

      - name: Launch V7 on Kaggle kg-09
        shell: bash
        run: |
          set -euo pipefail
          python control-plane-payloads/soilbin-q1-v7-memory-spectral/launch_soilbin_v7_cloudflare.py

      - name: Request trusted read OIDC
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,urllib.request,urllib.parse
          base=os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']; sep='&' if '?' in base else '?'
          target=base+sep+'audience='+urllib.parse.quote('cgp-control-plane-v3',safe='')
          req=urllib.request.Request(target,headers={'Authorization':'Bearer '+os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
          with urllib.request.urlopen(req,timeout=30) as r: token=json.load(r)['value']
          if len(token)<100: raise SystemExit('read OIDC unavailable')
          print('::add-mask::'+token)
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f: f.write('CGP_READ_OIDC_TOKEN='+token+'\\n')
          PY

      - name: Poll V7 and collect evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,pathlib,time,urllib.request,urllib.error
          endpoint='https://chatgpt-kaggle-gateway.rezanory-chatgpt-plugins.workers.dev/control-plane/v3/read/kaggle'
          token=os.environ['CGP_READ_OIDC_TOKEN']
          account='kg-09'
          raw_ref=os.environ.get('SOILBIN_V7_KERNEL_REF','').strip()
          ref=raw_ref.removeprefix('/code/')
          if '/' not in ref: raise SystemExit('invalid launched V7 kernel ref: '+raw_ref)
          owner,slug=ref.split('/',1)
          def call(payload,timeout=120):
              req=urllib.request.Request(endpoint,data=json.dumps(payload,separators=(',',':')).encode(),method='POST',
                  headers={'Authorization':'Bearer '+token,'Content-Type':'application/json','Accept':'application/json','User-Agent':'soilbin-v7-evidence/1.0'})
              try:
                  with urllib.request.urlopen(req,timeout=timeout) as r:
                      val=json.loads(r.read().decode('utf-8','replace') or '{}')
              except urllib.error.HTTPError as e:
                  detail=e.read(4000).decode('utf-8','replace')
                  raise RuntimeError(f'read broker HTTP {e.code}: {detail}') from e
              if val.get('ok') is not True or val.get('read_only') is not True:
                  raise RuntimeError('read broker rejected: '+json.dumps(val)[:1500])
              return val.get('result') or {}
          for attempt in range(210):
              last=call({'action':'raw_read','account_id':account,'service':'kernels.KernelsApiService',
                         'method':'GetKernelSessionStatus','body':{'userName':owner,'kernelSlug':slug}},60)
              txt=json.dumps(last,ensure_ascii=False,sort_keys=True).upper()
              print('V7_KAGGLE_STATUS',attempt,txt[:1200],flush=True)
              if 'COMPLETE' in txt: break
              if any(x in txt for x in ['ERROR','FAILED','CANCELLED']):
                  raise SystemExit('V7 Kaggle terminal failure: '+txt[:2200])
              time.sleep(20)
          else:
              raise SystemExit('V7 Kaggle status polling timed out')
          out=call({'action':'output_json_files','account_id':account,'kernel_ref':ref,
                    'file_names':['RESULTS_V7.json','RUN_MANIFEST_V7.json'],
                    'max_bytes_per_file':262144},180)
          files=out.get('files') or []
          if len(files)!=2: raise SystemExit('expected 2 V7 evidence files, got '+str(len(files))+' :: '+json.dumps(out)[:1800])
          dest=pathlib.Path(os.environ['RUNNER_TEMP'])/'soilbin-v7-evidence'
          dest.mkdir(parents=True,exist_ok=True)
          by={}
          for f in files:
              name=str(f.get('file_name') or '')
              value=f.get('json')
              if not isinstance(value,dict): raise SystemExit('missing JSON for '+name)
              by[name]=value
              (dest/name).write_text(json.dumps(value,ensure_ascii=False,indent=2),encoding='utf-8')
          results=by['RESULTS_V7.json']
          rep=results.get('baseline_reproduction') or {}
          if rep.get('within_2pct_of_frozen_v5') is not True:
              raise SystemExit('V7 baseline reproduction drift gate failed')
          summary={
              'kernel_ref':ref,
              'kaggle_terminal_complete':True,
              'baseline_reproduction':rep,
              'best_extension_descriptive':results.get('best_extension_descriptive'),
              'full_pre_registered_challenger':results.get('full_pre_registered_challenger'),
              'primary_summary':results.get('primary_summary'),
              'paired_vs_v5':results.get('paired_vs_v5'),
              'robustness':results.get('robustness'),
              'selection_counts':results.get('selection_counts'),
              'persistence_joint_Group_MAE_N':results.get('persistence_joint_Group_MAE_N')
          }
          (dest/'EVIDENCE_SUMMARY_V7.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as h:
              h.write('SOILBIN_V7_EVIDENCE_DIR='+str(dest)+'\\n')
              h.write('SOILBIN_V7_COMPLETE=1\\n')
              h.write('SOILBIN_V7_KERNEL_REF_NORMALIZED='+ref+'\\n')
          print('SOILBIN_V7_KAGGLE_COMPLETE',json.dumps(summary,ensure_ascii=False),flush=True)
          PY

      - name: Upload V7 evidence
        uses: actions/upload-artifact@v4
        with:
          name: soilbin-v7-memory-spectral-evidence
          path: ${{ env.SOILBIN_V7_EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish V7 receipt
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,urllib.request
          ok=os.environ.get('SOILBIN_V7_COMPLETE')=='1'
          title='COMPLETE' if ok else 'FAILED_OR_INCOMPLETE'
          body=(f"SOILBIN V7 memory/fusion/spectral Kaggle run {title}\\n"
                f"GitHub run: {os.environ['GITHUB_RUN_ID']}\\n"
                "Kaggle: kg-09 / mylovevpn1\\n"
                f"Kernel: {os.environ.get('SOILBIN_V7_KERNEL_REF_NORMALIZED',os.environ.get('SOILBIN_V7_KERNEL_REF','unknown'))}\\n"
                f"Exact V5 reproduction gate: {'PASS' if ok else 'not verified'}\\n"
                "V7 remains post-lock exploratory; V5 is not overwritten.\\n")
          req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/134/comments",
              data=json.dumps({'body':body}).encode(),method='POST',
              headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],'Accept':'application/vnd.github+json',
                       'X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json','User-Agent':'soilbin-v7/1.0'})
          with urllib.request.urlopen(req,timeout=30): pass
          PY
