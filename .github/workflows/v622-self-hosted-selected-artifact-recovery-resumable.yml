name: v622-self-hosted-selected-artifact-recovery-resumable

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v622-self-hosted-selected-artifact-recovery-resumable.yml'
      - 'scripts/v622-selected-artifact-recovery-resumable.ps1'
      - 'deploy/cloudflare-worker-free/src/v622-selected-artifact-recovery-worker.ts'

permissions:
  contents: read
  issues: write

concurrency:
  group: v622-cloudflare-production-mutation
  cancel-in-progress: false

jobs:
  recover:
    runs-on: [self-hosted, windows, x64, v622]
    timeout-minutes: 180
    environment: cloudflare-production
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy protected selected artifact recovery bridge
        shell: powershell
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          $ErrorActionPreference = 'Stop'
          $accountId = ([string]$env:RAW_CLOUDFLARE_ACCOUNT_ID).Trim()
          if ([string]::IsNullOrWhiteSpace($env:CLOUDFLARE_API_TOKEN) -or [string]::IsNullOrWhiteSpace($accountId)) {
            throw 'Cloudflare credentials missing'
          }
          Write-Host "::add-mask::$accountId"
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "V622_CF_ACCOUNT_ID=$accountId`n", [System.Text.UTF8Encoding]::new($false))
          $env:CLOUDFLARE_ACCOUNT_ID = $accountId
          Push-Location 'deploy/cloudflare-worker-free'
          try {
            npm install --no-audit --no-fund
            if ($LASTEXITCODE -ne 0) { throw 'npm install failed' }
            npm run check
            if ($LASTEXITCODE -ne 0) { throw 'Worker typecheck failed' }
            npx wrangler deploy src/v622-selected-artifact-recovery-worker.ts --name chatgpt-kaggle-gateway
            if ($LASTEXITCODE -ne 0) { throw 'Selected artifact recovery bridge deploy failed' }
          }
          finally { Pop-Location }

      - name: Create ephemeral recovery capability
        shell: powershell
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $bytes = New-Object byte[] 48
          $rng = [System.Security.Cryptography.RandomNumberGenerator]::Create()
          try { $rng.GetBytes($bytes) } finally { $rng.Dispose() }
          $token = [Convert]::ToBase64String($bytes).TrimEnd('=').Replace('+','-').Replace('/','_')
          Write-Host "::add-mask::$token"
          $env:CLOUDFLARE_ACCOUNT_ID = $env:V622_CF_ACCOUNT_ID
          Push-Location 'deploy/cloudflare-worker-free'
          try {
            $token | npx wrangler secret put CGP_PROJECT_CONTROL_TOKEN --name chatgpt-kaggle-gateway
            if ($LASTEXITCODE -ne 0) { throw 'Capability install failed' }
          }
          finally { Pop-Location }
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "V622_RECOVERY_TOKEN=$token`n", [System.Text.UTF8Encoding]::new($false))

      - name: Recover exact six selected artifacts with resumable transfers
        timeout-minutes: 150
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & (Join-Path $env:GITHUB_WORKSPACE 'scripts/v622-selected-artifact-recovery-resumable.ps1')

      # Upload each selected candidate independently. A DNS/blob failure no longer
      # invalidates an otherwise healthy multi-hundred-MB aggregate upload.
      - name: Upload ConvNeXt selected files attempt 1
        id: upload_convnext_1
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: v622-selected-M06-convnext-tiny
          path: ${{ runner.temp }}/v622-selected-backbone-checkpoints-configs/M06__convnext_tiny
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: true

      - name: Upload ConvNeXt selected files attempt 2
        id: upload_convnext_2
        if: steps.upload_convnext_1.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: v622-selected-M06-convnext-tiny
          path: ${{ runner.temp }}/v622-selected-backbone-checkpoints-configs/M06__convnext_tiny
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: true

      - name: Upload ConvNeXt selected files attempt 3
        if: steps.upload_convnext_1.outcome == 'failure' && steps.upload_convnext_2.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: v622-selected-M06-convnext-tiny
          path: ${{ runner.temp }}/v622-selected-backbone-checkpoints-configs/M06__convnext_tiny
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: true

      - name: Upload DenseNet selected files attempt 1
        id: upload_densenet_1
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: v622-selected-M06-densenet121
          path: ${{ runner.temp }}/v622-selected-backbone-checkpoints-configs/M06__densenet121
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: true

      - name: Upload DenseNet selected files attempt 2
        id: upload_densenet_2
        if: steps.upload_densenet_1.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: v622-selected-M06-densenet121
          path: ${{ runner.temp }}/v622-selected-backbone-checkpoints-configs/M06__densenet121
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: true

      - name: Upload DenseNet selected files attempt 3
        if: steps.upload_densenet_1.outcome == 'failure' && steps.upload_densenet_2.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: v622-selected-M06-densenet121
          path: ${{ runner.temp }}/v622-selected-backbone-checkpoints-configs/M06__densenet121
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: true

      - name: Upload ResNet selected files attempt 1
        id: upload_resnet_1
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: v622-selected-M06-resnet50v2
          path: ${{ runner.temp }}/v622-selected-backbone-checkpoints-configs/M06__resnet50v2
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: true

      - name: Upload ResNet selected files attempt 2
        id: upload_resnet_2
        if: steps.upload_resnet_1.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: v622-selected-M06-resnet50v2
          path: ${{ runner.temp }}/v622-selected-backbone-checkpoints-configs/M06__resnet50v2
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: true

      - name: Upload ResNet selected files attempt 3
        if: steps.upload_resnet_1.outcome == 'failure' && steps.upload_resnet_2.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: v622-selected-M06-resnet50v2
          path: ${{ runner.temp }}/v622-selected-backbone-checkpoints-configs/M06__resnet50v2
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: true

      - name: Stage manifest upload payload
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:RUNNER_TEMP 'v622-selected-backbone-checkpoints-configs/SELECTED_ARTIFACT_MANIFEST.json'
          $sha = Join-Path $env:RUNNER_TEMP 'v622-selected-manifest-sha.txt'
          $dest = Join-Path $env:RUNNER_TEMP 'v622-selected-recovery-manifest'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item -Force $source (Join-Path $dest 'SELECTED_ARTIFACT_MANIFEST.json')
          Copy-Item -Force $sha (Join-Path $dest 'SELECTED_ARTIFACT_MANIFEST.sha256')

      - name: Upload selected manifest attempt 1
        id: upload_manifest_1
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: v622-selected-backbone-recovery-manifest
          path: ${{ runner.temp }}/v622-selected-recovery-manifest
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: true

      - name: Upload selected manifest attempt 2
        id: upload_manifest_2
        if: steps.upload_manifest_1.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: v622-selected-backbone-recovery-manifest
          path: ${{ runner.temp }}/v622-selected-recovery-manifest
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: true

      - name: Upload selected manifest attempt 3
        if: steps.upload_manifest_1.outcome == 'failure' && steps.upload_manifest_2.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: v622-selected-backbone-recovery-manifest
          path: ${{ runner.temp }}/v622-selected-recovery-manifest
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: true

      - name: Remove capability and restore canonical Worker
        shell: powershell
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:V622_CF_ACCOUNT_ID)) {
            throw 'Cloudflare account id missing during cleanup.'
          }
          $env:CLOUDFLARE_ACCOUNT_ID = $env:V622_CF_ACCOUNT_ID
          Push-Location 'deploy/cloudflare-worker-free'
          try {
            $deleteOk = $false
            for ($attempt = 1; $attempt -le 5; $attempt++) {
              'y' | npx wrangler secret delete CGP_PROJECT_CONTROL_TOKEN --name chatgpt-kaggle-gateway
              if ($LASTEXITCODE -eq 0) { $deleteOk = $true; break }
              if ($attempt -lt 5) { Start-Sleep -Seconds (5 * $attempt) }
            }
            if (-not $deleteOk) { throw 'Could not delete ephemeral recovery capability after retries.' }

            $restoreOk = $false
            for ($attempt = 1; $attempt -le 5; $attempt++) {
              npx wrangler deploy
              if ($LASTEXITCODE -eq 0) { $restoreOk = $true; break }
              if ($attempt -lt 5) { Start-Sleep -Seconds (5 * $attempt) }
            }
            if (-not $restoreOk) { throw 'Could not restore canonical Worker after retries.' }
          }
          finally { Pop-Location }

      - name: Publish selected artifact recovery receipt
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'v622-selected-backbone-checkpoints-configs'
          $value = Get-Content -Raw (Join-Path $root 'SELECTED_ARTIFACT_MANIFEST.json') | ConvertFrom-Json
          $manifestSha = (Get-Content -Raw (Join-Path $env:RUNNER_TEMP 'v622-selected-manifest-sha.txt')).Trim()
          $checkpoints = @($value.artifacts | Where-Object { $_.role -eq 'checkpoint' })
          $cp = @($checkpoints | ForEach-Object { "$($_.candidate_id)=$($_.sha256)" }) -join ', '
          $body = "## V6.2.2 selected checkpoints/configs recovered`n`n- Kernel: ``$($value.kernel_ref)```n- Scope: exactly 3 ``config.json`` + 3 ``final_selected.keras`` for frozen ensemble members`n- Config hashes matched canonical run index: ``PASS```n- Selected artifact manifest SHA-256: ``$manifestSha```n- Checkpoint SHA-256: ``$cp```n- Downloader: ``$($value.downloader)```n- Private artifact family: ``v622-selected-M06-convnext-tiny``, ``v622-selected-M06-densenet121``, ``v622-selected-M06-resnet50v2``, ``v622-selected-backbone-recovery-manifest```n- Kaggle compute launched: ``false```n- Canonical M01-M12 rerun: ``false```n- HPO/confirmation repeated: ``false```n- Locked test used: ``false```n- External data used: ``false```n- GitHub-hosted compute used: ``false```n- Ephemeral capability removed: ``PASS```n- Canonical Worker restored: ``PASS```n- GitHub run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID`n"
          $payload = @{ body = $body } | ConvertTo-Json
          $headers = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/issues/18/comments" -Method Post -Headers $headers -ContentType 'application/json' -Body $payload | Out-Null

      - name: Emergency cleanup after earlier failure
        if: failure()
        shell: powershell
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          $ErrorActionPreference = 'Continue'
          if (-not [string]::IsNullOrWhiteSpace($env:V622_CF_ACCOUNT_ID)) {
            $env:CLOUDFLARE_ACCOUNT_ID = $env:V622_CF_ACCOUNT_ID
            Push-Location 'deploy/cloudflare-worker-free'
            try {
              for ($attempt = 1; $attempt -le 3; $attempt++) {
                'y' | npx wrangler secret delete CGP_PROJECT_CONTROL_TOKEN --name chatgpt-kaggle-gateway
                if ($LASTEXITCODE -eq 0) { break }
                Start-Sleep -Seconds 5
              }
              for ($attempt = 1; $attempt -le 3; $attempt++) {
                npx wrangler deploy
                if ($LASTEXITCODE -eq 0) { break }
                Start-Sleep -Seconds 5
              }
            }
            finally { Pop-Location }
          }

      - name: Publish selected artifact recovery failure receipt
        if: failure()
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Continue'
          $failurePath = Join-Path $env:RUNNER_TEMP 'v622-selected-recovery-failure.txt'
          $reason = if (Test-Path $failurePath) { (Get-Content -Raw $failurePath).Trim() } else { 'post-recovery upload or cleanup failure; inspect this exact workflow run' }
          if ($reason.Length -gt 1000) { $reason = $reason.Substring(0, 1000) }
          $body = "## V6.2.2 selected checkpoint/config recovery diagnostic receipt`n`n- Result: ``FAILED_OR_TIMED_OUT```n- Scope: selected 3 configs + 3 checkpoints recovery only`n- Failure reason: ``$reason```n- Resumable transfer enabled: ``true```n- Sharded upload retries enabled: ``true```n- Kaggle compute launched: ``false```n- Canonical M01-M12 rerun: ``false```n- HPO/confirmation repeated: ``false```n- Locked test used: ``false```n- External data used: ``false```n- GitHub run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID`n- Action: inspect only this recovery path; do not launch training/HPO/locked-test work.`n"
          try {
            $payload = @{ body = $body } | ConvertTo-Json
            $headers = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
            Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/issues/18/comments" -Method Post -Headers $headers -ContentType 'application/json' -Body $payload | Out-Null
          }
          catch {
            Write-Warning "Could not publish failure diagnostic receipt: $($_.Exception.Message)"
          }
