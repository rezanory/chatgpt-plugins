name: kaggle-secret-promotion-test-20260913

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    environment: kaggle-09
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - name: Promote token without printing it
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN"
          gh secret set CGP_KAGGLE_KG09_TOKEN_TEST -R "$GITHUB_REPOSITORY" --body "$KAGGLE_API_TOKEN"
          gh secret list -R "$GITHUB_REPOSITORY" --json name --jq '.[].name' | grep -qx CGP_KAGGLE_KG09_TOKEN_TEST
          echo PROMOTION_TEST_OK
      - name: Remove test secret
        if: always()
        shell: bash
        run: |
          gh secret delete CGP_KAGGLE_KG09_TOKEN_TEST -R "$GITHUB_REPOSITORY" || true
