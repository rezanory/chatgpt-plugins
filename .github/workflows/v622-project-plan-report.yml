name: v622-project-plan-report

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v622-project-plan-report.yml'
      - 'deploy/cloudflare-worker-free/src/project-plan.ts'
      - 'deploy/cloudflare-worker-free/src/source-contract.ts'
      - 'deploy/cloudflare-worker-free/src/recovery.ts'
      - 'deploy/cloudflare-worker-free/src/index.ts'

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Read recovered project plan
        shell: bash
        run: |
          url='https://chatgpt-kaggle-gateway.rezanory-chatgpt-plugins.workers.dev/recovery/v6-2-2/shard-artifacts?shard=PLAN'
          ok=0
          for attempt in $(seq 1 30); do
            code="$(curl --silent --show-error --max-time 120 -o /tmp/v622-plan.json -w '%{http_code}' "$url" || true)"
            if [ "$code" = '200' ] && python - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path('/tmp/v622-plan.json').read_text(encoding='utf-8'))
          assert value.get('planned_model_codes') == [f'M{i:02d}' for i in range(1, 13)]
          assert isinstance(value.get('source_inventory'), list)
          assert isinstance(value.get('kernel_source_contract'), dict)
          PY
            then
              ok=1
              break
            fi
            sleep 10
          done
          if [ "$ok" != '1' ]; then
            echo 'Recovered V6.2.2 project-plan endpoint did not become ready.' >&2
            cat /tmp/v622-plan.json 2>/dev/null | head -c 4000 || true
            exit 1
          fi

      - name: Publish compact execution contract
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          value = json.loads(Path('/tmp/v622-plan.json').read_text(encoding='utf-8'))
          runner_inventory = [
              name for name in value.get('source_inventory', [])
              if re.search(r'(runner|matrix|master|worker|hpo|ensemble|champion|inventory)', name, re.I)
          ]
          signals = [
              line for line in value.get('source_signal_lines', [])
              if re.search(r'(M0[1-9]|M1[0-2]|--model-id|--image-size|--seed|--run-name|--output-root|head-epochs|finetune-epochs|matrix|worker|shard|FINAL_TEST_TOKEN)', line, re.I)
          ][:180]
          compact = {
              'source_kernel': value.get('source_kernel'),
              'planned_model_codes': value.get('planned_model_codes'),
              'resolutions_seen': value.get('resolutions'),
              'runner_inventory': runner_inventory,
              'kernel_source_contract': value.get('kernel_source_contract'),
              'execution_signals': signals,
          }
          body = '## V6.2.2 compact execution contract\n\n```json\n' + json.dumps(compact, indent=2) + '\n```\n'
          Path('/tmp/v622-plan.md').write_text(body, encoding='utf-8')
          PY
          gh issue comment 18 --repo "$GITHUB_REPOSITORY" --body-file /tmp/v622-plan.md
