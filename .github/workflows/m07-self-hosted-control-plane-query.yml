name: m07-self-hosted-control-plane-query

# Read-only fallback for the canonical V3 broker query.  This workflow exists
# only because GitHub-hosted runners can be unavailable for account/billing
# reasons; it never launches Kaggle compute or performs a write.
on:
  workflow_dispatch:
    inputs:
      query_json:
        description: "Bounded read-only control-plane query JSON"
        required: true
        type: string

permissions:
  id-token: write
  actions: read
  contents: read

jobs:
  query:
    if: ${{ github.actor_id == 62356000 }}
    runs-on: [self-hosted, windows, x64, v622]
    environment: cloudflare-production
    timeout-minutes: 20
    steps:
      - name: Resolve exact V3 query implementation
        id: resolve
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $h=@{Authorization="Bearer $env:GITHUB_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          $r=Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/git/ref/heads/feature/control-plane-v3" -Headers $h -TimeoutSec 30
          $sha=[string]$r.object.sha
          if($sha -notmatch '^[0-9a-f]{40}$'){throw 'Unable to resolve feature/control-plane-v3 SHA'}
          "sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "CGP_QUERY_IMPL_SHA=$sha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Checkout exact V3 query implementation
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.sha }}

      - name: Parse bounded read-only query payload
        shell: powershell
        env:
          CGP_QUERY_JSON: ${{ inputs.query_json }}
        run: |
          $ErrorActionPreference='Stop'
          $raw=[string]$env:CGP_QUERY_JSON
          if($raw.Length -lt 2 -or $raw.Length -gt 30000){throw 'query payload length invalid'}
          $obj=$raw | ConvertFrom-Json
          if(-not $obj.provider){throw 'query provider missing'}
          $payload=Join-Path $env:RUNNER_TEMP 'm07-control-plane-query.json'
          [IO.File]::WriteAllText($payload,$raw,[Text.UTF8Encoding]::new($false))
          "CGP_QUERY_PAYLOAD=$payload" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Request GitHub OIDC read-broker identity
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if(-not $env:ACTIONS_ID_TOKEN_REQUEST_URL -or -not $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN){throw 'GitHub OIDC request context unavailable'}
          $sep=if($env:ACTIONS_ID_TOKEN_REQUEST_URL.Contains('?')){'&'}else{'?'}
          $uri="$($env:ACTIONS_ID_TOKEN_REQUEST_URL)$($sep)audience=cgp-control-plane-v3"
          $h=@{Authorization="Bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN"}
          $r=Invoke-RestMethod -Uri $uri -Headers $h -TimeoutSec 30
          $token=[string]$r.value
          if($token.Length -lt 100){throw 'GitHub OIDC token unavailable'}
          Write-Host "::add-mask::$token"
          [IO.File]::AppendAllText($env:GITHUB_ENV,"CGP_OIDC_TOKEN=$token`n",[Text.UTF8Encoding]::new($false))

      - name: Execute provider read query
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $python=(Get-Command python.exe -ErrorAction SilentlyContinue).Source
          if(-not $python){$python=(Get-Command python -ErrorAction Stop).Source}
          $out=Join-Path $env:RUNNER_TEMP 'm07-control-plane-query-result.json'
          & $python scripts/control_plane_query_paged.py --payload-file $env:CGP_QUERY_PAYLOAD --out $out
          $code=$LASTEXITCODE
          if(-not (Test-Path $out)){throw 'query result missing'}
          $rawResult=Get-Content -Raw $out
          if($rawResult.Length -gt 50000){$rawResult=$rawResult.Substring(0,50000)+"`n<truncated>"}
          Write-Host 'CGP_QUERY_RESULT_BEGIN'
          Write-Host $rawResult
          Write-Host 'CGP_QUERY_RESULT_END'
          "CGP_QUERY_EXIT=$code" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          exit 0

      - name: Upload durable query result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m07-self-hosted-control-plane-query-${{ github.run_id }}
          path: ${{ runner.temp }}/m07-control-plane-query-result.json
          if-no-files-found: ignore
          retention-days: 7
