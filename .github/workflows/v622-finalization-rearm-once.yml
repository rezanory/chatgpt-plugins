name: v622-finalization-rearm-once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v622-finalization-rearm-once.yml'

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  rearm:
    runs-on: [self-hosted, windows, x64, v622]
    timeout-minutes: 10
    steps:
      - name: Dispatch final freeze only if no active duplicate exists
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $h=@{Authorization="Bearer $env:GITHUB_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          $uri="https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/workflows/v622-kaggle-finalization-freeze-bridge.yml/runs?per_page=20"
          $runs=Invoke-RestMethod -Uri $uri -Headers $h -Method Get
          $active=@($runs.workflow_runs | Where-Object { $_.status -in @('queued','in_progress','pending','waiting','requested') })
          if($active.Count -gt 0){
            $ids=($active | ForEach-Object { "$($_.id):$($_.status)" }) -join ', '
            Write-Host "NO_DISPATCH_ACTIVE_FINAL_FREEZE=$ids"
            exit 0
          }
          $p=@{ref='main'}|ConvertTo-Json -Compress
          Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/workflows/v622-kaggle-finalization-freeze-bridge.yml/dispatches" -Method Post -Headers $h -ContentType 'application/json' -Body $p
          Write-Host 'V622_FINAL_FREEZE_DISPATCHED_ONCE'
          $body="## V6.2.2 final-freeze safely re-armed`n`n- Active duplicate detected before dispatch: ``false```n- Dispatch target: ``v622-kaggle-finalization-freeze-bridge.yml```n- Runner policy: ``self-hosted only```n- Backbone rerun: ``false```n- Train/HPO/confirmation: ``false```n- Locked test/external: ``false```n"
          $payload=@{body=$body}|ConvertTo-Json -Compress
          Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/issues/18/comments" -Method Post -Headers $h -ContentType 'application/json' -Body $payload | Out-Null
