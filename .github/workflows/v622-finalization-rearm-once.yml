name: v622-finalization-rearm-once-retired

# FINAL_FREEZE_MANIFEST already passed on azadka. Re-arming it is forbidden before lockbox.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: [self-hosted, windows, x64, v622]
    steps:
      - name: Confirm retired state
        shell: powershell
        run: |
          Write-Host 'Retired V6.2.2 final-freeze rearm: no workflow dispatch, Kaggle launch, Cloudflare mutation, locked test, or external validation is performed.'
