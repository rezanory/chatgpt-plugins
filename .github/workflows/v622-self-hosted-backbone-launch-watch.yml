name: v622-self-hosted-backbone-launch-watch

# trigger: latest backbone launch run watcher v2
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v622-self-hosted-backbone-launch-watch.yml'

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  watch:
    runs-on: [self-hosted, windows, x64, v622]
    steps:
      - name: Report latest exact backbone launch run
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/workflows/v622-self-hosted-backbone-launch.yml/runs?branch=main&per_page=5"
          $runs = Invoke-RestMethod -Uri $uri -Method Get -Headers $headers
          $run = $runs.workflow_runs | Select-Object -First 1
          if (-not $run) { throw 'No backbone launch workflow run found.' }
          $body = "## V6.2.2 backbone launch run watcher`n`n- Run: $($run.html_url)`n- Run ID: $($run.id)`n- Event: $($run.event)`n- Status: $($run.status)`n- Conclusion: $($run.conclusion)`n- Head SHA: $($run.head_sha)`n"
          $payload = @{ body = $body } | ConvertTo-Json
          Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/issues/18/comments" -Method Post -Headers $headers -ContentType 'application/json' -Body $payload | Out-Null
