name: v622-self-hosted-backbone-status-repair

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v622-self-hosted-backbone-status-repair.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: v622-cloudflare-production-mutation
  cancel-in-progress: false

jobs:
  status:
    runs-on: [self-hosted, windows, x64, v622]
    timeout-minutes: 15
    environment: cloudflare-production
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy exact read-only backbone status wrapper
        shell: powershell
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          $ErrorActionPreference = 'Stop'
          $accountId = ([string]$env:RAW_CLOUDFLARE_ACCOUNT_ID).Trim()
          if ([string]::IsNullOrWhiteSpace($env:CLOUDFLARE_API_TOKEN) -or [string]::IsNullOrWhiteSpace($accountId)) {
            throw 'Cloudflare deployment credentials are not configured.'
          }
          Write-Host "::add-mask::$accountId"
          $env:CLOUDFLARE_ACCOUNT_ID = $accountId
          Push-Location 'deploy/cloudflare-worker-free'
          try {
            npm install --no-audit --no-fund
            if ($LASTEXITCODE -ne 0) { throw 'npm install failed' }
            npm run check
            if ($LASTEXITCODE -ne 0) { throw 'Worker typecheck failed' }
            npx wrangler deploy src/v622-backbone-monitor-index.ts --name chatgpt-kaggle-gateway
            if ($LASTEXITCODE -ne 0) { throw 'Exact status wrapper deploy failed' }
          }
          finally { Pop-Location }

      - name: Read exact Kaggle backbone status
        id: probe
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://chatgpt-kaggle-gateway.rezanory-chatgpt-plugins.workers.dev/recovery/v6-2-2/backbone-status'
          $value = $null
          $last = $null
          for ($attempt = 1; $attempt -le 20; $attempt++) {
            try {
              $candidate = Invoke-RestMethod -Uri $url -Method Get -TimeoutSec 30
              if ($candidate.project -ne 'PNEUMONIA V6.2.2' -or
                  $candidate.stage -ne 'post_ablation_backbone_comparison' -or
                  $candidate.kernel_ref -ne 'trickermark/pneumonia-v6-2-2-backbone-m06-r224') {
                throw 'stale or unexpected status response'
              }
              $value = $candidate
              break
            }
            catch {
              $last = $_.Exception.Message
              Start-Sleep -Seconds 3
            }
          }
          if (-not $value) { throw "Exact backbone status route did not converge after explicit wrapper deploy: $last" }
          $status = ([string]$value.status).Trim().ToUpperInvariant()
          $terminal = @('COMPLETE','ERROR','FAILED','CANCELLED','CANCELED','DEAD') -contains $status
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "status=$status`nterminal=$($terminal.ToString().ToLowerInvariant())`n", [System.Text.UTF8Encoding]::new($false))
          $value | ConvertTo-Json -Depth 20 | Set-Content -Encoding utf8 (Join-Path $env:RUNNER_TEMP 'v622-backbone-status-repair.json')

      - name: Publish exact status infrastructure repair receipt
        if: always()
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Continue'
          $status = '${{ steps.probe.outputs.status }}'
          if ([string]::IsNullOrWhiteSpace($status)) { $status = 'PROBE_ERROR' }
          $body = "## V6.2.2 exact backbone status infrastructure receipt`n`n- Kernel: ``trickermark/pneumonia-v6-2-2-backbone-m06-r224```n- Status: ``$status```n- Exact status wrapper explicitly deployed: ``true```n- Kaggle compute launched by this repair: ``false```n- Automatic rerun performed: ``false```n- Canonical M01-M12 rerun: ``false```n- HPO/confirmation repeated: ``false```n- Locked test used: ``false```n- External data used: ``false```n- GitHub run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID`n"
          $payload = @{ body = $body } | ConvertTo-Json
          $headers = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/issues/18/comments" -Method Post -Headers $headers -ContentType 'application/json' -Body $payload | Out-Null
