name: cloudflare-worker-free-deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-worker-free-deploy.yml'
      - 'deploy/cloudflare-worker-free/**'

permissions:
  contents: read

concurrency:
  group: cloudflare-worker-free-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: cloudflare-production
    steps:
      - uses: actions/checkout@v4

      - name: Detect Cloudflare deployment credentials
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          account_id="$(printf '%s' "$RAW_CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$account_id" ]; then
            if ! [[ "$account_id" =~ ^[A-Za-z0-9_-]+$ ]]; then
              echo "Cloudflare Account ID contains unsupported characters after normalization." >&2
              exit 1
            fi
            echo "::add-mask::$account_id"
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "account_id=$account_id" >> "$GITHUB_OUTPUT"
            echo "Cloudflare Workers Free deployment credentials are configured."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deployment credentials are absent; live deployment is skipped."
          fi

      - name: Install Worker dependencies
        if: steps.credentials.outputs.configured == 'true'
        working-directory: deploy/cloudflare-worker-free
        run: npm install --no-audit --no-fund

      - name: Validate Worker package
        if: steps.credentials.outputs.configured == 'true'
        working-directory: deploy/cloudflare-worker-free
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.credentials.outputs.account_id }}
        run: |
          npm run check
          npm run deploy:dry

      - name: Deploy Worker Free
        if: steps.credentials.outputs.configured == 'true'
        working-directory: deploy/cloudflare-worker-free
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.credentials.outputs.account_id }}
        run: npx wrangler deploy

      - name: Report Worker secret readiness safely
        if: steps.credentials.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.credentials.outputs.account_id }}
        shell: bash
        run: |
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/chatgpt-kaggle-gateway/secrets" \
            -o /tmp/cloudflare-secret-list.json
          python - /tmp/cloudflare-secret-list.json <<'PY'
          import json
          import pathlib
          import sys

          payload = json.loads(pathlib.Path(sys.argv[1]).read_text())
          if not payload.get("success"):
              raise SystemExit("Cloudflare secret-name lookup returned success=false")
          names = {
              str(item.get("name") or "")
              for item in (payload.get("result") or [])
              if isinstance(item, dict) and item.get("name")
          }
          required = [
              "CGP_KAGGLE_KG01_TOKEN",
              "CGP_KAGGLE_KG02_TOKEN",
              "CGP_KAGGLE_KG04_TOKEN",
              "CGP_KAGGLE_KG05_TOKEN",
              "CGP_KAGGLE_KG06_TOKEN",
              "CGP_KAGGLE_KG07_TOKEN",
              "CGP_MCP_PATH_TOKEN",
          ]
          present = [name for name in required if name in names]
          missing = [name for name in required if name not in names]
          print(f"READ_RECOVERY_SECRETS_PRESENT={len(present)}/{len(required)}")
          if missing:
              print("READ_RECOVERY_SECRETS_MISSING=" + ",".join(missing))
          else:
              print("READ_RECOVERY_SECRETS_READY=true")
          # Intentionally never print the raw API payload or any secret binding text.
          PY

      - name: Resolve workers.dev URL and verify health
        if: steps.credentials.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.credentials.outputs.account_id }}
        shell: bash
        run: |
          response="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain")"
          subdomain="$(python - "$response" <<'PY'
          import json
          import sys
          payload = json.loads(sys.argv[1])
          if not payload.get("success"):
              raise SystemExit("Cloudflare workers subdomain lookup failed")
          value = str((payload.get("result") or {}).get("subdomain") or "").strip()
          if not value:
              raise SystemExit("Cloudflare workers.dev subdomain is missing")
          print(value)
          PY
          )"
          worker_url="https://chatgpt-kaggle-gateway.${subdomain}.workers.dev"
          for attempt in $(seq 1 20); do
            if payload="$(curl --fail --silent --show-error --max-time 10 "$worker_url/healthz")"; then
              python - "$payload" <<'PY'
          import json
          import sys
          value = json.loads(sys.argv[1])
          assert value.get("service") == "chatgpt-kaggle-gateway"
          assert value.get("transport") == "cloudflare-workers-free"
          assert value.get("status") == "ready"
          print("LIVE_MCP_CONFIGURED=" + str(bool(value.get("mcp_configured"))).lower())
          print("LIVE_KAGGLE_TOKENS_CONFIGURED=" + str(int(value.get("kaggle_tokens_configured", 0))))
          print("LIVE_WRITE_ENABLED=" + str(bool(value.get("write_enabled"))).lower())
          PY
              echo "Cloudflare Workers Free health check PASS: $worker_url/healthz"
              exit 0
            fi
            sleep 3
          done
          echo "Cloudflare Worker did not pass /healthz validation." >&2
          exit 1

      - name: Report activation blocker
        if: steps.credentials.outputs.configured != 'true'
        run: echo "SKIPPED_NOT_CONFIGURED"
