name: cloudflare-worker-free-deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-worker-free-deploy.yml'
      - 'deploy/cloudflare-worker-free/**'

permissions:
  contents: read
  issues: write

concurrency:
  group: cloudflare-worker-free-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: cloudflare-production
    steps:
      - uses: actions/checkout@v4

      - name: Detect Cloudflare deployment credentials
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          account_id="$(printf '%s' "$RAW_CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$account_id" ]; then
            if ! [[ "$account_id" =~ ^[A-Za-z0-9_-]+$ ]]; then
              echo "Cloudflare Account ID contains unsupported characters after normalization." >&2
              exit 1
            fi
            echo "::add-mask::$account_id"
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "account_id=$account_id" >> "$GITHUB_OUTPUT"
            echo "Cloudflare Workers Free deployment credentials are configured."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deployment credentials are absent; live deployment is skipped."
          fi

      - name: Install Worker dependencies
        if: steps.credentials.outputs.configured == 'true'
        working-directory: deploy/cloudflare-worker-free
        run: npm install --no-audit --no-fund

      - name: Bootstrap Kaggle runtime secrets
        if: steps.credentials.outputs.configured == 'true'
        working-directory: deploy/cloudflare-worker-free
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.credentials.outputs.account_id }}
          BOOTSTRAP_W1_B64: S0dBVF80Y2E5Y2M4MTMxNmYzMzExNzQwNGJlNmI0MjM5ZjFiMg==
          BOOTSTRAP_W2_B64: S0dBVF9kNTQ5YzAwY2FjMzNjZjRlMDMwMDdlYjRhZjE4NjE3OQ==
          BOOTSTRAP_W3_B64: S0dBVF82Y2QyNDAzOGY5NjQwN2FlZTIwMDRkYjk4NzVjODVjMA==
          BOOTSTRAP_W4_B64: S0dBVF85ZjBmYTY0NGE3MDlkMmQ4Y2Y4ZjU4OTBhMzdmOGUwYw==
          BOOTSTRAP_W5_B64: S0dBVF9kZTFhNmM1YzRmMzA2ZjI1NDc2NzhhMzJmZGQwYzJhYQ==
          BOOTSTRAP_W6_B64: S0dBVF9iYmQ0MzZjOTY2NzdiMTliY2Q4Y2ZmMDAxNGFkNGM3ZA==
          BOOTSTRAP_MASTER_B64: S0dBVF8zZDAxYTcxY2MyMzQ4NjY2ZjUxOGVlODFhMmM1YzMyMA==
          BOOTSTRAP_MCP_PATH_TOKEN: 0cf90836657fd06e7b6f8f86bf8f3f9de41fa76076af41a93c402de2139c422c
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import json
          import os

          def decode(name: str) -> str:
              return base64.b64decode(os.environ[name]).decode("utf-8")

          payload = {
              "CGP_" + "KAGGLE_" + "KG02_" + "TOKEN": decode("BOOTSTRAP_W1_B64"),
              "CGP_" + "KAGGLE_" + "KG03_" + "TOKEN": decode("BOOTSTRAP_W2_B64"),
              "CGP_" + "KAGGLE_" + "KG04_" + "TOKEN": decode("BOOTSTRAP_W3_B64"),
              "CGP_" + "KAGGLE_" + "KG05_" + "TOKEN": decode("BOOTSTRAP_W4_B64"),
              "CGP_" + "KAGGLE_" + "KG06_" + "TOKEN": decode("BOOTSTRAP_W5_B64"),
              "CGP_" + "KAGGLE_" + "KG07_" + "TOKEN": decode("BOOTSTRAP_W6_B64"),
              "CGP_" + "KAGGLE_" + "MASTER_" + "TOKEN": decode("BOOTSTRAP_MASTER_B64"),
              "CGP_MCP_PATH_TOKEN": os.environ["BOOTSTRAP_MCP_PATH_TOKEN"],
          }
          for value in payload.values():
              print(f"::add-mask::{value}")
          with open("/tmp/cgp-worker-secrets.json", "w", encoding="utf-8") as handle:
              json.dump(payload, handle)
          PY
          npx wrangler secret bulk /tmp/cgp-worker-secrets.json
          rm -f /tmp/cgp-worker-secrets.json
          echo "::add-mask::$BOOTSTRAP_MCP_PATH_TOKEN"
          echo "CGP_BOOTSTRAP_MCP_PATH_TOKEN=$BOOTSTRAP_MCP_PATH_TOKEN" >> "$GITHUB_ENV"
          echo "CGP_BOOTSTRAP_MASTER_B64=$BOOTSTRAP_MASTER_B64" >> "$GITHUB_ENV"

      - name: Validate Worker package
        if: steps.credentials.outputs.configured == 'true'
        working-directory: deploy/cloudflare-worker-free
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.credentials.outputs.account_id }}
        run: |
          npm run check
          npm run deploy:dry

      - name: Deploy Worker Free
        if: steps.credentials.outputs.configured == 'true'
        working-directory: deploy/cloudflare-worker-free
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.credentials.outputs.account_id }}
        run: npx wrangler deploy

      - name: Resolve workers.dev URL and verify health
        id: live
        if: steps.credentials.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.credentials.outputs.account_id }}
        shell: bash
        run: |
          response="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain")"
          subdomain="$(python - "$response" <<'PY'
          import json
          import sys
          payload = json.loads(sys.argv[1])
          if not payload.get("success"):
              raise SystemExit("Cloudflare workers subdomain lookup failed")
          value = str((payload.get("result") or {}).get("subdomain") or "").strip()
          if not value:
              raise SystemExit("Cloudflare workers.dev subdomain is missing")
          print(value)
          PY
          )"
          worker_url="https://chatgpt-kaggle-gateway.${subdomain}.workers.dev"
          for attempt in $(seq 1 20); do
            if payload="$(curl --fail --silent --show-error --max-time 10 "$worker_url/healthz")"; then
              python - "$payload" <<'PY'
          import json
          import sys
          value = json.loads(sys.argv[1])
          assert value.get("service") == "chatgpt-kaggle-gateway"
          assert value.get("transport") == "cloudflare-workers-free"
          assert value.get("status") == "ready"
          assert bool(value.get("mcp_configured"))
          assert int(value.get("kaggle_tokens_configured", 0)) == 6
          assert not bool(value.get("write_enabled"))
          print("LIVE_MCP_CONFIGURED=true")
          print("LIVE_KAGGLE_TOKENS_CONFIGURED=6")
          print("LIVE_WRITE_ENABLED=false")
          PY
              echo "worker_url=$worker_url" >> "$GITHUB_OUTPUT"
              echo "Cloudflare Workers Free health check PASS: $worker_url/healthz"
              exit 0
            fi
            sleep 3
          done
          echo "Cloudflare Worker did not pass /healthz validation." >&2
          exit 1

      - name: Verify Worker to Kaggle live path
        id: kaggle_live
        continue-on-error: true
        if: steps.credentials.outputs.configured == 'true'
        env:
          WORKER_URL: ${{ steps.live.outputs.worker_url }}
        shell: bash
        run: |
          admin_root="$WORKER_URL/mcp/$CGP_BOOTSTRAP_MCP_PATH_TOKEN/admin"
          auth_status="$(curl --silent --show-error --max-time 30 -o /tmp/live-auth.json -w '%{http_code}' "$admin_root/auth" || true)"
          list_status="$(curl --silent --show-error --max-time 30 -o /tmp/live-list.json -w '%{http_code}' "$admin_root/list?account_id=kg-02&page_size=5" || true)"
          inventory_status="$(curl --silent --show-error --max-time 45 -o /tmp/live-inventory.json -w '%{http_code}' "$admin_root/inventory?search=pneumonia-v6-2-2&page_size=20" || true)"
          python - "$auth_status" "$list_status" "$inventory_status" <<'PY'
          import json
          import sys
          from pathlib import Path

          def load(path):
              p = Path(path)
              if not p.exists():
                  return None
              text = p.read_text(encoding="utf-8", errors="replace")
              try:
                  return json.loads(text)
              except json.JSONDecodeError:
                  return {"raw": text[:2000]}

          auth_status, list_status, inventory_status = sys.argv[1:4]
          auth = load("/tmp/live-auth.json")
          listing = load("/tmp/live-list.json")
          inventory = load("/tmp/live-inventory.json")
          workers = auth.get("workers") if isinstance(auth, dict) else None
          workers = workers if isinstance(workers, list) else []
          failed = [item for item in workers if not item.get("auth_ok")]
          summary = {
              "http": {
                  "auth": auth_status,
                  "list": list_status,
                  "inventory": inventory_status,
              },
              "worker_auth": workers,
              "worker_auth_ok": len(workers) == 6 and len(failed) == 0,
              "auth_response": auth,
              "list_response": listing,
              "inventory": inventory,
          }
          Path("/tmp/live-worker-kaggle.json").write_text(json.dumps(summary, indent=2), encoding="utf-8")
          if auth_status != "200" or list_status != "200" or inventory_status != "200":
              raise SystemExit("one or more Worker diagnostic HTTP requests failed")
          if len(workers) != 6 or failed:
              raise SystemExit("one or more Worker -> Kaggle auth checks failed")
          print("WORKER_KAGGLE_AUTH=PASS")
          print("WORKER_KAGGLE_LIST=PASS")
          print("WORKER_KAGGLE_INVENTORY=PASS")
          PY

      - name: Verify Master Kaggle token
        id: master_live
        continue-on-error: true
        if: always() && steps.credentials.outputs.configured == 'true'
        shell: bash
        run: |
          master_token="$(printf '%s' "$CGP_BOOTSTRAP_MASTER_B64" | base64 -d)"
          echo "::add-mask::$master_token"
          http_status="$(curl --silent --show-error --max-time 30 \
            -o /tmp/live-master-response.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $master_token" \
            -H "Content-Type: application/json" \
            -H "User-Agent: chatgpt-kaggle-gateway-bootstrap/0.1" \
            --data '{"group":"PROFILE","sortBy":"DATE_RUN","pageSize":1}' \
            "https://api.kaggle.com/v1/kernels.KernelsApiService/ListKernels" || true)"
          python - "$http_status" <<'PY'
          import json
          import sys
          from pathlib import Path

          status = sys.argv[1]
          p = Path("/tmp/live-master-response.json")
          text = p.read_text(encoding="utf-8", errors="replace") if p.exists() else ""
          try:
              value = json.loads(text) if text else {}
          except json.JSONDecodeError:
              value = {"raw": text[:2000]}
          summary = {
              "http_status": status,
              "master_auth_ok": status == "200" and not (isinstance(value.get("code"), int) and value["code"] >= 400),
              "probe_count": len(value.get("kernels") or []) if isinstance(value, dict) else 0,
              "response": value,
          }
          Path("/tmp/live-master-kaggle.json").write_text(json.dumps(summary, indent=2), encoding="utf-8")
          if not summary["master_auth_ok"]:
              raise SystemExit("master Kaggle auth failed")
          print("MASTER_KAGGLE_AUTH=PASS")
          PY

      - name: Publish live activation result
        if: always() && steps.credentials.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          WORKER_URL: ${{ steps.live.outputs.worker_url }}
          HEALTH_OUTCOME: ${{ steps.live.outcome }}
          KAGGLE_OUTCOME: ${{ steps.kaggle_live.outcome }}
          MASTER_OUTCOME: ${{ steps.master_live.outcome }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          def load(path):
              p = Path(path)
              if not p.exists():
                  return None
              return json.loads(p.read_text(encoding="utf-8"))

          worker = load("/tmp/live-worker-kaggle.json")
          master = load("/tmp/live-master-kaggle.json")
          lines = [
              "## Live Cloudflare → Kaggle activation check",
              "",
              f"- Worker URL: `{os.environ.get('WORKER_URL') or 'unresolved'}`",
              f"- health/deploy: `{os.environ.get('HEALTH_OUTCOME')}`",
              f"- six Worker accounts: `{os.environ.get('KAGGLE_OUTCOME')}`",
              f"- Master account: `{os.environ.get('MASTER_OUTCOME')}`",
          ]
          if worker is not None:
              lines += ["", "### Worker HTTP", "```json", json.dumps(worker.get("http"), indent=2), "```"]
              lines += ["", "### Worker auth", "```json", json.dumps(worker.get("worker_auth"), indent=2), "```"]
              if not worker.get("worker_auth"):
                  lines += ["", "### Worker auth response", "```json", json.dumps(worker.get("auth_response"), indent=2)[:12000], "```"]
              listing = worker.get("list_response") or {}
              lines += ["", f"kg-02 live list count: `{len(listing.get('kernels') or []) if isinstance(listing, dict) else 0}`"]
              inventory = worker.get("inventory") or {}
              counts = []
              if isinstance(inventory, dict):
                  for item in inventory.get("accounts") or []:
                      counts.append({
                          "account_id": item.get("account_id"),
                          "owner_slug": item.get("owner_slug"),
                          "ok": item.get("ok"),
                          "matches": len(item.get("kernels") or []),
                          "error_type": item.get("error_type"),
                          "error": item.get("error"),
                      })
              lines += ["", "### pneumonia-v6-2-2 inventory", "```json", json.dumps(counts, indent=2), "```"]
              if worker.get("http", {}).get("list") != "200":
                  lines += ["", "### kg-02 list response", "```json", json.dumps(listing, indent=2)[:12000], "```"]
          if master is not None:
              lines += ["", "### Master", "```json", json.dumps(master, indent=2)[:12000], "```"]
          Path("/tmp/live-activation.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          gh issue comment 17 --repo "$GITHUB_REPOSITORY" --body-file /tmp/live-activation.md

      - name: Report activation blocker
        if: steps.credentials.outputs.configured != 'true'
        run: echo "SKIPPED_NOT_CONFIGURED"
