name: v622-stage2-final-freeze-reconciliation

on:
  workflow_run:
    workflows:
      - v622-self-hosted-selected-artifact-recovery-resumable
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  freeze:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download ConvNeXt selected files
        uses: actions/download-artifact@v4
        with:
          name: v622-selected-M06-convnext-tiny
          path: ${{ runner.temp }}/v622-freeze-inputs/convnext
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Download DenseNet selected files
        uses: actions/download-artifact@v4
        with:
          name: v622-selected-M06-densenet121
          path: ${{ runner.temp }}/v622-freeze-inputs/densenet
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Download ResNet selected files
        uses: actions/download-artifact@v4
        with:
          name: v622-selected-M06-resnet50v2
          path: ${{ runner.temp }}/v622-freeze-inputs/resnet
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Download Stage 1 recovery manifest
        uses: actions/download-artifact@v4
        with:
          name: v622-selected-backbone-recovery-manifest
          path: ${{ runner.temp }}/v622-freeze-inputs/manifest
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Reconcile selected artifacts and build FINAL_FREEZE_MANIFEST
        shell: bash
        env:
          ROOT: ${{ runner.temp }}/v622-freeze-inputs
          STAGE1_RUN_ID: ${{ github.event.workflow_run.id }}
          STAGE1_RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ['ROOT'])
          manifest_path = root / 'manifest' / 'SELECTED_ARTIFACT_MANIFEST.json'
          manifest_sha_path = root / 'manifest' / 'SELECTED_ARTIFACT_MANIFEST.sha256'
          if not manifest_path.is_file() or not manifest_sha_path.is_file():
              raise SystemExit('Stage 1 manifest payload is incomplete')

          def sha256(path: Path) -> str:
              h = hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          actual_manifest_sha = sha256(manifest_path)
          expected_manifest_sha = manifest_sha_path.read_text(encoding='utf-8').strip().lower()
          if actual_manifest_sha != expected_manifest_sha:
              raise SystemExit('Stage 1 selected artifact manifest SHA mismatch')

          stage1 = json.loads(manifest_path.read_text(encoding='utf-8'))
          expected_ids = ['M06__convnext_tiny', 'M06__densenet121', 'M06__resnet50v2']
          expected_config_sha = {
              'M06__convnext_tiny': '167cb7b1d17b3978f2b4f47f55e315a1d4fae293006d897d25d13b5074dadcea',
              'M06__densenet121': 'c9b3107715849a633d90689902298c110bbb7c9c1bc1c8a6ac9ff1693f55386e',
              'M06__resnet50v2': 'dce7845aa7c07ccb913cded8e9ff368e7061f3a43723ded21f8a94dba9fab697',
          }
          expected_dirs = {
              'M06__convnext_tiny': root / 'convnext',
              'M06__densenet121': root / 'densenet',
              'M06__resnet50v2': root / 'resnet',
          }

          if stage1.get('project') != 'PNEUMONIA V6.2.2':
              raise SystemExit('Wrong Stage 1 project identity')
          if stage1.get('status') != 'RECOVERED_SELECTED_ONLY':
              raise SystemExit('Stage 1 status is not recovery-complete')
          if stage1.get('kernel_ref') != 'trickermark/pneumonia-v6-2-2-backbone-m06-r224':
              raise SystemExit('Wrong backbone source kernel')
          if stage1.get('recipe_sha256') != '27cae8c59e06b609f9dfd02b526d807dc359b2bb14ae7bc5ee77c68c7553b08f':
              raise SystemExit('Recipe SHA mismatch')
          if stage1.get('frozen_policy_sha256') != '7e23bbed9246d5588c67a46380b570e1c1a3e869062613b9dcdb298e2e822861':
              raise SystemExit('Frozen policy SHA mismatch')
          if list(stage1.get('selected_candidate_ids') or []) != expected_ids:
              raise SystemExit('Selected candidate identity/order mismatch')
          if int(stage1.get('selected_artifact_count', -1)) != 6:
              raise SystemExit('Selected artifact cardinality mismatch')
          if stage1.get('locked_test_used') is not False or stage1.get('external_data_used') is not False:
              raise SystemExit('Forbidden locked/external evidence appears in Stage 1')

          rows = stage1.get('artifacts') or []
          if len(rows) != 6:
              raise SystemExit('Stage 1 manifest does not contain exactly six artifact rows')
          by_key = {(r.get('candidate_id'), r.get('role')): r for r in rows}
          if len(by_key) != 6:
              raise SystemExit('Stage 1 artifact rows are not unique')

          reconciled = []
          for candidate_id in expected_ids:
              base = expected_dirs[candidate_id]
              config = base / 'config.json'
              checkpoint = base / 'final_selected.keras'
              for role, path in [('config', config), ('checkpoint', checkpoint)]:
                  if not path.is_file() or path.stat().st_size <= 0:
                      raise SystemExit(f'Missing/empty {candidate_id} {role}')
                  file_sha = sha256(path)
                  source = by_key.get((candidate_id, role))
                  if source is None:
                      raise SystemExit(f'Missing Stage 1 row for {candidate_id} {role}')
                  if file_sha != str(source.get('sha256', '')).lower():
                      raise SystemExit(f'Stage 1/download SHA mismatch for {candidate_id} {role}')
                  if int(source.get('bytes', -1)) != path.stat().st_size:
                      raise SystemExit(f'Stage 1/download size mismatch for {candidate_id} {role}')
                  if role == 'config' and file_sha != expected_config_sha[candidate_id]:
                      raise SystemExit(f'Canonical config SHA mismatch for {candidate_id}')
                  reconciled.append({
                      'candidate_id': candidate_id,
                      'role': role,
                      'basename': path.name,
                      'bytes': path.stat().st_size,
                      'sha256': file_sha,
                      'source_file_name': source.get('source_file_name'),
                  })

          final_manifest = {
              'schema_version': 1,
              'project': 'PNEUMONIA V6.2.2',
              'stage': 'FINAL_FREEZE_MANIFEST',
              'status': 'FROZEN',
              'stage1_recovery_run_id': int(os.environ['STAGE1_RUN_ID']),
              'stage1_recovery_run_url': os.environ['STAGE1_RUN_URL'],
              'stage1_selected_artifact_manifest_sha256': actual_manifest_sha,
              'source_kernel': 'trickermark/pneumonia-v6-2-2-backbone-m06-r224',
              'recipe_sha256': '27cae8c59e06b609f9dfd02b526d807dc359b2bb14ae7bc5ee77c68c7553b08f',
              'frozen_policy_sha256': '7e23bbed9246d5588c67a46380b570e1c1a3e869062613b9dcdb298e2e822861',
              'selected_candidate_ids': expected_ids,
              'ensemble_weights': {
                  'M06__convnext_tiny': {'numerator': 1, 'denominator': 3},
                  'M06__densenet121': {'numerator': 1, 'denominator': 3},
                  'M06__resnet50v2': {'numerator': 1, 'denominator': 3},
              },
              'selection_evidence': {
                  'oof_balanced_accuracy': 0.9977578475,
                  'oof_mcc': 0.9913388287,
                  'false_positives': 0,
                  'false_negatives': 2,
              },
              'artifacts': reconciled,
              'selected_artifact_count': 6,
              'reconciliation': 'PASS',
              'locked_test_used': False,
              'external_data_used': False,
              'new_kaggle_compute_launched': False,
              'canonical_m01_m12_rerun': False,
              'hpo_or_confirmation_repeated': False,
              'next_permitted_stage': 'OFFICIAL_LOCKED_TEST',
          }

          out_dir = root / 'final-freeze'
          out_dir.mkdir(parents=True, exist_ok=True)
          out = out_dir / 'FINAL_FREEZE_MANIFEST.json'
          out.write_text(json.dumps(final_manifest, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          out_sha = sha256(out)
          (out_dir / 'FINAL_FREEZE_MANIFEST.sha256').write_text(out_sha + '\n', encoding='utf-8')
          print(f'FINAL_FREEZE_MANIFEST_SHA256={out_sha}')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
              f.write(f'FINAL_FREEZE_MANIFEST_SHA256={out_sha}\n')
          PY

      - name: Upload FINAL_FREEZE_MANIFEST
        uses: actions/upload-artifact@v4
        with:
          name: v622-final-freeze-manifest
          path: ${{ runner.temp }}/v622-freeze-inputs/final-freeze
          if-no-files-found: error
          retention-days: 90

      - name: Journal Stage 2 PASS
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: '18'
          STAGE1_RUN_URL: ${{ github.event.workflow_run.html_url }}
          FREEZE_SHA: ${{ env.FINAL_FREEZE_MANIFEST_SHA256 }}
        run: |
          set -euo pipefail
          body="$(cat <<EOF
          ## V6.2.2 FINAL_FREEZE_MANIFEST

          - Stage 2 reconciliation: \`PASS\`
          - Stage 1 source run: ${STAGE1_RUN_URL}
          - Selected candidates: \`M06__convnext_tiny, M06__densenet121, M06__resnet50v2\`
          - Ensemble weights: \`1/3, 1/3, 1/3\`
          - Recipe SHA-256: \`27cae8c59e06b609f9dfd02b526d807dc359b2bb14ae7bc5ee77c68c7553b08f\`
          - Frozen policy SHA-256: \`7e23bbed9246d5588c67a46380b570e1c1a3e869062613b9dcdb298e2e822861\`
          - FINAL_FREEZE_MANIFEST SHA-256: \`${FREEZE_SHA}\`
          - Private artifact: \`v622-final-freeze-manifest\`
          - Locked test used: \`false\`
          - External data used: \`false\`
          - New Kaggle compute launched: \`false\`
          - Next permitted stage: \`OFFICIAL_LOCKED_TEST\`

          Stage 2 is frozen. This workflow does not launch the locked test.
          EOF
          )"
          jq -n --arg body "${body}" '{body:$body}' | gh api --method POST "/repos/${REPO}/issues/${ISSUE_NUMBER}/comments" --input - >/dev/null
