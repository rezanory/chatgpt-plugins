name: v622-direct-cancel-stale-runs-and-restart-transfer-retired

# Retired after the Kaggle-native artifact Dataset and FINAL_FREEZE_MANIFEST were completed.
# Kept as a manual no-op only so it cannot cancel runs, mutate Cloudflare, or restart artifact transfer.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: [self-hosted, windows, x64, v622]
    steps:
      - name: Confirm retired state
        shell: powershell
        run: |
          Write-Host 'Retired V6.2.2 stale-run reset: no Actions cancellation, Cloudflare mutation, Kaggle transfer, locked test, or external validation is performed.'
