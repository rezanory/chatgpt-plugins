name: v622-official-locked-test-retired-after-pass

# Official locked test consumed exactly once and passed. This workflow is now a manual no-op.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: [self-hosted, windows, x64, v622]
    steps:
      - name: Confirm immutable lockbox closure
        shell: powershell
        run: |
          Write-Host 'OFFICIAL_LOCKED_TEST already completed on azadka.'
          Write-Host 'Automatic relaunch is permanently disabled.'
          Write-Host 'No Kaggle/Cloudflare/model mutation is performed.'
