name: v622-live-recovery-probe-disabled-kaggle-native

# Legacy probe retained as a manual no-op for audit history.
# Checkpoint transfer to GitHub is no longer a finalization gate.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    runs-on: [self-hosted, windows, x64, v622]
    timeout-minutes: 5
    steps:
      - name: Confirm recovery-probe retirement
        shell: powershell
        run: |
          Write-Host 'Legacy GitHub checkpoint-recovery probe is retired.'
          Write-Host 'Selected checkpoints remain in Kaggle and are consumed there by finalization.'
          Write-Host 'GitHub remains bridge/journal only.'
