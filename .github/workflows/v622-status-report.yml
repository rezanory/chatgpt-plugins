name: v622-status-report

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v622-status-report.yml'

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Read live V6.2.2 recovery status
        shell: bash
        run: |
          url='https://chatgpt-kaggle-gateway.rezanory-chatgpt-plugins.workers.dev/recovery/v6-2-2/status'
          ok=0
          for attempt in $(seq 1 30); do
            code="$(curl --silent --show-error --max-time 60 -o /tmp/v622-status.json -w '%{http_code}' "$url" || true)"
            if [ "$code" = '200' ] && python - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path('/tmp/v622-status.json').read_text(encoding='utf-8'))
          assert value.get('project') == 'PNEUMONIA V6.2.2'
          assert isinstance(value.get('runs'), list)
          PY
            then
              ok=1
              break
            fi
            sleep 10
          done
          if [ "$ok" != '1' ]; then
            echo 'Live V6.2.2 status endpoint did not become ready.' >&2
            cat /tmp/v622-status.json 2>/dev/null || true
            exit 1
          fi

      - name: Publish model/run status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          value = json.loads(Path('/tmp/v622-status.json').read_text(encoding='utf-8'))
          lines = [
              '## Live V6.2.2 model/run status',
              '',
              f"Generated: `{value.get('generated_at')}`",
              f"Write enabled: `{value.get('write_enabled')}`",
              '',
              '### Summary',
              '```json',
              json.dumps(value.get('summary') or {}, indent=2),
              '```',
              '',
              '### Known TRAIN / HPO / CONFIRM runs',
              '```json',
              json.dumps(value.get('runs') or [], indent=2),
              '```',
              '',
              '### Existing merge/champion/ensemble candidates',
              '```json',
              json.dumps(value.get('finalization_candidates') or [], indent=2),
              '```',
              '',
              '### In progress',
              '```json',
              json.dumps(value.get('in_progress') or [], indent=2),
              '```',
              '',
              '### Needs repair',
              '```json',
              json.dumps(value.get('needs_repair') or [], indent=2),
              '```',
          ]
          Path('/tmp/v622-status.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          gh issue comment 18 --repo "$GITHUB_REPOSITORY" --body-file /tmp/v622-status.md
