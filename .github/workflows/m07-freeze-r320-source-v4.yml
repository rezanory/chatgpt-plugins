name: M07 freeze exact R320 source Version 4

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freeze:
    name: Clone immutable R320 source Version 4 for kg-05
    runs-on: [self-hosted, windows, x64, v622]
    timeout-minutes: 30
    environment: kaggle-05
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      SOURCE_HANDLE: rezanory/m07-gate-r320-state-v1-7/versions/4
      TARGET_HANDLE: trickermark/m07-gate-r320-state-v1-7-immutable-v4
    steps:
      - name: Checkout exact fix-forward source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install Kaggle client
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install -q 'kagglehub>=1.0,<2'

      - name: Download and verify exact source Version 4
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP ('m07-source-v4-' + $env:GITHUB_RUN_ID)
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $env:M07_SOURCE_ROOT=$root
          [IO.File]::AppendAllText($env:GITHUB_ENV,"M07_SOURCE_ROOT=$root`n",[Text.UTF8Encoding]::new($false))
          $python=(Get-Command python.exe -ErrorAction SilentlyContinue).Source
          if(-not $python){$python=(Get-Command python -ErrorAction Stop).Source}
          $script=@'
          import hashlib, json, os, pathlib, shutil
          import kagglehub

          source = os.environ['SOURCE_HANDLE']
          target = os.environ['TARGET_HANDLE']
          root = pathlib.Path(os.environ['M07_SOURCE_ROOT'])
          download_root = root / 'download'
          staged = root / 'staged'
          download_root.mkdir(parents=True, exist_ok=True)
          staged.mkdir(parents=True, exist_ok=True)
          downloaded = pathlib.Path(kagglehub.dataset_download(
              source, output_dir=str(download_root), force_download=True,
          ))
          required = [
              'CAMPAIGN_STATE.json',
              'FOLD_4_RECOVERY/FOLDS/fold_4/COMPLETED.json',
          ]
          files = sorted(
              p for p in downloaded.rglob('*')
              if p.is_file() and p.name != '.complete'
          )
          rel = {p.relative_to(downloaded).as_posix(): p for p in files}
          missing = [name for name in required if name not in rel]
          if missing:
              raise SystemExit(f'BLOCKED_EXACT_EVIDENCE_LINEAGE_MISMATCH: missing={missing}')
          manifest = []
          for name in sorted(rel):
              data = rel[name].read_bytes()
              manifest.append({
                  'path': name,
                  'bytes': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
              })
              destination = staged / name
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(rel[name], destination)
          manifest_blob = json.dumps(manifest, ensure_ascii=False, separators=(',', ':')).encode()
          manifest_sha = hashlib.sha256(manifest_blob).hexdigest()
          metadata = {
              'title': 'M07 Gate R320 State V1.7 Immutable V4',
              'id': target,
              'licenses': [{'name': 'CC0-1.0'}],
              'description': (
                  'Immutable fix-forward clone of ' + source +
                  '; source version is frozen and must not be replaced.'
              ),
          }
          (staged / 'dataset-metadata.json').write_text(
              json.dumps(metadata, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          receipt = {
              'schema': 'm07.d260914d.source.freeze.v1',
              'source_handle': source,
              'target_handle': target,
              'source_version': 4,
              'required_files': required,
              'file_count': len(manifest),
              'manifest_sha256': manifest_sha,
              'manifest': manifest,
              'github_run_id': os.environ['GITHUB_RUN_ID'],
              'source_sha': os.environ['GITHUB_SHA'],
          }
          (root / 'm07-source-freeze-receipt.json').write_text(
              json.dumps(receipt, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          print(json.dumps({
              'source_handle': source,
              'target_handle': target,
              'source_version': 4,
              'required_files': {name: name in rel for name in required},
              'file_count': len(manifest),
              'manifest_sha256': manifest_sha,
          }, ensure_ascii=False, sort_keys=True))
          '@
          $script | & $python -
          if($LASTEXITCODE -ne 0){throw 'M07 source Version 4 verification failed'}
          "M07_SOURCE_STAGED=$env:M07_SOURCE_ROOT\staged" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload immutable clone as first version
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $python=(Get-Command python.exe -ErrorAction SilentlyContinue).Source
          if(-not $python){$python=(Get-Command python -ErrorAction Stop).Source}
          $script=@'
          import json, os, pathlib
          import kagglehub

          target = os.environ['TARGET_HANDLE']
          staged = os.environ['M07_SOURCE_STAGED']
          # This target slug is intentionally new.  A rerun must fail closed
          # rather than create a mutable second version under the same handle.
          kagglehub.dataset_upload(
              target,
              staged,
              version_notes='d260914d immutable clone of rezaNORY/m07-gate-r320-state-v1-7 Version 4',
          )
          receipt = pathlib.Path(os.environ['M07_SOURCE_ROOT'], 'm07-source-freeze-receipt.json')
          obj = json.loads(receipt.read_text(encoding='utf-8'))
          obj['upload_status'] = 'SUBMITTED_FIRST_VERSION'
          receipt.write_text(json.dumps(obj, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps({
              'target_handle': target,
              'upload_status': obj['upload_status'],
              'manifest_sha256': obj['manifest_sha256'],
          }, ensure_ascii=False, sort_keys=True))
          '@
          $script | & $python -
          if($LASTEXITCODE -ne 0){throw 'M07 immutable clone upload failed'}

      - name: Preserve source freeze receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m07-source-freeze-${{ github.run_id }}
          path: ${{ runner.temp }}\m07-source-v4-${{ github.run_id }}\m07-source-freeze-receipt.json
          if-no-files-found: warn
          retention-days: 30
