name: v622-self-hosted-fix-backbone-launch-hash

# trigger: exact JS serialization hash guard patch
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v622-self-hosted-fix-backbone-launch-hash.yml'

permissions:
  contents: write
  issues: write

jobs:
  patch:
    runs-on: [self-hosted, windows, x64, v622]
    steps:
      - name: Patch exact transformed-code hash only
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'deploy/cloudflare-worker-free/src/v622-backbone-launch-worker.ts'
          $old = '9dad6e8bc26f105c7ff21c5aa9050f0878dde9f05cffa14921324b132be1fabe'
          $new = '03724400a3dd744f9e952a02c4a6ff202c29bcf93942683ff74c8b9982a24f67'
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/contents/$path"
          $file = Invoke-RestMethod -Uri $uri -Method Get -Headers $headers
          $bytes = [Convert]::FromBase64String(($file.content -replace '\s',''))
          $text = [Text.Encoding]::UTF8.GetString($bytes)
          $count = ([regex]::Matches($text, [regex]::Escape($old))).Count
          if ($count -ne 1) { throw "Expected old transformed-code hash exactly once; found $count" }
          if ($text.Contains($new)) { throw 'New transformed-code hash already present unexpectedly.' }
          $patched = $text.Replace($old, $new)
          if ($patched -eq $text) { throw 'Hash patch made no change.' }
          if (-not $patched.Contains('27cae8c59e06b609f9dfd02b526d807dc359b2bb14ae7bc5ee77c68c7553b08f')) { throw 'Frozen recipe SHA guard missing after patch.' }
          if (-not $patched.Contains('5abff78b9b10a13792b6d1b6cd24df780a64d16b7ec891d2ed74628dbb0b910b')) { throw 'W16 source SHA guard missing after patch.' }
          $payload = @{
            message = 'Fix JS serialization hash for guarded V6.2.2 backbone launch'
            content = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($patched))
            sha = $file.sha
            branch = 'main'
          } | ConvertTo-Json -Depth 5
          $updated = Invoke-RestMethod -Uri $uri -Method Put -Headers $headers -ContentType 'application/json' -Body $payload
          $comment = "## V6.2.2 backbone launch hash guard fix`n`n- Scope: transformed-code SHA guard only.`n- Old SHA: $old`n- New JS-serialization SHA: $new`n- Frozen recipe/source/backbones/seed unchanged.`n- Commit: $($updated.commit.sha)`n- This patch itself launches no Kaggle compute.`n"
          $issuePayload = @{ body = $comment } | ConvertTo-Json
          Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/issues/18/comments" -Method Post -Headers $headers -ContentType 'application/json' -Body $issuePayload | Out-Null
