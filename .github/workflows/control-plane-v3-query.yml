name: control-plane-v3-query

on:
  issue_comment:
    types: [created]

permissions:
  id-token: write
  contents: read
  issues: write

jobs:
  query:
    if: >-
      ${{ github.event.issue.number == 33 &&
          github.event.comment.user.id == 62356000 &&
          startsWith(github.event.comment.body, 'CONTROL_PLANE_V3_QUERY ') }}
    runs-on: [self-hosted, windows, x64, v622]
    environment: cloudflare-production
    timeout-minutes: 10
    concurrency:
      group: control-plane-v3-read-query-${{ github.event.comment.id }}
      cancel-in-progress: false
    steps:
      - name: Validate repair2 query request
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $event=Get-Content -Raw $env:GITHUB_EVENT_PATH | ConvertFrom-Json
          if([string]$event.repository.id -ne '1337215097'){throw 'repository id mismatch'}
          if([string]$event.comment.user.id -ne '62356000'){throw 'actor id mismatch'}
          $body=[string]$event.comment.body
          if(-not $body.StartsWith('CONTROL_PLANE_V3_QUERY ')){throw 'query prefix mismatch'}

      - name: Publish verification start marker
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $h=@{Authorization="Bearer $env:GITHUB_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          $body="M07 REPAIR2 VERIFY START | run=$env:GITHUB_RUN_ID | target=radlinaradlina/m07-postprocess-repair2 | read_only=true"
          $p=@{body=$body}|ConvertTo-Json -Compress
          Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/issues/33/comments" -Method Post -Headers $h -ContentType 'application/json' -Body $p | Out-Null

      - name: Request GitHub OIDC read identity
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if(-not $env:ACTIONS_ID_TOKEN_REQUEST_URL -or -not $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN){throw 'GitHub OIDC request context unavailable'}
          $sep=if($env:ACTIONS_ID_TOKEN_REQUEST_URL.Contains('?')){'&'}else{'?'}
          $uri="$($env:ACTIONS_ID_TOKEN_REQUEST_URL)$($sep)audience=cgp-control-plane-v3"
          $h=@{Authorization="Bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN"}
          $r=Invoke-RestMethod -Uri $uri -Headers $h -TimeoutSec 30
          $token=[string]$r.value
          if($token.Length -lt 100){throw 'GitHub OIDC token unavailable'}
          Write-Host "::add-mask::$token"
          [IO.File]::AppendAllText($env:GITHUB_ENV,"CGP_OIDC_TOKEN=$token`n",[Text.UTF8Encoding]::new($false))

      - name: Inspect Repair2 directly
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $h=@{Authorization="Bearer $env:CGP_OIDC_TOKEN"}
          $response=Invoke-RestMethod -Uri 'https://chatgpt-kaggle-gateway.rezanory-chatgpt-plugins.workers.dev/control-plane/v3/inspect/m07-postprocess-repair2' -Method Post -Headers $h -ContentType 'application/json' -Body '{}' -TimeoutSec 180
          $json=$response | ConvertTo-Json -Depth 50
          $out=Join-Path $env:RUNNER_TEMP 'm07-repair2-verify.json'
          [IO.File]::WriteAllText($out,$json,[Text.UTF8Encoding]::new($false))
          "CGP_QUERY_RESULT=$out" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Publish Repair2 verification receipt
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $raw=Get-Content -Raw $env:CGP_QUERY_RESULT
          if($raw.Length -gt 100000){$raw=$raw.Substring(0,100000)+"`n<truncated>"}
          $body="## M07 REPAIR2 VERIFY PASS`n`n- Run: ``$env:GITHUB_RUN_ID```n- Read only: ``true```n- Target: ``radlinaradlina/m07-postprocess-repair2```n`n``````json`n$raw`n``````"
          $h=@{Authorization="Bearer $env:GITHUB_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          $p=@{body=$body}|ConvertTo-Json -Compress
          Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/issues/33/comments" -Method Post -Headers $h -ContentType 'application/json' -Body $p | Out-Null
