name: control-plane-v3-query

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      query_json:
        description: "Bounded read-only control-plane query JSON"
        required: true
        type: string

permissions:
  id-token: write
  actions: read
  contents: read
  issues: write

jobs:
  query:
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' && github.actor_id == 62356000) ||
          ((github.event.issue.number == 33 || github.event.issue.number == 126) &&
           github.event.comment.user.id == 62356000 &&
           startsWith(github.event.comment.body, 'CONTROL_PLANE_V3_QUERY ')) }}
    # Use the online, pre-provisioned self-hosted runner for read-only broker
    # queries when GitHub-hosted capacity is unavailable due account billing.
    runs-on: ubuntu-latest
    environment: cloudflare-production
    timeout-minutes: 20
    concurrency:
      group: control-plane-v3-read-query-${{ github.run_id }}
      cancel-in-progress: false
    steps:
      - name: Resolve exact v3 query implementation
        id: resolve
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $h=@{Authorization="Bearer $env:GITHUB_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          $r=Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/git/ref/heads/feature/control-plane-v3" -Headers $h -TimeoutSec 30
          $sha=[string]$r.object.sha
          if($sha -notmatch '^[0-9a-f]{40}$'){throw 'Unable to resolve feature/control-plane-v3 SHA'}
          "sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "CGP_QUERY_IMPL_SHA=$sha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Publish query start marker
        if: ${{ github.event_name == 'issue_comment' }}
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $h=@{Authorization="Bearer $env:GITHUB_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          $body="CONTROL PLANE V3 QUERY START | run=$env:GITHUB_RUN_ID | impl=$env:CGP_QUERY_IMPL_SHA | read_only=true | cloudflare_deploy=false | kaggle_compute=false"
          $p=@{body=$body}|ConvertTo-Json -Compress
          $event=Get-Content -Raw $env:GITHUB_EVENT_PATH | ConvertFrom-Json
          $issue=[int]$event.issue.number
          Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/issues/$issue/comments" -Method Post -Headers $h -ContentType 'application/json' -Body $p | Out-Null

      - name: Publish workflow-dispatch query start marker
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Write-Host "CONTROL PLANE V3 QUERY START | run=$env:GITHUB_RUN_ID | read_only=true | cloudflare_deploy=false | kaggle_compute=false | transport=workflow_dispatch"

      - name: Checkout exact v3 query implementation
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.sha }}

      - name: Parse bounded read-only query payload
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $event=Get-Content -Raw $env:GITHUB_EVENT_PATH | ConvertFrom-Json
          if($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch'){
            $raw=[string]$event.inputs.query_json
          } else {
            if([string]$event.repository.id -ne '1337215097'){throw 'repository id mismatch'}
            if([string]$event.comment.user.id -ne '62356000'){throw 'actor id mismatch'}
            $body=[string]$event.comment.body
            $prefix='CONTROL_PLANE_V3_QUERY '
            if(-not $body.StartsWith($prefix)){throw 'query prefix mismatch'}
            $raw=$body.Substring($prefix.Length).Trim()
          }
          if($raw.Length -lt 2 -or $raw.Length -gt 30000){throw 'query payload length invalid'}
          $obj=$raw | ConvertFrom-Json
          if(-not $obj.provider){throw 'query provider missing'}
          $payload=Join-Path $env:RUNNER_TEMP 'control-plane-v3-query.json'
          [IO.File]::WriteAllText($payload,$raw,[Text.UTF8Encoding]::new($false))
          "CGP_QUERY_PAYLOAD=$payload" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Request GitHub OIDC read-broker identity
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if(-not $env:ACTIONS_ID_TOKEN_REQUEST_URL -or -not $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN){throw 'GitHub OIDC request context unavailable'}
          $sep=if($env:ACTIONS_ID_TOKEN_REQUEST_URL.Contains('?')){'&'}else{'?'}
          $uri="$($env:ACTIONS_ID_TOKEN_REQUEST_URL)$($sep)audience=cgp-control-plane-v3"
          $h=@{Authorization="Bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN"}
          $r=Invoke-RestMethod -Uri $uri -Headers $h -TimeoutSec 30
          $token=[string]$r.value
          if($token.Length -lt 100){throw 'GitHub OIDC token unavailable'}
          Write-Host "::add-mask::$token"
          [IO.File]::AppendAllText($env:GITHUB_ENV,"CGP_OIDC_TOKEN=$token`n",[Text.UTF8Encoding]::new($false))

      - name: Execute provider read query
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          $ErrorActionPreference='Stop'
          $python=(Get-Command python.exe -ErrorAction SilentlyContinue).Source
          if(-not $python){$python=(Get-Command python -ErrorAction Stop).Source}
          $out=Join-Path $env:RUNNER_TEMP 'control-plane-v3-query-result.json'
          & $python scripts/control_plane_query_paged.py --payload-file $env:CGP_QUERY_PAYLOAD --out $out
          $code=$LASTEXITCODE
          if(-not (Test-Path $out)){throw 'query result missing'}
          "CGP_QUERY_RESULT=$out" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CGP_QUERY_EXIT=$code" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          # Durable fallback: the provider result is always visible in the job log,
          # even when posting the issue receipt times out on the self-hosted runner.
          $rawResult=Get-Content -Raw $out
          if($rawResult.Length -gt 50000){$rawResult=$rawResult.Substring(0,50000)+"`n<truncated>"}
          Write-Host 'CGP_QUERY_RESULT_BEGIN'
          Write-Host $rawResult
          Write-Host 'CGP_QUERY_RESULT_END'
          exit 0

      - name: Publish sanitized query receipt
        if: ${{ github.event_name == 'issue_comment' }}
        shell: pwsh
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $python=(Get-Command python.exe -ErrorAction SilentlyContinue).Source
          if(-not $python){$python=(Get-Command python -ErrorAction Stop).Source}
          $script=@'
          import json, os, pathlib, urllib.request
          raw=pathlib.Path(os.environ['CGP_QUERY_RESULT']).read_text(encoding='utf-8-sig')
          if len(raw)>50000:
              raw=raw[:50000]+'\n<truncated>'
          status='PASS' if os.environ.get('CGP_QUERY_EXIT')=='0' else 'DIAGNOSTIC'
          body=(f"## CONTROL PLANE V3 QUERY {status}\n\n"
                f"- Run: `{os.environ['GITHUB_RUN_ID']}`\n"
                f"- Query implementation: `{os.environ['CGP_QUERY_IMPL_SHA']}`\n"
                "- Read only: `true`\n- Cloudflare deploy: `false`\n"
                "- Kaggle compute launched: `false`\n\n```json\n"+raw+"\n```")
          payload=json.dumps({'body':body},ensure_ascii=True).encode('utf-8')
          event=json.loads(pathlib.Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
          issue=int(event["issue"]["number"])
          url=f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/{issue}/comments"
          req=urllib.request.Request(url,data=payload,method='POST',headers={
              'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],
              'Accept':'application/vnd.github+json',
              'X-GitHub-Api-Version':'2022-11-28',
              'Content-Type':'application/json; charset=utf-8',
              'User-Agent':'control-plane-v3-query-journal/1.1',
          })
          with urllib.request.urlopen(req,timeout=15) as response:
              if response.status not in (200,201):
                  raise SystemExit(f'journal HTTP {response.status}')
          '@
          $script | & $python -
          if($LASTEXITCODE -ne 0){throw 'sanitized query receipt publish failed'}

      - name: Upload durable query result artifact
        if: always()
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@v4
        with:
          name: control-plane-v3-query-${{ github.run_id }}
          path: ${{ runner.temp }}/control-plane-v3-query-result.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish query workflow diagnostic
        if: ${{ failure() && github.event_name == 'issue_comment' }}
        continue-on-error: true
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $h=@{Authorization="Bearer $env:GITHUB_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          $impl=if($env:CGP_QUERY_IMPL_SHA){$env:CGP_QUERY_IMPL_SHA}else{'unresolved'}
          $body="## CONTROL PLANE V3 QUERY WORKFLOW DIAGNOSTIC`n`n- Run: ``$env:GITHUB_RUN_ID```n- Query implementation: ``$impl```n- Result: ``FAILED_BEFORE_SANITIZED_RECEIPT```n- Read only: ``true```n- Cloudflare deploy: ``false```n- Kaggle compute launched: ``false``"
          $p=@{body=$body}|ConvertTo-Json -Compress
          $event=Get-Content -Raw $env:GITHUB_EVENT_PATH | ConvertFrom-Json
          $issue=[int]$event.issue.number
          Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/issues/$issue/comments" -Method Post -Headers $h -ContentType 'application/json' -Body $p -TimeoutSec 15 | Out-Null

  soilbin_q1_v2_package:
    if: ${{ github.event.issue.number == 33 && github.event.comment.user.id == 62356000 && github.event.comment.body == 'SOILBIN_Q1_V2_PACKAGE_READ_BROKER_ALLOWED' }}
    runs-on: ubuntu-latest
    environment: cloudflare-production
    timeout-minutes: 20
    steps:
      - name: Checkout canonical SoilBin V2 source
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Request trusted read OIDC identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          base=os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']; sep='&' if '?' in base else '?'
          req=urllib.request.Request(base+sep+'audience=cgp-control-plane-v3',headers={'Authorization':'Bearer '+os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
          with urllib.request.urlopen(req,timeout=30) as r: token=json.load(r)['value']
          if len(token)<100: raise SystemExit('OIDC unavailable')
          print('::add-mask::'+token)
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as h: h.write('CGP_OIDC_TOKEN='+token+'\n')
          PY
      - name: Build canonical SoilBin V2 ZIP from Kaggle output
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,json,urllib.request,urllib.parse,hashlib,zipfile,shutil
          from pathlib import Path,PurePosixPath
          from datetime import datetime,timezone
          base='https://chatgpt-kaggle-gateway.rezanory-chatgpt-plugins.workers.dev'; owner='mylovevpn1'; slug='soilbin-q1-q2-waveform-v2-20260914'; account='kg-09'; oidc=os.environ['CGP_OIDC_TOKEN']
          root=Path(os.environ['RUNNER_TEMP'])/'soilbin_v2_package'; shutil.rmtree(root,ignore_errors=True); outroot=root/'KAGGLE_OUTPUT'; outroot.mkdir(parents=True)
          def broker(payload):
              q=urllib.request.Request(base+'/control-plane/v3/read/kaggle',data=json.dumps(payload,separators=(',',':')).encode(),method='POST',headers={'Authorization':'Bearer '+oidc,'Content-Type':'application/json','Accept':'application/json','User-Agent':'soilbin-package/1.1'})
              with urllib.request.urlopen(q,timeout=90) as r:return json.loads(r.read().decode())
          items=[]
          for page in range(1,21):
              r=broker({'action':'raw_read','account_id':account,'service':'kernels.KernelsApiService','method':'ListKernelSessionOutput','body':{'userName':owner,'kernelSlug':slug,'page':page,'pageSize':100}})
              if not r.get('ok'): raise SystemExit('Cloudflare listing failed')
              fs=(r.get('result') or {}).get('files') or []; items.extend(fs)
              if len(fs)<100:break
          if not items:raise SystemExit('No V2 output files found')
          mf=[]
          for item in items:
              name=str(item.get('fileName','')).strip(); url=str(item.get('url','')).strip(); pp=PurePosixPath(name)
              if not name or pp.is_absolute() or '..' in pp.parts or not url:raise SystemExit('Unsafe output entry')
              u=urllib.parse.urlparse(url)
              if u.scheme!='https' or u.hostname!='www.kaggleusercontent.com':raise SystemExit('Unexpected output host')
              d=outroot.joinpath(*pp.parts); d.parent.mkdir(parents=True,exist_ok=True)
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'soilbin-package/1.1'}),timeout=120) as r:b=r.read()
              d.write_bytes(b); mf.append({'path':'KAGGLE_OUTPUT/'+pp.as_posix(),'size':len(b),'sha256':hashlib.sha256(b).hexdigest()})
          shutil.copytree(Path('control-plane-payloads/soilbin-q1-v2-waveform'),root/'SOURCE_PAYLOAD')
          shutil.copy2('.github/workflows/pneumonia-v17-8acct-20260912.yml',root/'ORCHESTRATION_WORKFLOW.yml')
          for p in sorted((root/'SOURCE_PAYLOAD').rglob('*')):
              if p.is_file():
                  b=p.read_bytes(); mf.append({'path':p.relative_to(root).as_posix(),'size':len(b),'sha256':hashlib.sha256(b).hexdigest()})
          b=(root/'ORCHESTRATION_WORKFLOW.yml').read_bytes(); mf.append({'path':'ORCHESTRATION_WORKFLOW.yml','size':len(b),'sha256':hashlib.sha256(b).hexdigest()})
          manifest={'package':'SoilBin Q1/Q2 Waveform V2 complete package','created_utc':datetime.now(timezone.utc).isoformat(),'github_sha':os.environ['GITHUB_SHA'],'github_run_id':os.environ['GITHUB_RUN_ID'],'kernel_ref':f'{owner}/{slug}','account_id':account,'notebook_sha256':'266bc63950b03efac68a1a4a0d36cad9b35ddfbfaaa17c79339c4f01ee1df128','data_csv_sha256':'dc96ffd8d48f6cc861c2ecbfbc95b95fa809c24c55688fbccba6cd8f61ce6059','files':mf}
          (root/'PACKAGE_MANIFEST.json').write_text(json.dumps(manifest,indent=2,ensure_ascii=False),encoding='utf-8')
          zp=Path(os.environ['RUNNER_TEMP'])/'SoilBin_Q1_Q2_V2_WAVEFORM_COMPLETE_PACKAGE_20260914.zip'
          with zipfile.ZipFile(zp,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in sorted(root.rglob('*')):
                  if p.is_file():z.write(p,p.relative_to(root).as_posix())
          print('ZIP_SIZE',zp.stat().st_size,'ZIP_SHA256',hashlib.sha256(zp.read_bytes()).hexdigest())
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as h:h.write('SOILBIN_V2_PACKAGE_PATH='+str(zp)+'\n')
          PY
      - name: Upload canonical SoilBin V2 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: SoilBin_Q1_Q2_V2_WAVEFORM_COMPLETE_PACKAGE_20260914
          path: ${{ env.SOILBIN_V2_PACKAGE_PATH }}
          if-no-files-found: error
          retention-days: 7

