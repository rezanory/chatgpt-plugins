name: m07-push-launch-status

on:
  push:
    branches: [main]
    paths:
      - 'ops/m07-status-trigger.txt'

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish launcher status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,urllib.request,urllib.error
          repo=os.environ['GH_REPO']; token=os.environ['GH_TOKEN']
          headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'m07-push-status'}
          def get(url):
              req=urllib.request.Request(url,headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:return json.loads(r.read().decode())
              except Exception as e:return {'probe_error':f'{type(e).__name__}: {e}','url':url}
          wfs={}
          for wf in ['pneumonia-m07-continuation-v3-push.yml','pneumonia-m07-continuation-v3.yml']:
              d=get(f'https://api.github.com/repos/{repo}/actions/workflows/{wf}/runs?per_page=10')
              wfs[wf]=[{'id':r.get('id'),'event':r.get('event'),'status':r.get('status'),'conclusion':r.get('conclusion'),'head_sha':r.get('head_sha'),'run_number':r.get('run_number'),'created_at':r.get('created_at'),'updated_at':r.get('updated_at'),'html_url':r.get('html_url')} for r in d.get('workflow_runs',[])] if isinstance(d,dict) else d
              if isinstance(d,dict) and d.get('probe_error'): wfs[wf]=d
          runners=get(f'https://api.github.com/repos/{repo}/actions/runners?per_page=100')
          if isinstance(runners,dict) and 'runners' in runners:
              runners=[{'id':r.get('id'),'name':r.get('name'),'os':r.get('os'),'status':r.get('status'),'busy':r.get('busy'),'labels':[x.get('name') for x in r.get('labels',[])]} for r in runners.get('runners',[])]
          body='## M07 PUSH LAUNCH STATUS\n```json\n'+json.dumps({'workflows':wfs,'runners':runners},indent=2)[:60000]+'\n```'
          data=json.dumps({'body':body}).encode()
          req=urllib.request.Request(f'https://api.github.com/repos/{repo}/issues/33/comments',data=data,method='POST',headers={**headers,'Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=30) as r:r.read()
          PY