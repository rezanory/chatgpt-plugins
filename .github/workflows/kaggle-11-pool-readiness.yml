name: kaggle-11-pool-readiness

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kaggle-11-pool-readiness.yml'

permissions:
  id-token: write
  contents: read

concurrency:
  group: kaggle-11-pool-readiness
  cancel-in-progress: false

jobs:
  cloudflare-pool:
    name: 11 accounts via Cloudflare OIDC
    runs-on: [self-hosted, windows, x64, v622-r1]
    timeout-minutes: 10
    steps:
      - name: Request GitHub OIDC read identity
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if(-not $env:ACTIONS_ID_TOKEN_REQUEST_URL -or -not $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN){throw 'GitHub OIDC context unavailable'}
          $sep=if($env:ACTIONS_ID_TOKEN_REQUEST_URL.Contains('?')){'&'}else{'?'}
          $uri="$($env:ACTIONS_ID_TOKEN_REQUEST_URL)$($sep)audience=cgp-control-plane-v3"
          $r=Invoke-RestMethod -Uri $uri -Headers @{Authorization="Bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN"} -TimeoutSec 30
          $token=[string]$r.value
          if($token.Length -lt 100){throw 'GitHub OIDC token unavailable'}
          Write-Host "::add-mask::$token"
          [IO.File]::AppendAllText($env:GITHUB_ENV,"CGP_OIDC_TOKEN=$token`n",[Text.UTF8Encoding]::new($false))
      - name: Wait for complete Cloudflare configuration
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $base='https://chatgpt-kaggle-gateway.rezanory-chatgpt-plugins.workers.dev'
          $ok=$false
          for($i=0;$i -lt 60;$i++){
            try{
              $h=Invoke-RestMethod -Uri "$base/healthz" -Method Get -TimeoutSec 20
              $v3=Invoke-RestMethod -Uri "$base/control-plane/v3/healthz" -Method Get -TimeoutSec 20
              if($h.status -eq 'ready' -and $h.kaggle_tokens_configured -eq 10 -and $h.master_configured -eq $true -and $v3.github_oidc_read_broker -eq $true){$ok=$true;break}
            }catch{}
            Start-Sleep -Seconds 5
          }
          if(-not $ok){throw 'Cloudflare Kaggle configuration did not reach 11/11'}
          Write-Host 'CLOUDFLARE_CONFIGURED=11/11'
      - name: Verify all accounts read-only through Cloudflare
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $python=(Get-Command python.exe -ErrorAction SilentlyContinue).Source
          if(-not $python){$python=(Get-Command python -ErrorAction Stop).Source}
          $script=@'
          import concurrent.futures, json, os, urllib.error, urllib.request
          base='https://chatgpt-kaggle-gateway.rezanory-chatgpt-plugins.workers.dev'
          token=os.environ['CGP_OIDC_TOKEN']
          accounts=[
            ('kg-01','master','azadka'),
            ('kg-02','kg-02','radlinaradlina'),
            ('kg-03','kg-03','rezanory'),
            ('kg-04','kg-04','reyhanehazad'),
            ('kg-05','kg-05','trickermark'),
            ('kg-06','kg-06','msdenis'),
            ('kg-07','kg-07','nisabulutmark'),
            ('kg-08','kg-08','azadkk'),
            ('kg-09','kg-09','mylovevpn1'),
            ('kg-10','kg-10','computstu1'),
            ('kg-11','kg-11','jobreza1'),
          ]
          def seconds(value):
            if isinstance(value,(int,float)): return float(value)
            if isinstance(value,dict): return float(value.get('seconds',0) or 0)+float(value.get('nanos',0) or 0)/1e9
            text=str(value or '').strip()
            return float(text[:-1]) if text.endswith('s') else None
          def quota(obj):
            if not isinstance(obj,dict): return None
            used=seconds(obj.get('timeUsed',obj.get('time_used')))
            total=seconds(obj.get('totalTimeAllowed',obj.get('total_time_allowed')))
            if used is None or total is None: return {'shape':sorted(obj.keys())}
            return {'used_hours':round(used/3600,3),'remaining_hours':round(max(0,total-used)/3600,3),'total_hours':round(total/3600,3)}
          def call(pool_id,cp_id,owner):
            row={'account_id':pool_id,'owner_slug':owner,'route':'cloudflare-oidc'}
            try:
              payload={'provider':'kaggle','action':'raw_read','account_id':cp_id,
                       'service':'kernels.KernelsApiService','method':'GetAcceleratorQuotaStatistics','body':{}}
              req=urllib.request.Request(base+'/control-plane/v3/read/kaggle',data=json.dumps(payload,separators=(',',':')).encode(),method='POST',headers={
                'Authorization':'Bearer '+token,'Content-Type':'application/json','Accept':'application/json',
                'User-Agent':'kaggle-11-pool-readiness/2.1'})
              with urllib.request.urlopen(req,timeout=30) as r: out=json.load(r)
              if not out.get('ok'):
                row.update(status='BROKER_ERROR',error_type='BROKER_NOT_OK')
                return row
              result=out.get('result') or {}
              row.update(status='OK',
                         gpu=quota(result.get('gpuQuota') or result.get('gpu_quota')),
                         tpu=quota(result.get('tpuQuota') or result.get('tpu_quota')),
                         refresh_at=result.get('quotaRefreshTime') or result.get('quota_refresh_time'))
              return row
            except urllib.error.HTTPError as exc:
              row.update(status='HTTP_ERROR',http_status=int(exc.code),error_type='HTTPError')
              return row
            except Exception as exc:
              row.update(status='ERROR',error_type=type(exc).__name__)
              return row
          with concurrent.futures.ThreadPoolExecutor(max_workers=11) as ex:
            rows=list(ex.map(lambda x: call(*x),accounts))
          rows.sort(key=lambda x:x['account_id'])
          for row in rows: print('KAGGLE_POOL_RESULT='+json.dumps(row,sort_keys=True))
          failed=[row for row in rows if row.get('status')!='OK']
          if len(rows)!=11 or failed:
            summary=','.join(f"{row['account_id']}:{row.get('status')}:{row.get('http_status','')}" for row in failed)
            raise SystemExit('Cloudflare pool incomplete: '+summary)
          print('KAGGLE_11_POOL_READY=11/11')
          '@
          $script | & $python -
          if($LASTEXITCODE -ne 0){throw '11-account Cloudflare Kaggle probe failed'}
      - name: Diagnose exact Phase2 kernel read surfaces
        if: ${{ github.ref == 'refs/heads/fix/phase2-verifier-403-20260920' }}
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $python=(Get-Command python.exe -ErrorAction SilentlyContinue).Source
          if(-not $python){$python=(Get-Command python -ErrorAction Stop).Source}
          $script=@'
          import json, os, urllib.error, urllib.request

          endpoint='https://chatgpt-kaggle-gateway.rezanory-chatgpt-plugins.workers.dev/control-plane/v3/read/kaggle'
          token=os.environ['CGP_OIDC_TOKEN']
          targets=[
            ('master','azadka','p17-p2-m01-r224-a01-20260920-35531382748'),
            ('kg-02','radlinaradlina','p17-p2-m02-r224-a01-20260920-35531386401'),
            ('kg-03','rezanory','p17-p2-m03-r224-a01-20260920-35531394688'),
            ('kg-04','reyhanehazad','p17-p2-m04-r224-a01-20260920-35531397274'),
            ('kg-05','trickermark','p17-p2-m05-r224-a01-20260920-35531402776'),
            ('kg-06','msdenis','p17-p2-m06-r224-a01-20260920-35531405681'),
            ('kg-07','nisabulutmark','p17-p2-m08-r224-a01-20260920-35531409770'),
            ('kg-08','azadkk','p17-p2-m09-r224-a01-20260920-35531415284'),
            ('kg-09','mylovevpn1','p17-p2-m10-r224-a01-20260920-35531419407'),
            ('kg-10','computstu1','p17-p2-m11-r224-a01-20260920-35531422030'),
            ('kg-11','jobreza1','p17-p2-m12-r224-a01-20260920-35531424115'),
          ]

          def read(account,method,body):
            payload={'action':'raw_read','account_id':account,'service':'kernels.KernelsApiService','method':method,'body':body}
            request=urllib.request.Request(endpoint,data=json.dumps(payload,separators=(',',':')).encode(),method='POST',headers={
              'Authorization':'Bearer '+token,'Content-Type':'application/json','Accept':'application/json',
              'User-Agent':'phase2-exact-read-diagnostic/1.0'})
            try:
              with urllib.request.urlopen(request,timeout=60) as response:
                value=json.load(response)
              return {'http_status':response.status,'ok':value.get('ok') is True,'result':value.get('result')}
            except urllib.error.HTTPError as error:
              detail=error.read(2000).decode('utf-8','replace')
              return {'http_status':int(error.code),'ok':False,'error':detail}

          for account,owner,slug in targets:
            listed=read(account,'ListKernels',{'group':'PROFILE','user':owner,'search':slug,'sortBy':'DATE_RUN','page':1,'pageSize':100})
            kernels=(listed.get('result') or {}).get('kernels') if listed.get('ok') else []
            kernels=kernels if isinstance(kernels,list) else []
            matches=[]
            for item in kernels:
              if not isinstance(item,dict): continue
              ref=str(item.get('ref') or '')
              if ref.lower()==f'{owner}/{slug}'.lower() or slug.lower() in ref.lower():
                matches.append({key:item.get(key) for key in sorted(item) if key.lower() not in {'token','secret','authorization','url'}})
            status=read(account,'GetKernelSessionStatus',{'userName':owner,'kernelSlug':slug})
            output=read(account,'ListKernelSessionOutput',{'userName':owner,'kernelSlug':slug,'pageSize':1})
            row={
              'account_id':account,'kernel_ref':f'{owner}/{slug}',
              'list_http':listed.get('http_status'),'listed_exact':matches,
              'status_http':status.get('http_status'),'status_result':status.get('result'),'status_error':status.get('error'),
              'output_http':output.get('http_status'),'output_keys':sorted((output.get('result') or {}).keys()) if isinstance(output.get('result'),dict) else [],'output_error':output.get('error'),
            }
            print('PHASE2_EXACT_READ_DIAGNOSTIC='+json.dumps(row,sort_keys=True,separators=(',',':')))
          '@
          $script | & $python -
          if($LASTEXITCODE -ne 0){throw 'Phase2 exact read diagnostic failed'}
