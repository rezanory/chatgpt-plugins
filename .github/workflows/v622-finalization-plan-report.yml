name: v622-finalization-plan-report

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v622-finalization-plan-report.yml'
      - 'deploy/cloudflare-worker-free/src/project-plan.ts'
      - 'deploy/cloudflare-worker-free/src/index.ts'

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Read finalization contract
        shell: bash
        run: |
          url='https://chatgpt-kaggle-gateway.rezanory-chatgpt-plugins.workers.dev/recovery/v6-2-2/finalization-plan'
          ok=0
          for attempt in $(seq 1 36); do
            code="$(curl --silent --show-error --max-time 120 -o /tmp/finalization.json -w '%{http_code}' "$url" || true)"
            if [ "$code" = '200' ] && python - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path('/tmp/finalization.json').read_text(encoding='utf-8'))
          assert value.get('project') == 'PNEUMONIA V6.2.2'
          modules = value.get('modules') or []
          assert len(modules) >= 10
          assert sum(1 for module in modules if module.get('present')) >= 8
          PY
            then
              ok=1
              break
            fi
            sleep 10
          done
          test "$ok" = '1'

      - name: Publish compact finalization contract
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          value = json.loads(Path('/tmp/finalization.json').read_text(encoding='utf-8'))
          pattern = re.compile(
              r'add_argument|sys\.executable|subprocess|FINAL_TEST|test_locked|locked|'
              r'champion|ensemble|backbone|qualification|M13|freeze|validation|selection|inventory|checkpoint',
              re.I,
          )
          modules = []
          for module in value.get('modules') or []:
              signals = [item for item in (module.get('signals') or []) if pattern.search(str(item.get('text') or ''))]
              modules.append({
                  'name': module.get('name'),
                  'present': module.get('present'),
                  'sha256': module.get('sha256'),
                  'signals': signals[:40],
                  'error': module.get('error'),
              })
          compact = {
              'project': value.get('project'),
              'source_kernel': value.get('source_kernel'),
              'policy': value.get('policy'),
              'modules': modules,
          }
          text = json.dumps(compact, indent=2)
          if len(text) > 58000:
              for module in compact['modules']:
                  module['signals'] = module.get('signals', [])[:20]
              text = json.dumps(compact, indent=2)
          Path('/tmp/finalization.md').write_text(
              '## V6.2.2 recovered finalization contract\n\n```json\n' + text + '\n```\n',
              encoding='utf-8',
          )
          PY
          gh issue comment 18 --repo "$GITHUB_REPOSITORY" --body-file /tmp/finalization.md
