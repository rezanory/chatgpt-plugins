name: pneumonia-v17-8acct-20260912

on:
  issue_comment:
    types: [created]

permissions:
  id-token: write
  contents: read
  issues: write

concurrency:
  group: pneumonia-v17-8acct-20260912
  cancel-in-progress: false

jobs:
  launch:
    if: ${{ github.event.issue.number == 33 && github.event.comment.user.id == 62356000 && github.event.comment.body == 'PNEUMONIA_V17_RUN_8ACCT_20260912' }}
    runs-on: [self-hosted, windows, x64, v622]
    timeout-minutes: 45
    steps:
      - name: Checkout exact package payload
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate exact V1.7 launch payload only
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $dir='control-plane-payloads/pneumonia-v17-20260912'
          $name='PNEUMONIA_MASTER_M01_M12_M07_GATE_RUN_SAFE_V1_7.ipynb'
          $rel="$dir/$name"
          if(-not (Test-Path $rel)){throw 'V1.7 payload missing'}
          $all=@(Get-ChildItem $dir -File -Filter '*.ipynb')
          if($all.Count -ne 1){throw "exactly one launch notebook required; found $($all.Count)"}
          $out=Join-Path $env:RUNNER_TEMP $name
          $python=(Get-Command python.exe -ErrorAction SilentlyContinue).Source
          if(-not $python){$python=(Get-Command python -ErrorAction Stop).Source}
          $env:CGP_GIT_REL=$rel
          $env:CGP_EXACT_OUT=$out
          & $python -c "import os,subprocess,pathlib; b=subprocess.check_output(['git','show','HEAD:'+os.environ['CGP_GIT_REL']]); pathlib.Path(os.environ['CGP_EXACT_OUT']).write_bytes(b)"
          if($LASTEXITCODE -ne 0){throw 'exact Git blob extraction failed'}
          $sha=(Get-FileHash $out -Algorithm SHA256).Hash.ToLower()
          if($sha -ne '9fca3b687297fc4e23cd1a2f68d4765c897bd20516ae7c69309c99ca5a595907'){throw "V1.7 SHA mismatch: $sha"}
          "CGP_NOTEBOOK_PATH=$out" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CGP_NOTEBOOK_SHA=$sha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "V1.7 exact Git blob validated: $sha"

      - name: Request GitHub OIDC action-broker identity
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if(-not $env:ACTIONS_ID_TOKEN_REQUEST_URL -or -not $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN){throw 'GitHub OIDC request context unavailable'}
          $sep=if($env:ACTIONS_ID_TOKEN_REQUEST_URL.Contains('?')){'&'}else{'?'}
          $uri="$($env:ACTIONS_ID_TOKEN_REQUEST_URL)$($sep)audience=cgp-control-plane-v3-action"
          $h=@{Authorization="Bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN"}
          $r=Invoke-RestMethod -Uri $uri -Headers $h -TimeoutSec 30
          $token=[string]$r.value
          if($token.Length -lt 100){throw 'GitHub OIDC token unavailable'}
          Write-Host "::add-mask::$token"
          [IO.File]::AppendAllText($env:GITHUB_ENV,"CGP_ACTION_OIDC_TOKEN=$token`n",[Text.UTF8Encoding]::new($false))

      - name: Launch exact V1.7 on azadka master then six legacy workers
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $python=(Get-Command python.exe -ErrorAction SilentlyContinue).Source
          if(-not $python){$python=(Get-Command python -ErrorAction Stop).Source}
          $script=@'
          import concurrent.futures, json, os, pathlib, urllib.error, urllib.request

          endpoint='https://chatgpt-kaggle-gateway.rezanory-chatgpt-plugins.workers.dev/control-plane/v3/action/kaggle'
          token=os.environ['CGP_ACTION_OIDC_TOKEN'].strip()
          template=pathlib.Path(os.environ['CGP_NOTEBOOK_PATH']).read_text(encoding='utf-8')
          accounts=[
              ('master','azadka'),
              ('kg-02','radlinaradlina'),
              ('kg-03','rezanory'),
              ('kg-04','reyhanehazad'),
              ('kg-05','trickermark'),
              ('kg-06','msdenis'),
              ('kg-07','nisabulutmark'),
          ]

          def broker(payload, timeout=240):
              raw=json.dumps(payload,separators=(',',':')).encode()
              req=urllib.request.Request(endpoint,data=raw,method='POST',headers={
                  'Authorization':'Bearer '+token,
                  'Content-Type':'application/json',
                  'Accept':'application/json',
                  'User-Agent':'pneumonia-v17-eight-account-launch/1.0',
              })
              try:
                  with urllib.request.urlopen(req,timeout=timeout) as r:
                      txt=r.read().decode('utf-8','replace')
                      value=json.loads(txt) if txt else {}
                      return r.status,value
              except urllib.error.HTTPError as exc:
                  txt=exc.read(5000).decode('utf-8','replace')
                  raise RuntimeError(f'HTTP {exc.code}: {txt[:1400]}') from exc

          def submit(item):
              aid,owner=item
              slug=(f'{owner}/pneumonia-v17-master-20260912' if aid=='master' else f'{owner}/pneumonia-v17-worker-{owner}-20260912')
              row={'account_id':aid,'owner':owner,'kernel_ref':slug,'master_owner':'azadka'}
              nb=template
              payload={
                  'request_id':f'pneumonia-v17-8acct-{aid}-20260912-v1',
                  'provider':'kaggle',
                  'operation_class':'compute',
                  'account_id':aid,
                  'purpose':'Execute only the exact PNEUMONIA V1.7 notebook independently. azadka is master; all other accounts are workers. No other notebook.',
                  'service':'kernels.KernelsApiService',
                  'method':'SaveKernel',
                  'body':{
                      'slug':slug,
                      'newTitle':('Pneumonia V1.7 MASTER - azadka - 2026-09-12' if aid=='master' else f'Pneumonia V1.7 WORKER - {owner} - 2026-09-12'),
                      'text':nb,
                      'language':'PYTHON',
                      'kernelType':'NOTEBOOK',
                      'kernelExecutionType':'SAVE_AND_RUN_ALL',
                      'isPrivate':True,
                      'enableGpu':True,
                      'enableInternet':True,
                      'datasetDataSources':['paultimothymooney/chest-xray-pneumonia'],
                  },
              }
              try:
                  http,result=broker(payload)
                  if not isinstance(result,dict) or not result.get('ok'):
                      raise RuntimeError('Control Plane returned ok=false')
                  row.update(submitted=True,http_status=http,provider_ref=result.get('provider_ref'),requested_ref=result.get('requested_ref'),broker_run_id=result.get('broker_run_id'))
              except Exception as exc:
                  row.update(submitted=False,error=f'{type(exc).__name__}: {exc}'[:1600])
              return row

          master_result=submit(accounts[0])
          results=[master_result]
          if master_result.get('submitted'):
              with concurrent.futures.ThreadPoolExecutor(max_workers=6) as ex:
                  futures=[ex.submit(submit,a) for a in accounts[1:]]
                  results.extend(f.result() for f in concurrent.futures.as_completed(futures))
          order={a[0]:i for i,a in enumerate(accounts)}
          results.sort(key=lambda x:order[x['account_id']])
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'pneumonia-v17-seven-control-plane-results.json'
          out.write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')
          ok=sum(1 for r in results if r.get('submitted'))
          fail=7-ok
          master=next(r for r in results if r['account_id']=='master')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
              f.write(f'CGP_RESULTS_PATH={out}\nCGP_OK_COUNT={ok}\nCGP_FAIL_COUNT={fail}\nCGP_MASTER_OK={1 if master.get("submitted") else 0}\n')
          print(json.dumps({'master_submitted':bool(master.get('submitted')),'submitted':ok,'failed':fail,'master_first':True,'workers_parallel':True,'exact_v17_only':True}))
          '@
          $script | & $python -
          if($LASTEXITCODE -ne 0){throw 'broker launch script failed'}

      - name: Publish exact V1.7 launch receipt
        if: always()
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $rows=@()
          if($env:CGP_RESULTS_PATH -and (Test-Path $env:CGP_RESULTS_PATH)){
            $r=Get-Content -Raw $env:CGP_RESULTS_PATH | ConvertFrom-Json
            foreach($x in @($r)){
              $state=if($x.submitted){'SAVEKERNEL_ACCEPTED'}else{'FAILED'}
              $detail=if($x.submitted){if($x.provider_ref){[string]$x.provider_ref}else{'Control Plane ok=true'}}else{([string]$x.error).Replace('|','/')}
              $rows += "| $($x.account_id) | $($x.owner) | $state | $($x.kernel_ref) | $detail |"
            }
          }
          $table=($rows -join "`n")
          $state=if($env:CGP_OK_COUNT -eq '7' -and $env:CGP_MASTER_OK -eq '1'){'ALL_7_ACCEPTED'}else{'PARTIAL_OR_FAILED'}
          $msg=@"
          ## PNEUMONIA V1.7 EIGHT-ACCOUNT CONTROL-PLANE $state
          - Run: ``$env:GITHUB_RUN_ID``
          - Master/controller: ``azadka``
          - Exact V1.7 notebook SHA256: ``$env:CGP_NOTEBOOK_SHA``
          - Notebook allowlist: ``exactly one .ipynb``
          - Submission topology: ``azadka master first; six legacy workers independently after master acceptance``
          - Master accepted: ``$env:CGP_MASTER_OK``
          - Submitted/accepted: ``$env:CGP_OK_COUNT/7``
          - Failed: ``$env:CGP_FAIL_COUNT/7``
          - RUNNING is not claimed by this receipt; it records authoritative SaveKernel acceptance only.

          | Account | Owner | State | Kernel | Detail |
          |---|---|---|---|---|
          $table
          "@
          $payload=@{body=$msg}|ConvertTo-Json -Compress
          $h=@{Authorization="Bearer $env:GITHUB_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/issues/33/comments" -Method Post -Headers $h -ContentType 'application/json' -Body $payload | Out-Null

      - name: Fail closed unless azadka master and all six legacy workers accepted
        if: always()
        shell: powershell
        run: |
          if($env:CGP_OK_COUNT -ne '7' -or $env:CGP_FAIL_COUNT -ne '0' -or $env:CGP_MASTER_OK -ne '1'){
            throw "Exact V1.7 control-plane launch incomplete: submitted=$env:CGP_OK_COUNT failed=$env:CGP_FAIL_COUNT master=$env:CGP_MASTER_OK"
          }
          Write-Host 'Exact V1.7 accepted on azadka master and all six legacy workers; no other notebook was submitted by this workflow.'
