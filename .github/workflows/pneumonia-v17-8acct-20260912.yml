          print("M07_FINAL5_NOTEBOOK_BUILT", out.name, "winner=2", "cells=15")
          '@
          $builderOutput = @($script | & $python - 2>&1)
          $builderCode = $LASTEXITCODE
          if($builderCode -ne 0){throw ('M07_FINAL5_BUILDER_FAILURE=' + ($builderOutput -join "`n"))}
          "CGP_NOTEBOOK_PATH=$env:RUNNER_TEMP\PNEUMONIA_V17_D260914D_M07_FINAL_FIVEFOLD_FIX2.ipynb" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Request trusted action OIDC identity
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if(-not $env:ACTIONS_ID_TOKEN_REQUEST_URL -or -not $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN){throw 'GitHub OIDC request context unavailable'}
          $sep=if($env:ACTIONS_ID_TOKEN_REQUEST_URL.Contains('?')){'&'}else{'?'}
          $oidc=Invoke-RestMethod -Uri "$($env:ACTIONS_ID_TOKEN_REQUEST_URL)$($sep)audience=cgp-control-plane-v3-action" -Headers @{Authorization="Bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN"} -TimeoutSec 30
          $token=[string]$oidc.value
          if($token.Length-lt100){throw 'GitHub OIDC token unavailable'}
          Write-Host "::add-mask::$token"
          [IO.File]::AppendAllText($env:GITHUB_ENV,"CGP_ACTION_OIDC_TOKEN=$token`n",[Text.UTF8Encoding]::new($false))

      - name: Submit final five-fold kernel
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $python=(Get-Command python.exe -ErrorAction SilentlyContinue).Source
          if(-not $python){$python=(Get-Command python -ErrorAction Stop).Source}
          $script=@'
          import json, os, pathlib, urllib.request, urllib.error
          endpoint = "https://chatgpt-kaggle-gateway.rezanory-chatgpt-plugins.workers.dev/control-plane/v3/action/kaggle"
          notebook = pathlib.Path(os.environ["CGP_NOTEBOOK_PATH"]).read_text(encoding="utf-8")
          payload = {
              "request_id": "pneumonia-v17-d260914d-m07-final-fivefold-fix2-v3",
              "provider": "kaggle", "operation_class": "compute", "account_id": "kg-03",
              "purpose": "d260914d M07 final five patient-locked folds using independent Stage-B PASS winner candidate 2; Locked Test, External and Phase2 remain locked.",
              "service": "kernels.KernelsApiService", "method": "SaveKernel",
              "body": {"slug": "rezanory/m07-final-5fold-fix2-20260914", "newTitle": "M07 Final 5fold Fix2 20260914", "text": notebook, "language": "PYTHON", "kernelType": "NOTEBOOK", "kernelExecutionType": "SAVE_AND_RUN_ALL", "isPrivate": True, "enableGpu": True, "enableInternet": True, "datasetDataSources": ["paultimothymooney/chest-xray-pneumonia"]},
          }
          req = urllib.request.Request(endpoint, data=json.dumps(payload, separators=(",", ":")).encode(), method="POST", headers={"Authorization": "Bearer " + os.environ["CGP_ACTION_OIDC_TOKEN"], "Content-Type": "application/json", "Accept": "application/json", "User-Agent": "pneumonia-v17-final-fivefold/1.0"})
          try:
              with urllib.request.urlopen(req, timeout=240) as response:
                  result = json.loads(response.read().decode("utf-8", "replace") or "{}")
          except urllib.error.HTTPError as error:
              raise SystemExit(f"Final five-fold SaveKernel HTTP {error.code}: {error.read(4000).decode('utf-8', 'replace')[:1800]}")
          if not result.get("ok"):
              raise SystemExit("Final five-fold action broker returned ok=false")
          print(json.dumps({"accepted": True, "provider_ref": result.get("provider_ref") or (result.get("result") or {}).get("ref"), "broker_run_id": result.get("broker_run_id"), "broker_sha": result.get("broker_sha")}, ensure_ascii=False))
          '@
          $script | & $python -
          if($LASTEXITCODE -ne 0){throw 'Final five-fold SaveKernel submission failed'}

      - name: Publish final five-fold launch receipt
        if: always()
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $h=@{Authorization="Bearer $env:GITHUB_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          $body="## PNEUMONIA V1.7 d260914d M07 FINAL FIVE-FOLD FIX2 ATTEMPT`n- GitHub run: ``$env:GITHUB_RUN_ID```n- Kernel: ``rezanory/m07-final-5fold-fix2-20260914```n- Supersedes: ``rezanory/m07-final-5fold-fix1-20260914`` (errored while restoring a zero-version persistence dataset)`n- Stage-B prerequisite: ``PASS; winner candidate 2; Top-3 [2,0,7]```n- Scientific guard: ``Locked Test, External Validation and Phase2 remain locked```n- This is an orchestration receipt only; PASS requires Kaggle completion plus exact five-fold and OOF artifacts."
          Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/issues/33/comments" -Method Post -Headers $h -ContentType 'application/json; charset=utf-8' -Body (@{body=$body}|ConvertTo-Json -Compress) | Out-Null

