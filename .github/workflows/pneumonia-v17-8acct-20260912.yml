name: pneumonia-v17-8acct-20260912

on:
  issue_comment:
    types: [created]

permissions:
  id-token: write
  contents: read
  issues: write

concurrency:
  group: pneumonia-v17-d260914d-m07-stageb-confirmation-v2
  cancel-in-progress: false

jobs:
  launch-m07-stage1-fix1:
    if: ${{ github.event.issue.number == 33 && github.event.comment.user.id == 62356000 && github.event.comment.body == 'PNEUMONIA_V17_D260914D_M07_STAGE1_ALLOWLISTED_FIX1' }}
    runs-on: [self-hosted, windows, x64, v622]
    timeout-minutes: 45
    steps:
      - name: Checkout immutable predecessor and superseding builder
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Rebuild superseding d260914d candidate deterministically
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $srcDir='control-plane-payloads/pneumonia-v17-d260914b'
          $parts=0..8 | ForEach-Object { Join-Path $srcDir ("initial10.part{0:D2}.b64" -f $_) }
          $archive=Join-Path $env:RUNNER_TEMP 'pneumonia_initial10_d260914b.tar.xz'
          $fs=[IO.File]::Open($archive,[IO.FileMode]::Create)
          try {
            foreach($p in $parts){
              if(-not(Test-Path $p)){throw "missing immutable predecessor payload part: $p"}
              $bytes=[Convert]::FromBase64String(([IO.File]::ReadAllText($p)).Trim())
              $fs.Write($bytes,0,$bytes.Length)
            }
          } finally {$fs.Dispose()}
          $oldSha=(Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          if($oldSha -ne '522ec01eb9cd916c96067ad36a6cef0823af35550142f47f607aaaff74c2c48a'){throw "immutable predecessor payload SHA mismatch: $oldSha"}
          $oldOut=Join-Path $env:RUNNER_TEMP 'pneumonia-v17-d260914b-immutable-source'
          $newOut=Join-Path $env:RUNNER_TEMP 'pneumonia-v17-d260914d-fix1'
          if(Test-Path $oldOut){Remove-Item -Recurse -Force $oldOut}
          if(Test-Path $newOut){Remove-Item -Recurse -Force $newOut}
          New-Item -ItemType Directory -Path $oldOut -Force | Out-Null
          New-Item -ItemType Directory -Path $newOut -Force | Out-Null
          $python=(Get-Command python.exe -ErrorAction SilentlyContinue).Source
          if(-not $python){$python=(Get-Command python -ErrorAction Stop).Source}
          & $python -c "import tarfile; tarfile.open(r'$archive','r:xz').extractall(r'$oldOut')"
          if($LASTEXITCODE-ne 0){throw 'immutable predecessor payload extraction failed'}
          & $python 'control-plane-payloads/pneumonia-v17-d260914d-fix1/build_stage1_fix1.py' --src $oldOut --dst $newOut
          if($LASTEXITCODE-ne 0){throw 'superseding candidate deterministic build/validation failed'}
          "CGP_PAYLOAD_DIR=$newOut" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "SUPERSEDING_CANDIDATE_OK old_payload_sha=$oldSha"

      - name: Validate exact fresh M07 Stage-1 superseding notebooks
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $python=(Get-Command python.exe -ErrorAction SilentlyContinue).Source
          if(-not $python){$python=(Get-Command python -ErrorAction Stop).Source}
          @'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['CGP_PAYLOAD_DIR'])
          expected={
            'W01':'d763dee2a0bb569615564b38ca719aef1863be7419d3cb232be73faf37e77383',
            'W02':'bf199fc8110cde3ebde95a9dee583b77365ef763ec690405dbc0a502844185aa',
            'W03':'e41518beb7fc648a9895ef9806ef51ef726c2862e40f6f2747f5368cd5672ccd',
          }
          for slot in ('W01','W02','W03'):
              name=f'PNEUMONIA_V17_M07_STAGE1_SCREEN_{slot}_d260914d.ipynb'
              p=root/name
              if not p.is_file(): raise SystemExit(f'missing notebook {name}')
              sha=hashlib.sha256(p.read_bytes()).hexdigest()
              if sha != expected[slot]: raise SystemExit(f'{slot}: notebook SHA mismatch: {sha}')
              nb=json.loads(p.read_text(encoding='utf-8'))
              text='\n'.join(''.join(c.get('source',[])) for c in nb['cells'])
              required=['d260914d','DIST_ROLE = "M07_HPO_SCREEN"',f'DIST_SLOT = "{slot}"','UNLOCK_REMAINING_MODELS = False','paultimothymooney/chest-xray-pneumonia','DIST_LEAKAGE_GUARD','SCREEN SHARD COMPLETE','payload.get("errors") == ["Not found"]']
              for token in required:
                  if token not in text: raise SystemExit(f'{name}: required token missing: {token}')
          ev=json.loads((root/'RUNTIME_BUILD_EVIDENCE.json').read_text(encoding='utf-8'))
          if ev.get('pass') is not True: raise SystemExit('runtime build evidence not PASS')
          print('M07_STAGE1_SUPERSEDING_NOTEBOOKS_EXACT_OK=3')
          '@ | & $python -
          if($LASTEXITCODE-ne 0){throw 'M07 Stage-1 superseding validation failed'}

      - name: Request allowlisted GitHub OIDC identity
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if(-not $env:ACTIONS_ID_TOKEN_REQUEST_URL -or -not $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN){throw 'GitHub OIDC request context unavailable'}
          $sep=if($env:ACTIONS_ID_TOKEN_REQUEST_URL.Contains('?')){'&'}else{'?'}
          $oidcUri="$($env:ACTIONS_ID_TOKEN_REQUEST_URL)$($sep)audience=cgp-control-plane-v3-action"
          $oidc=Invoke-RestMethod -Uri $oidcUri -Headers @{Authorization="Bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN"} -TimeoutSec 30
          $token=[string]$oidc.value
          if($token.Length-lt100){throw 'GitHub OIDC token unavailable'}
          Write-Host "::add-mask::$token"
          [IO.File]::AppendAllText($env:GITHUB_ENV,"CGP_ACTION_OIDC_TOKEN=$token`n",[Text.UTF8Encoding]::new($false))

      - name: Submit only three superseding M07 Stage-1 jobs
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $python=(Get-Command python.exe -ErrorAction SilentlyContinue).Source
          if(-not $python){$python=(Get-Command python -ErrorAction Stop).Source}
          @'
          import concurrent.futures,json,os,pathlib,urllib.request,urllib.error
          endpoint='https://chatgpt-kaggle-gateway.rezanory-chatgpt-plugins.workers.dev/control-plane/v3/action/kaggle'
          oidc=os.environ['CGP_ACTION_OIDC_TOKEN'].strip()
          root=pathlib.Path(os.environ['CGP_PAYLOAD_DIR'])
          jobs=[
            ('kg-02','radlinaradlina','W01','PNEUMONIA_V17_M07_STAGE1_SCREEN_W01_d260914d.ipynb'),
            ('kg-03','rezanory','W02','PNEUMONIA_V17_M07_STAGE1_SCREEN_W02_d260914d.ipynb'),
            ('kg-04','reyhanehazad','W03','PNEUMONIA_V17_M07_STAGE1_SCREEN_W03_d260914d.ipynb'),
          ]
          def call(payload):
              req=urllib.request.Request(endpoint,data=json.dumps(payload,separators=(',',':')).encode(),method='POST',headers={'Authorization':'Bearer '+oidc,'Content-Type':'application/json','Accept':'application/json','User-Agent':'pneumonia-v17-d260914d-fix1-allowlisted/1.0'})
              try:
                  with urllib.request.urlopen(req,timeout=240) as r:
                      return json.loads(r.read().decode('utf-8','replace') or '{}')
              except urllib.error.HTTPError as e:
                  raise RuntimeError(f'HTTP {e.code}: '+e.read(4000).decode('utf-8','replace'))
          def submit(job):
              aid,owner,slot,name=job
              text=(root/name).read_text(encoding='utf-8')
              ref=f'{owner}/pneumonia-v17-d260914d-m07-screen-{slot.lower()}'
              payload={
                'request_id':f'pneumonia-v17-d260914d-m07-screen-{slot.lower()}-allowlisted-fix1-v1',
                'provider':'kaggle','operation_class':'compute','account_id':aid,
                'purpose':f'Superseding d260914d M07 HPO screening shard {slot}; persistence NOT_FOUND contract fix only; no Locked Test; Phase2 locked.',
                'service':'kernels.KernelsApiService','method':'SaveKernel',
                'body':{'slug':ref,'newTitle':f'Pneumonia V1.7 d260914d M07 Screen {slot}','text':text,
                        'language':'PYTHON','kernelType':'NOTEBOOK','kernelExecutionType':'SAVE_AND_RUN_ALL',
                        'isPrivate':True,'enableGpu':True,'enableInternet':True,
                        'datasetDataSources':['paultimothymooney/chest-xray-pneumonia']}
              }
              try:
                  r=call(payload)
                  if not r.get('ok'): raise RuntimeError('control plane returned ok=false')
                  return {'account_id':aid,'owner':owner,'slot':slot,'kernel_ref':ref,'ok':True,
                          'provider_ref':r.get('provider_ref') or (r.get('result') or {}).get('ref') or ref,
                          'broker_run_id':r.get('broker_run_id'),'broker_sha':r.get('broker_sha')}
              except Exception as e:
                  return {'account_id':aid,'owner':owner,'slot':slot,'kernel_ref':ref,'ok':False,'error':repr(e)[:1800]}
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as ex:
              rows=list(ex.map(submit,jobs))
          rows.sort(key=lambda x:x['slot'])
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'pneumonia-v17-d260914d-m07-stage1-fix1-launch.json'
          out.write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(rows,ensure_ascii=False))
          ok=sum(1 for r in rows if r['ok'])
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
              f.write(f'CGP_OK_COUNT={ok}\nCGP_RESULTS_PATH={out}\n')
          if ok!=3: raise SystemExit(2)
          '@ | & $python -
          if($LASTEXITCODE-ne 0){throw 'M07 Stage-1 superseding submit failed'}

      - name: Publish superseding launch receipt
        if: always()
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $rows=@()
          if($env:CGP_RESULTS_PATH -and (Test-Path $env:CGP_RESULTS_PATH)){
            foreach($x in @(Get-Content -Raw $env:CGP_RESULTS_PATH | ConvertFrom-Json)){
              $state=if($x.ok){'SAVE_AND_RUN_ALL_ACCEPTED'}else{'FAILED'}
              $detail=if($x.ok){"provider=$($x.provider_ref); broker_run=$($x.broker_run_id); broker_sha=$($x.broker_sha)"}else{([string]$x.error).Replace('|','/')}
              $rows += "| $($x.slot) | $($x.account_id) | $($x.owner) | $state | $($x.kernel_ref) | $detail |"
            }
          }
          $accepted=if($env:CGP_OK_COUNT){$env:CGP_OK_COUNT}else{'0'}
          $msg="## PNEUMONIA V1.7 d260914d M07 STAGE1 SUPERSEDING FIX1`n- GitHub run: ``$env:GITHUB_RUN_ID```n- Accepted: ``$accepted/3```n- Campaign: ``d260914d```n- Supersedes: ``d260914b`` (immutable)`n- Fix: ``canonical KaggleHub BackendError NOT_FOUND code=5 accepted as confirmed fresh persistence absence`` `n- Stage1 SHAs: ``W01 d763dee2a0bb569615564b38ca719aef1863be7419d3cb232be73faf37e77383`` / ``W02 bf199fc8110cde3ebde95a9dee583b77365ef763ec690405dbc0a502844185aa`` / ``W03 e41518beb7fc648a9895ef9806ef51ef726c2862e40f6f2747f5368cd5672ccd```n- Scientific state: ``M07 HPO screening only; Phase-2 not launched```n- Locked Test: ``NOT EXECUTED```n- OIDC workflow: ``pneumonia-v17-8acct-20260912.yml`` `n`n| Slot | Account | Owner | State | Kernel | Detail |`n|---|---|---|---|---|---|`n$($rows-join"`n")"
          $h=@{Authorization="Bearer $env:GITHUB_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/issues/33/comments" -Method Post -Headers $h -ContentType 'application/json; charset=utf-8' -Body ([Text.Encoding]::UTF8.GetBytes((@{body=$msg}|ConvertTo-Json -Compress))) | Out-Null

      - name: Fail closed unless all three superseding jobs were accepted
        if: always()
        shell: powershell
        run: |
          if($env:CGP_OK_COUNT-ne'3'){throw "d260914d M07 Stage-1 incomplete: accepted=$env:CGP_OK_COUNT/3"}
          Write-Host 'd260914d M07 Stage-1 3/3 SAVE_AND_RUN_ALL accepted via allowlisted OIDC workflow.'

  confirm-m07-stageb:
    if: ${{ github.event.issue.number == 33 && github.event.comment.user.id == 62356000 && github.event.comment.body == 'PNEUMONIA_V17_D260914D_M07_STAGEB_CONFIRMATION_FOLD3' }}
    # Use an isolated hosted runner for this bounded orchestration step so a
    # stale self-hosted checkout cleanup cannot hold the campaign lane.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout canonical main source
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Build exact Stage-B confirmation notebook from sealed Stage-1 evidence
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $python=(Get-Command python.exe -ErrorAction SilentlyContinue).Source
          if(-not $python){$python=(Get-Command python -ErrorAction Stop).Source}
          $script=@'
          import json, os, pathlib, re, urllib.request

          REPO = "rezanory/chatgpt-plugins"
          COMMENTS = f"https://api.github.com/repos/{REPO}/issues/33/comments"
          headers = {
              "Authorization": "Bearer " + os.environ["GITHUB_TOKEN"],
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "m07-stageb-builder/1.0",
          }

          def get_page(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.loads(response.read().decode("utf-8", "replace")), response.headers

          comments = []
          url = COMMENTS + "?per_page=100&since=2026-09-14T10:00:00Z"
          while url:
              page, response_headers = get_page(url)
              comments.extend(page)
              link = response_headers.get("Link", "")
              next_url = None
              for part in link.split(","):
                  if 'rel="next"' in part:
                      next_url = part.split(";", 1)[0].strip().strip("<>")
              url = next_url

          rows = []
          for comment in comments:
              body = str(comment.get("body", ""))
              if "CONTROL PLANE V3 QUERY PASS" not in body:
                  continue
              match = re.search(r"```json\s*(.*?)\s*```", body, re.S)
              if not match:
                  continue
              try:
                  receipt = json.loads(match.group(1))
                  request_id = str(receipt.get("request_id", ""))
                  if not (request_id.startswith("d260914d-m07-w") and "-metrics-json-" in request_id):
                      continue
                  result = receipt["result"]["result"]
                  for entry in result["files"]:
                      value = entry["json"]
                      rows.append({
                          "kernel_ref": result["kernel_ref"],
                          "file_name": entry["file_name"],
                          "candidate_id": int(value["candidate_id"]),
                          "fold": int(value["fold"]),
                          "candidate_source": value["candidate_source"],
                          "metrics": value["metrics"],
                          "run_fingerprint": value["run_fingerprint"],
                          "artifact_sha256": value["artifact_sha256"],
                          "code_sha256": value["run_contract"]["code_sha256"],
                          "split_fingerprint": value["split_fingerprint"],
                          "locked_test_used": bool(value["locked_test_used"]),
                          "external_used": bool(value["external_used"]),
                      })
              except (KeyError, TypeError, ValueError, json.JSONDecodeError):
                  continue

          expected_pairs = {(candidate, fold) for candidate in range(8) for fold in (1, 2)}
          pairs = {(row["candidate_id"], row["fold"]) for row in rows}
          if len(rows) != 16 or pairs != expected_pairs:
              raise SystemExit(f"Stage-1 exact fan-in failed: rows={len(rows)} pairs={sorted(pairs)}")
          if any(row["locked_test_used"] or row["external_used"] for row in rows):
              raise SystemExit("Stage-1 evidence illegally consumed Locked Test or external data")
          code_shas = {row["code_sha256"] for row in rows}
          split_shas = {row["split_fingerprint"] for row in rows}
          if code_shas != {"d099b6e51c243b3c489f0a280ca247971e84b1cf1c504cba2a51028c93fba27f"}:
              raise SystemExit(f"Stage-1 code identity mismatch: {sorted(code_shas)}")
          if split_shas != {"896491de87f9dc2a1d7d63548b7c5c22206da11f27a37efece8efc8e1557c8a9"}:
              raise SystemExit(f"Stage-1 split identity mismatch: {sorted(split_shas)}")
          rows.sort(key=lambda row: (row["candidate_id"], row["fold"]))
          TOP_IDS = [2, 0, 7]
          STAGE1_EXPECTED_CODE = "d099b6e51c243b3c489f0a280ca247971e84b1cf1c504cba2a51028c93fba27f"
          STAGE1_EXPECTED_SPLIT = "896491de87f9dc2a1d7d63548b7c5c22206da11f27a37efece8efc8e1557c8a9"

          notebook_path = pathlib.Path("control-plane-payloads/pneumonia-v17-20260912/PNEUMONIA_MASTER_M01_M12_M07_GATE_RUN_SAFE_V1_7.ipynb")
          notebook = json.loads(notebook_path.read_text(encoding="utf-8"))
          if len(notebook.get("cells", [])) < 13:
              raise SystemExit("canonical V1.7 notebook shape is incomplete")
          hpo_source = "".join(notebook["cells"][12].get("source", []))
          # Use an ASCII execution boundary. The notebook's descriptive heading
          # contains an em dash whose decoding has differed across runners; the
          # candidate-generation call itself is ASCII and stable. Preserve all
          # function definitions above that call, then replace only execution.
          execution_marker = "candidates = generate_confirmation_candidates()"
          marker_index = hpo_source.find(execution_marker)
          if marker_index < 0:
              raise SystemExit("HPO candidate-generation execution boundary missing")
          prefix = hpo_source[:marker_index]
          compile(prefix, "<m07-stageb-hpo-definitions>", "exec")
          stage1_blob = json.dumps(rows, ensure_ascii=False, separators=(",", ":"))
          custom = """
          # M07 d260914d Stage-B confirmation: exact Fold 3 for Stage-A Top-3.
          # Stage-1 rows are read-only, independently sealed receipts; no Test data is loaded.
          STAGE1_ROWS = json.loads(STAGE1_BLOB)
          STAGE1_EXPECTED_CODE = "d099b6e51c243b3c489f0a280ca247971e84b1cf1c504cba2a51028c93fba27f"
          STAGE1_EXPECTED_SPLIT = "896491de87f9dc2a1d7d63548b7c5c22206da11f27a37efece8efc8e1557c8a9"
          if len(STAGE1_ROWS) != 16:
              raise ValueError("M07_STAGE1_FANIN_NOT_EXACT")
          if {row["split_fingerprint"] for row in STAGE1_ROWS} != {STAGE1_EXPECTED_SPLIT}:
              raise ValueError("M07_STAGE1_SPLIT_FINGERPRINT_MISMATCH")
          if {row["code_sha256"] for row in STAGE1_ROWS} != {STAGE1_EXPECTED_CODE}:
              raise ValueError("M07_STAGE1_CODE_SHA_MISMATCH")
          TOP_IDS = [2, 0, 7]
          _candidates = {int(candidate["candidate_id"]): candidate for candidate in generate_confirmation_candidates()}
          if set(_candidates) != set(range(8)):
              raise ValueError("M07_CANDIDATE_GENERATION_IDENTITY_MISMATCH")
          stage1_by_candidate = {}
          for row in STAGE1_ROWS:
              if row["candidate_id"] not in stage1_by_candidate:
                  stage1_by_candidate[row["candidate_id"]] = []
              stage1_by_candidate[row["candidate_id"]].append({"metrics": row["metrics"], "fold": row["fold"]})
          for candidate_id in range(8):
              if sorted(item["fold"] for item in stage1_by_candidate.get(candidate_id, [])) != [1, 2]:
                  raise ValueError(f"M07_STAGE1_CANDIDATE_FOLDS_INCOMPLETE:{candidate_id}")

          fold3_payloads = {}
          for candidate_id in TOP_IDS:
              fold3_payload = run_or_restore_hpo_candidate_fold(_candidates[candidate_id], 3)
              if fold3_payload.get("status") != "SUCCESS" or int(fold3_payload.get("fold", -1)) != 3:
                  raise ValueError(f"M07_STAGEB_FOLD3_NOT_SUCCESS:{candidate_id}")
              if fold3_payload.get("locked_test_used") or fold3_payload.get("external_used"):
                  raise ValueError(f"M07_STAGEB_FORBIDDEN_DATA_ACCESS:{candidate_id}")
              if fold3_payload.get("run_contract", {}).get("code_sha256") != STAGE1_EXPECTED_CODE:
                  raise ValueError(f"M07_STAGEB_CODE_SHA_MISMATCH:{candidate_id}")
              if fold3_payload.get("split_fingerprint") != STAGE1_EXPECTED_SPLIT:
                  raise ValueError(f"M07_STAGEB_SPLIT_FINGERPRINT_MISMATCH:{candidate_id}")
              fold3_payloads[candidate_id] = fold3_payload

          confirmation_rows = []
          for candidate_id in TOP_IDS:
              all_folds = stage1_by_candidate[candidate_id] + [{"metrics": fold3_payloads[candidate_id]["metrics"], "fold": 3}]
              confirmation_rows.append(aggregate_candidate_results(_candidates[candidate_id], all_folds, phase="CONFIRMATION_FOLDS_1_2_3"))
          confirmation_ranked = sorted(confirmation_rows, key=robust_rank_tuple, reverse=True)
          for rank, row in enumerate(confirmation_ranked, start=1):
              row["confirmation_rank"] = int(rank)
          winner = confirmation_ranked[0]
          winner_candidate_id = int(winner["candidate_id"])
          winner_candidate = _candidates[winner_candidate_id]
          shared_params = candidate_params(winner_candidate)
          confirmation_df = pd.DataFrame(confirmation_ranked)
          confirmation_df.to_csv(HPO_ROOT / "M07_HPO_CONFIRMATION_RANKING.csv", index=False)
          (HPO_ROOT / "M07_HPO_CONFIRMATION_RANKING.json").write_text(json.dumps(json_safe(confirmation_ranked), indent=2), encoding="utf-8")
          receipt = {
              "schema": "m07.confirmation_hpo.stageb.v1",
              "status": "PASS",
              "campaign_id": "d260914d",
              "stage": "CONFIRMATION_FOLD_3_AND_RANK_SEAL",
              "stage1_rows": STAGE1_ROWS,
              "stage1_code_sha256": STAGE1_EXPECTED_CODE,
              "split_fingerprint": STAGE1_EXPECTED_SPLIT,
              "stage_a_top_ids": TOP_IDS,
              "fold3_run_fingerprints": {str(candidate_id): fold3_payloads[candidate_id]["run_fingerprint"] for candidate_id in TOP_IDS},
              "confirmation_ranking": json_safe(confirmation_ranked),
              "winner_candidate_id": winner_candidate_id,
              "winner_candidate_source": winner_candidate["source"],
              "winner_params": json_safe(shared_params),
              "f2_policy": "REPORT_ONLY_NOT_USED_FOR_SELECTION",
              "locked_test_used": False,
              "external_used": False,
              "phase2_unlocked": False,
          }
          atomic_write_json(HPO_ROOT / "M07_HPO_STAGEB_CONFIRMATION_RECEIPT.json", receipt)
          for source in (HPO_ROOT / "M07_HPO_CONFIRMATION_RANKING.csv", HPO_ROOT / "M07_HPO_CONFIRMATION_RANKING.json", HPO_ROOT / "M07_HPO_STAGEB_CONFIRMATION_RECEIPT.json"):
              shutil.copy2(source, PERSIST_ROOT / source.name)
          _persist_upload(note="M07 d260914d Stage-B Fold-3 confirmation and exact Top-3 ranking sealed; Phase2 and Locked Test remain locked", strict=PERSIST_STRICT)
          print("M07_STAGEB_CONFIRMATION_PASS", json.dumps({"winner_candidate_id": winner_candidate_id, "top_ids": TOP_IDS, "fold3_run_fingerprints": receipt["fold3_run_fingerprints"]}, ensure_ascii=False))
          """
