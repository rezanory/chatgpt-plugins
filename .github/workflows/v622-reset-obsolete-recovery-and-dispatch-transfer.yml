name: v622-reset-obsolete-recovery-and-dispatch-transfer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v622-reset-obsolete-recovery-and-dispatch-transfer.yml'

permissions:
  actions: write
  contents: read
  issues: write

# Intentional one-shot lock reset. Entering this group cancels the obsolete
# in-progress recovery and replaces the stale pending transfer. This workflow
# then restores the canonical Worker before dispatching a fresh transfer.
concurrency:
  group: v622-cloudflare-production-mutation
  cancel-in-progress: true

jobs:
  reset:
    runs-on: [self-hosted, windows, x64, v622]
    timeout-minutes: 25
    environment: cloudflare-production
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore canonical Cloudflare Worker after obsolete recovery cancellation
        shell: powershell
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          $ErrorActionPreference = 'Stop'
          $accountId = ([string]$env:RAW_CLOUDFLARE_ACCOUNT_ID).Trim()
          if ([string]::IsNullOrWhiteSpace($env:CLOUDFLARE_API_TOKEN) -or [string]::IsNullOrWhiteSpace($accountId)) {
            throw 'Cloudflare credentials missing during lock reset.'
          }
          Write-Host "::add-mask::$accountId"
          $env:CLOUDFLARE_ACCOUNT_ID = $accountId
          Push-Location 'deploy/cloudflare-worker-free'
          try {
            npm install --no-audit --no-fund
            if ($LASTEXITCODE -ne 0) { throw 'npm install failed during canonical restore.' }

            # The obsolete recovery installed this ephemeral secret. Deletion is
            # best-effort because it may already be absent after a partial cleanup.
            for ($attempt = 1; $attempt -le 5; $attempt++) {
              'y' | npx wrangler secret delete CGP_PROJECT_CONTROL_TOKEN --name chatgpt-kaggle-gateway
              if ($LASTEXITCODE -eq 0) { break }
              if ($attempt -lt 5) { Start-Sleep -Seconds (5 * $attempt) }
            }

            $restored = $false
            for ($attempt = 1; $attempt -le 5; $attempt++) {
              npx wrangler deploy
              if ($LASTEXITCODE -eq 0) { $restored = $true; break }
              if ($attempt -lt 5) { Start-Sleep -Seconds (5 * $attempt) }
            }
            if (-not $restored) { throw 'Canonical Worker restore failed after retries.' }
          }
          finally { Pop-Location }

      - name: Dispatch fresh Kaggle-to-Kaggle transfer
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $payload = @{ ref = 'main' } | ConvertTo-Json
          Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/workflows/v622-kaggle-to-kaggle-finalization-artifact-transfer.yml/dispatches" -Method Post -Headers $headers -ContentType 'application/json' -Body $payload | Out-Null
          Write-Host 'Fresh Kaggle-to-Kaggle transfer dispatched; it will start after this reset releases the shared concurrency lane.'

      - name: Journal lock reset
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $body = "## V6.2.2 obsolete recovery lock reset`n`n- Obsolete recovery run ``32282103394``: superseded/cancelled by shared concurrency reset.`n- Stale pending transfer ``32292044711``: superseded by fresh dispatch.`n- Canonical Cloudflare Worker restored: ``PASS```n- Ephemeral recovery capability cleanup attempted before restore: ``PASS/ABSENT_ACCEPTED```n- Model compute performed by reset: ``false```n- Kaggle TRAIN/HPO/confirmation launched: ``false```n- Locked test/external validation launched: ``false```n- Next action: fresh ``v622-kaggle-to-kaggle-finalization-artifact-transfer`` run, then Kaggle-native final freeze.`n- Reset run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID`n"
          $payload = @{ body = $body } | ConvertTo-Json
          Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/issues/18/comments" -Method Post -Headers $headers -ContentType 'application/json' -Body $payload | Out-Null
