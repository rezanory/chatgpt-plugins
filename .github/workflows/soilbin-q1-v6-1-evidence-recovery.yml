name: soilbin-q1-v6-1-evidence-recovery

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  id-token: write
  contents: read
  issues: write

concurrency:
  group: soilbin-q1-v6-1-evidence-recovery-kg09
  cancel-in-progress: false

jobs:
  collect-existing:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.issue.number == 134 && github.event.comment.user.id == 62356000 && github.event.comment.body == 'SOILBIN_Q1_V6_1_COLLECT_KG09') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Collect existing V6.1 evidence with OIDC refresh
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import pathlib
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          endpoint = 'https://chatgpt-kaggle-gateway.rezanory-chatgpt-plugins.workers.dev/control-plane/v3/read/kaggle'
          account = 'kg-09'
          ref = 'mylovevpn1/soilbin-q1-q2-v6-1-virtual-synthetic-20260928'
          owner, slug = ref.split('/', 1)

          def request_oidc():
              base = os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']
              separator = '&' if '?' in base else '?'
              target = base + separator + 'audience=' + urllib.parse.quote('cgp-control-plane-v3', safe='')
              request = urllib.request.Request(
                  target,
                  headers={
                      'Authorization': 'Bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN'],
                      'Accept': 'application/json',
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  token = str(json.load(response).get('value') or '').strip()
              if len(token) < 100:
                  raise RuntimeError('fresh read OIDC unavailable')
              print('::add-mask::' + token)
              return token

          token = request_oidc()

          def call(payload, timeout=120):
              global token
              for refresh_attempt in range(2):
                  request = urllib.request.Request(
                      endpoint,
                      data=json.dumps(payload, separators=(',', ':')).encode(),
                      method='POST',
                      headers={
                          'Authorization': 'Bearer ' + token,
                          'Content-Type': 'application/json',
                          'Accept': 'application/json',
                          'User-Agent': 'soilbin-v6-1-recovery/1.0',
                      },
                  )
                  try:
                      with urllib.request.urlopen(request, timeout=timeout) as response:
                          value = json.loads(response.read().decode('utf-8', 'replace') or '{}')
                      if value.get('ok') is not True or value.get('read_only') is not True:
                          raise RuntimeError('read broker rejected: ' + json.dumps(value)[:1500])
                      return value.get('result') or {}
                  except urllib.error.HTTPError as exc:
                      detail = exc.read(4000).decode('utf-8', 'replace')
                      if exc.code == 403 and 'OIDC JWT expired' in detail and refresh_attempt == 0:
                          token = request_oidc()
                          continue
                      raise RuntimeError(f'read broker HTTP {exc.code}: {detail}') from exc
              raise RuntimeError('read broker OIDC refresh exhausted')

          terminal = None
          for attempt in range(330):
              terminal = call(
                  {
                      'action': 'raw_read',
                      'account_id': account,
                      'service': 'kernels.KernelsApiService',
                      'method': 'GetKernelSessionStatus',
                      'body': {'userName': owner, 'kernelSlug': slug},
                  },
                  60,
              )
              text = json.dumps(terminal, ensure_ascii=False, sort_keys=True).upper()
              print('V61_RECOVERY_STATUS', attempt, text[:1200], flush=True)
              if 'COMPLETE' in text:
                  break
              if any(marker in text for marker in ['ERROR', 'FAILED', 'CANCELLED']):
                  raise SystemExit('V6.1 Kaggle terminal failure: ' + text[:2400])
              time.sleep(20)
          else:
              raise SystemExit('V6.1 Kaggle status polling timed out')

          output = call(
              {
                  'action': 'output_json_files',
                  'account_id': account,
                  'kernel_ref': ref,
                  'file_names': [
                      'RESULTS_V6_1.json',
                      'RUN_MANIFEST_V6_1.json',
                      'LEAKAGE_AUDIT_V6_1.json',
                  ],
                  'max_bytes_per_file': 524288,
              },
              180,
          )
          files = output.get('files') or []
          if len(files) != 3:
              raise SystemExit(
                  'expected 3 V6.1 evidence files, got '
                  + str(len(files))
                  + ' :: '
                  + json.dumps(output)[:1800]
              )

          destination = pathlib.Path(os.environ['RUNNER_TEMP']) / 'soilbin-v6-1-evidence'
          destination.mkdir(parents=True, exist_ok=True)
          by_name = {}
          for item in files:
              name = str(item.get('file_name') or '')
              value = item.get('json')
              if not isinstance(value, dict):
                  raise SystemExit('missing JSON for ' + name)
              by_name[name] = value
              (destination / name).write_text(
                  json.dumps(value, ensure_ascii=False, indent=2),
                  encoding='utf-8',
              )

          results = by_name['RESULTS_V6_1.json']
          manifest = by_name['RUN_MANIFEST_V6_1.json']
          leakage = by_name['LEAKAGE_AUDIT_V6_1.json']
          reproduction = results.get('baseline_reproduction') or {}

          if results.get('schema') != 'soilbin.q1.v6.1.virtual-synthetic':
              raise SystemExit('unexpected V6.1 results schema')
          if results.get('does_not_supersede_v5') is not True:
              raise SystemExit('V6.1 V5-lock guard missing')
          if reproduction.get('within_2pct_of_frozen_v5') is not True:
              raise SystemExit('V6.1 baseline reproduction drift gate failed')
          if leakage.get('passed') is not True:
              raise SystemExit('V6.1 leakage audit did not pass')
          if int(leakage.get('forbidden_source_intersections', -1)) != 0:
              raise SystemExit('V6.1 forbidden source intersection detected')
          if int(leakage.get('synthetic_rows_in_evaluation', -1)) != 0:
              raise SystemExit('V6.1 synthetic evaluation row detected')
          if manifest.get('baseline_reproduction_within_2pct') is not True:
              raise SystemExit('V6.1 manifest reproduction gate failed')

          summary = {
              'kernel_ref': ref,
              'kaggle_terminal_complete': True,
              'baseline_reproduction': reproduction,
              'primary_nested_selected': results.get('primary_nested_selected'),
              'pre_registered_flagship': results.get('pre_registered_flagship'),
              'best_descriptive_only': results.get('best_descriptive_only'),
              'selection_counts': results.get('selection_counts'),
              'seed_stability': results.get('seed_stability'),
              'leakage_audit': leakage,
          }
          (destination / 'EVIDENCE_SUMMARY_V6_1.json').write_text(
              json.dumps(summary, ensure_ascii=False, indent=2),
              encoding='utf-8',
          )
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as handle:
              handle.write('SOILBIN_V61_EVIDENCE_DIR=' + str(destination) + '\n')
              handle.write('SOILBIN_V61_COMPLETE=1\n')
              handle.write('SOILBIN_V61_KERNEL_REF_NORMALIZED=' + ref + '\n')
          print('SOILBIN_V6_1_RECOVERY_COMPLETE', json.dumps(summary, ensure_ascii=False), flush=True)
          PY

      - name: Upload recovered V6.1 evidence
        uses: actions/upload-artifact@v4
        with:
          name: soilbin-v6-1-virtual-synthetic-evidence-recovered
          path: ${{ env.SOILBIN_V61_EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish recovery receipt
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          complete = os.environ.get('SOILBIN_V61_COMPLETE') == '1'
          title = 'COMPLETE' if complete else 'FAILED_OR_INCOMPLETE'
          body = (
              f"SOILBIN V6.1 existing-run evidence recovery {title}\n\n"
              f"- GitHub run: `{os.environ['GITHUB_RUN_ID']}`\n"
              "- Kaggle account: `kg-09` / `mylovevpn1`\n"
              f"- Kernel: `{os.environ.get('SOILBIN_V61_KERNEL_REF_NORMALIZED', 'mylovevpn1/soilbin-q1-q2-v6-1-virtual-synthetic-20260928')}`\n"
              f"- V5 reproduction + leakage gates: `{'PASS' if complete else 'not verified'}`\n"
              "- Existing Kaggle execution was collected read-only; no duplicate launch was made.\n"
          )
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/134/comments",
              data=json.dumps({'body': body}).encode(),
              method='POST',
              headers={
                  'Authorization': 'Bearer ' + os.environ['GITHUB_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
                  'User-Agent': 'soilbin-v6-1-recovery/1.0',
              },
          )
          with urllib.request.urlopen(request, timeout=30):
              pass
          PY
