name: retired-evidence-v622-self-hosted-kaggle-quota

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v622-self-hosted-kaggle-quota.yml'

permissions:
  contents: read
  issues: write

jobs:
  quota:
    runs-on: [self-hosted, windows, x64, v622]
    timeout-minutes: 10
    steps:
      - name: Read all Kaggle accelerator quotas from active repository secrets
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
          K_MASTER: ${{ secrets.CGP_KAGGLE_MASTER_TOKEN }}
          K_KG02: ${{ secrets.CGP_KAGGLE_KG02_TOKEN }}
          K_KG03: ${{ secrets.CGP_KAGGLE_KG03_TOKEN }}
          K_KG04: ${{ secrets.CGP_KAGGLE_KG04_TOKEN }}
          K_KG05: ${{ secrets.CGP_KAGGLE_KG05_TOKEN }}
          K_KG06: ${{ secrets.CGP_KAGGLE_KG06_TOKEN }}
          K_KG07: ${{ secrets.CGP_KAGGLE_KG07_TOKEN }}
          K_KG08: ${{ secrets.CGP_KAGGLE_KG08_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $python = (Get-Command python.exe -ErrorAction SilentlyContinue).Source
          if (-not $python) { $python = (Get-Command python -ErrorAction Stop).Source }
          $script = @'
          import base64, concurrent.futures, json, os, re, urllib.request, urllib.error

          ENDPOINT='https://api.kaggle.com/v1/kernels.KernelsApiService/GetAcceleratorQuotaStatistics'
          accounts=[
              ('kg-01','azadka','K_MASTER'),
              ('kg-02','radlinaradlina','K_KG02'),
              ('kg-03','rezanory','K_KG03'),
              ('kg-04','reyhanehazad','K_KG04'),
              ('kg-05','trickermark','K_KG05'),
              ('kg-06','msdenis','K_KG06'),
              ('kg-07','nisabulutmark','K_KG07'),
              ('kg-08','unknown','K_KG08'),
          ]

          def seconds(value):
              if value is None: return None
              if isinstance(value,(int,float)): return float(value)
              if isinstance(value,dict):
                  return float(value.get('seconds',0) or 0)+float(value.get('nanos',0) or 0)/1e9
              text=str(value).strip()
              m=re.fullmatch(r'(-?[0-9]+(?:\.[0-9]+)?)s',text)
              if m: return float(m.group(1))
              try: return float(text)
              except Exception: return None

          def quota(obj):
              if not isinstance(obj,dict): return None
              used=seconds(obj.get('timeUsed') if 'timeUsed' in obj else obj.get('time_used'))
              total=seconds(obj.get('totalTimeAllowed') if 'totalTimeAllowed' in obj else obj.get('total_time_allowed'))
              if used is None or total is None:
                  return {'raw_shape':sorted(obj.keys())}
              return {'used_hours':round(used/3600,3),'remaining_hours':round(max(0,total-used)/3600,3),'total_hours':round(total/3600,3)}

          def auth(owner,token):
              if token.startswith('KGAT_'): return 'Bearer '+token,'KGAT_BEARER'
              if owner!='unknown': return 'Basic '+base64.b64encode(f'{owner}:{token}'.encode()).decode(),'LEGACY_BASIC'
              return None,'UNKNOWN'

          def probe(item):
              aid,owner,env_name=item
              token=(os.environ.get(env_name) or '').strip()
              row={'account_id':aid,'owner_slug':owner,'secret_name':env_name,'read_only':True,'no_kaggle_compute_launched':True}
              if not token:
                  row.update(status='TOKEN_NOT_IN_REPOSITORY',gpu=None,tpu=None)
                  return row
              authorization,mode=auth(owner,token)
              row['auth_mode']=mode
              if not authorization:
                  row.update(status='AUTH_MODE_UNRESOLVED',gpu=None,tpu=None)
                  return row
              req=urllib.request.Request(ENDPOINT,data=b'{}',method='POST',headers={
                  'Authorization':authorization,'Content-Type':'application/json','Accept':'application/json',
                  'User-Agent':'kaggle-eight-quota-active-repo/1.0'})
              try:
                  with urllib.request.urlopen(req,timeout=30) as response:
                      payload=json.loads(response.read().decode('utf-8'))
                  row.update(status='OK',http_status=200,
                      gpu=quota(payload.get('gpuQuota') or payload.get('gpu_quota')),
                      tpu=quota(payload.get('tpuQuota') or payload.get('tpu_quota')),
                      refresh_at=payload.get('quotaRefreshTime') or payload.get('quota_refresh_time'))
              except urllib.error.HTTPError as exc:
                  row.update(status='QUERY_ERROR',http_status=exc.code,gpu=None,tpu=None)
              except Exception as exc:
                  row.update(status='QUERY_ERROR',error_type=type(exc).__name__,gpu=None,tpu=None)
              return row

          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as ex:
              rows=list(ex.map(probe,accounts))
          body='## KAGGLE QUOTA ACTIVE REPOSITORY SECRETS\n\n```json\n'+json.dumps(rows,indent=2)+'\n```\n'
          data=json.dumps({'body':body}).encode('utf-8')
          url=f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/18/comments"
          req=urllib.request.Request(url,data=data,method='POST',headers={
              'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],'Accept':'application/vnd.github+json',
              'X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json; charset=utf-8',
              'User-Agent':'kaggle-eight-quota-active-repo/1.0'})
          with urllib.request.urlopen(req,timeout=30) as response:
              if response.status not in (200,201): raise SystemExit(f'journal HTTP {response.status}')
          print(json.dumps({'accounts_checked':8,'ok':sum(r['status']=='OK' for r in rows),'missing':sum(r['status']=='TOKEN_NOT_IN_REPOSITORY' for r in rows),'errors':sum(r['status']=='QUERY_ERROR' for r in rows)}))
          '@
          $script | & $python -
          if ($LASTEXITCODE -ne 0) { throw 'Kaggle quota active-repository probe failed.' }
