name: retired-evidence-kaggle-repo-secret-presence-20260913

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kaggle-repo-secret-presence-20260913.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      K01: ${{ secrets.CGP_KAGGLE_MASTER_TOKEN }}
      K02: ${{ secrets.CGP_KAGGLE_KG02_TOKEN }}
      K03: ${{ secrets.CGP_KAGGLE_KG03_TOKEN }}
      K04: ${{ secrets.CGP_KAGGLE_KG04_TOKEN }}
      K05: ${{ secrets.CGP_KAGGLE_KG05_TOKEN }}
      K06: ${{ secrets.CGP_KAGGLE_KG06_TOKEN }}
      K07: ${{ secrets.CGP_KAGGLE_KG07_TOKEN }}
      K08: ${{ secrets.CGP_KAGGLE_KG08_TOKEN }}
      K09: ${{ secrets.CGP_KAGGLE_KG09_TOKEN }}
      K10: ${{ secrets.CGP_KAGGLE_KG10_TOKEN }}
      K11: ${{ secrets.CGP_KAGGLE_KG11_TOKEN }}
    steps:
      - name: Report presence only
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          result={f'kg-{i:02d}': bool(os.environ.get(f'K{i:02d}', '').strip()) for i in range(1,12)}
          print('KAGGLE_REPO_SECRET_PRESENCE='+json.dumps(result,sort_keys=True))
          PY
