[project]
name = "chatgpt-plugins-repair-engine"
version = "0.1.0"
description = "Provider-neutral failure classification and repair decisions"
requires-python = ">=3.11"
dependencies = ["chatgpt-plugins-core"]

[tool.uv.sources]
chatgpt-plugins-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chatgpt_plugins_repair_engine"]
